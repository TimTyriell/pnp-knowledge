[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pnp-okf"
version = "0.1.0"
description = "Distill Pen & Paper actual-play transcripts into an Open Knowledge Format (OKF) campaign bundle using the DeepSeek API"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.16"]

[project.scripts]
pnp = "pnp_okf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
