# episodes.yaml — die Episoden-Liste der Kampagne.
#
# System of Record fuer Folgen-Identitaet: eine Episoden-ID pro Aufzeichnung,
# plus der handgepflegte Abenteuername und die Kurzbeschreibung, die keine
# Pipeline ableiten kann. Gekeyt auf video_id, weil das der einzige ueber alle
# drei Repos stabile Schluessel ist (Datum kollidiert, sobald zwei Teams am
# selben Tag aufnehmen).
#
# Konsumenten lesen nur `id` — die Ableitung passiert einmal, in
# pnp-crawl/sync_episodes.py, und wird hier materialisiert.
#
# ID-Regel:
#   `id:` gesetzt  -> wird genommen.
#   sonst          -> Episoden derselben season (und desselben team, wenn
#                     per_team) nach date sortieren, n = 1-basierter Index,
#                     `template` formatieren.
#
# Neue Season oder neues Team = nur ein Eintrag unter `seasons:` / `teams:`.
# Kein Code.
#
# Pflege:  cd ../pnp-crawl && python sync_episodes.py --check | --write

schema: 1

seasons:
  "P":
    label: Prolog
    # pinned: die IDs stehen literal in jedem Eintrag statt abgeleitet zu
    # werden. P-01..P-55, lueckenlos. Zwei Aenderungen gegenueber der alten
    # Wiki-Tabelle (P-01..P-57):
    #   * H-eHSlfxUAg (war P-56) heisst auf YouTube "Season 1 Episode 1 |
    #     Team B" und ist nach S1-01-B gewandert.
    #   * cRNIWJz_ATo (war P-17) war ein abgebrochener Stream, siehe `ignore`.
    # Alles danach ist um eins nachgerueckt, damit keine Luecke bleibt.
    pinned: true
  "1":
    label: Staffel 1
    template: "S{season}-{n:02d}-{team}"
    per_team: true

# Videos that exist in pnp-crawl but are not episodes. Listed here so
# sync_episodes.py never re-adds them and so a gap in the numbering is a
# documented decision rather than an oversight.
ignore:
  cRNIWJz_ATo: Abgebrochener Stream (2025-08-05) — keine spielbare Session, kein Transkript.

teams:
  # Gruppenname aus pnp-crawl/groups/ -> Buchstabe in der ID.
  Team-A: A
  Team-B: B
  Team-C: C
  willauch: W

