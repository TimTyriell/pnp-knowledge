ftrag erhalten haben, und es kommt zum Kampf. Sp\u00e4ter, auf dem Weg zur Gilde, wird die Gruppe von einem Dunkelelb-Attent\u00e4ter \u00fcberfallen, der es auf Rotunas abgesehen hat. Esterossa kann den Angreifer mit einem m\u00e4chtigen Blitz ausschalten, doch sie entdecken, dass Rotunas vergiftet wurde und zusammenbricht.\n\n# Auftretende Entit\u00e4ten\n\n* [Rotunas](/characters/rotunas.md) \u2014 Ein Riese und Namensgeber der Gruppe, der sich als Besch\u00fctzer der einfachen Leute sieht. Er lehnt den Auftrag der Gilde ab, hilft den Fl\u00fcchtlingen gro\u00dfz\u00fcgig mit Gold und \u00fcberzeugt Roland zur Flucht. Wird am Ende der Session von einem Attent\u00e4ter vergiftet. [00:14:06]\n* [Dodo](/characters/dodo.md) \u2014 Ein als 'Trollschlechter' und Arena-Champion bekannter Goblin. Er fungiert als Sprecher der Gruppe gegen\u00fcber der Gilde und ist besorgt, die neue Gilde nicht zu ver\u00e4rgern, unterst\u00fctzt aber den Plan, den Fl\u00fcchtlingen zu helfen. [00:12:42]\n* [Esterossa](/characters/esterossa.md) \u2014 Ein Heiler der Gruppe mit imposantem Auftreten und magischen F\u00e4higkeiten. Er verh\u00e4lt sich gegen\u00fcber der Gilde diplomatisch, ist von der Situation der Fl\u00fcchtlinge weniger ber\u00fchrt, unterst\u00fctzt aber die Gruppe und schaltet den Attent\u00e4ter mit einem kritischen Blitz aus. [00:03:52]\n* [Nyrella](/characters/nyrella.md) \u2014 Eine Fee, die der neuen Gilde misstraut und Mitleid mit den Fl\u00fcchtlingen hat. Sie verteilt gro\u00dfz\u00fcgig Gold im Lager und erh\u00e4lt als Dank einen Gl\u00fccksbringer mit einer Lebensrune. [00:04:51]\n* [Gorak](/npcs/gorak.md) \u2014 Ein Tiefenzwerg und Anf\u00fchrer der neuen Gilde in Breska. Er l\u00e4dt die Gruppe ein, um eine Nachricht an ihren Gildenmeister zu \u00fcberbringen und bietet ihnen eine Aufnahmepr\u00fcfung an. [00:24:13]\n* [Rolanes](/npcs/rolanes.md) \u2014 Ein reicher, hochn\u00e4siger Tiefling und 'Meister der M\u00fcnze' in der neuen Gilde. Er hat den Einlassstopp f\u00fcr mittellose Fl\u00fcchtlinge in die Stadt angeordnet. [00:26:08]\n* [Lilly](/npcs/lilly.md) \u2014 Ein Sukkubus, der als Empfangsdame in der neuen Gilde arbeitet und f\u00fcr 'jegliches Am\u00fcsement' verf\u00fcgbar ist. [00:17:08]\n* [Roland](/npcs/roland.md) \u2014 Der Sprecher und \u00c4lteste des Fl\u00fcchtlingslagers vor Breska. Er ist ein alter Bekannter der Gruppe aus der Zeit der Goblin-Belagerung. Er ist besorgt um seine Leute und willigt schlie\u00dflich ein, sie zum Banditenlager zu f\u00fchren. [01:01:59]\n* [Breska](/locations/breska.md) \u2014 Eine schnell gewachsene Stadt, die von einer neuen, wohlhabenden Gilde kontrolliert wird. Sie l\u00e4sst keine mittellosen Fl\u00fcchtlinge mehr in die Stadt und hat ein gro\u00dfes Fl\u00fcchtlingslager vor den Toren. [00:08:22]\n* [Neue Gilde in Breska](/factions/neue_gilde_in_breska.md) \u2014 Eine von einem Tiefenzwerg namens Gorak gef\u00fchrte Gilde, die sehr auf St\u00e4rke und Reichtum bedacht ist. Sie will die Fl\u00fcchtlinge vor der Stadt vertreiben und sucht die Kooperation mit der Gilde der Gruppe. [00:28:22]\n* [Fl\u00fcchtlingslager](/locations/fluechtlingslager.md) \u2014 Ein Lager au\u00dferhalb der Stadtmauern von Breska, bewohnt von ausgehungerten und verzweifelten Fl\u00fcchtlingen, meist Zwerge, die vor den Untoten aus dem Norden geflohen sind. [00:36:38]\n* [Banditenlager](/locations/banditenlager.md) \u2014 Ein alter St\u00fctzpunkt von Banditen, der Roland als m\u00f6glicher Zufluchtsort f\u00fcr die Fl\u00fcchtlinge einf\u00e4llt. Die Gruppe plant, sich in zehn Tagen dort mit den Fl\u00fcchtlingen zu treffen. [01:13:21]\n* [Auftragsschriftrolle](/items/auftragsschriftrolle.md) \u2014 Ein inoffizieller Eil-Mordauftrag, der beim Attent\u00e4ter gefunden wird. Darauf stehen Rotunas' Name und eine Zeichnung von ihm, jedoch ohne Auftraggeber. [01:53:24]\n* [Gl\u00fccksbringer](/items/gluecksbringer.md) \u2014 Ein kleiner, gekerbter Stein mit einer Rune, die f\u00fcr 'Leben' steht. Nyrella erh\u00e4lt ihn von einer Zwergin als Dank f\u00fcr ihre Gro\u00dfz\u00fcgigkeit. [01:03:07]\n* [Vergiftung von Rotunas](/events/vergiftung_von_rotunas.md) \u2014 Nach dem Kampf mit dem Attent\u00e4ter bemerkt die Gruppe, dass Rotunas' Wunde schwarz verf\u00e4rbt ist und er vergiftet zusammenbricht. Esterossa versucht, ihm ein Gegengift einzufl\u00f6\u00dfen. [01:54:30]\n* [Konfrontation mit Halborks](/events/konfrontation_mit_halborks.md) \u2014 Drei Halborks, die den Auftrag der Gilde angenommen haben, werden auf dem Weg zum Fl\u00fcchtlingslager von der Gruppe aufgehalten. Nach einer Eskalation durch Rotunas kommt es zu einem kurzen Kampf, bevor die Halborks abziehen. [01:28:56]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=AhIT8dcxw2o)", "sessions/2025-09-23": "# Zusammenfassung\n\nDie Gruppe bringt den vergifteten Rotunas zur Gilde, nachdem ein mysteri\u00f6ser Gnoll ihm mit einer Tinktur geholfen hat. In der Gilde erholt sich Rotunas, und die Gruppe bricht zum vereinbarten Treffpunkt mit den Fl\u00fcchtlingen aus Breska auf. Nyrella und Cookie kundschaften das Banditenlager aus, das eher einer gut befestigten Festung gleicht. Die Gruppe verhandelt mit den Banditen \u00fcber eine Unterkunft f\u00fcr die Fl\u00fcchtlinge. W\u00e4hrend der Verhandlungen erreicht Roland die Gruppe und berichtet, dass die Karawane von Untoten angegriffen wurde. Die Helden eilen zur Hilfe und k\u00f6nnen die ersten Wagen retten. Es entbrennt ein heftiger Kampf gegen eine Horde Untoter, angef\u00fchrt von einem m\u00e4chtigen, wiederbelebenden Wesen. Trotz gro\u00dfer Anstrengungen und m\u00e4chtiger Zauber stehen die Helden einer \u00dcbermacht gegen\u00fcber und m\u00fcssen entscheiden, ob sie den Pass weiter verteidigen.\n\n# Auftretende Entit\u00e4ten\n\n* [Rotunas](/characters/rotunas.md) \u2014 Wurde in der letzten Session vergiftet, von einem Gnoll geheilt und erwacht in der Gilde mit einer bleibenden Wunde. Nimmt am Kampf gegen die Untoten teil und wirkt einen riesigen Feuerball. [00:02:01]\n* [Nyrella](/characters/nyrella.md) \u2014 Kundschaftet mit Cookie das Banditenlager aus und agiert im Kampf aus der Ferne mit Bogen und Magie (Vicious Entangle). [00:04:02]\n* [Cookie](/characters/cookie.md) \u2014 Kundschaftet mit Nyrella das Banditenlager aus und k\u00e4mpft mit Akrobatik und Magie (Vicious Entangle, Holy Arrows) gegen die Untoten. [00:00:02]\n* [Esterossa](/characters/esterossa.md) \u2014 Untersucht im Haus des Gnolls Dokumente und findet ein Fahndungsplakat. Verteidigt im Kampf mit Schild und versucht, Untote zu vertreiben. [00:05:51]\n* [Dodo](/characters/dodo.md) \u2014 Untersucht das Haus des Gnolls. Verhandelt mit den Banditen und setzt im Kampf seinen Feueratem ein. [00:04:56]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 F\u00fchrt die Verhandlungen mit den Banditen und bietet Gold als Anzahlung. Versucht im Kampf, die Fl\u00fcchtlinge mit Musik zu beruhigen. [00:12:33]\n* [Gnoll (Heiler)](/npcs/gnoll_heiler.md) \u2014 Eine vermummte Gestalt in einer Waldh\u00fctte, die Rotunas mit einer selbstgemischten Tinktur heilt. Lehnt Bezahlung ab. Auf ihn ist ein Kopfgeld ausgesetzt. [00:02:01]\n* [Roland](/npcs/roland.md) \u2014 Anf\u00fchrer der Fl\u00fcchtlinge aus Breska. Erreicht die Gruppe blutverschmiert und berichtet vom Angriff der Untoten auf die Karawane. [00:17:09]\n* [Harl](/npcs/harl.md) \u2014 Einer der Anf\u00fchrer des Banditenlagers, charismatisch und verhandlungsbereit. Verlangt Gold f\u00fcr die Unterbringung der Fl\u00fcchtlinge. [00:10:12]\n* [Withermind](/npcs/withermind.md) \u2014 Ein m\u00e4chtiger Untoter mit einem gro\u00dfen Schwert, der gefallene Untote wiederbeleben kann und eine Druckwelle als Angriff einsetzt. [00:49:46]\n* [G\u00fcnther (Ajani)](/npcs/guenther_ajani.md) \u2014 Esterossas tierischer Begleiter, eine Katze (eigentlich weiblich), die als Bote zwischen Nyrella und der Gruppe dient. [00:17:27]\n* [Nairuk](/npcs/nairuk.md) \u2014 Ein Begleiter der Gruppe, der im Kampf gegen die Untoten in der ersten Reihe steht und Angriffe abwehrt. [00:17:27]\n* [Banditenlager / Festung](/locations/banditenlager_festung.md) \u2014 Eine gut befestigte, aktive Festung in einem Talkessel, die von einer gro\u00dfen Banditengruppe bewohnt wird. Dient als m\u00f6glicher Zufluchtsort f\u00fcr die Fl\u00fcchtlinge. [00:28:19]\n* [Gildenhauptsitz (Ehrenfels)](/locations/gildenhauptsitz_ehrenfels.md) \u2014 Der Sitz der Abenteurergilde, ein kleines, gut bewachtes Dorf auf einem Berg, wo Rotunas medizinisch versorgt wird. [00:13:03]\n* [Gildenmeister](/npcs/gildenmeister.md) \u2014 Der Leiter der Gilde, der der Gruppe erlaubt, Land zu besiedeln, aber vor bestimmten Gebieten warnt. [00:16:13]\n* [Banditen (Fraktion)](/factions/banditen_fraktion.md) \u2014 Eine gro\u00dfe Gruppe, aufgeteilt unter zwei Anf\u00fchrern, die in der n\u00f6rdlichen Schneise operiert und Handelsrouten kontrolliert. [00:24:31]\n* [Fl\u00fcchtlinge aus Breska](/factions/fluechtlinge_aus_breska.md) \u2014 Eine Gruppe von Dorfbewohnern, die von der Gruppe besch\u00fctzt und zum Banditenlager gef\u00fchrt wird, aber auf dem Weg von Untoten angegriffen wird. [00:21:26]\n* [Untote Armee](/factions/untote_armee.md) \u2014 Eine Streitmacht von Untoten, die die Karawane angreift und von einem m\u00e4chtigen Wesen angef\u00fchrt wird, das Gefallene wiederbeleben kann. [00:28:20]\n* [Heiltinktur des Gnolls](/items/heiltinktur_des_gnolls.md) \u2014 Ein Brei aus Kr\u00e4utern und Fl\u00fcssigkeit, der Rotunas' Vergiftung heilt, ihn aber zun\u00e4chst in Ohnmacht fallen l\u00e4sst. [00:08:32]\n* [Fahndungsplakat](/items/fahndungsplakat.md) \u2014 Ein von Esterossa gefundenes Dokument, das einen Gnoll zeigt und eine Belohnung von 'vier H\u00e4nden' verspricht. [00:05:52]\n* [Angriff der Untoten auf die Karawane](/events/angriff_der_untoten_auf_die_karawane.md) \u2014 Die Karawane der Fl\u00fcchtlinge wird auf dem Weg zum Treffpunkt von einer Horde Untoter angegriffen und verfolgt. [00:17:34]\n* [Schlacht am Bergpass](/events/schlacht_am_bergpass.md) \u2014 Die Gruppe stellt sich einer \u00dcbermacht von Untoten, angef\u00fchrt vom Withermind, um die Fl\u00fcchtlinge zu sch\u00fctzen und den Pass zu halten. [00:31:51]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=DGzfqVigS0g)", "sessions/2025-09-30": "# Zusammenfassung\n\nDie Gruppe verteidigt einen Gebirgspass gegen eine Armee von Untoten, angef\u00fchrt von einem Todesritter. Dodo, durch Magie vergr\u00f6\u00dfert, h\u00e4lt die Front, w\u00e4hrend Esterossa den Pass mit einer Steinmauer verengt. Lindo Laut inspiriert die Gruppe und wehrt mit Zeitmagie einen Pfeilhagel ab. Rotunas und Lindo Laut f\u00fchren einen m\u00e4chtigen kombinierten Feuerangriff aus, der den Todesritter schwer besch\u00e4digt. Nachdem Rotunas beinahe stirbt, aber durch einen gl\u00fccklichen Zufall wiederbelebt wird, vernichtet er die verbliebenen Skelette. Eine geisterhafte Gestalt namens Belorus der Stille erscheint und bietet eine Waffenruhe an, da die Gruppe seinen General besiegt hat. Zur\u00fcck im Banditenlager verhandelt Lindo Laut mit dem Anf\u00fchrer Hal \u00fcber die Unterbringung der Fl\u00fcchtlinge. Die Situation eskaliert beinahe, als Hal die Dorfbewohner bedroht, doch Lindo Laut kann ihn mit zus\u00e4tzlichem Gold beschwichtigen. Am Abend feiern die Dorfbewohner die Gruppe. Roland erz\u00e4hlt eine Legende \u00fcber die Splitterwelt und die vergessenen G\u00f6tter, und die Gruppe realisiert, dass sie keine Erinnerungen an die Zeit vor elf Jahren haben. In der Nacht hat Lindo Laut einen beunruhigenden Traum von Vasul. Am n\u00e4chsten Morgen verabschiedet sich die Gruppe von Hal, der ihnen r\u00e4t, sich von einer Hexe im Osten fernzuhalten.\n\n# Auftretende Entit\u00e4ten\n\n* [Dodo](/characters/dodo.md) \u2014 Ein Goblin-Krieger, der sich mit Magie vergr\u00f6\u00dfert hat und im Kampf die Frontlinie gegen die Untoten h\u00e4lt. Er tr\u00e4gt eine Waffe, die aus einem Spiegel gezogen wurde, und wird von Hal als respektlos empfunden. [00:02:00]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Ein Barde/Magier, der die Gruppe mit einer Rede inspiriert, Zeitmagie einsetzt und sp\u00e4ter die Verhandlungen mit dem Banditenanf\u00fchrer Hal f\u00fchrt. Er hat einen Traum, in dem er die Perspektive von Vasul einnimmt. [00:04:38]\n* [Esterossa](/characters/esterossa.md) \u2014 Ein Magier, der Steinw\u00e4nde formen kann, um den Pass zu verengen. Er heilt Dodo im Kampf und zeigt sp\u00e4ter Mitgef\u00fchl f\u00fcr die Dorfbewohner. Er besitzt eine Katze namens Adjani. [00:07:27]\n* Cookie (Ribbit) \u2014 Ein Froschwesen, das sich mit einem K\u00e4ferpanzer sch\u00fctzt und ein Heilfeld erschaffen kann. Sie ist besorgt \u00fcber die Motive der Untoten und fragt die Dorfbewohner nach einem m\u00f6glichen gestohlenen Gegenstand. [00:02:59]\n* [Nyrella](/characters/nyrella.md) \u2014 Eine Waldl\u00e4uferin oder Druidin, die mit Rankenmagie die Dorfbewohner vor den Bogensch\u00fctzen der Banditen sch\u00fctzt. Sie beschlie\u00dft, mit Nairuk bei den Fl\u00fcchtlingen zu bleiben, um f\u00fcr ihre Sicherheit zu sorgen. [00:07:27]\n* [Rotunas](/characters/rotunas.md) \u2014 Ein m\u00e4chtiger Feuermagier, der im Kampf fast stirbt, aber durch einen Gl\u00fcckswurf wiederbelebt wird und den entscheidenden Angriff gegen die Untoten f\u00fchrt. Er genie\u00dft die abendliche Feier mit den Dorfbewohnern. [00:14:45]\n* [Todesritter (General der Untoten)](/npcs/todesritter_general_der_untoten.md) \u2014 Der Anf\u00fchrer der Untotenarmee, der den Pass angreift. Er kann Magie aufl\u00f6sen, gr\u00fcne Blitze beschw\u00f6ren und Schattenmagie einsetzen. Er wird durch einen kombinierten Angriff von Rotunas und Lindo Laut besiegt. [00:10:20]\n* [Belorus der Stille](/npcs/belorus_der_stille.md) \u2014 Eine geisterhafte, magische Kreatur, die nach dem Tod des Generals erscheint. Sie kommuniziert telepathisch und bietet eine Waffenruhe an, da die Gruppe ihren General besiegt hat. Sie sucht nach zwei Personen und einem entrissenen Gegenstand. [00:52:20]\n* [Hal](/npcs/hal.md) \u2014 Der Anf\u00fchrer der Banditen in der Festung. Er ist arrogant, aufbrausend und auf seinen Respekt vor seinen M\u00e4nnern bedacht. Er verhandelt mit Lindo Laut \u00fcber die Unterbringung der Fl\u00fcchtlinge und droht zeitweise, die Dorfbewohner zu t\u00f6ten. [01:01:51]\n* [Roland](/npcs/roland.md) \u2014 Der Anf\u00fchrer der Fl\u00fcchtlinge. Er ist ersch\u00f6pft, aber dankbar. Am Abend erz\u00e4hlt er der Gruppe eine Legende \u00fcber die Splitterwelt und die vergessenen G\u00f6tter, was die Gruppe an ihre fehlenden Erinnerungen denken l\u00e4sst. [01:09:12]\n* [Adjani](/npcs/adjani.md) \u2014 Esterossas Katze, die zuvor f\u00e4lschlich f\u00fcr m\u00e4nnlich gehalten und 'G\u00fcnther' genannt wurde. Ihr wahrer Name ist Adjani, und sie bleibt bei Nyrella, um als Bote zu dienen. [01:35:07]\n* [Nairuk](/npcs/nairuk.md) \u2014 Ein Begleiter von Nyrella, der von den Kindern als lebender Rollercoaster genutzt wird. Er bleibt mit Nyrella bei den Fl\u00fcchtlingen. [01:43:07]\n* [Vasul](/npcs/vasul.md) \u2014 Eine Figur aus Lindo Lauts Traum, die in einer Burgruine eine schattenhafte Gestalt trifft und einen Pakt eingeht, um ihre 'richtige Macht' zur\u00fcckzuerlangen. [01:59:23]\n* [Gebirgspass](/locations/gebirgspass.md) \u2014 Der Schauplatz der gro\u00dfen Schlacht gegen die Untotenarmee. Die Gruppe verteidigt ihn, um die Fl\u00fcchtlinge zu sch\u00fctzen. [00:01:09]\n* [Banditenfestung](/locations/banditenfestung.md) \u2014 Eine gut befestigte, aber teils notd\u00fcrftig reparierte Festung, die von Hal und etwa drei Dutzend Soldaten bewohnt wird. Sie dient als Zufluchtsort f\u00fcr die Fl\u00fcchtlinge. [02:04:15]\n* [Splitterwelt](/locations/splitterwelt.md) \u2014 Eine von Roland erw\u00e4hnte Zwischenwelt, die durch den Krieg der G\u00f6tter entstanden ist. Sie liegt zwischen den 'Circle Below' und den 'Hallows Above' und enth\u00e4lt ein Tor zu einer vergessenen Welt namens Abyssalis/Abyssares. [01:50:02]\n* [Die Herrin von Hal](/npcs/die_herrin_von_hal.md) \u2014 Eine geheimnisvolle Elbin, die die Anf\u00fchrerin der Banditen zu sein scheint. Sie stimmt der Unterbringung der Fl\u00fcchtlinge zu und m\u00f6chte die Gruppe bei Gelegenheit treffen. Sie kennt angeblich bereits einige der Gruppenmitglieder. [02:08:47]\n* [Das Tagebuch](/items/das_tagebuch.md) \u2014 Ein Buch, das Cookie und Dodo zuvor gestohlen haben. Die Gruppe vermutet, dass die Untoten auf der Suche nach diesem Gegenstand sind. [00:56:23]\n* [Schlacht am Pass](/events/schlacht_am_pass.md) \u2014 Die erfolgreiche Verteidigung des Passes gegen eine \u00dcbermacht von Untoten, die mit dem Tod des Generals und dem Erscheinen von Belorus der Stille endet. [00:10:20]\n* [Verhandlung mit Hal](/events/verhandlung_mit_hal.md) \u2014 Eine hitzige Verhandlung \u00fcber die Unterbringung der Fl\u00fcchtlinge, die fast in Gewalt umschl\u00e4gt, aber durch Lindo Lauts diplomatisches Geschick und zus\u00e4tzliches Gold gel\u00f6st wird. [01:14:56]\n* [Die fehlenden Erinnerungen](/events/die_fehlenden_erinnerungen.md) \u2014 Die Gruppe realisiert, dass sie keine Erinnerungen an die Zeit vor elf Jahren hat, was durch Rolands Geschichte \u00fcber die G\u00f6tterkriege ausgel\u00f6st wird. [01:52:17]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=bUT7Mc2hjUY)", "sessions/2025-10-07": "# Zusammenfassung\n\nDie Gruppe erreicht ein trockenes Orkgebiet und trifft auf die Magier Arus und Lia, die versehentlich einen m\u00e4chtigen, au\u00dfer Kontrolle geratenen Kristallgolem erschaffen haben. Sie werden beauftragt, diesen zu zerst\u00f6ren. Bei der Untersuchung der Umgebung entdecken sie seltsame lila und gr\u00fcne Kristalle, wobei die gr\u00fcnen die lilanen assimilieren und feueranf\u00e4llig sind. Lindo Laut und Cookie zerst\u00f6ren ein unnat\u00fcrliches, pulsierendes Gew\u00e4chs aus gr\u00fcnen Kristallen, das mit der Hack in Verbindung zu stehen scheint. Rotunas findet unter einem gro\u00dfen gr\u00fcnen Kristall eine Kontrollrune, die sich jedoch aufl\u00f6st, bevor er sie analysieren kann. Der Golem n\u00e4hert sich und ein Kampf entbrennt. Die Gruppe konzentriert sich darauf, seine Gliedma\u00dfen zu zerst\u00f6ren, was ihnen nach und nach gelingt. Kurz bevor der Golem eine Kristallmine erreicht, sprengen die Magier die Mine. Im gemeinsamen Kampf wird der Golem schlie\u00dflich vernichtet. Bei der Untersuchung der \u00dcberreste findet Rotunas eine weitere Kontrollrune im Torso des Golems, was auf eine gezielte Sabotage hindeutet.\n\n# Auftretende Entit\u00e4ten\n\n* [Rotunas](/characters/rotunas.md) \u2014 Spielercharakter, Magier. Untersucht die Kristalle, entdeckt und analysiert die Kontrollrunen und wirkt im Kampf m\u00e4chtige Feuerzauber gegen den Golem. [00:04:36]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Spielercharakter, Barde. Untersucht magische Anomalien, zerst\u00f6rt mit Cookie das gr\u00fcne Kristallgew\u00e4chs, feuert die Gruppe an und k\u00e4mpft mit Feuermagie gegen den Golem. [00:05:39]\n* [Esterossa](/characters/esterossa.md) \u2014 Spielercharakter, flugf\u00e4hig. Kundschaftet den Golem aus, bereitet Treibsand als Falle vor und versucht vergeblich, den Golem zu kommandieren. Wird im Kampf schwer getroffen. [00:04:30]\n* [Cookie](/characters/cookie.md) \u2014 Spielercharakter, Waldl\u00e4uferin mit Begleiter Perry. Sammelt Proben der Kristalle, kommuniziert mit der Natur und analysiert die Schw\u00e4chen des Golems. [00:06:03]\n* [Dodo](/characters/dodo.md) \u2014 Spielercharakter, der 'Trollschlechter'. Ber\u00fchrt versehentlich einen lila Kristall und wird an den Fingerspitzen kristallisiert. Greift den Golem mit seinem Feueratem an. [00:04:49]\n* [Arus](/npcs/arus.md) \u2014 Magier, Bruder von Lia. Hat zusammen mit ihr den Golem erschaffen und bittet die Gruppe um Hilfe bei der Zerst\u00f6rung. Warnt vor den Kristallen. [00:03:00]\n* [Lia](/npcs/lia.md) \u2014 Magierin, Schwester von Arus. Mitverantwortlich f\u00fcr die Erschaffung des Golems. Ist von Rotunas als 'Trollschlechter' beeindruckt. [00:03:00]\n* Perry \u2014 Cookies tierischer Begleiter. Wird von Cookie zeitweise nicht gesehen (technisches Problem). [00:06:03]\n* [Orkgebiet (nahe Hartwacht und 'das Ende')](/locations/orkgebiet_nahe_hartwacht_und_das_ende.md) \u2014 Trockenes, karges Gebiet im Norden, in dem die Gruppe unterwegs ist. Gepr\u00e4gt von Palmen, Felsen und Kakteen. [00:00:03]\n* [Kristallmine](/locations/kristallmine.md) \u2014 Eine feuchte H\u00f6hle, in der sowohl lila als auch gr\u00fcne Kristalle wachsen. Hier wurde eine Kontrollrune unter einem gro\u00dfen gr\u00fcnen Kristall gefunden. [00:50:11]\n* [Lila Kristalle](/items/lila_kristalle.md) \u2014 Besondere, nicht-magische Kristalle aus dem Norden, die bei Ber\u00fchrung Lebewesen kristallisieren lassen. Wurden f\u00fcr die Erschaffung des Golems verwendet. [00:11:53]\n* [Gr\u00fcne Kristalle](/items/gruene_kristalle.md) \u2014 Magische Kristalle, die lila Kristalle assimilieren k\u00f6nnen und feueranf\u00e4llig sind. Stehen mit der 'Hack' in Verbindung und wurden vermutlich zur Sabotage platziert. [00:29:36]\n* [Kontrollrune](/items/kontrollrune.md) \u2014 Eine magische Rune, die zur Kontrolle dient. Eine wurde unter einem gr\u00fcnen Kristall gefunden und zerst\u00f6rt, eine weitere im Torso des zerst\u00f6rten Golems entdeckt. [01:02:28]\n* [Steingolem (Koloss)](/npcs/steingolem_koloss.md) \u2014 Ein riesiger, aus sechs lila Kristallen erschaffener Koloss, der au\u00dfer Kontrolle geraten ist. Bewegt sich langsam, wirft mit Felsen und versucht, weitere Kristalle zu erreichen. Wurde durch eine Kontrollrune manipuliert. [00:08:03]\n* [Der Einfluss der Hack](/factions/der_einfluss_der_hack.md) \u2014 Eine bereits bekannte, unheilvolle Macht oder Fraktion, deren Einfluss in den gr\u00fcnen Kristallen und dem pulsierenden Gew\u00e4chs erkannt wird. [00:23:36]\n* [Zerst\u00f6rung des gr\u00fcnen Kristallgew\u00e4chses](/events/zerstoerung_des_gruenen_kristallgewaechses.md) \u2014 Lindo Laut und Cookie verbrennen ein unnat\u00fcrliches, pulsierendes Gebilde aus gr\u00fcnen Kristallen mit geb\u00fcndelter Feuermagie, was zu einer intensiven Stichflamme f\u00fchrt. [00:39:45]\n* [Kampf gegen den Golem](/events/kampf_gegen_den_golem.md) \u2014 Die Gruppe k\u00e4mpft gegen den Koloss. Sie zerst\u00f6ren nacheinander seine Gliedma\u00dfen, wobei der rechte Arm von Rotunas' Feuerball spektakul\u00e4r explodiert. Der Golem wird schlie\u00dflich mit Hilfe der Magier endg\u00fcltig vernichtet. [01:48:31]\n* [Sprengung der Kristallwand](/events/sprengung_der_kristallwand.md) \u2014 Um zu verhindern, dass der Golem die Kristalle erreicht und noch m\u00e4chtiger wird, sprengen Arus und Lia die Kristallwand. [01:57:46]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=qVAF_54S8Vw)", "sessions/2025-10-14": "# Zusammenfassung\n\nDie Gruppe reist nach Willau, um am gro\u00dfen Turnier teilzunehmen, das zur Feier des Sieges \u00fcber Brandau abgehalten wird. Bei der Ankunft erleben sie eine \u00f6ffentliche Hinrichtung und erkunden die lebendige Stadt. In einer Taverne treffen sie auf eine alte Bekannte namens Lisa, die ihnen Informationen \u00fcber die Turnierkategorien und die Vorlieben der Herrschaft f\u00fcr kunstvolle K\u00e4mpfe gibt. Auf der Suche nach dem Champion Mil vor der Arena kommt es zu einer Konfrontation, da Mil eine d\u00e4monische Pr\u00e4senz in Lindo Laut sp\u00fcrt. Sp\u00e4ter untersuchen der untote Magier Tyrael und der Heiler Bosar Lindo Laut und best\u00e4tigen, dass ein D\u00e4mon in ihm wohnt, der bald erwachen k\u00f6nnte. Tyrael gibt Lindo Laut ein ekliges Fleischst\u00fcck, um den D\u00e4mon zu stillen, und warnt ihn vor der Teilnahme am Magierkampf. Im Lager diskutiert die Gruppe die Optionen und beschlie\u00dft schlie\u00dflich, als Team in der Monster-Kategorie auf Tier 3 anzutreten.\n\n# Auftretende Entit\u00e4ten\n\n* [Esterossa](/characters/esterossa.md) \u2014 Spielercharakter, der sich f\u00fcr die Monsterk\u00e4mpfe interessiert und die Gruppe bei der Entscheidungsfindung anf\u00fchrt. [00:00:05]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Spielercharakter, eine Fee, in der ein D\u00e4mon entdeckt wird, was zu Spannungen mit Mil und einer Untersuchung durch Tyrael f\u00fchrt. [00:00:05]\n* [Rotunas](/characters/rotunas.md) \u2014 Spielercharakter, ein Magier von einem Riesenstamm, der die Gruppe mit magischem Wissen unterst\u00fctzt. [00:00:05]\n* [Dodo](/characters/dodo.md) \u2014 Spielercharakter, ein Krieger, der von Mil als ausbildungsw\u00fcrdig erachtet wird und \u00fcber einen Solo-Kampf nachdenkt. [00:00:05]\n* [Valdemar der Goldene Ritter](/npcs/valdemar_der_goldene_ritter.md) \u2014 Ein Soldat in vergoldeter R\u00fcstung, der die Hinrichtung eines Banditen am Stadttor von Willau leitet. [00:04:10]\n* [Lisa](/npcs/lisa.md) \u2014 Eine Einheimische aus Willau, die die Gruppe aus Ehrenfels kennt und ihnen Informationen \u00fcber das Turnier und die Stadt gibt. [00:32:38]\n* [Mil](/npcs/mil.md) \u2014 Ein katzenartiger Berserker und zweifacher Solo-Champion, der eine d\u00e4monische Pr\u00e4senz in Lindo Laut sp\u00fcrt und ihm misstrauisch gegen\u00fcbersteht. [00:47:02]\n* [Tyrael](/npcs/tyrael.md) \u2014 Ein untoter, sehr m\u00e4chtiger Magier (Lich), der den D\u00e4mon in Lindo Laut untersucht und vor dessen Macht warnt. [01:24:39]\n* [Bosar](/npcs/bosar.md) \u2014 Ein begnadeter Heiler (Galappa), der Tyrael begleitet und Lindo Lauts Zustand mit untersucht. [01:22:44]\n* [Starville](/npcs/starville.md) \u2014 Ein K\u00e4mpfer, der es in mehreren Disziplinen bis ins Finale geschafft hat und von Mil als Ansprechpartner f\u00fcr Monsterk\u00e4mpfe empfohlen wird. [01:11:14]\n* [Lord Kaledan und Lady Lyra von Willau](/npcs/lord_kaledan_und_lady_lyra_von_willau.md) \u2014 Die Herrscher von Willau, die kunstvolle K\u00e4mpfe sch\u00e4tzen und ein St\u00fcck Land als Hauptpreis f\u00fcr den Solo-Champion ausgelobt haben. [00:38:07]\n* [Willau](/locations/willau.md) \u2014 Gro\u00dfe, lebendige Stadt im Norden, die den Konflikt gegen Brandau gewonnen hat und das Turnier ausrichtet. [00:00:32]\n* [Arena von Willau](/locations/arena_von_willau.md) \u2014 Austragungsort des Turniers, etwa eine Stunde au\u00dferhalb der Stadt gelegen, mit einem Zeltlager f\u00fcr Teilnehmer. [00:53:22]\n* [Taverne in Willau](/locations/taverne_in_willau.md) \u2014 Ein magisches Geb\u00e4ude, in dem das Personal Teleportationsf\u00e4higkeiten besitzt und die Gruppe Lisa trifft. [00:25:04]\n* [Turnier von Willau](/events/turnier_von_willau.md) \u2014 Ein Wettkampf mit sechs Kategorien (Solo, Duo, Team, Wizard, Monster, Hunt) und vier Tiers, bei dem ein St\u00fcck Land als Hauptpreis winkt. [00:13:31]\n* [Hinrichtung am Stadttor](/events/hinrichtung_am_stadttor.md) \u2014 \u00d6ffentliche Enthauptung eines Banditen durch Valdemar den Goldenen Ritter, die die Gruppe bei ihrer Ankunft beobachtet. [00:04:10]\n* [D\u00e4mon in Lindo Laut](/items/daemon_in_lindo_laut.md) \u2014 Eine b\u00f6sartige, d\u00e4monische Pr\u00e4senz in Lindo Laut, die von Mil und Tyrael entdeckt wird und mit dem Gott Basul in Verbindung stehen k\u00f6nnte. [01:02:21]\n* [Ekliges Fleischst\u00fcck](/items/ekliges_fleischstueck.md) \u2014 Ein brauner Brei, den Tyrael Lindo Laut gibt, um den D\u00e4mon in ihm f\u00fcr eine Weile zu stillen. [01:31:35]\n* [Grenzland](/locations/grenzland.md) \u2014 Ein gef\u00e4hrliches Gebiet s\u00fcdlich von Willau, Schauplatz eines gro\u00dfen Krieges vor elf Jahren, aus dem viele Monster f\u00fcr die Arena stammen. [01:14:02]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=cUtz87UCHu4)", "sessions/2025-10-21": "# Zusammenfassung\n\nDie Gruppe, bestehend aus Dodo, Cookie und Esterossa, tritt in der Arena von Willoch zum ersten von drei Monsterk\u00e4mpfen an. Ihr erster Gegner ist ein mysteri\u00f6ser 'Haariger', der sich im Kampf in einen Werwolf verwandelt. Trotz einiger Schwierigkeiten, wie einem fehlgeleiteten gr\u00fcnen Blitz, der Cookies Ranken aufl\u00f6st, gelingt es dem Team, den Werwolf zu \u00fcberw\u00e4ltigen. Nach einem Daumenzeichen des Lords Kalidarn gew\u00e4hrt Dodo dem reum\u00fctigen Werwolf einen schnellen Tod. Die Gruppe feiert ihren Sieg mit der jubelnden Menge, bevor sie sich f\u00fcr den n\u00e4chsten Kampf ausruht. Am n\u00e4chsten Tag werden sie in eine mit Netzen \u00fcberspannte Arena teleportiert, wo sie gegen eine riesige Phasenspinne und ihre Brut k\u00e4mpfen m\u00fcssen. Ziel ist es, ein Objekt aus dem Nest zu bergen. Der Kampf ist z\u00e4h, die Spinne setzt Netze und Gift ein und teleportiert sich. Esterossa wird vergiftet. Schlie\u00dflich gelingt es ihnen, die Spinne zu t\u00f6ten, wobei sie in einer S\u00e4ureexplosion zerplatzt. In einem versteckten Raum finden sie eine magische Kiste mit einem gro\u00dfen Spinnenei, das sie an sich nehmen. Durch das Entfernen des Eis wird ein Einsturz ausgel\u00f6st, doch Esterossa kann mit Magie eine T\u00fcr in die Wand formen, durch die sie entkommen. Zur\u00fcck in der Arena pr\u00e4sentiert Dodo das Ei der jubelnden Menge und der Obrigkeit, wobei besonders Lady Lyra von Cookies magischer Lichtshow beeindruckt ist. Die Session endet mit dem vergifteten Esterossa, der auf Heilung hofft.\n\n# Auftretende Entit\u00e4ten\n\n* [Dodo](/characters/dodo.md) \u2014 Ein Drachengeborener Goblin und K\u00e4mpfer, bekannt als 'der Trollschlechter'. Er ist der Anf\u00fchrer der Gruppe, meditiert vor K\u00e4mpfen, tauntet Gegner an und gew\u00e4hrte dem besiegten Werwolf einen schnellen, aber w\u00fcrdevollen Tod. Er pr\u00e4sentiert das erbeutete Spinnenei der Menge. [00:01:01]\n* [Cookie](/characters/cookie.md) \u2014 Ein Froschwesen (Ribbit) mit Naturmagie und Bogen. Sie ist vor K\u00e4mpfen nerv\u00f6s, aktiviert einen K\u00e4ferpanzer und nutzt Rankenzauber (Vicious Entangle) sowie verschiedene Giftpfeile. Sie hat ein Schnabeltier namens Perry als Begleiter und beeindruckt die Menge mit einer magischen Lichtshow. [00:01:01]\n* [Esterossa Torbhalm](/characters/esterossa_torbhalm.md) \u2014 Ein gefl\u00fcgelter Kleriker des Gottes Korn. Er betet vor K\u00e4mpfen (\u201eBlut f\u00fcr den Blutgott\u201c), kann heilen (Healing Hands) und Material formen (Shape Material). Er wird im zweiten Kampf von der Spinne vergiftet und ist am Ende der Session schwer angeschlagen. [00:01:01]\n* Perry \u2014 Cookies Schnabeltier-Begleiter. Er k\u00e4mpft an ihrer Seite, wird von kleinen Spinnen angegriffen und \u00fcbersteht den S\u00e4ureschaden der explodierenden Mutterspinne. [00:07:09]\n* [Der Haarige / Werwolf](/npcs/der_haarige_werwolf.md) \u2014 Der erste Arena-Gegner. Ein Mann, der sich gegen seinen Willen in einen Werwolf verwandelt. Er ist schwer verletzt, bereut seine Taten und wird schlie\u00dflich von Dodo auf Gehei\u00df von Lord Kalidarn mit einem Schlag get\u00f6tet. [00:12:45]\n* [Phasenspinne](/npcs/phasenspinne.md) \u2014 Der zweite Arena-Gegner. Eine riesige, giftige Spinne, die sich teleportieren kann, Netze verschie\u00dft und ihre Brut aus Eiern schl\u00fcpfen l\u00e4sst. Sie wird von der Gruppe get\u00f6tet und explodiert in einer S\u00e4urewolke. [01:10:44]\n* [Lord Kalidarn von Willoch](/npcs/lord_kalidarn_von_willoch.md) \u2014 Der Herrscher von Willoch. Er wirkt emotionslos und schwer zu beeindrucken. Er entscheidet per Daumenzeichen \u00fcber das Schicksal des Werwolfs und zeigt sich auch nach dem zweiten Sieg der Gruppe unbeeindruckt. [00:14:00]\n* [Lady Lyra von Willoch](/npcs/lady_lyra_von_willoch.md) \u2014 Die Lady von Willoch. Sie applaudiert der Gruppe und ist im Gegensatz zu Lord Kalidarn von Cookies magischer Lichtshow am Ende der Session sichtlich beeindruckt. [00:13:00]\n* [Garlin der Weise](/npcs/garlin_der_weise.md) \u2014 Ein warforged-artiger Magier mit einem roten Mantel und einem magischen Buch. Er ber\u00e4t den Lord und ist f\u00fcr die magische \u00dcbertragung der zweiten Arena verantwortlich. [00:14:00]\n* [Arena von Willoch](/locations/arena_von_willoch.md) \u2014 Der Hauptaustragungsort der K\u00e4mpfe. Eine gro\u00dfe Arena mit jubelndem Publikum und einer Loge f\u00fcr die Obrigkeit. Die Gruppe tritt hier in Kategorie 3 an und muss mindestens drei K\u00e4mpfe bestehen. [00:01:01]\n* [Spinnennest-Arena](/locations/spinnennest_arena.md) \u2014 Der zweite Kampfort. Ein mit Netzen \u00fcberspanntes, abgelegenes Gebiet mit einem unterirdischen H\u00f6hlensystem, das von der Phasenspinne bewohnt wird. Die K\u00e4mpfe werden per Magie in die Hauptarena \u00fcbertragen. [00:56:18]\n* [Spinnenei](/items/spinnenei.md) \u2014 Ein gro\u00dfes, gr\u00fcnes und schweres Ei, das in einer magischen Kiste im Spinnennest gefunden wurde. Es war das Zielobjekt der zweiten Pr\u00fcfung und wurde von Dodo geborgen und der Menge pr\u00e4sentiert. [01:51:23]\n* [Erster Arena-Kampf](/events/erster_arena_kampf.md) \u2014 Der Kampf gegen den Werwolf. Die Gruppe arbeitet zusammen, um ihn zu immobilisieren und zu besiegen. Der Kampf endet mit der Hinrichtung des Werwolfs durch Dodo nach dem Urteil des Lords. [00:16:39]\n* [Zweiter Arena-Kampf](/events/zweiter_arena_kampf.md) \u2014 Der Kampf gegen die Phasenspinne und ihre Brut. Ein z\u00e4her Kampf, bei dem Esterossa vergiftet wird. Die Gruppe findet und birgt das Spinnenei und entkommt nur knapp dem einst\u00fcrzenden Dungeon. [00:56:18]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=sxFhbtwoefA)", "sessions/2025-10-28": "# Zusammenfassung\n\nDie Gruppe, nun mit Lindo Laut statt des verletzten Esterossa, betritt den dritten, uralten Dungeon, der noch nie bezwungen wurde. Nachdem sie eine Blutopfer-Falle an einem Tor \u00fcberlisten, erkunden sie eine verlassene Taverne und finden Tageb\u00fccher, die von einer sich st\u00e4ndig regenerierenden Kreatur und einem Sieben-Tage-Zyklus des Schreckens berichten. Sie entdecken eine blaue, heilige Flamme und in einer Schmiede die Baupl\u00e4ne f\u00fcr eine Waffe, die das Monster vernichten kann. Dodo fertigt einen speziellen Dolch, den sie mit heiligem \u00d6l und der Flamme aktivieren. Mit dieser Waffe zerst\u00f6ren sie eine untote, schwarze Kreatur, m\u00fcssen aber feststellen, dass dies nicht der Hauptgegner war. Ein m\u00e4chtiger, intelligenter Untoter mit magischen Fernangriffen stellt sich ihnen entgegen und versucht, Lindo Laut und Cookie mental zu kontrollieren, um eine sch\u00fctzende Drachenstatue zu zerst\u00f6ren. Die Gruppe kann die Kontrolle zur\u00fcckgewinnen und flieht, doch die heilige Flamme ihrer Waffe erlischt. Verwirrt und uneins \u00fcber das weitere Vorgehen \u2013 ob sie den Altar nutzen oder die Flamme neu entfachen sollen \u2013 beschlie\u00dfen sie, die Session zu beenden und einen Plan zu fassen.\n\n# Auftretende Entit\u00e4ten\n\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Der Team-Captain (Spielercharakter) springt f\u00fcr den verletzten Esterossa ein. Er wird im Dungeon von einer inneren, dunklen Stimme heimgesucht, die ihn zu Opferungen dr\u00e4ngt, kann aber mehrfach die Kontrolle behalten und die Gruppe mit einer Rallye unterst\u00fctzen. [00:00:44]\n* [Dodo](/characters/dodo.md) \u2014 Der Drachengeborene (Spielercharakter) stellt in der Schmiede einen speziellen Dolchaufsatz f\u00fcr seinen Streitkolben her, der die untote Kreatur vernichten kann. Er ist pragmatisch und sucht stets nach Fallen. [00:01:52]\n* [Cookie](/characters/cookie.md) \u2014 Die Alchemistin (Spielercharakterin) hat mit ihrem Begleiter Perry zu k\u00e4mpfen, der im Dungeon panisch wird. Sie wird kurzzeitig von dem Hauptgegner mental kontrolliert und zum Angriff auf die Drachenstatue gezwungen. [00:02:16]\n* Perry \u2014 Cookies tierischer Begleiter. Er leidet extrem unter der bedr\u00fcckenden Atmosph\u00e4re des Dungeons, wird panisch und verkriecht sich schlie\u00dflich in Cookies Tasche. [00:02:43]\n* [Stavre](/npcs/stavre.md) \u2014 Ein Soldat, der die Gruppe zum Dungeon begleitet und ihnen vor dem Betreten einige Fragen beantwortet. Er warnt sie vor den Gefahren und erkl\u00e4rt die Bedingungen, um den Dungeon wieder zu verlassen. [00:07:20]\n* [Bullrin](/npcs/bullrin.md) \u2014 Ein Zwerg aus einer fr\u00fcheren Abenteurergruppe, der im Dungeon zur\u00fcckblieb, um seinen Gef\u00e4hrten die Flucht zu erm\u00f6glichen. Sein Tagebuch enth\u00e4lt die entscheidende Information, dass die Kreatur immer st\u00e4rker wiederkehrt und nicht einfach nur besiegt werden kann. [00:34:11]\n* [Uhoriaks](/factions/uhoriaks.md) \u2014 Eine uralte Gottheit oder Macht, die als 'Vernichterin' bezeichnet wird. Ihr Symbol ist ein Auge, das die Gruppe beobachtet. Im Dungeon befinden sich ein Altar und eine Statue, die mit ihr in Verbindung stehen und Blutopfer zu fordern scheinen. [00:28:07]\n* [Der uralte Dungeon](/locations/der_uralte_dungeon.md) \u2014 Eine uralte, unterirdische Anlage, die als dritte Arena-Pr\u00fcfung dient. Sie ist mit einem magischen Schutz versiegelt, der sich erst nach langer Zeit wieder \u00f6ffnet. Der Dungeon ist erf\u00fcllt von fleischfressenden Sporen und beherbergt eine m\u00e4chtige, intelligente untote Kreatur. [00:07:20]\n* [Die untote Kreatur (Hauptgegner)](/npcs/die_untote_kreatur_hauptgegner.md) \u2014 Eine gro\u00dfe, intelligente untote Gestalt mit magischen Fernangriffen und der F\u00e4higkeit zur Gedankenkontrolle. Sie scheint die Quelle des \u00dcbels im Dungeon zu sein und kann nur mit einer speziell pr\u00e4parierten Waffe vernichtet werden. [01:19:20]\n* [Die schwarze Kreatur (Nebengegner)](/npcs/die_schwarze_kreatur_nebengegner.md) \u2014 Eine groteske, untote Kreatur mit langen Armen und einer klebrigen, schwarzen Fl\u00fcssigkeit, die sich st\u00e4ndig regeneriert. Sie wird von Dodo mit dem neu geschmiedeten, brennenden Dolch endg\u00fcltig zu Staub zerfallen. [01:19:20]\n* [Der heilige Dolch](/items/der_heilige_dolch.md) \u2014 Eine von Dodo nach den Pl\u00e4nen des Zwergs Bullrin gefertigte Waffe. Sie muss mit heiligem \u00d6l getr\u00e4nkt und an der blauen Flamme entz\u00fcndet werden, um die untoten Kreaturen im Dungeon endg\u00fcltig vernichten zu k\u00f6nnen. [01:36:45]\n* [Heiliges \u00d6l](/items/heiliges_oel.md) \u2014 Ein Trank, der bei einer Leiche in einem roten Gewand gefunden wurde. Er wird ben\u00f6tigt, um den Dolch zu pr\u00e4parieren, bevor er an der heiligen Flamme entz\u00fcndet werden kann. [00:56:55]\n* [Die blaue Flamme](/items/die_blaue_flamme.md) \u2014 Eine seltsame, blaue Flamme in einem kleinen Raum, die wie in einer anderen Dimension zu existieren scheint. Sie ist der Ort, an dem der pr\u00e4parierte Dolch entz\u00fcndet werden muss. [01:07:20]\n* [Die Drachenstatue](/items/die_drachenstatue.md) \u2014 Eine Statue in einem sporenfreien Raum, die eine sch\u00fctzende Aura ausstrahlt. Die Inschrift erw\u00e4hnt 'Das Blut des Heiligen Drachens'. Der Hauptgegner versuchte, Cookie zu zwingen, sie zu zerst\u00f6ren. [02:01:47]\n* [Der Altar des Uhoriaks](/items/der_altar_des_uhoriaks.md) \u2014 Ein Altar mit dem Symbol von Uhoriaks und einem Pendel. Als Cookie ihr Blut darauf tropfen l\u00e4sst, wird ihre Hand stark in Richtung des Pendels gezogen, was darauf hindeutet, dass ein gr\u00f6\u00dferes Opfer n\u00f6tig ist. [01:23:29]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=V6NzNakqxXM)", "sessions/2025-11-14": "# Zusammenfassung\n\nDie Gruppe erreicht das vom Lord von Willauch als Belohnung \u00fcberlassene Anwesen im Norden. Sie entdecken, dass es nicht verlassen ist, sondern von einer Gruppe Goblins und einem Menschen namens Horatio bewohnt und instand gehalten wird. Nach einer freundlichen F\u00fchrung durch das Haus und die darunterliegenden H\u00f6hlen, die einen alten Altar und einen unerforschten Dungeon beinhalten, verhandeln sie mit Horatio. Man einigt sich friedlich: Die Gruppe erh\u00e4lt das Eigentumsrecht und den unterirdischen Bereich, w\u00e4hrend Horatio sein Zimmer beh\u00e4lt und die Koordination des Hauses weiterf\u00fchrt. Ein Vertrag wird aufgesetzt und das Anwesen nach einer Abstimmung 'Casa de la Cookie' getauft. Esterossa erschafft magisch einen Schlafraum im Keller. In der Nacht wird Dodo von einem Brummen des Altars geweckt, dessen Flamme erneut auf seine Ber\u00fchrung reagiert, doch die Gruppe kann das R\u00e4tsel nicht l\u00f6sen. Am n\u00e4chsten Morgen erhalten sie einen Brief von Valeria, die sich wegen der bevorstehenden Geburt ihres Kindes vorerst von der Gruppe verabschiedet und ihnen Gold sowie einen mysteri\u00f6sen Ring schickt.\n\n# Auftretende Entit\u00e4ten\n\n* [Rotunas](/characters/rotunas.md) \u2014 Der magiebegabte Anf\u00fchrer der Gruppe, der den Vertrag mit Horatio mit seinem magischen Siegel unterzeichnet und den Altar untersucht. [00:09:33]\n* [Esterossa](/characters/esterossa.md) \u2014 Die gefl\u00fcgelte Abenteurerin, die zuerst mit den Goblins spricht und sp\u00e4ter mit ihrer Magie (Shape Material) einen Schlafraum im Keller erschafft. [00:09:33]\n* [Dodo](/characters/dodo.md) \u2014 Ein Halb-Goblin von der Insel Tarkia, der nach einem Freund namens Krenko sucht und in der Nacht als Einziger das Brummen des Altars h\u00f6rt. [00:09:33]\n* [Horatio](/npcs/horatio.md) \u2014 Der menschliche 'Herr des Hauses', der das verfallene Anwesen mit den Goblins wieder aufgebaut hat. Er handelt einen friedlichen Vertrag mit der Gruppe aus und \u00fcbergibt Rotunas ein magisches Amulett f\u00fcr die Tore. [00:16:33]\n* [Lukas](/npcs/lukas.md) \u2014 Ein freundlicher Goblin-Alchemist, der der Gruppe das Haus zeigt und selbstgebraute Tr\u00e4nke anbietet, darunter einen dubiosen Heiltrank und einen Zaubertrank. [00:09:48]\n* [Link](/npcs/link.md) \u2014 Der menschliche Wirt des Anwesens, der Essen und Bier anbietet und das s\u00fc\u00dfe Pilzsekret zum S\u00fc\u00dfen von Wein verwendet. [00:29:37]\n* [Hexenmeister-Goblin](/npcs/hexenmeister_goblin.md) \u2014 Ein intelligenter, aber misstrauischer Goblin, der ein Buch 'Goblinisch f\u00fcr Dummies' studiert und Dodo gegen\u00fcber nach einem magischen Blitz vertrauensvoller wird. [00:14:48]\n* [Valeria](/characters/valeria.md) \u2014 Eine ehemalige Gef\u00e4hrtin der Gruppe, die sich per Brief verabschiedet, da sie in ihrer Heimat die Geburt ihres Kindes vorbereitet. Sie schickt Gold und einen magischen Ring. [01:43:18]\n* [Casa de la Cookie](/locations/casa_de_la_cookie.md) \u2014 Der von der Gruppe und dem Chat gew\u00e4hlte Name f\u00fcr das neu erworbene Anwesen, das zuvor namenlos war. [01:21:09]\n* [Willauch](/locations/willauch.md) \u2014 Die Stadt, deren Lord der Gruppe das Anwesen als Belohnung f\u00fcr den Sieg \u00fcber den Lich \u00fcberlassen hat. [00:01:38]\n* [Der Altar](/items/der_altar.md) \u2014 Ein alter Opferaltar im Keller mit einer ewigen, blitzenden Flamme, die magisch aufgeladen ist und nachts zu brummen beginnt. Er scheint mit einem Kult der alten G\u00f6tter in Verbindung zu stehen. [00:53:34]\n* [Das Amulett](/items/das_amulett.md) \u2014 Ein von Horatio gefundener Gegenstand, der die Tore zum Keller und zum Dungeon \u00f6ffnet und verschlie\u00dft. Horatio \u00fcbergibt es an Rotunas. [00:58:04]\n* [Der Dungeon](/locations/der_dungeon.md) \u2014 Eine unerforschte H\u00f6hle unter dem Anwesen, die Horatio der Gruppe zur Erkundung anbietet. [00:54:36]\n* [Der Vertrag](/events/der_vertrag.md) \u2014 Die friedliche Einigung zwischen der Gruppe und Horatio, die den Besitzanspruch der Gruppe anerkennt, Horatio aber sein Zimmer und die Koordination des Hauses zusichert. [01:15:09]\n* [Valerias Brief](/events/valerias_brief.md) \u2014 Ein Bote \u00fcberbringt einen Brief von Valeria, die sich aufgrund der bevorstehenden Geburt ihres Kindes von der Gruppe verabschiedet und ihnen Gold sowie einen r\u00e4tselhaften Ring als Unterst\u00fctzung schickt. [01:43:18]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=8Khb-Y8XbKY)", "sessions/2025-11-18": "# Zusammenfassung\n\nDie Gruppe kehrt in die winterliche Taverne von Ehrenfels zur\u00fcck und trifft auf Nyrella, die von der Bedrohung durch Untote um das Banditenlager berichtet. Dodo \u00fcberbringt die traurige Nachricht von Cookies heldenhaftem Tod im Kampf gegen einen Lich, woraufhin die Taverne gemeinsam auf sie anst\u00f6\u00dft. Eine neue, geheimnisvolle Hexe namens Lunara Velora stellt sich der Gruppe vor und bittet um Aufnahme, was zun\u00e4chst auf Skepsis, besonders bei Esterossa, st\u00f6\u00dft. Die Stimmung wird durch einen Marktschreier gedr\u00fcckt, der von milit\u00e4rischer Mobilisierung in Willau und einer undurchdringlichen Bedrohung um Breska berichtet. Nyrella und Nairuk heitern die Taverne mit einer Zirkusvorstellung auf. Sp\u00e4ter erfahren die Abenteurer von der Priesterin Auranie und dem K\u00e4pt'n Lobrecht mehr \u00fcber die massive Untotenbedrohung, die Breska belagert. Die Gruppe akzeptiert Lunara schlie\u00dflich vorl\u00e4ufig und l\u00e4dt sie ein, sie auf ihrer n\u00e4chsten Mission zu begleiten. Auf dem Weg zum Quartier begegnen sie dem blutverschmierten, aber unger\u00fchrten Gildenmeister. In ihrem Unterschlupf angekommen, h\u00f6rt Rotunas mitten in der Nacht ein Klopfen an der T\u00fcr, auf das niemand antwortet.\n\n# Auftretende Entit\u00e4ten\n\n* [Esterossa](/characters/esterossa.md) \u2014 Ein gefl\u00fcgelter Charakter, der neuen Hexen gegen\u00fcber sehr misstrauisch ist und versucht, Nyrella durch Magie vor zu viel Alkohol zu sch\u00fctzen. Er \u00fcbergibt sich sp\u00e4ter drau\u00dfen, nachdem er versucht hat, mit den anderen beim Trinken mitzuhalten. [00:02:14]\n* [Rotunas](/characters/rotunas.md) \u2014 Ein mit Runen bedeckter Zauberer und Anf\u00fchrer der Gruppe. Er bleibt den Abend \u00fcber n\u00fcchtern und beobachtet aufmerksam die Stimmung in der Taverne. Er ist offen f\u00fcr die Aufnahme von Lunara und h\u00f6rt nachts ein mysteri\u00f6ses Klopfen. [00:02:24]\n* [Dodo](/characters/dodo.md) \u2014 Ein Goblin, der die traurige Nachricht von Cookies Tod \u00fcberbringt und Lunara den Stein von Cookie anbietet, um mit Perry zu sprechen. Er ist neugierig auf den von Goblins gebrauten Kornklatscher. [00:04:08]\n* [Nyrella](/characters/nyrella.md) \u2014 Eine kleine, gefl\u00fcgelte Frohnatur und ehemalige Zirkusartistin, die mit ihrem Eisb\u00e4ren Nairuk reist. Sie berichtet von der bedrohlichen Lage im Banditenlager und heitert sp\u00e4ter die Taverne mit einer Vorf\u00fchrung auf. [00:06:45]\n* [Lunara Velora](/characters/lunara_velora.md) \u2014 Eine neue, junge Hexe mit blasser Haut, wei\u00dfen Haaren und Runen, die halb Tidekin ist. Sie sucht nach dem Verlust ihres Zirkels eine neue Familie und bittet die Gruppe um Aufnahme. Sie bl\u00fcht in der Nacht auf und gewinnt schnell das Vertrauen des Schnabeltiers Perry. [00:21:17]\n* [Cookie](/characters/cookie.md) \u2014 Ein verstorbenes Mitglied der Gruppe, das im Kampf gegen einen Lich heldenhaft gefallen ist. Ihr Tod wird in der Taverne betrauert und der Marktschreier wird beauftragt, ihre Legende zu verbreiten. [00:09:47]\n* [Nairuk](/npcs/nairuk.md) \u2014 Nyrellas treuer Eisb\u00e4r, der auf die Nachricht von Cookies Tod mit einem traurigen Heulen reagiert und sp\u00e4ter an der Zirkusvorf\u00fchrung in der Taverne teilnimmt. [00:06:45]\n* Perry \u2014 Das Schnabeltier der Gruppe, das normalerweise sehr misstrauisch ist, aber sofort eine ungew\u00f6hnliche Zuneigung zu Lunara zeigt, was die Gruppe \u00fcberrascht. [01:44:19]\n* [Auranie](/npcs/auranie.md) \u2014 Eine Priesterin, die aus Breska vertrieben wurde, weil ihre Predigten nicht mehr geh\u00f6rt wurden. Sie berichtet der Gruppe von ihrer Sorge, dass Breska von Untoten \u00fcberrannt werden k\u00f6nnte und nicht mehr existiert. [01:23:00]\n* [Gildenmeister](/npcs/gildenmeister.md) \u2014 Der Anf\u00fchrer der Gilde, dem die Gruppe sp\u00e4t in der Nacht blutverschmiert, aber v\u00f6llig gefasst begegnet. Er winkt besorgte Nachfragen ab. [01:40:34]\n* [Marktschreier](/npcs/marktschreier.md) \u2014 Ein Nachrichtenverbreiter, der in der Taverne Neuigkeiten verk\u00fcndet, darunter die milit\u00e4rische Aufr\u00fcstung in Willau, die Nachrichtensperre aus Breska und die Sichtung von Untoten am Fu\u00dfe des Berges. [00:55:14]\n* [K\u00e4pt'n Lobrecht](/npcs/kaept_n_lobrecht.md) \u2014 Ein Kapit\u00e4n, der mit Miaomani unterwegs ist und best\u00e4tigt, dass die Gegend um Breska aufgrund von Untoten unpassierbar ist und die Stadt keine Hilfe von au\u00dfen annehmen will. [01:28:51]\n* [Ehrenfels](/locations/ehrenfels.md) \u2014 Eine Stadt in den Bergen, in der die Taverne und das Quartier der Gruppe liegen. Es ist Winter, es liegt Schnee und der Fluss beginnt zu gefrieren. [00:00:04]\n* [Breska](/locations/breska.md) \u2014 Eine Stadt, die von einer massiven Armee von Untoten belagert oder bereits \u00fcberrannt wurde. Es kommen keine Nachrichten mehr heraus und die Priesterin Auranie spekuliert \u00fcber ihren Untergang. [00:56:57]\n* [Willau](/locations/willau.md) \u2014 Der Ort, an dem die Arena-K\u00e4mpfe stattfanden. Nach dem Sieg \u00fcber Brandau mobilisiert Willau erneut sein Milit\u00e4r, um Macht zu demonstrieren. [00:56:57]\n* [Dwarfmaster Gilde](/factions/dwarfmaster_gilde.md) \u2014 Die Gilde, der die Abenteurer angeh\u00f6ren. Sie bietet Auftr\u00e4ge an und stellt ihren Mitgliedern Unterk\u00fcnfte zur Verf\u00fcgung. Eine andere Gruppe der Gilde ist k\u00fcrzlich bei einem Auftrag ums Leben gekommen. [00:00:04]\n* [Kornklatscher](/items/kornklatscher.md) \u2014 Ein starkes, von Goblins gebrautes alkoholisches Getr\u00e4nk, das wie Putzalkohol schmeckt und im Magen blubbert. Es wird in der Taverne zu einem Wettbewerb zwischen Nyrella und Lunara getrunken. [00:26:56]\n* [Tod von Cookie](/events/tod_von_cookie.md) \u2014 Die Gruppe trauert um Cookie, die im Kampf gegen einen Lich gefallen ist. Die Nachricht wird von Dodo \u00fcberbracht und f\u00fchrt zu einer r\u00fchrenden Trauerbekundung in der gesamten Taverne. [00:09:47]\n* [Zirkusvorf\u00fchrung](/events/zirkusvorfuehrung.md) \u2014 Um die gedr\u00fcckte Stimmung in der Taverne zu heben, f\u00fchren Nyrella und Nairuk Kunstst\u00fccke auf, unterst\u00fctzt von Rotunas' Lichtzaubern und Esterossas goldenem Glitzer. Die Show ist ein voller Erfolg. [01:12:24]\n* [Mysteri\u00f6ses Klopfen](/events/mysterioeses_klopfen.md) \u2014 Mitten in der Nacht klopft es an der T\u00fcr des Gruppenquartiers. Als Rotunas nachfragt, wer da ist, erh\u00e4lt er keine Antwort, was die Session mit einem unheimlichen Cliffhanger beendet. [01:53:42]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=w__ahowb9p0)", "sessions/2025-11-25": "# Zusammenfassung\n\nDie Gruppe, nun mit Lindo Laut, ist auf dem Weg zum Banditenlager, um den dortigen Bewohnern zu helfen. Im verschneiten Wald sp\u00fcrt Lindo Laut eine Kreatur aus der Splitterwelt auf, die den Lebenden Energie entzieht. Ein Kampf entbrennt, bei dem die Kreatur Dodo teilweise verschlingt. Die Gruppe entdeckt, dass der Wald eine sch\u00fctzende Aura gegen die Kreatur und Untote besitzt. Mit vereinten Kr\u00e4ften und unter Einsatz von Esterossas heiliger Magie k\u00f6nnen sie das Wesen an einen Baum binden und vernichten. Es hinterl\u00e4sst einen Beschw\u00f6rungsstab, den Lindo Laut an sich nimmt. Kurz darauf werden sie von einer Horde Untoter angegriffen, die sie mit einem \u00dcberraschungsangriff und m\u00e4chtiger Magie zur\u00fcckschlagen. Auf dem R\u00fcckzug der Untoten finden sie einen sterbenden Mann, der von einem untoten General und einem Magier verflucht wurde. Lindo Lauts Versuch, den Fluch zu bannen, beschw\u00f6rt versehentlich etwas aus der Splitterwelt und zieht die Seele des Mannes dorthin. Die Gruppe sucht Schutz in einer H\u00fctte, wo Lindo Laut seinen Diener Slicks beschw\u00f6rt, der ihm d\u00fcstere Offenbarungen \u00fcber seine F\u00e4higkeiten und seine Verbindung zur Splitterwelt macht. Die Session endet mit der Entscheidung, am n\u00e4chsten Morgen direkt zu den Fl\u00fcchtlingen weiterzuziehen.\n\n# Auftretende Entit\u00e4ten\n\n* [Rotunas](/characters/rotunas.md) \u2014 Ein magiebegabter Riese mit Eis- und Feuerkr\u00e4ften. Er versucht, die Splitterwelt-Kreatur mit Eis zu binden und entfesselt sp\u00e4ter eine gewaltige Eis-Explosion, die viele Untote vernichtet. Er versiegelt die verfluchte Leiche in einem Eisblock. [00:32:59]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Ein d\u00e4monisch verwandelter Charakter mit Verbindung zur Splitterwelt. Er sp\u00fcrt die Kreatur auf, sch\u00fctzt die Gruppe vor ihrem Einfluss und versucht, ein Portal zu \u00f6ffnen. Er beschw\u00f6rt seinen Diener Slicks und erf\u00e4hrt, dass er Seelen nach Abyssalis schicken kann. [00:08:12]\n* [Esterossa](/characters/esterossa.md) \u2014 Ein Heiler mit heiliger Magie. Seine Kr\u00e4fte sind effektiv gegen die Splitterwelt-Kreatur. Er heilt Dodo und Rotunas mehrfach und versucht, den sterbenden Mann mit 'Lifeguard' zu retten. [00:49:28]\n* [Dodo](/characters/dodo.md) \u2014 Ein K\u00e4mpfer mit einem heiligen Streitkolben und der F\u00e4higkeit, Feuer zu spucken. Er wird von der Splitterwelt-Kreatur verschlungen und erleidet schweren Schaden. Im Kampf gegen die Untoten f\u00fchrt er einen spektakul\u00e4ren, sich drehenden Feuerangriff aus. [00:41:49]\n* [Splitterwelt-Kreatur](/npcs/splitterwelt_kreatur.md) \u2014 Ein geisterhaftes Wesen aus der Splitterwelt, das Lebewesen Energie entzieht und sie verschlingt. Es scheint wie ein Werkzeug zu agieren und wird durch den Kontakt mit den B\u00e4umen des Waldes vernichtet. Es hinterl\u00e4sst einen Beschw\u00f6rungsstab. [00:08:50]\n* [Slicks](/npcs/slicks.md) \u2014 Lindo Lauts d\u00fcsterer, unterw\u00fcrfiger Diener. Er erscheint auf Abruf und offenbart Lindo Laut, dass dieser die Seele des sterbenden Mannes nach Abyssalis geschickt hat und die Macht besitzt, Kreaturen zu beschw\u00f6ren und zu 'verbessern'. [01:53:10]\n* [Sterbender Mann](/npcs/sterbender_mann.md) \u2014 Ein Gefangener der Untoten, der von einem untoten Magier verflucht wurde. Er stirbt an seinen Wunden und dem Fluch, woraufhin seine Seele durch Lindo Lauts Einwirkung in die Splitterwelt gezogen wird. [01:35:34]\n* [Untoter General](/npcs/untoter_general.md) \u2014 Ein Anf\u00fchrer der Untoten, der in einer Vision des sterbenden Mannes gesehen wird. Er scheint die Untoten zu befehligen und ist mit einem untoten Magier unterwegs. [01:36:49]\n* [Untoter Magier](/npcs/untoter_magier.md) \u2014 Ein magiebegabter Untoter, der dem sterbenden Mann einen Fluch auferlegt und die Botschaft hinterl\u00e4sst, dass sie 'im Wald am Ende der Route' auf die Gruppe warten. [01:36:49]\n* [Magischer Wald](/locations/magischer_wald.md) \u2014 Der Wald um den Berg der Gilde. Er besitzt eine sch\u00fctzende Aura, die Kreaturen der Splitterwelt und Untote abwehrt. Die B\u00e4ume nehmen die sch\u00fctzende Energie aus dem Wasser des Waldes auf. [00:24:22]\n* [Schutzh\u00fctte](/locations/schutzhuette.md) \u2014 Eine kleine, leere H\u00fctte auf einem freien Feld, die fr\u00fcher Reisenden als Schutz diente. Die Gruppe sucht dort am Ende der Session Zuflucht vor der K\u00e4lte. [01:50:33]\n* [Beschw\u00f6rungsstab](/items/beschwoerungsstab.md) \u2014 Ein gef\u00e4hrliches Artefakt, das von der vernichteten Splitterwelt-Kreatur zur\u00fcckgelassen wurde. Es dient dazu, Kreaturen aus anderen Reichen zu beschw\u00f6ren. Lindo Laut kann es gefahrlos an sich nehmen. [00:56:25]\n* [Schl\u00fcssel (Stab von Lindo Laut)](/items/schluessel_stab_von_lindo_laut.md) \u2014 Lindos Stab, der als 'Schl\u00fcssel' bezeichnet wird und ihm als Medium dient, um Energie zu fokussieren und Verbindungen zur Splitterwelt herzustellen. [00:15:15]\n* [Kampf gegen die Splitterwelt-Kreatur](/events/kampf_gegen_die_splitterwelt_kreatur.md) \u2014 Die Gruppe stellt sich der Kreatur, die Dodo verschlingt. Sie entdecken die Schw\u00e4che des Wesens gegen\u00fcber dem Wald und heiliger Magie und vernichten es, indem sie es an einen Baum binden. [00:39:35]\n* [Kampf gegen die Untotenhorde](/events/kampf_gegen_die_untotenhorde.md) \u2014 Eine gro\u00dfe, koordinierte Horde Untoter greift an. Die Gruppe nutzt einen \u00dcberraschungsangriff durch ein Portal und Rotunas entfesselt eine m\u00e4chtige Eisattacke, die die meisten Feinde auf einen Schlag vernichtet und den Rest in die Flucht schl\u00e4gt. [01:10:11]\n* [Beschw\u00f6rung durch Lindo Laut](/events/beschwoerung_durch_lindo_laut.md) \u2014 Beim Versuch, den Fluch des sterbenden Mannes zu bannen, beschw\u00f6rt Lindo Laut versehentlich schwarze, wurzelartige Kreaturen aus der Splitterwelt und zieht die Seele des Mannes dorthin. [01:40:45]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=wd5R4fJfngY)", "sessions/2026-01-06": "# Zusammenfassung\n\nDie Heldengruppe, bestehend aus Dodo, Esterossa, Lindo Laut und Lunara, h\u00e4lt in einer notd\u00fcrftig reparierten H\u00fctte nahe eines Fl\u00fcchtlingslagers Ausschau nach der untoten Bedrohung durch Zebras. Gelangweilt von der anhaltenden Ruhe und dem tiefen Winter, entdecken sie bei einem Routinegang eine mysteri\u00f6se Statue, die sich scheinbar nur dann bewegt, wenn sie nicht beobachtet wird. Kurz darauf h\u00f6ren sie einen Schrei und finden einen schwer verwundeten Soldaten aus Breska, der von Untoten angegriffen wird. Nach einem kurzen Kampf retten sie ihn und erfahren, dass er Teil einer Gruppe war, die eine dringende Nachricht von Lord Voras nach Ehrenfels bringen sollte, sein Kommandant jedoch gefallen und die Botschaft verloren ist. Zur\u00fcck in der H\u00fctte zerst\u00f6ren sie die Statue, in deren Inneren sich ein gr\u00fcner Kristall befindet, dessen Explosion Dodo eine kurze Vision eines Labors und einer Gestalt beschert. Der Soldat stirbt beinahe an einer gr\u00fcnen Substanz, wird aber von Lunara wiederbelebt und wirkt danach wie ausgewechselt. Die Gruppe kehrt zum Ort des \u00dcberfalls zur\u00fcck, birgt das versiegelte Dokument vom Leichnam des Kommandanten und wird auf dem R\u00fcckweg von einem gef\u00e4hrlichen Seelenkalb attackiert. W\u00e4hrend des Kampfes wird Dodo kurzzeitig verschlungen, kann aber von Esterossa befreit werden. Schlie\u00dflich stellt sich heraus, dass der Soldat erneut von einer fremden Macht korrumpiert wurde und mit dem Dokument fliehen wollte, woraufhin Lindo Laut ihn aufh\u00e4lt und Esterossa versucht, ihn mit ihrer Magie zu retten.\n\n# Auftretende Entit\u00e4ten\n\n* [Dodo](/characters/dodo.md) \u2014 Ein blauer Halb-Drakoner/Halb-Goblin, der als Tank der Gruppe ohne R\u00fcstung k\u00e4mpft. Er nutzt seine Feuerf\u00e4higkeiten, um B\u00e4ume zu markieren und Kristalle zu zerst\u00f6ren, und erh\u00e4lt eine Vision von einem Labor und einer Gestalt. [00:09:34]\n* [Esterossa](/characters/esterossa.md) \u2014 Ein Asima Seraph, der Heiler der Gruppe. Er heilt den verwundeten Soldaten, tr\u00e4gt ihn im Flug und f\u00fcgt dem Seelenkalb mit seiner heiligen Magie schweren Schaden zu, um Dodo zu befreien. [00:10:34]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Die diplomatische Speerspitze der Gruppe mit vampir\u00e4hnlichen Z\u00fcgen. Er nutzt Gedankenlesen, um die Erinnerungen des Soldaten zu durchsuchen, beschw\u00f6rt eine Feuerwand und kommuniziert mit seinem Diener Slix \u00fcber die Kreaturen der Zwischenwelt. [00:11:28]\n* [Lunara Velora](/characters/lunara_velora.md) \u2014 Eine k\u00fchle, geheimnisvolle und tierliebe Wundhexe, die neu in der Gruppe ist. Sie wehrt Pfeile mit Magie ab, verhext Gegner, beschw\u00f6rt Ketten, um die Statue zu zerst\u00f6ren, und belebt den erstickten Soldaten wieder. [00:11:40]\n* [Verwundeter Soldat aus Breska](/npcs/verwundeter_soldat_aus_breska.md) \u2014 Ein Soldat im Dienste von Lord Voras, der mit einer wichtigen Botschaft nach Ehrenfels unterwegs war. Er wird von der Gruppe gerettet, stirbt fast an einer gr\u00fcnen Substanz, wird wiederbelebt und verh\u00e4lt sich danach seltsam, bevor er versucht, mit dem Dokument zu fliehen. [00:39:59]\n* [Slix](/npcs/slix.md) \u2014 Lindo Lauts Diener, der auf Abruf erscheint. Er identifiziert das Seelenkalb, zeigt sich entt\u00e4uscht \u00fcber Lindos Z\u00f6gern, seine Macht einzusetzen, und dr\u00e4ngt ihn, seine Kr\u00e4fte zu nutzen. [01:39:37]\n* [Seelenkalb](/npcs/seelenkalb.md) \u2014 Eine gef\u00e4hrliche Kreatur der Zwischenwelt, die Seelen verschlingt. Sie greift die Gruppe an, verschluckt Dodo kurzzeitig und wird schlie\u00dflich von Esterossa und Lindo Laut in die Flucht geschlagen. [01:40:31]\n* [H\u00fctte am Berghang](/locations/huette_am_berghang.md) \u2014 Eine notd\u00fcrftig reparierte H\u00fctte au\u00dferhalb des Fl\u00fcchtlingslagers, die der Gruppe als Unterschlupf und Ausguck dient. Sie ist der zentrale R\u00fcckzugsort w\u00e4hrend dieser Session. [00:14:46]\n* [Wald nahe der H\u00fctte](/locations/wald_nahe_der_huette.md) \u2014 Ein verschneiter, unheimlich stiller Wald, in dem die Gruppe patrouilliert. Hier finden sie die sich bewegende Statue, den verwundeten Soldaten und werden von Untoten und dem Seelenkalb angegriffen. [00:17:17]\n* [Breska](/locations/breska.md) \u2014 Eine Stadt, die von Untoten belagert wird und unter Nahrungsmittelknappheit leidet. Von hier stammt der verwundete Soldat mit der wichtigen Nachricht von Lord Voras. [00:39:59]\n* [Ehrenfels](/locations/ehrenfels.md) \u2014 Das eigentliche Ziel der Nachricht, die der Soldat \u00fcberbringen soll. Wird von ihm im wiederbelebten Zustand als Ziel genannt, nachdem er zuvor von Willauch sprach. [01:25:36]\n* [Fl\u00fcchtlingslager](/locations/fluechtlingslager.md) \u2014 Ein Lager, in dem die Gruppe zuvor den Winter verbracht hat und von dem aus sie nun als Sp\u00e4her agieren. Es liegt weiter oben am Berg. [00:14:46]\n* [Die Gilde](/factions/die_gilde.md) \u2014 Die Organisation, der die Helden angeh\u00f6ren und die w\u00f6chentlich Auftr\u00e4ge verteilt. Sie ist der Grundpfeiler der Kampagne. [00:12:18]\n* [Untote Horde (Zebras)](/factions/untote_horde_zebras.md) \u2014 Eine gro\u00dfe untote Bedrohung, die sich \u00fcber das Land ausbreitet und gegen die die Helden k\u00e4mpfen. In dieser Session greifen Skelett-Bogensch\u00fctzen und Nahk\u00e4mpfer die Gruppe an. [00:12:18]\n* [Versiegeltes Dokument](/items/versiegeltes_dokument.md) \u2014 Eine wichtige, unge\u00f6ffnete Schriftrolle von Lord Voras, die der Kommandant bei sich trug. Sie soll nach Ehrenfels gebracht werden und wird schlie\u00dflich von Lindo Laut vor dem fliehenden Soldaten gesichert. [01:37:04]\n* [Gr\u00fcner Kristall](/items/gruener_kristall.md) \u2014 Ein leuchtender Kristall im Inneren der Statue, der bei Zerst\u00f6rung explodiert und Dodo eine Vision eines Labors mit einem gro\u00dfen Kristall und einer Gestalt zeigt. \u00c4hnliche Kristalle wurden von der Gruppe bereits zuvor gesehen. [01:12:58]\n* [Mysteri\u00f6se Statue](/items/mysterioese_statue.md) \u2014 Eine verwitterte Statue, die sich unbemerkt bewegt, wenn sie nicht beobachtet wird. Sie enth\u00e4lt einen gr\u00fcnen Kristall und scheint eine Verbindung zu dem korrumpierten Soldaten zu haben. Wird von Lunara mit Ketten zerst\u00f6rt. [00:28:10]\n* [Entdeckung der Statue](/events/entdeckung_der_statue.md) \u2014 Esterossa entdeckt bei einer Patrouille eine Statue, die der Gruppe zuvor nie aufgefallen war und die sich scheinbar von selbst bewegt hat. [00:26:23]\n* [Rettung des Soldaten](/events/rettung_des_soldaten.md) \u2014 Die Gruppe h\u00f6rt einen Schrei und findet einen schwer verwundeten Soldaten aus Breska, der von untoten Bogensch\u00fctzen angegriffen wird. Sie wehren die Pfeile ab und schlagen die Untoten zur\u00fcck. [00:39:59]\n* [Zerst\u00f6rung der Statue und Vision](/events/zerstoerung_der_statue_und_vision.md) \u2014 Lunara zerst\u00f6rt die Statue mit beschworenen Ketten. Dodo verbrennt den freigelegten gr\u00fcnen Kristall, was eine Explosion ausl\u00f6st und ihm eine kurze Vision eines Labors und einer Person beschert. [01:11:49]\n* [Wiederbelebung des Soldaten](/events/wiederbelebung_des_soldaten.md) \u2014 Der Soldat erstickt fast an einer gr\u00fcnen Substanz in seinem Erbrochenen. Lunara f\u00fchrt eine Herzdruckmassage durch und gibt Hope aus, um ihn erfolgreich wiederzubeleben. [01:18:03]\n* [Bergung des Dokuments](/events/bergung_des_dokuments.md) \u2014 Die Gruppe kehrt zum Ort des \u00dcberfalls zur\u00fcck und findet die Leichen der Soldaten. Der wiederbelebte Soldat birgt das versiegelte Dokument aus der R\u00fcstung des gefallenen Kommandanten. [01:36:50]\n* [Kampf gegen das Seelenkalb](/events/kampf_gegen_das_seelenkalb.md) \u2014 Auf dem R\u00fcckweg wird die Gruppe von einem Seelenkalb angegriffen. Es verschlingt Dodo, der sich nicht befreien kann, bevor Esterossa ihn mit einem gezielten Angriff aus dem Bauch der Kreatur schneidet und diese in die Flucht schl\u00e4gt. [01:47:50]\n* [Vereitelung der Flucht](/events/vereitelung_der_flucht.md) \u2014 Der Soldat versucht erneut, mit dem Dokument zu fliehen, wird aber von Lindo Laut aufgehalten. Esterossa versucht, ihn mit Magie von der Korruption durch einen Kristall in seinem K\u00f6rper zu heilen. [02:04:29]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=VGw81seFvbo)", "sessions/2026-01-13": "# Zusammenfassung\n\nDie Gruppe kehrt von einer Patrouille ins Winterlager zur\u00fcck, das sich unter Nyrellas Einfluss zu einer kleinen, befestigten Siedlung entwickelt hat. Rotunas ist aus einem langen, transformierenden Schlaf erwacht und hat neue Kr\u00e4fte sowie die F\u00e4higkeit zur Teleportation erlangt. Die Ruhe wird durch einen Hilferuf aus der belagerten Stadt Breska unterbrochen, der von einem Boten namens Hans \u00fcberbracht wird. Hans entpuppt sich als unwissender \u00dcberbringer eines magischen Kristalls, aus dem ein m\u00e4chtiger untoter Ritter und ein fliegender Sch\u00e4del beschworen werden, die die Gruppe angreifen. W\u00e4hrend des Kampfes entdecken Esterossa und Nyrella, dass zwei mysteri\u00f6se Statuen auf den H\u00fcgeln die Kreaturen mit einem Schutzschild verst\u00e4rken. Nach der Zerst\u00f6rung der Statuen und einem erbitterten Kampf, in dem Dodo den Todesritter mit seinem heiligen Streitkolben vernichtet und Rotunas den Sch\u00e4del zerschmettert, erscheint der untote Lord Belorus pers\u00f6nlich. Er offenbart, dass er hinter Lindo Laut her ist, da dieser ein Fragment eines Gottes in sich tr\u00e4gt, das eine Gefahr f\u00fcr die Welt darstellt. Rotunas teleportiert die Gruppe in letzter Sekunde hinter die Palisaden, woraufhin Belorus eine gewaltige Armee von Untoten aus dem Boden erhebt und die Belagerung des Lagers beginnt.\n\n# Auftretende Entit\u00e4ten\n\n* [Rotunas](/characters/rotunas.md) \u2014 Der riesenhafte Magier ist aus einem langen Schlaf erwacht, hat die abyssische Sprache gelernt und f\u00fchlt sich k\u00f6rperlich leichter und st\u00e4rker. Er hat die neue F\u00e4higkeit erlangt, die Gruppe an Orte zu teleportieren, die er bereits besucht hat. [00:08:34]\n* [Nyrella](/characters/nyrella.md) \u2014 Die Fee hat ma\u00dfgeblich zum Zusammenhalt und Ausbau des Winterlagers beigetragen und Freundschaften zwischen Fl\u00fcchtlingen und Banditen gef\u00f6rdert. Sie ist hin- und hergerissen zwischen ihrer Verbundenheit zum Lager und ihrer Loyalit\u00e4t zur Gruppe. [00:15:48]\n* [Esterossa](/characters/esterossa.md) \u2014 Der gefl\u00fcgelte Charakter entdeckt w\u00e4hrend des Kampfes zwei mysteri\u00f6se Statuen auf den H\u00fcgeln, die den Feinden als Schutzschild dienen, und zerst\u00f6rt sie mit seinem Kriegshammer, was den Kampfverlauf entscheidend wendet. [01:19:15]\n* [Dodo](/characters/dodo.md) \u2014 Der Halbgoblin ist von der vorherigen Begegnung mit einem Splitterkalb noch stark mitgenommen. Im Kampf gegen den Todesritter erweist sich sein heiliger Streitkolben aus Zebras als eine der wenigen Waffen, die den magischen Schutz des Feindes durchdringen kann. [01:37:13]\n* [Lunara Velora](/characters/lunara_velora.md) \u2014 Die junge Hexe wird von einem Kobold im Lager nach ihrer Spezies gefragt. Im Kampf versucht sie, den Todesritter mit Wasserranken zu fesseln, was ihr kurzzeitig gelingt. [01:54:06]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Ist w\u00e4hrend der Session nicht anwesend, steht aber im Mittelpunkt des Konflikts. Belorus ist pers\u00f6nlich erschienen, um ihn zu t\u00f6ten, da er ein Fragment eines Gottes in sich tr\u00e4gt und eine Gefahr f\u00fcr die Welt darstellt. [02:09:45]\n* [Hal](/npcs/hal.md) \u2014 Der Anf\u00fchrer der Banditen hat seine grimmige Art abgelegt und das Lager liebgewonnen. Er erh\u00e4lt einen Hilferuf aus Breska und ber\u00e4t mit der Gruppe die n\u00e4chsten Schritte, da der Winter bald endet. [00:18:17]\n* [Hans](/npcs/hans.md) \u2014 Ein Soldat aus Breska, der eine Nachricht f\u00fcr Lindo Laut \u00fcberbringt. Er wurde von Lord Belorus geschickt und \u00fcbergibt ahnungslos einen magischen Kristall, aus dem der Todesritter beschworen wird. [00:52:04]\n* [Lord Belorus](/npcs/lord_belorus.md) \u2014 Ein m\u00e4chtiger untoter Lord in schwarzer R\u00fcstung, der die Untoten kontrolliert und Breska belagert. Er erscheint pers\u00f6nlich, um Lindo Laut zu t\u00f6ten, da dieser ein g\u00f6ttliches Fragment in sich tr\u00e4gt, das einen neuen Krieg der G\u00f6tter ausl\u00f6sen k\u00f6nnte. [02:07:07]\n* [Nayruk](/npcs/nayruk.md) \u2014 Nyrellas B\u00e4renbegleiter, der im Kampf versucht, den Todesritter von Dodo abzulenken, aber von diesem ignoriert wird. [01:51:40]\n* [Roland](/npcs/roland.md) \u2014 Ein Soldat oder Bandit im Lager, der auf dem Aussichtsturm Wache h\u00e4lt und deutlich entspannter wirkt als zuvor. [00:18:17]\n* [Winterlager](/locations/winterlager.md) \u2014 Das Lager wurde \u00fcber den Winter mit einem Graben, Palisaden, drei Holzh\u00fctten und einem Aussichtsturm befestigt. Es dient Fl\u00fcchtlingen und Banditen als Zuflucht und wird am Ende der Session von einer Armee Untoter belagert. [00:14:58]\n* [Breska](/locations/breska.md) \u2014 Eine Stadt, die von Untoten belagert wird. Ein Hilferuf von Voras dem Heiligen berichtet, dass die Mauern gefallen und die Bev\u00f6lkerung fast verhungert ist. [00:38:23]\n* [Ehrenfels](/locations/ehrenfels.md) \u2014 Eine Stadt, in die ein wichtiges Dokument gebracht werden soll. Dodo erw\u00e4hnt, dass sich dort das Trainingsgel\u00e4nde der Gilde befindet, zu der ein Portal ge\u00f6ffnet werden k\u00f6nnte. [00:45:25]\n* [Casa de Cookie](/locations/casa_de_cookie.md) \u2014 Ein Haus, das der Gruppe geh\u00f6rt und in dem Lindo Laut ein Portal platziert hat. Lunara schl\u00e4gt vor, einen magischen Baum zu pflanzen, um die Fl\u00fcchtlinge dorthin zu evakuieren. [00:47:53]\n* [Mysteri\u00f6se Statuen](/items/mysterioese_statuen.md) \u2014 Zwei uralte Statuen mit Masken auf den H\u00fcgeln um das Lager, die den beschworenen Untoten im Kampf ein magisches Schutzschild verleihen. Sie werden von Esterossa zerst\u00f6rt. [01:12:17]\n* [Gr\u00fcner Kristall / Seelenstein](/items/gruener_kristall_seelenstein.md) \u2014 Ein Kristall, der von Hans \u00fcberbracht wird und als Energiequelle f\u00fcr eine Teleportation dient. Aus ihm werden der Todesritter und der fliegende Sch\u00e4del beschworen. [01:15:10]\n* [Heiliger Streitkolben aus Zebras](/items/heiliger_streitkolben_aus_zebras.md) \u2014 Dodos Waffe, die sich als f\u00e4hig erweist, das magische Schutzschild des Todesritters zu durchdringen und ihm schweren Schaden zuzuf\u00fcgen. [01:37:13]\n* [Schriftrolle von Belorus](/items/schriftrolle_von_belorus.md) \u2014 Eine Nachricht an Lindo Laut, in der Belorus erkl\u00e4rt, dass Lindo Laut nicht existieren d\u00fcrfe, da er ein Produkt des G\u00f6tterkrieges sei und einen neuen Krieg ausl\u00f6sen k\u00f6nnte. [01:03:00]\n* [Kampf gegen den Todesritter](/events/kampf_gegen_den_todesritter.md) \u2014 Ein erbitterter Kampf gegen einen aus einem Kristall beschworenen untoten Ritter und einen fliegenden Sch\u00e4del. Der Kampf wird durch die Zerst\u00f6rung der sch\u00fctzenden Statuen und den Einsatz von Dodos heiligem Streitkolben gewonnen. [01:17:32]\n* [Erscheinen von Belorus und Beginn der Belagerung](/events/erscheinen_von_belorus_und_beginn_der_belagerung.md) \u2014 Nach dem Kampf erscheint Lord Belorus pers\u00f6nlich, offenbart seine Motive und erhebt eine Armee von Hunderten Untoten, um das Lager zu belagern, nachdem die Gruppe sich weigert, Lindo Laut auszuliefern. [02:14:25]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=w4LB1s9_3rs)", "sessions/2026-01-20": "# Zusammenfassung\n\nDie Gruppe verteidigt das Banditenversteck gegen Belorus und seine untote Armee. W\u00e4hrend des Kampfes verschanzen sie sich, verst\u00e4rken Barrikaden mit Magie und wehren mehrere Angriffswellen ab. Lindo Laut teleportiert sich ins Lager und versucht, Belorus mit Worten zu erreichen, was diesen zun\u00e4chst nur w\u00fctender macht. Lunara aktiviert eine m\u00e4chtige F\u00e4higkeit, die das Schlachtfeld in die Splitterwelt verschiebt und die meisten Untoten vernichtet. Belorus, nun besiegt und verunsichert, l\u00e4sst sich auf ein Gespr\u00e4ch ein. Lindo Laut kann ihn \u00fcberzeugen, dass sein Tod Vasul nur st\u00e4rken w\u00fcrde und die Gruppe nicht von Vasul kontrolliert wird. Belorus zieht sich mit seinen verbliebenen Magiern zur\u00fcck. Nach der Schlacht ehrt Hal die Gruppe, und Lindo Laut liest eine alte Notiz vor, die von einem f\u00fcnften Teil Vasuls in Ehrenfels berichtet, was der Feier einen bitteren Beigeschmack gibt.\n\n# Auftretende Entit\u00e4ten\n\n* [Belorus](/npcs/belorus.md) \u2014 Ein dunkler Paladin und Anf\u00fchrer einer untoten Armee, der Lindo Laut t\u00f6ten will, um die Macht des alten Gottes Vasul zu vernichten. Er wird im Kampf besiegt und von Lindo Lauts Worten \u00fcberzeugt, sich zur\u00fcckzuziehen. [00:06:59]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Ein Feenwesen und Spielercharakter, der die Macht des alten Gottes Vasul in sich tr\u00e4gt. Er teleportiert sich zur Schlacht, versucht zu verhandeln und \u00fcberzeugt Belorus schlie\u00dflich, dass sein Tod Vasul nur st\u00e4rken w\u00fcrde. [00:06:59]\n* [Lunara Velora](/characters/lunara_velora.md) \u2014 Eine Schatten-Mondhexe und Spielercharakterin. Sie versucht mit Belorus zu reden und entfesselt sp\u00e4ter eine m\u00e4chtige F\u00e4higkeit, die das Schlachtfeld in die Splitterwelt verschiebt und die meisten Untoten vernichtet. [00:14:51]\n* [Rotunas](/characters/rotunas.md) \u2014 Ein Runenleser und Spielercharakter, der sich zuvor als Lindo Laut ausgegeben hatte. Er wirkt im Kampf Nebelw\u00e4nde und Feuerb\u00e4lle und unterst\u00fctzt Lunara mit seiner Runenmagie, um die Splitterwelt zu manifestieren. [00:21:06]\n* [Nyrella](/characters/nyrella.md) \u2014 Eine Bogensch\u00fctzin und Spielercharakterin, die unter PTSD leidet. Sie erschafft eiserne Ranken zur Verteidigung und beschie\u00dft Belorus mit astralen Pfeilen, wodurch sie seine R\u00fcstung schw\u00e4cht. [00:23:48]\n* [Esterossa](/characters/esterossa.md) \u2014 Ein Spielercharakter, der das Holztor in Stahl verwandelt und die Barrikaden verst\u00e4rkt. Er heilt Lindo Laut und Rotunas im Kampf und sch\u00fctzt sie mit einem Schutzzauber. [00:13:00]\n* [Dodo](/characters/dodo.md) \u2014 Ein Spielercharakter, der im Kampf Kommandos gibt und Feuerst\u00f6\u00dfe einsetzt. Er verhindert im letzten Moment, dass Lindo Laut gegen seinen Willen Belorus angreift, und spendet der Gruppe Trost. [00:10:51]\n* [Hal](/npcs/hal.md) \u2014 Der Anf\u00fchrer der Banditen, der die Verteidigung des Lagers organisiert. Er bietet an, die Balliste auf Belorus zu schie\u00dfen, und bl\u00e4st nach schweren Verlusten zum R\u00fcckzug in die zweite Verteidigungslinie. [00:08:27]\n* [Nairuk](/npcs/nairuk.md) \u2014 Ein Eisb\u00e4r, der auf Dodos Kommando einen gro\u00dfen untoten Tempelritter vernichtet. [01:26:45]\n* [Slicks](/npcs/slicks.md) \u2014 Eine Pr\u00e4senz in Lindo Lauts Geist, die ihn dr\u00e4ngt, seine Macht zu nutzen und die Untoten zu vernichten. Sie bezeichnet Belorus als \u00dcberbleibsel der Vergangenheit. [00:41:35]\n* [Vasul](/npcs/vasul.md) \u2014 Ein alter Gott, dessen Macht in mehrere Teile zersplittert ist. Ein Teil befindet sich in Lindo Laut. Belorus will ihn vernichten, w\u00e4hrend andere M\u00e4chte ihn wiedererwecken wollen. [00:16:58]\n* [Banditenversteck](/locations/banditenversteck.md) \u2014 Ein Lager, das als Zufluchtsort f\u00fcr Fl\u00fcchtlinge aus Bereska dient. Es wird von einer Palisade, einem Tor und einer Br\u00fccke gesch\u00fctzt und ist Schauplatz der gro\u00dfen Schlacht gegen Belorus. [00:06:33]\n* [Splitterwelt](/locations/splitterwelt.md) \u2014 Eine Paralleldimension, die Lunara mit ihrer Macht teilweise mit der realen Welt verschmelzen l\u00e4sst. In diesem Zustand werden die meisten Untoten vernichtet und Belorus gibt auf. [01:34:52]\n* [Kristall](/items/kristall.md) \u2014 Ein magisches Artefakt, das von Belorus' Magiern getragen wird. Es wird von Hal mit der Balliste beschossen und sp\u00e4ter von Rotunas mit einem Feuerball getroffen, aber nicht zerst\u00f6rt. [00:51:06]\n* [Buch von Vasul](/items/buch_von_vasul.md) \u2014 Ein Buch, das Runen \u00e4hnlich denen von Lunara enth\u00e4lt und mit der Splitterwelt in Verbindung steht. Lindo Laut wirft es Belorus vor die F\u00fc\u00dfe, um seine Aufrichtigkeit zu beweisen. [01:39:46]\n* [Notiz von Vora](/items/notiz_von_vora.md) \u2014 Eine alte Notiz, die Lindo Laut am Ende der Session vorliest. Sie enth\u00fcllt die Existenz eines f\u00fcnften Teils von Vasul, der in Ehrenfels liegt und vom Gildenmeister bewacht wird. [02:03:43]\n* [Schlacht um das Banditenversteck](/events/schlacht_um_das_banditenversteck.md) \u2014 Die gro\u00dfe Verteidigungsschlacht gegen Belorus und seine untote Armee. Die Gruppe kann die Angriffe abwehren, woraufhin Belorus das Gespr\u00e4ch sucht und sich schlie\u00dflich zur\u00fcckzieht. [00:18:22]\n* [Enth\u00fcllung des f\u00fcnften Teils](/events/enthuellung_des_fuenften_teils.md) \u2014 Lindo Laut liest eine Notiz vor, die von einem f\u00fcnften, bisher unbekannten Teil Vasuls in Ehrenfels berichtet. Diese Nachricht tr\u00fcbt die Siegesstimmung der Gruppe. [02:04:06]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=H3ckYdTv4y8)", "sessions/2026-01-27": "# Zusammenfassung\n\nDie Abenteurer Rotunas und Esterossa erreichen die Zwergenfestung in den Bergen, um einen Konflikt mit Goblins zu l\u00f6sen. Nach einer Besprechung mit Hauptmann Krevis steigen sie in die Minen hinab, wo sie sofort in einen Kampf mit Goblins geraten. Rotunas gelingt es, den Kampf mit einem lauten 'Stopp' auf Goblinisch zu unterbrechen. Es folgen z\u00e4he Verhandlungen mit dem Goblin Lurk, die jedoch scheitern, da die Goblins das angebotene magische Erz nicht als wertvoll erachten. Daraufhin holen die Helden den Zwergenlord Harik hinzu, der sich bereit erkl\u00e4rt, pers\u00f6nlich zu verhandeln. Gemeinsam begeben sie sich \u00fcber eine Br\u00fccke tiefer in die Minen und werden zum Schamanen der Goblins gef\u00fchrt. Rotunas bietet im Namen der Zwerge nicht nur magisches Erz, sondern auch die Unterweisung im Schmieden von Waffen und Ausr\u00fcstung an. Der Schamane willigt ein und schlie\u00dft ein Friedensabkommen mit Lord Harik. Nach der erfolgreichen diplomatischen Mission teleportiert Rotunas die Gruppe zur\u00fcck in die Festung, wo sie belohnt werden.\n\n# Auftretende Entit\u00e4ten\n\n* [Rotunas](/characters/rotunas.md) \u2014 Ein riesenhafter (3,20 m) Magier und Spielercharakter, der als Diplomat auftritt und versucht, die Goblin-Sprache zu lernen. Er treibt die Verhandlungen voran und teleportiert die Gruppe am Ende zur\u00fcck. [00:01:51]\n* [Esterossa](/characters/esterossa.md) \u2014 Ein starker Krieger und Spielercharakter, der Rotunas unterst\u00fctzt, im Kam
