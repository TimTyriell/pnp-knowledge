uk spiegelt oft Nyrellas Misstrauen, besonders gegen\u00fcber [Lindo Laut](lindo_laut.md).\n*   **[Lindo Laut](lindo_laut.md):** Ein Verb\u00fcndeter, der sie im Kampf mit einem Wunsch heilt. Sp\u00e4ter ist Nairuk ihm gegen\u00fcber extrem misstrauisch.\n*   **[Dodo](dodo.md):** Ein Gruppenmitglied, das sie mit ihren Ranken aus einer Grube rettet.\n*   **[Cookie](cookie.md):** Kundschaftet mit ihr zusammen ein Banditenlager aus.\n\n# Belege\n\n1.  Session 2025-07-29 @ 00:00:39 (https://www.youtube.com/watch?v=XXgO5Ht4Q0A)\n2.  Session 2025-08-05 @ 00:01:00 (https://www.youtube.com/watch?v=cRNIWJz_ATo)\n3.  Session 2025-08-12 @ 00:00:21 (https://www.youtube.com/watch?v=vHIjua0BZ9Y)\n4.  Session 2025-08-20 @ 00:21:24 (https://www.youtube.com/watch?v=-XbO3FLSL_I)\n5.  Session 2025-09-02 @ 00:09:23 (https://www.youtube.com/watch?v=TLZOH7TlGhk)\n6.  Session 2025-09-06 @ 00:05:52 (https://www.youtube.com/watch?v=vo1xnyLQDJk)\n7.  Session 2025-09-09 @ 00:10:54 (https://www.youtube.com/watch?v=Zl0qfuI6Goc)\n8.  Session 2025-09-17 @ 00:04:51 (https://www.youtube.com/watch?v=AhIT8dcxw2o)\n9.  Session 2025-09-23 @ 00:04:02 (https://www.youtube.com/watch?v=DGzfqVigS0g)\n10. Session 2025-09-30 @ 00:07:27 (https://www.youtube.com/watch?v=bUT7Mc2hjUY)\n11. Session 2025-11-18 @ 00:06:45 (https://www.youtube.com/watch?v=w__ahowb9p0)\n12. Session 2026-01-13 @ 00:15:48 (https://www.youtube.com/watch?v=w4LB1s9_3rs)\n13. Session 2026-01-20 @ 00:23:48 (https://www.youtube.com/watch?v=H3ckYdTv4y8)\n14. Session 2026-02-11 @ 00:23:33 (https://www.youtube.com/watch?v=3C8SD-cyNPM)\n15. Session 2026-02-24 @ 00:05:16 (https://www.youtube.com/watch?v=WOFArbwDDIQ)", "characters/nyruk": "# Nyruk\n\nNyruk ist der treue Eisb\u00e4ren-Companion von [Nyrelle](nyrelle.md). Er k\u00e4mpft an ihrer Seite und unterst\u00fctzt sie im Gefecht, indem er Gegner durch lautes Br\u00fcllen warnt und einsch\u00fcchtert. Nyruk handelt auf Befehl seiner Gef\u00e4hrtin und folgt ihren Anweisungen im Kampf.\n\n# Belege\n1. Session 2025-07-29 @ 00:00:39 (https://www.youtube.com/watch?v=XXgO5Ht4Q0A)", "characters/pedro_die_katze": "# Pedro die Katze\n\nPedro die Katze ist die Tarnidentit\u00e4t von [Lindo Laut](lindo_laut.md), die er durch einen von [Sys Fizik](../npcs/sys_fizik.md) gebrauten Trank annimmt. In dieser Gestalt erscheint er als kleinw\u00fcchsiger Katari, um seine Anf\u00e4lligkeit in Phasen ohne Magie zu kaschieren und unerkannt zu bleiben.\n\n# Belege\n1. Session 2026-03-03, 01:58:44 \u2013 https://www.youtube.com/watch?v=BRUNuNKTeOg", "characters/rotunas": "# Rotunas\n\nRotunas ist ein riesenhafter Magier und Spielercharakter, gespielt von Micha. Er geh\u00f6rt einem Riesenstamm an und wird als Richborn-Zauberer beschrieben. Mit einer K\u00f6rpergr\u00f6\u00dfe von etwa drei Metern (3,20 m) ist er die gr\u00f6\u00dfte und schwerste Figur der Gruppe, was oft zu ungewollten Ger\u00e4uschen f\u00fchrt. Sein Name wurde zu Beginn der Session am 5. August 2025 korrigiert, da er zuvor falsch aufgeschrieben worden war.\n\n## Pers\u00f6nlichkeit und Rolle\n\nRotunas ist besonnen, h\u00f6flich und sieht sich als Besch\u00fctzer der einfachen Leute. Er fungiert h\u00e4ufig als Sprecher und Anf\u00fchrer der Gruppe, treibt Verhandlungen voran und trifft diplomatische Entscheidungen. Er lehnt moralisch fragw\u00fcrdige Auftr\u00e4ge ab \u2013 so verweigert er einen Auftrag der Gilde und hilft stattdessen Fl\u00fcchtlingen gro\u00dfz\u00fcgig mit Gold. Er \u00fcberzeugt [Roland](../npcs/roland.md) zur Flucht. In der Taverne bleibt er n\u00fcchtern und beobachtet aufmerksam die Stimmung. Er ist offen f\u00fcr die Aufnahme neuer Gruppenmitglieder wie [Lunara](../npcs/lunara.md).\n\n## Magische F\u00e4higkeiten\n\nRotunas ist ein vielseitiger Zauberwirker mit einem breiten Arsenal an Magie:\n\n- **Eismagie**: Eiszapfen (Ice Spike), Eis-Explosionen, Gegner mit Eis binden, Leichen in Eisbl\u00f6cken versiegeln\n- **Feuermagie**: Feuerb\u00e4lle, m\u00e4chtige Feuerzauber, riesige Feuerb\u00e4lle\n- **Arkanmagie**: Arkane T\u00fcren, arkaner Morgen (Arcane Dawn), magische Geschosse, magische H\u00e4nde\n- **Schutz- und Kontrollzauber**: Schutzzauber, Nebelw\u00e4nde, T\u00fcren magisch versiegeln, Zellent\u00fcren mit Magie versiegeln\n- **Bewegungsmagie**: Teleportation von T\u00fcren, Teleportation der gesamten Gruppe an bereits besuchte Orte, Kraftvoller Drucksto\u00df (Power Push)\n- **Wahrnehmungsmagie**: Reveal, Mystic Tether, verborgene Wesen enth\u00fcllen\n- **Sonstiges**: Fliegen beschw\u00f6ren, Runenmagie zur Unterst\u00fctzung anderer\n\n## Besondere Merkmale und Ausr\u00fcstung\n\nRotunas tr\u00e4gt magische Tattoos, Armringe und magische Ringe mit Runen. Er besitzt verbesserte arkanische Handschuhe, die er in einem Kampf fand. Er tr\u00e4gt das Amulett von [Duran](../npcs/duran.md), das sich nach einem Kampf verdunkelte, sowie einen Seelenstein, den er als Schutz einsetzt. Ein magischer Schl\u00fcssel in seinem Besitz wurde als Portalschl\u00fcssel identifiziert.\n\n## Verletzungen und Wunden\n\nIm Laufe der Kampagne erleidet Rotunas mehrere schwere Verletzungen:\n\n- Er schneidet sich an einer vergifteten Klaue, als er einen kranken Baum untersucht\n- Er erleidet einen Stromschlag von einer Rune und wird daraufhin von einem geisterhaften Doppelg\u00e4nger heimgesucht\n- Er wird von einem Attent\u00e4ter vergiftet, von einem Gnoll geheilt und erwacht mit einer bleibenden Wunde\n- Er wird im Kampf mehrfach fast get\u00f6tet, \u00fcberlebt aber durch seine F\u00e4higkeit \"Wizards Hope\" und Gl\u00fccksw\u00fcrfe\n- Er opfert im Kampf gegen [Slix](../npcs/slix.md) seinen rechten Unterarm, um diesen mit einem m\u00e4chtigen Schlag zu verletzen und zu vertreiben\n- Nach dem Verlust seines Arms tr\u00e4gt er eine von Zwergen gefertigte Metallprothese\n\n## Entwicklung\n\nNach einem langen Schlaf erwacht Rotunas mit neuen F\u00e4higkeiten: Er hat die abyssische Sprache gelernt, f\u00fchlt sich k\u00f6rperlich leichter und st\u00e4rker und kann die Gruppe an Orte teleportieren, die er bereits besucht hat. Er versucht zudem, die Goblin-Sprache zu lernen. Er gibt sich zeitweise als Lindo Laut aus.\n\n## Beziehungen\n\nRotunas ist seit den Ereignissen in Breska mit der Gruppe unterwegs. Er tr\u00e4gt [Valeria](valeria.md) auf seiner Schulter. Er verh\u00f6rt [Gulrak](../npcs/gulrak.md), untersucht Kristalle und analysiert Kontrollrunen, unterzeichnet einen Vertrag mit [Horatio](../npcs/horatio.md) mit seinem magischen Siegel und ist misstrauisch gegen\u00fcber dem alten Magier [Trickler](../npcs/trickler.md). Er schl\u00e4gt vor, den wahren Schuldigen der Anschuldigungen gegen die Silberkerne zu finden.\n\n# Belege\n\n1. Session 2025-04-09 @ 00:01:07 \u2013 https://www.youtube.com/watch?v=1PWdwvun5ow\n2. Session 2025-04-15 @ 00:05:14 \u2013 https://www.youtube.com/watch?v=YCpAz_syjaY\n3. Session 2025-04-23 @ 00:02:34 \u2013 https://www.youtube.com/watch?v=z3C-bewKqUs\n4. Session 2025-04-30 @ 00:09:19 \u2013 https://www.youtube.com/watch?v=fsCOiSkKKTE\n5. Session 2025-05-06 @ 00:17:48 \u2013 https://www.youtube.com/watch?v=e0v6AFGd4mE\n6. Session 2025-06-03 @ 00:24:05 \u2013 https://www.youtube.com/watch?v=jtYR4Je0a18\n7. Session 2025-06-10 @ 00:07:21 \u2013 https://www.youtube.com/watch?v=cLkCu3Iq3y8\n8. Session 2025-06-17 @ 00:04:37 \u2013 https://www.youtube.com/watch?v=tl76B4V0io8\n9. Session 2025-06-25 @ 00:00:00 \u2013 https://www.youtube.com/watch?v=tpkO9uGw6-I\n10. Session 2025-07-29 @ 00:06:48 \u2013 https://www.youtube.com/watch?v=XXgO5Ht4Q0A\n11. Session 2025-08-05 @ 00:01:14 \u2013 https://www.youtube.com/watch?v=cRNIWJz_ATo\n12. Session 2025-09-09 @ 00:10:34 \u2013 https://www.youtube.com/watch?v=Zl0qfuI6Goc\n13. Session 2025-09-17 @ 00:14:06 \u2013 https://www.youtube.com/watch?v=AhIT8dcxw2o\n14. Session 2025-09-23 @ 00:02:01 \u2013 https://www.youtube.com/watch?v=DGzfqVigS0g\n15. Session 2025-09-30 @ 00:14:45 \u2013 https://www.youtube.com/watch?v=bUT7Mc2hjUY\n16. Session 2025-10-07 @ 00:04:36 \u2013 https://www.youtube.com/watch?v=qVAF_54S8Vw\n17. Session 2025-10-14 @ 00:00:05 \u2013 https://www.youtube.com/watch?v=cUtz87UCHu4\n18. Session 2025-11-14 @ 00:09:33 \u2013 https://www.youtube.com/watch?v=8Khb-Y8XbKY\n19. Session 2025-11-18 @ 00:02:24 \u2013 https://www.youtube.com/watch?v=w__ahowb9p0\n20. Session 2025-11-25 @ 00:32:59 \u2013 https://www.youtube.com/watch?v=wd5R4fJfngY\n21. Session 2026-01-13 @ 00:08:34 \u2013 https://www.youtube.com/watch?v=w4LB1s9_3rs\n22. Session 2026-01-20 @ 00:21:06 \u2013 https://www.youtube.com/watch?v=H3ckYdTv4y8\n23. Session 2026-01-27 @ 00:01:51 \u2013 https://www.youtube.com/watch?v=9RzvnnWzV7E\n24. Session 2026-02-17 @ 00:00:01 \u2013 https://www.youtube.com/watch?v=Z2jlzpoTWVw\n25. Session 2026-03-18 @ 00:09:52 \u2013 https://www.youtube.com/watch?v=HHXxsASLrbQ", "characters/valeria": "# Valeria\n\nValeria ist eine Simja (Affenmagierin) und ehemalige Gef\u00e4hrtin der Gruppe. Sie zeichnet sich durch ihre starke Fixierung auf Essen, ihre Neugier und ihr impulsives Wesen aus. Optisch tr\u00e4gt sie eine Pilotenbrille und f\u00fchrt einen Great Staff, den sie f\u00fcr magische Angriffe einsetzt.\n\n## F\u00e4higkeiten & Magie\n\nAls Nomadin und Magierin beherrscht Valeria verschiedene Zauber. In K\u00e4mpfen setzt sie effektiv Feuerzauber ein, mit denen sie beispielsweise mehrere Goblins t\u00f6tet. Sie verf\u00fcgt zudem \u00fcber heilende F\u00e4higkeiten, wie die Rettung eines sterbenden Bauern zeigt.\n\n## Wichtige Handlungen\n\n- **Katakombe von Thornwell**: Valeria ber\u00fchrte das Bild an der Wand in der Katakombe.\n- **Schrein von Nerash**: In einer impulsiven Handlung l\u00f6schte sie die Kerze am Schrein von [Nerash](../glaube/nerash.md), wodurch eine gefesselte Kreatur erschien. Am Ende dieser Begegnung bot sie Nerash spontan ihre Dienste an.\n- **Abschied**: Valeria verabschiedete sich sp\u00e4ter per Brief von der Gruppe. Sie kehrte in ihre Heimat zur\u00fcck, um die Geburt ihres Kindes vorzubereiten. Als Abschiedsgeschenk schickte sie Gold und einen magischen Ring.\n\n## Verbindungen\n\n- [Nerash](../glaube/nerash.md) \u2013 Bot ihm spontan ihre Dienste an\n\n# Belege\n\n1. Session 2025-04-09 @ 00:01:07 (https://www.youtube.com/watch?v=1PWdwvun5ow)\n2. Session 2025-04-23 @ 00:23:30 (https://www.youtube.com/watch?v=z3C-bewKqUs)\n3. Session 2025-07-09 @ 00:46:11 (https://www.youtube.com/watch?v=XOnHa6CmDbo)\n4. Session 2025-11-14 @ 01:43:18 (https://www.youtube.com/watch?v=8Khb-Y8XbKY)", "events/absturz_in_die_tiefe": "# Absturz in die Tiefe\n\nDer **Absturz in die Tiefe** war ein gef\u00e4hrlicher Vorfall, der sich w\u00e4hrend der Erkundung einer unterirdischen Umgebung ereignete.\n\n## Verlauf\n\n[Lunara](../characters/lunara.md) trat auf eine br\u00fcchige Steinplatte, die unter ihrem Gewicht nachgab. Sie st\u00fcrzte daraufhin in einen tiefen Spalt und drohte in die Tiefe zu fallen. Dank ihres vorbereiteten Knochens, den sie rechtzeitig einsetzen konnte, und der schnellen Rettung durch [Lindo Laut](../characters/lindo_laut.md) konnte ein t\u00f6dlicher Ausgang jedoch verhindert werden.\n\n## Beteiligte\n\n- **[Lunara](../characters/lunara.md):** L\u00f6ste den Absturz aus und konnte sich mit einem vorbereiteten Knochen stabilisieren.\n- **[Lindo Laut](../characters/lindo_laut.md):** Rettete Lunara vor dem t\u00f6dlichen Fall.\n\n# Belege\n\n1. Session 2026-02-24, 02:01:37 \u2013 https://www.youtube.com/watch?v=WOFArbwDDIQ", "events/angriff_der_ghule": "# Angriff der Ghule\n\nEin n\u00e4chtlicher \u00dcberfall mehrerer Ghule auf die Gruppe.\n\n## Verlauf\nIn der Nacht wurde die Gruppe von mehreren Ghulen \u00fcberfallen. Die Gruppe konnte die Ghule durch den kombinierten Einsatz von Feuer- und Eismagie sowie Nahkampf besiegen.\n\n# Belege\n1. Session 2025-08-12 @ 01:03:37 (https://www.youtube.com/watch?v=vHIjua0BZ9Y)", "events/angriff_der_schleimkreaturen": "# Angriff der Schleimkreaturen\n\nEin Kampfereignis, bei dem die Gruppe in einem Raum mit Illusionsflammen von mehreren kleinen, schleimigen Kreaturen \u00fcberrascht wurde.\n\n## Beteiligte\n- [Dodo](../characters/dodo.md) warf sich sch\u00fctzend dazwischen, als [Cookie](../characters/cookie.md) erneut fast get\u00f6tet wurde.\n- Die Gruppe t\u00f6tete drei der Kreaturen.\n- Eine Kreatur entkam.\n\n## Verlauf\nDie Gruppe befand sich in einem Raum mit Illusionsflammen, als sie pl\u00f6tzlich von den Schleimkreaturen angegriffen wurde. [Cookie](../characters/cookie.md) geriet dabei in akute Lebensgefahr, wurde aber durch das Eingreifen von [Dodo](../characters/dodo.md) gerettet. Von den angreifenden Kreaturen konnten drei get\u00f6tet werden, w\u00e4hrend einer die Flucht gelang.\n\n# Belege\n1. Session 2025-06-10, 01:49:45 \u2013 https://www.youtube.com/watch?v=cLkCu3Iq3y8", "events/angriff_der_untoten_auf_die_karawane": "# Angriff der Untoten auf die Karawane\n\nEin \u00dcberfall einer Horde Untoter auf die Karawane der Fl\u00fcchtlinge, die sich auf dem Weg zu einem vereinbarten Treffpunkt befand. Die Untoten griffen die Karawane an und verfolgten sie.\n\n# Belege\n1. Session 2025-09-23 @ 00:17:34 (https://www.youtube.com/watch?v=DGzfqVigS0g)", "events/angriff_des_untoten_eisbaeren": "# Angriff des untoten Eisb\u00e4ren\n\nW\u00e4hrend ihrer Reise wurden [Dodo](../characters/dodo.md) und [Cookie](../characters/cookie.md) von einem untoten Eisb\u00e4ren angegriffen. [Cookie](../characters/cookie.md) setzte einen Wurzelzauber ein, um die Kreatur festzuhalten, was den beiden die Flucht erm\u00f6glichte.\n\n# Belege\n1. Session 2025-05-14 @ 00:27:24 (https://www.youtube.com/watch?v=5eAEDN5ra-4)", "events/arena_kampf": "# Arena-Kampf\n\nEin vergangenes Ereignis, bei dem [Dodo](../characters/dodo.md) und [Lindo Laut](../characters/lindo_laut.md) zu \"Champions der Arena\" wurden. Dieser Titel wird sp\u00e4ter genutzt, um Zugang zur Bibliothek zu erhalten.\n\n# Belege\n1. Session 2026-03-03 @ 00:10:09 (https://www.youtube.com/watch?v=BRUNuNKTeOg)", "events/befreiung_und_tod_von_luli": "# Befreiung und Tod von Luli\n\nW\u00e4hrend ihres Aufenthalts in [Lenra](../orte/lenra.md) befreite [Cookie](../charaktere/cookie.md) die Pilzkreatur [Luli](../charaktere/luli.md) aus einem Gef\u00e4ngnis. Kurz nach der Befreiung riss Luli sich los und wurde von einer gro\u00dfen, unsichtbaren Kreatur gefressen.\n\n# Belege\n1. Session 2025-06-17, 01:36:37, https://www.youtube.com/watch?v=tl76B4V0io8", "events/befreiung_von_nerash": "# Befreiung von Nerash\n\nDie Befreiung von Nerash war ein entscheidendes Ereignis, bei dem die Gruppe eine gefesselte Kreatur befreite, die sich als der Demigott [Nerash](../npcs/nerash.md) herausstellte.\n\n## Verlauf\nDie Gruppe traf die bewusste Entscheidung, die gefesselte Kreatur von ihren Fesseln zu l\u00f6sen. Nach der Befreiung offenbarte sich die Kreatur als der Demigott Nerash. Die Befreiungshandlung l\u00f6ste unmittelbar einen Kampf mit [Kol Meref](../npcs/kol_meref.md) aus. Nerash besch\u00fctzte die Gruppe w\u00e4hrend dieses Kampfes und erm\u00f6glichte ihnen die Flucht durch ein Portal.\n\n## Beteiligte\n- [Nerash](../npcs/nerash.md) \u2013 Der befreite Demigott\n- [Kol Meref](../npcs/kol_meref.md) \u2013 Gegner, der nach der Befreiung angriff\n\n# Belege\n1. Session 2025-07-09, 01:14:31 \u2013 https://www.youtube.com/watch?v=XOnHa6CmDbo", "events/begegnung_am_schlangenschrein": "# Begegnung am Schlangenschrein\n\nDie Gruppe interagierte an einem Schrein mit einer geisterhaften Schlangengottheit. Die Kreatur verf\u00fcgte \u00fcber sechs K\u00f6pfe, die einen Angriff gegen [Dodo](../characters/dodo.md) ausf\u00fchrten. Nachdem Dodo diesen Angriff unbeschadet \u00fcberstand, beantwortete die Gottheit die Frage der Gruppe nach dem Verbleib der Hack. Sie verwies die Abenteurer in den Nordwesten.\n\n# Belege\n1. Session 2025-06-03 @ 01:46:48 (https://www.youtube.com/watch?v=jtYR4Je0a18)", "events/bergung_des_dokuments": "# Bergung des Dokuments\n\nDie Bergung des Dokuments war ein Ereignis, bei dem die Gruppe an den Ort eines vorangegangenen \u00dcberfalls zur\u00fcckkehrte. Dort fanden sie die Leichen gefallener Soldaten vor. Ein wiederbelebter Soldat entnahm das versiegelte Dokument aus der R\u00fcstung des gefallenen Kommandanten.\n\n# Belege\n1. Session 2026-01-06, 01:36:50, https://www.youtube.com/watch?v=VGw81seFvbo", "events/bergung_von_zebrus_zorn": "# Bergung von Zebrus Zorn\n\n## \u00dcberblick\nDie Bergung von Zebrus Zorn fand in den Ruinen der zwergischen Stadt **Drunbran** statt. Die Gruppe entdeckte die legend\u00e4re Waffe in einer magisch gesicherten Kammer und konnte sie durch den Einsatz eines Spiegels erfolgreich bergen.\n\n## Ablauf\n\n### Zugang zur Kammer\nDie Gruppe stie\u00df auf ein zwergisches Siegel, das den Namen der Stadt **Drunbran** trug. Nachdem sie das Siegel ge\u00f6ffnet hatten, gelangten sie in eine Kammer, in deren Zentrum sich ein magisches Pentagramm befand.\n\n### Bergung der Waffe\nInnerhalb des Pentagramms lag **Zebrus Zorn**. Die Gruppe nutzte einen Spiegel, um die Waffe aus der magischen Sicherung zu befreien und zu bergen.\n\n## Beteiligte Entit\u00e4ten\n- [Zebrus Zorn](../items/zebrus_zorn.md) \u2013 die geborgene Waffe\n- **Drunbran** \u2013 die zwergische Stadt, in deren Ruinen die Bergung stattfand\n\n# Belege\n1. Session 2025-09-09 @ 01:37:52 \u2013 https://www.youtube.com/watch?v=Zl0qfuI6Goc", "events/beschwoerung_durch_lindo_laut": "# Beschw\u00f6rung durch Lindo Laut\n\n## Beteiligte\n- [Lindo Laut](../characters/lindo_laut.md)\n\n## Beschreibung\nBei dem Versuch, den Fluch eines sterbenden Mannes zu bannen, kam es zu einer unbeabsichtigten Beschw\u00f6rung durch [Lindo Laut](../characters/lindo_laut.md). Anstatt den Fluch zu l\u00f6sen, beschwor er schwarze, wurzelartige Kreaturen aus der Splitterwelt herauf. Im Zuge dieses Ereignisses wurde die Seele des sterbenden Mannes in die Splitterwelt gezogen.\n\n# Belege\n1. Session 2025-11-25, 01:40:45 \u2013 https://www.youtube.com/watch?v=wd5R4fJfngY", "events/blutopfer_an_der_statue": "# Blutopfer an der Statue\n\nEin Ritual, das von [Esterossa](../characters/esterossa.md) durchgef\u00fchrt wurde, um das m\u00e4chtige Feuerwesen [Lenra](../npcs/lenra.md) zu beschw\u00f6ren.\n\n## Ablauf\n\nEsterossa opferte sein eigenes Blut an einer Statue, die eine b\u00f6se Gottheit darstellt. Durch dieses Blutopfer gelang es ihm, das Feuerwesen Lenra herbeizurufen.\n\n## Beteiligte\n\n- **[Esterossa](../characters/esterossa.md):** F\u00fchrte das Opfer durch\n- **[Lenra](../npcs/lenra.md):** Das beschworene Feuerwesen\n\n# Belege\n\n1. Session 2025-04-15, 01:13:27 \u2013 https://www.youtube.com/watch?v=YCpAz_syjaY", "events/bruecke_der_hoffnungslosigkeit": "# Br\u00fccke der Hoffnungslosigkeit\n\n## \u00dcberblick\nDie Br\u00fccke der Hoffnungslosigkeit ist ein Ort, der von einer unheilvollen, l\u00e4hmenden Macht durchdrungen ist. Charaktere, die sie zu \u00fcberqueren versuchen, werden von einer Kraft erfasst, die an ihrer Seele zerrt und tiefe Hoffnungslosigkeit in ihnen ausl\u00f6st.\n\n## Auswirkungen\n- Beim Betreten oder \u00dcberqueren der Br\u00fccke werden betroffene Personen von einer pl\u00f6tzlichen, l\u00e4hmenden Hoffnungslosigkeit ergriffen.\n- Die Macht wirkt direkt auf die Seele der Charaktere und beeintr\u00e4chtigt ihren Willen und ihre Handlungsf\u00e4higkeit.\n\n# Belege\n1. Session 2025-08-12, 01:53:43 \u2013 https://www.youtube.com/watch?v=vHIjua0BZ9Y", "events/cookies_pilzvision": "# Cookies Pilzvision\n\nW\u00e4hrend der Erkundung der pilzbefallenen H\u00f6hle unter dem [Verlassenen Turm](../locations/verlassener_turm.md) versuchte [Cookie](../characters/cookie.md), mit den sich ausbreitenden Pilzen zu kommunizieren. Dabei erlebte sie eine beunruhigende Vision.\n\nIn dieser Vision sah sie ein Waldst\u00fcck mit einem h\u00f6lzernen Tor, das sie zu rufen schien.\n\n---\n\n# Belege\n\n1. Session 2025-04-30, 01:42:06 \u2013 https://www.youtube.com/watch?v=fsCOiSkKKTE", "events/der_anschlag_in_der_taverne": "# Der Anschlag in der Taverne\n\nEin n\u00e4chtlicher \u00dcberfall von Assassinen der [Brabarand-Gilde](../factions/brabarand_gilde.md) auf die Helden in ihrer Taverne. Der Angriff wurde von der Gruppe abgewehrt, jedoch wurde [Cookie](../characters/cookie.md) dabei schwer verwundet. Im Nachgang stellte sich heraus, dass ein Kopfgeld auf die Gruppe ausgesetzt worden war.\n\n# Belege\n1. Session 2025-07-22, 00:13:50, https://www.youtube.com/watch?v=BRRCUgW4xRo", "events/der_kampf_gegen_die_schattenkreatur": "# Der Kampf gegen die Schattenkreatur\n\nEin von [Voras](../npcs/voras.md) und [Nox](../npcs/nox.md) arrangierter Testkampf, der in der Splitterwelt stattfand. Die Gruppe trat gegen eine riesige, schattenartige Kreatur mit H\u00f6rnern an.\n\nIm Verlauf des Kampfes zeigte sich, dass Schattenmagie gegen die Kreatur wirkungslos war. Die Gruppe besiegte das Wesen dennoch gemeinsam und bewies damit ihre St\u00e4rke f\u00fcr die bevorstehende Mission in Abyssalis.\n\n# Belege\n1. Session 2026-03-10, 01:30:51 \u2013 https://www.youtube.com/watch?v=Kr9_AC2XtOw", "events/der_vertrag": "# Der Vertrag\n\nEin m\u00fcndlicher Vertrag, geschlossen zwischen der Abenteurergruppe und [Horatio](../npcs/horatio.md), der die Besitzverh\u00e4ltnisse und Nutzungsrechte des Anwesens regelt.\n\n## Vertragsinhalt\n\n- Die Gruppe erkennt Horatios Anspruch auf sein pers\u00f6nliches Zimmer im Haus an.\n- Horatio wird die Koordination und Verwaltung des Hauses zugesichert.\n- Im Gegenzug erkennt Horatio den Besitzanspruch der Gruppe am gesamten Anwesen an.\n\n## Bedeutung\n\nDer Vertrag stellt eine friedliche Einigung dar, die einen potentiellen Konflikt um die Besitzrechte des Hauses beilegte. Er etabliert eine klare Rollenverteilung: Die Gruppe als Eigent\u00fcmer, Horatio als Verwalter mit eigenem Wohnrecht.\n\n# Belege\n\n1. Session 2025-11-14, 01:15:09 \u2013 https://www.youtube.com/watch?v=8Khb-Y8XbKY", "events/die_erweckung_von_voras": "# Die Erweckung von Voras\n\nDie Erweckung von Voras war ein Ereignis, das in einer Katakombe stattfand. Die Gruppe \u00f6ffnete dort den Sarg von Voras. Der Magier [Lendras](../npcs/lendras.md) brach einen Bann, um ihn zu erwecken. Daraufhin stellte sich Voras als \"der Heilige\" heraus.\n\n# Belege\n1. Session 2025-04-23, 01:53:19, https://www.youtube.com/watch?v=z3C-bewKqUs", "events/die_fehlenden_erinnerungen": "# Die fehlenden Erinnerungen\n\nDie fehlenden Erinnerungen bezeichnen das kollektive Ph\u00e4nomen innerhalb der Gruppe, keine Erinnerungen an die Zeit vor elf Jahren zu besitzen. Diese Erkenntnis wird durch die Erz\u00e4hlung von [Roland](../npcs/roland.md) \u00fcber die G\u00f6tterkriege ausgel\u00f6st.\n\n## Umst\u00e4nde der Erkenntnis\n\nW\u00e4hrend [Roland](../npcs/roland.md) der Gruppe von den G\u00f6tterkriegen berichtet, wird den Mitgliedern bewusst, dass ihre eigene Vergangenheit jenseits der letzten elf Jahre vollst\u00e4ndig im Dunkeln liegt. Es handelt sich um eine abrupte, gemeinsame Realisation, die fundamentale Fragen zur Identit\u00e4t und Geschichte der Charaktere aufwirft.\n\n# Belege\n\n1. Session 2025-09-30, 01:52:17 \u2013 https://www.youtube.com/watch?v=bUT7Mc2hjUY", "events/die_flut": "# Die Flut\n\nEin n\u00e4chtliches Naturereignis im Sumpfgebiet, bei dem der Wasserpegel rapide ansteigt und das umliegende Land \u00fcberschwemmt.\n\n## Verlauf\nNach Einbruch der Nacht begann das Wasser im Sumpf unerwartet schnell zu steigen und setzte weite Teile des Landes unter Wasser. Die Gruppe konnte sich rechtzeitig in den versiegelten Turm retten und entkam so den Fluten.\n\n## Beteiligte Orte\n- Der [versiegelte Turm](../orte/versiegelter_turm.md) diente als Zufluchtsort w\u00e4hrend des Hochwassers.\n\n# Belege\n1. Session 2025-06-03, 02:00:29 \u2013 https://www.youtube.com/watch?v=jtYR4Je0a18", "events/die_jagd_nach_der_hexe_hack": "# Die Jagd nach der Hexe 'Hack'\n\nDie Jagd nach der Hexe 'Hack' ist die zentrale Mission der Gruppe. Gesucht wird eine bucklige, alte Hexe, die \u00fcber magische F\u00e4higkeiten verf\u00fcgt.\n\n## Verlauf\n\nDie Gruppe begann ihre Suche bei den Froschwesen auf der Br\u00fccke, die die Hexe jedoch nicht kannten. Auch in der versunkenen Stadt konnten bisher keine Hinweise auf ihren Aufenthaltsort gefunden werden.\n\n# Belege\n1. Session 2025-06-10, 00:31:47 \u2013 https://www.youtube.com/watch?v=cLkCu3Iq3y8", "events/die_schlacht_um_das_dorf": "# Die Schlacht um das Dorf\n\nEin massiver Angriff von Goblins und einem Oger auf das Dorf, der von den Helden und Dorfbewohnern erfolgreich abgewehrt wird.\n\n## Beteiligte\n- Goblins\n- Ein Oger\n- Die Helden\n- Dorfbewohner\n\n## Verlauf\nDie Streitmacht aus Goblins und einem Oger griff das Dorf an. Die Verteidigung wurde gemeinschaftlich von den anwesenden Helden und den Dorfbewohnern organisiert. Der Angriff konnte erfolgreich zur\u00fcckgeschlagen werden.\n\n# Belege\n1. Session 2025-04-23, 00:00:49 \u2013 https://www.youtube.com/watch?v=z3C-bewKqUs", "events/diskussion_ueber_das_schicksal_der_goetter": "# Diskussion \u00fcber das Schicksal der G\u00f6tter\n\nW\u00e4hrend der Reise der Gruppe kam eine grundlegende Debatte \u00fcber die Rolle und Notwendigkeit von G\u00f6ttern in der Welt auf. Ausl\u00f6ser war eine provokante These von [Nox](../characters/nox.md), der in den Raum stellte, dass die Welt m\u00f6glicherweise gar keine G\u00f6tter ben\u00f6tige.\n\nIm Verlauf der Diskussion wurden verschiedene Wege abgewogen:\n*   Die alten G\u00f6tter unterst\u00fctzen.\n*   Die neuen G\u00f6tter unterst\u00fctzen.\n*   Einen dritten, g\u00e4nzlich eigenen Weg abseits g\u00f6ttlicher Einflussnahme beschreiten.\n\n# Belege\n1. Session 2026-02-17, 00:54:55, https://www.youtube.com/watch?v=Z2jlzpoTWVw", "events/entdeckung_der_statue": "# Entdeckung der Statue\n\nW\u00e4hrend einer Patrouille entdeckte [Esterossa](../characters/esterossa.md) eine Statue, die der Gruppe zuvor nie aufgefallen war. Die Statue schien sich von selbst bewegt zu haben.\n\n# Belege\n1. Session 2026-01-06 @ 00:26:23 (https://www.youtube.com/watch?v=VGw81seFvbo)", "events/enthuellung_des_fuenften_teils": "# Enth\u00fcllung des f\u00fcnften Teils\n\nDie Enth\u00fcllung des f\u00fcnften Teils war ein einschneidendes Ereignis, das die Siegesstimmung der Gruppe abrupt beendete. [Lindo Laut](../characters/lindo_laut.md) las eine Notiz vor, die von der Existenz eines f\u00fcnften, bis dahin v\u00f6llig unbekannten Teils von [Vasul](../npcs/vasul.md) in Ehrenfels berichtete. Diese Nachricht warf sofort einen Schatten auf die bisherigen Erfolge der Gruppe und deutete auf eine weit gr\u00f6\u00dfere, noch ungel\u00f6ste Bedrohung hin.\n\n# Belege\n1. Session 2026-01-20, 02:04:06: https://www.youtube.com/watch?v=H3ckYdTv4y8", "events/erscheinen_von_belorus_und_beginn_der_belagerung": "# Erscheinen von Belorus und Beginn der Belagerung\n\nNach dem Kampf manifestierte sich [Lord Belorus](../npcs/lord_belorus.md) pers\u00f6nlich vor der Gruppe. Er legte seine Beweggr\u00fcnde offen dar und forderte die Auslieferung von [Lindo Laut](../npcs/lindo_laut.md). Als die Gruppe sich weigerte, dieser Forderung nachzukommen, erweckte Belorus eine Armee aus Hunderten von Untoten und leitete damit die Belagerung des Lagers ein.\n\n# Belege\n1. Session 2026-01-13, 02:14:25, https://www.youtube.com/watch?v=w4LB1s9_3rs", "events/erster_arena_kampf": "# Erster Arena-Kampf\n\nDer erste Arena-Kampf der Gruppe fand in der Arena von [Trifis](../locations/trifis.md) statt. Die Gruppe trat gegen einen Werwolf an, der zuvor von [Dodo](dodo.md) und [Gerrang](../npcs/gerrang.md) in der Kanalisation gefangen genommen worden war.\n\n## Verlauf\n\nDie Gruppe arbeitete zusammen, um den Werwolf zu immobilisieren und zu besiegen. Der Kampf endete mit der Hinrichtung des Werwolfs durch [Dodo](dodo.md), nachdem [Lord Ironvale](../npcs/lord_ironvale.md) das Urteil gesprochen hatte.\n\n# Belege\n\n1. Session 2025-10-21, 00:16:39 \u2013 https://www.youtube.com/watch?v=sxFhbtwoefA", "events/flucht_aus_steinbachtal": "# Flucht aus Steinbachtal\n\nDie Flucht aus Steinbachtal war die \u00fcberst\u00fcrzte Evakuierung der Stadt durch die Helden und die von ihnen befreiten Zwerge. Sie wurden dabei von einem untoten General und einer Horde von Untoten verfolgt. Der Fluchtweg f\u00fchrte durch einen engen Tunnel aus der Stadt hinaus.\n\n## Beteiligte\n- Die Helden\n- Gerettete Zwerge\n- Ein untoter General (Verfolger)\n\n# Belege\n1. Session 2025-09-09, 01:56:08, https://www.youtube.com/watch?v=Zl0qfuI6Goc", "events/flucht_aus_zebros": "# Flucht aus Zebros\n\nDie Flucht aus Zebros war ein dramatisches Ereignis, bei dem sich [Dodo](../characters/dodo.md) und [Cookie](../characters/cookie.md) in der Nacht einem \u00fcberw\u00e4ltigenden Angriff von Untoten gegen\u00fcbersahen. Sie wurden von untoten Bogensch\u00fctzen und einer Zombiehorde verfolgt und mussten sich ihren Weg zur\u00fcck erk\u00e4mpfen, um das Tal zu verlassen.\n\n# Belege\n1. Session 2025-05-14 @ 01:29:42 (https://www.youtube.com/watch?v=5eAEDN5ra-4)", "events/flucht_durch_das_portal": "# Flucht durch das Portal\n\nDie Flucht durch das Portal war der entscheidende Moment, in dem die Gruppe und die geretteten \u00dcberlebenden einer unmittelbaren Bedrohung entkamen.\n\nMithilfe des [Amuletts des Heiligen Duran](../items/amulett_des_heiligen_duran.md) und gesch\u00fctzt durch einen Nebelzauber gelang es [Lindo Laut](../characters/lindo_laut.md), ein Portal zum Schiff zu \u00f6ffnen. Durch dieses Portal konnten die gesamte Gruppe sowie die \u00dcberlebenden im letzten Augenblick entkommen.\n\n# Belege\n1. Session 2025-05-06, 01:49:54, https://www.youtube.com/watch?v=e0v6AFGd4mE", "events/friedensschluss_zwischen_zwergen_und_goblins": "# Friedensschluss zwischen Zwergen und Goblins\n\nDer Friedensschluss zwischen den Zwergen und den Goblins stellt eine zentrale diplomatische Errungenschaft der Kampagne dar. Nachdem Verhandlungen mit dem Goblin-Anf\u00fchrer [Lurk](../npcs/lurk.md) gescheitert waren, gelang es durch ein Treffen zwischen [Lord Harik](../npcs/lord_harik.md) und dem Schamanen der Goblins, ein Abkommen zu erzielen. Dieses Abkommen sieht einen Wissenstransfer im Bereich des Schmiedens vor, der im Gegenzug den Frieden zwischen beiden V\u00f6lkern sichern soll.\n\n---\n\n# Belege\n\n1. Session 2026-01-27 @ 01:57:39 (https://www.youtube.com/watch?v=9RzvnnWzV7E)", "events/hinrichtung_am_stadttor": "# Hinrichtung am Stadttor\n\n## Kurzbeschreibung\n\u00d6ffentliche Enthauptung eines Banditen durch [Valdemar den Goldenen Ritter](../npcs/valdemar_der_goldene_ritter.md), die von der Gruppe bei ihrer Ankunft beobachtet wurde.\n\n## Details\nKurz nach der Ankunft der Gruppe in der Stadt wurden sie Zeugen einer \u00f6ffentlichen Hinrichtung am Stadttor. [Valdemar der Goldene Ritter](../npcs/valdemar_der_goldene_ritter.md) enthauptete dort einen verurteilten Banditen vor den Augen der versammelten Menge.\n\n# Belege\n1. Session 2025-10-14, 00:04:10 \u2013 https://www.youtube.com/watch?v=cUtz87UCHu4", "events/kampf_gegen_das_monster": "# Kampf gegen das Monster\n\nW\u00e4hrend der Reise der Gruppe kam es zur Beschw\u00f6rung und anschlie\u00dfenden Konfrontation mit einem tentakelbewehrten Monster. Im Verlauf des Kampfes \u00fcbernahm der [W\u00e4chter](../characters/waechter.md) eine sch\u00fctzende Rolle f\u00fcr die Gruppe, w\u00e4hrend der [Barde](../characters/barde.md) das Monster durch seine F\u00e4higkeiten schw\u00e4chte. Den entscheidenden, t\u00f6dlichen Treffer landete schlie\u00dflich die [Waldl\u00e4uferin](../characters/waldlaeuferin.md) mit einem finalen Schuss, woraufhin das Monster besiegt wurde.\n\n# Belege\n1. Session 2025-03-26, 01:29:13, https://www.youtube.com/watch?v=ROCKGeeRUFw", "events/kampf_gegen_das_seelenkalb": "# Kampf gegen das Seelenkalb\n\nAuf dem R\u00fcckweg von einer Expedition wurde die Gruppe von einem Seelenkalb angegriffen. W\u00e4hrend des Kampfes verschlang die Kreatur [Dodo](../characters/dodo.md), der sich aus eigener Kraft nicht aus ihrem Inneren befreien konnte. [Esterossa](../characters/esterossa.md) gelang es schlie\u00dflich, Dodo mit einem gezielten Angriff aus dem Bauch des Seelenkalbs zu schneiden. Daraufhin ergriff das verletzte Wesen die Flucht.\n\n# Belege\n1. Session 2026-01-06, 01:47:50 \u2013 https://www.youtube.com/watch?v=VGw81seFvbo", "events/kampf_gegen_den_golem": "# Kampf gegen den Golem\n\nDie Gruppe stellt sich dem kolossalen Golem in einem erbitterten Kampf. Sie konzentrieren ihre Angriffe darauf, den Koloss St\u00fcck f\u00fcr St\u00fcck zu demontieren, indem sie nacheinander seine Gliedma\u00dfen zerst\u00f6ren. Ein spektakul\u00e4rer Moment ist die Explosion des rechten Arms, ausgel\u00f6st durch einen Feuerball von [Rotunas](../characters/rotunas.md). Mit der entscheidenden Unterst\u00fctzung der Magier gelingt es schlie\u00dflich, den Golem endg\u00fcltig zu vernichten.\n\n# Belege\n1. Session 2025-10-07, 01:48:31 \u2013 https://www.youtube.com/watch?v=qVAF_54S8Vw", "events/kampf_gegen_den_miner_demon": "# Kampf gegen den Miner Demon\n\nDer Kampf gegen den Miner Demon war die erste gr\u00f6\u00dfere Auseinandersetzung der Gruppe nach einer Regelanpassung. Die Helden lockten den D\u00e4mon und seine Skelette in eine Ruine, um sie dort zu bek\u00e4mpfen. Durch eine Kombination aus Magie, Fernkampf und Tanking gelang es ihnen, den Miner Demon und seine untoten Begleiter zu besiegen.\n\n# Belege\n1. Session 2025-05-27, 00:46:26, https://www.youtube.com/watch?v=bamCIB_CkR8", "events/kampf_gegen_den_rachsuechtigen_geist": "# Kampf gegen den rachs\u00fcchtigen Geist\n\nEin Kampf, in dem die Gruppe von einem rachs\u00fcchtigen Geist attackiert wurde. Der Geist konzentrierte seine Angriffe mehrfach auf [Rotunas](../characters/rotunas.md) und brachte ihn dabei an den Rand des Todes. Rotunas \u00fcberlebte nur knapp durch den Einsatz seiner F\u00e4higkeit \"Wizards Hope\". Schlie\u00dflich gelang es ihm, den Geist mit einem m\u00e4chtigen Schlag vorerst zu vernichten.\n\n# Belege\n1. Session 2025-06-17, 01:06:10 - https://www.youtube.com/watch?v=tl76B4V0io8", "events/kampf_gegen_den_todesritter": "# Kampf gegen den Todesritter\n\nEin erbitterter Kampf gegen einen untoten Ritter, der aus einem Kristall beschworen wurde, sowie einen fliegenden Sch\u00e4del. Die Gruppe konnte die Auseinandersetzung f\u00fcr sich entscheiden, indem sie die sch\u00fctzenden Statuen zerst\u00f6rte und [Dodo](../characters/dodo.md) seinen heiligen Streitkolben einsetzte.\n\n# Belege\n1. Session 2026-01-13, 01:17:32 - https://www.youtube.com/watch?v=w4LB1s9_3rs", "events/kampf_gegen_die_bugbears": "# Kampf gegen die Bugbears\n\nEin Gefecht zwischen der Heldengruppe und mehreren Bugbear-Wachen, das vor den Toren einer Burg stattfand.\n\n## Verlauf\n\nDie Bugbears waren mit Armbr\u00fcsten bewaffnet und positionierten sich zur Verteidigung des Burgzugangs. Der Gruppe gelang es, die Wachen im direkten Kampf zu \u00fcberw\u00e4ltigen und auszuschalten.\n\n## Beteiligte\n\n- **Bugbear-Wachen**: Mit Armbr\u00fcsten ausger\u00fcstete Verteidiger der Burg.\n- **Die Heldengruppe**: Die Angreifer in diesem Gefecht.\n\n## Ausgang\n\nDie Bugbears wurden besiegt, der Weg zur Burg war damit frei.\n\n# Belege\n\n1. Session 2025-04-15, 00:48:00 \u2013 https://www.youtube.com/watch?v=YCpAz_syjaY", "events/kampf_gegen_die_mimic": "# Kampf gegen die Mimic\n\n## Verlauf\nW\u00e4hrend die Gruppe Muscheln sammelte, entpuppte sich eine davon als Mimic und griff an. Die Kreatur verschlang [Cookie](../characters/cookie.md) und f\u00fcgte ihm schweren Schaden zu. [Dodo](../characters/dodo.md) und [Rotunas](../characters/rotunas.md) versuchten zun\u00e4chst erfolglos, das Maul der Mimic aufzurei\u00dfen. Erst ein gezielter Schlag von [Dodo](../characters/dodo.md) mit seinem Streitkolben trennte den Oberkiefer der Mimic ab und befreite [Cookie](../characters/cookie.md).\n\n## Beteiligte\n- [Cookie](../characters/cookie.md) (verschlungen und verletzt)\n- [Dodo](../characters/dodo.md) (erlegte die Mimic)\n- [Rotunas](../characters/rotunas.md) (versuchte vergeblich, die Mimic aufzurei\u00dfen)\n\n# Belege\n1. Session 2025-06-10, 01:16:47 \u2013 https://www.youtube.com/watch?v=cLkCu3Iq3y8", "events/kampf_gegen_die_pilz_goblins": "# Kampf gegen die Pilz-Goblins\n\n## Beteiligte\n- [Cookie](../characters/cookie.md)\n- [Lindo Laut](../characters/lindo_laut.md)\n\n## Verlauf\nDie Gruppe wurde von zwei pilz\u00fcberwucherten Goblins \u00fcberrascht. [Cookie](../characters/cookie.md) blockte einen Sporenangriff mit einem Gegenmittel. [Lindo Laut](../characters/lindo_laut.md) vernichtete beide Goblins mit einem Feuerlaserstrahl.\n\n# Belege\n1. Session 2025-06-17, 00:24:17, https://www.youtube.com/watch?v=tl76B4V0io8", "events/kampf_gegen_die_splitterwelt_kreatur": "# Kampf gegen die Splitterwelt-Kreatur\n\nDer Kampf gegen die Splitterwelt-Kreatur war eine direkte Konfrontation der Gruppe mit dem Wesen, das zuvor [Dodo](../characters/dodo.md) verschlungen hatte.\n\n## Verlauf\n\nDie Gruppe stellte sich der Kreatur und entdeckte im Verlauf des Kampfes deren entscheidende Schw\u00e4chen: Das Wesen war verwundbar gegen\u00fcber dem Wald sowie gegen\u00fcber heiliger Magie. Diese Erkenntnis nutzten die Abenteurer, um die Kreatur zu \u00fcberw\u00e4ltigen und endg\u00fcltig zu vernichten. Sie banden das Wesen an einen Baum, was zu seiner Zerst\u00f6rung f\u00fchrte.\n\n# Belege\n\n1. Session 2025-11-25, 00:39:35, https://www.youtube.com/watch?v=wd5R4fJfngY", "events/kampf_gegen_die_sumpfamphibie": "# Kampf gegen die Sumpfamphibie\n\nEin Kampf der Gruppe gegen eine getarnte, giftige Amphibienkreatur in einem Sumpfgebiet, bei dem [Brass](../npcs/brass.md) als Jagdgef\u00e4hrte diente.\n\n## Verlauf\n\nDie Gruppe verfolgte die Amphibienkreatur, die sich durch Tarnung ihrem Zugriff entzog. Angriffe und ein Festhaltezauber schlugen zun\u00e4chst fehl. [Esterossa](../npcs/esterossa.md) setzte schlie\u00dflich Frostmagie ein, um das Monster einzufrieren. [Dodo](dodo.md) zerschmetterte die eingefrorene Kreatur mit einem Keulenschlag.\n\nW\u00e4hrend des Kampfes wurde [Brass](../npcs/brass.md) schwer verletzt und fast get\u00f6tet.\n\n# Belege\n1. Session 2025-06-03 @ 00:35:37 (https://www.youtube.com/watch?v=jtYR4Je0a18)", "events/kampf_gegen_die_untotenhorde": "# Kampf gegen die Untotenhorde\n\nEin gro\u00df angelegter, koordinierter Angriff einer Horde Untoter auf die Gruppe. Der Kampf wurde durch einen taktischen \u00dcberraschungsangriff der Gruppe entschieden.\n\n## Verlauf\n\nDie Gruppe er\u00f6ffnete den Kampf, indem sie ein Portal f\u00fcr einen \u00dcberraschungsangriff nutzte. [Rotuna](../characters/rotuna.md) entfesselte daraufhin eine m\u00e4chtige Eisattacke, die den Gro\u00dfteil der gegnerischen Horde auf einen Schlag vernichtete. Die verbliebenen Untoten wurden durch diese Demonstration der St\u00e4rke in die Flucht geschlagen.\n\n# Belege\n1. Session 2025-11-25, 01:10:11 - https://www.youtube.com/watch?v=wd5R4fJfngY", "events/kampf_gegen_kultisten_und_ghule": "# Kampf gegen Kultisten und Ghule\n\nW\u00e4hrend der Auseinandersetzung mit einer Gruppe von Kultisten und den von ihnen beschworenen Ghulen offenbarte sich eine bis dahin verborgene Kraft in [Lindo Lauts](../characters/lindo_lauts.md).\n\n# Belege\n1. Session 2025-09-02, 00:06:42 \u2013 https://www.youtube.com/watch?v=TLZOH7TlGhk", "events/kampf_gegen_slix_in_crowfin_manor": "# Kampf gegen Slix in Crowfin Manor\n\nNachdem der Schutzzauber in Crowfin Manor fiel, \u00fcbernahm [Slix](../npcs/slix.md) die Kontrolle \u00fcber [Lindo Laut](../npcs/lindo_laut.md). Unter diesem Einfluss t\u00f6tete er [Lionel](../npcs/lionel.md) und griff die Gruppe an.\n\nIm Verlauf des Kampfes verband [Lunara](../characters/lunara.md) die Welten miteinander. [Rotunas](../characters/rotunas.md) opferte seinen Arm, um einen entscheidenden Beitrag zu leisten. Schlie\u00dflich legte [Lindo Laut](../npcs/lindo_laut.md) die Handschellen an, wodurch [Slix](../npcs/slix.md) besiegt werden konnte.\n\n# Belege\n1. Session 2026-02-17, 02:01:52 \u2013 https://www.youtube.com/watch?v=Z2jlzpoTWVw", "events/kampf_in_der_seelenebene": "# Kampf in der Seelenebene\n\nDer Kampf in der Seelenebene war eine Konfrontation, die stattfand, nachdem die Seelen der Gruppe in eine andere Dimension gerissen wurden. In dieser Dimension sahen sie sich vier Kultisten sowie himmlischen W\u00e4chtern (Celestials) gegen\u00fcber, die sie im Kampf besiegten und vernichteten.\n\nDie Vernichtung der himmlischen W\u00e4chter hatte unmittelbare Konsequenzen: Der Graf war \u00fcber diesen Ausgang entsetzt. Zudem f\u00fchrte die Tat dazu, dass sich das Amulett von [Duran](../characters/duran.md) verdunkelte.\n\n# Belege\n1. Session 2025-06-25, 00:52:00 \u2013 https://www.youtube.com/watch?v=tpkO9uGw6-I", "events/konfrontation_mit_belorus": "# Konfrontation mit Belorus\n\nW\u00e4hrend die Gruppe in der N\u00e4he der Ruinen rastete, wurde [Dodo](../characters/dodo.md) von dem untoten Ritter [Belorus](../npcs/belorus.md) zu einem direkten Kampf herausgefordert. Die Situation eskalierte, als Belorus von einer Schar Untoter begleitet wurde.\n\n[Cookie](../characters/cookie.md) reagierte, indem sie einen m\u00e4chtigen Schutzzauber aktivierte. Die Wirkung des Zaubers vertrieb die untoten Kreaturen und zwang den Ritter Belorus zum R\u00fcckzug, bevor es zu einem ernsthaften Gefecht kommen konnte.\n\n# Belege\n1. Session 2025-05-14, 01:05:33 \u2013 https://www.youtube.com/watch?v=5eAEDN5ra-4", "events/konfrontation_mit_den_kultisten": "# Konfrontation mit den Kultisten\n\nW\u00e4hrend die Gruppe sich in einem von Kultisten kontrollierten Gebiet aufhielt, wurde sie von diesen entdeckt. Die Kultisten er\u00f6ffneten die Auseinandersetzung, indem sie [Dodo](../characters/dodo.md) mit einem Versteinerungszauber belegten.\n\nDie Situation eskalierte weiter, als die Kultisten ihren falschen Gott anriefen. [Esterossa](../characters/esterossa.md) reagierte darauf, indem sie zum Angriff rief.\n\n# Belege\n1. Session 2025-08-20, 01:19:04 \u2013 https://www.youtube.com/watch?v=-XbO3FLSL_I", "events/konfrontation_mit_der_brutstaette": "# Konfrontation mit der Brutst\u00e4tte\n\nW\u00e4hrend der Erkundung der Silbermine stie\u00df die Gruppe auf eine gro\u00dfe\nSilberbestie, die ihre Jungen besch\u00fctzte. Die Kreatur bewachte ein Artefakt,\ndas die Gruppe bergen wollte.\n\n[Nyrella](../characters/nyrella.md) gelang es, durch Kommunikation mit der\nSilberbestie eine Eskalation zu verhindern. Sie konnte die Kreatur beruhigen,\nsodass die Gruppe das Artefakt kampflos bergen konnte, ohne die Jungen zu\ngef\u00e4hrden.\n\n# Belege\n\n1. Session 2026-02-24, 02:12:44,\n   https://www.youtube.com/watch?v=WOFArbwDDIQ", "events/konfrontation_mit_dormak_und_finale_entscheidung": "# Konfrontation mit Dormak und finale Entscheidung\n\nIn der Krypta von [Dormak](../npcs/dormak.md) kam es zur entscheidenden Konfrontation zwischen den Helden und dem Nekromanten. Dormak stellte sich ihnen gemeinsam mit einer Armee Untoter entgegen.\n\nDen Wendepunkt der Auseinandersetzung brachte [Lindo Laut](../characters/lindo_laut.md), der sich auf den Thron setzte und die in seinem Amulett gefangenen b\u00f6sen Seelen vernichtete. Diese Handlung zwang Dormak zur Flucht.\n\n# Belege\n1. Session 2025-09-02 @ 01:46:04 (https://www.youtube.com/watch?v=TLZOH7TlGhk)", "events/konfrontation_mit_halborks": "# Konfrontation mit Halborks\n\nEin Zusammentreffen der Gruppe mit drei Halborks, die im Auftrag der Gilde unterwegs waren.\n\n## Verlauf\n\nDie Gruppe stellte drei Halborks auf dem Weg zum Fl\u00fcchtlingslager. Die Halborks hatten einen Auftrag der Gilde angenommen. Nach einer Eskalation, die von [Rotunas](../characters/rotunas.md) ausging, entwickelte sich ein kurzer Kampf. Die Halborks zogen sich schlie\u00dflich zur\u00fcck und verlie\u00dfen den Schauplatz.\n\n## Beteiligte\n\n- Drei Halborks (namentlich nicht bekannt, im Auftrag der Gilde)\n- [Rotunas](../characters/rotunas.md) (Verursacher der Eskalation)\n- Die restliche Gruppe\n\n# Belege\n\n1. Session 2025-09-17, 01:28:56 \u2013 https://www.youtube.com/watch?v=AhIT8dcxw2o", "events/konfrontation_mit_lenra": "# Konfrontation mit Lenra\n\nDie finale Auseinandersetzung mit der Nekromantin [Lenra](../npcs/lenra.md) fand im Bossraum ihres Verstecks statt. Als die Gruppe den Raum betrat, stellte sich ihnen Lenra direkt entgegen. W\u00e4hrend des Kampfes setzte sie einen Schrumpfungszauber ein, der sowohl [Dodo](../characters/dodo.md) als auch [Cookie](../characters/cookie.md) traf und ihre Gr\u00f6\u00dfe drastisch reduzierte. Trotz der Konfrontation gelang es Lenra letztlich, aus dem Kampf zu entkommen.\n\n# Belege\n1. Session 2025-04-15, 01:52:04 \u2013 https://www.youtube.com/watch?v=YCpAz_syjaY", "events/konfrontation_mit_slix": "# Konfrontation mit Slix\n\nNachdem [Lindo Laut](../npcs/lindo_laut.md) der Gruppe die Wahrheit \u00fcber [Kronos](../npcs/kronos.md) offenbart hatte, \u00fcbernahm [Slix](../npcs/slix.md) die Kontrolle \u00fcber die Situation. Er bedrohte die Gruppe, woraufhin es zu einem Kampf kam. [Lunara](../characters/lunara.md) stellte sich Slix entgegen und besiegte ihn durch pure Willenskraft. Der Vorfall lie\u00df die Gruppe zutiefst ersch\u00fcttert zur\u00fcck.\n\n# Belege\n1. Session 2026-02-11, 01:32:51 \u2013 https://www.youtube.com/watch?v=3C8SD-cyNPM", "events/kopfgeld_fuer_kronos": "# Kopfgeld f\u00fcr Kronos\n\n- **Typ:** Ereignis\n- **Beteiligte:** [Kronos](../npcs/kronos.md)\n- **Ort:** Haus des L\u00f6wen\n\nDie Gruppe handelte erfolgreich die Belohnung f\u00fcr die Leiche des Schamanen [Kronos](../npcs/kronos.md) aus. Sie erhielten daf\u00fcr im Haus des L\u00f6wen zwei Truhen und f\u00fcnf S\u00e4cke voller Gold.\n\n# Belege\n1. Session 2026-03-03, 00:30:45 \u2013 https://www.youtube.com/watch?v=BRUNuNKTeOg", "events/lindo_lauts_wunsch": "# Lindo Lauts Wunsch\n\n**Typ:** Ereignis  \n**Beteiligte:** [Lindo Laut](../characters/lindo_laut.md)\n\n## Beschreibung\n\nNachdem die Gruppe den Thron mit seiner gottgleichen Macht erreicht hatte, nutzte [Lindo Laut](../characters/lindo_laut.md) die Gelegenheit f\u00fcr einen selbstlosen Wunsch. Er w\u00fcnschte sich die vollst\u00e4ndige Heilung und Wiederbelebung seiner schwer verletzten Kameraden.\n\n# Belege\n\n1. Session 2025-09-02, 02:15:44 \u2013 https://www.youtube.com/watch?v=TLZOH7TlGhk", "events/mysterioeses_klopfen": "# Mysteri\u00f6ses Klopfen\n\nEin unheimliches Ereignis, das sich mitten in der Nacht im Gruppenquartier der Charaktere zutrug.\n\n## Verlauf\n\nW\u00e4hrend die Gruppe sich in ihrem Quartier aufhielt, ert\u00f6nte pl\u00f6tzlich ein Klopfen an der T\u00fcr. [Rotunas](../../characters/rotunas.md) ging der Sache nach und fragte, wer sich vor der T\u00fcr befinde. Er erhielt jedoch keine Antwort.\n\nDie Situation blieb ungekl\u00e4rt und endete mit einem spannungsgeladenen Moment der Ungewissheit.\n\n# Belege\n1. Session 2025-11-18, 01:53:42 \u2013 https://www.youtube.com/watch?v=w__ahowb9p0", "events/naechtliche_begegnung": "# N\u00e4chtliche Begegnung\n\nW\u00e4hrend der ersten Nachtwache, die [Cookie](../characters/cookie.md) \u00fcbernommen hatte, n\u00e4herte sich ein unbekanntes Wesen dem Lager der Gruppe. Die Kreatur besa\u00df H\u00f6rner und bewegte sich schleichend um das Lager herum. Bevor das Wesen identifiziert oder genauer in Augenschein genommen werden konnte, wurde es durch das Licht von [Esterossa](../npcs/esterossa.md) vertrieben.\n\n# Belege\n1. Session 2025-04-01, 00:37:13, https://www.youtube.com/watch?v=LZIuUzc3F18", "events/portal_unter_der_kapelle": "# Portal unter der Kapelle\n\nEin magisches Portal, das sich in der Kapelle des [Kuatau-Priesters](../npcs/kuatau-priester.md) befand. Es \u00f6ffnete sich, nachdem [Rotunas](../characters/rotunas.md) das sternf\u00f6rmige Amulett in den Brunnen getaucht hatte. Die \u00d6ffnung des Portals f\u00fchrte dazu, dass Pilze zu wachsen begannen. Das Portal wurde durch die gemeinsame Anstrengung von [Rotunas](../characters/rotunas.md), [Lindo Laut](../characters/lindo_laut.md) und dem [Kuatau-Priester](../npcs/kuatau-priester.md) wieder geschlossen.\n\n# Belege\n1. Session 2025-07-29, 01:21:48 - https://www.youtube.com/watch?v=XXgO5Ht4Q0A", "events/pruefung_des_brunnens": "# Pr\u00fcfung des Brunnens\n\nDie Pr\u00fcfung des Brunnens ist eine g\u00f6ttliche Pr\u00fcfung, die mit dem Brunnen in Verbindung steht. W\u00e4hrend dieser Pr\u00fcfung biss [Lindo Laut](../characters/lindo_laut.md) in ein Herz und w\u00e4re dabei beinahe gestorben.\n\nLaut Aussage des [W\u00e4chters](../npcs/waechter.md) haben alle Kultisten diese Pr\u00fcfung durchlaufen m\u00fcssen. Bemerkenswert ist jedoch, dass niemand der Pr\u00fcfung jemals widerstanden hat.\n\n# Belege\n1. Session 2025-08-20, 01:01:25 \u2013 https://www.youtube.com/watch?v=-XbO3FLSL_I", "events/rettung_des_soldaten": "# Rettung des Soldaten\n\n## Beteiligte\n- [Dodo](../characters/dodo.md)\n- [Lenra](../npcs/lenra.md)\n- [Maeve](../characters/maeve.md)\n- [Raziel](../characters/raziel.md)\n- [Soldat aus Breska](../npcs/soldat_aus_breska.md)\n\n## Verlauf\nDie Gruppe wurde durch einen Schrei auf einen schwer verwundeten [Soldaten aus Breska](../npcs/soldat_aus_breska.md) aufmerksam, der von untoten Bogensch\u00fctzen angegriffen wurde. Die Abenteurer wehrten die heranfliegenden Pfeile ab und schlugen die untoten Angreifer zur\u00fcck, wodurch sie den Soldaten retteten.\n\n## Folgen\n- Der [Soldat aus Breska](../npcs/soldat_aus_breska.md) wurde vor dem sicheren Tod bewahrt.\n\n# Belege\n1. Session 2026-01-06, 00:39:59 \u2013 https://www.youtube.com/watch?v=VGw81seFvbo", "events/rueckzug_aus_dem_dungeon": "# R\u00fcckzug aus dem Dungeon\n\nDer R\u00fcckzug aus dem Dungeon war eine taktische Entscheidung der Gruppe, die erste Erkundung des unterirdischen Komplexes abzubrechen.\n\n## Verlauf\n\nNachdem die Gruppe in den Dungeon vorgedrungen war, sah sie sich mit mehreren widrigen Umst\u00e4nden konfrontiert:\n\n- **Gef\u00e4hrliche Gase:** Im Dungeon traten giftige oder anderweitig sch\u00e4dliche Gase auf, die eine unmittelbare Bedrohung darstellten.\n- **Bedr\u00fcckende Atmosph\u00e4re:** Die allgemeine Stimmung und Umgebung im Dungeon wurde als belastend empfunden.\n- **Mangelnde Vorbereitung:** Die Gruppe erkannte, dass sie f\u00fcr die spezifischen Gefahren des Dungeons nicht ausreichend ausger\u00fcstet oder vorbereitet war.\n\nAufgrund dieser Faktoren fasste die Gruppe den Beschluss, die Erkundung nicht weiter fortzusetzen, und kehrte zur Oberfl\u00e4che zur\u00fcck.\n\n## Beteiligte\n\nDie gesamte anwesende Gruppe war an dieser Entscheidung beteiligt.\n\n# Belege\n\n1. Session 2026-02-11, 01:14:20 \u2013 https://www.youtube.com/watch?v=3C8SD-cyNPM", "events/schlacht_am_bergpass": "# Schlacht am Bergpass\n\nDie Schlacht am Bergpass war eine milit\u00e4rische Auseinandersetzung zwischen der\nAbenteurergruppe und einer \u00dcbermacht von Untoten, die vom [Withermind](../npcs/withermind.md)\nangef\u00fchrt wurde. Ziel der Gruppe war es, eine Gruppe von Fl\u00fcchtlingen zu\nsch\u00fctzen und den strategisch wichtigen Bergpass zu halten.\n\n## Verlauf\n\nDie Abenteurer stellten sich der \u00fcberlegenen Streitmacht der Untoten\nentgegen, um den Fl\u00fcchtlingen die Flucht zu erm\u00f6glichen und den Pass gegen\ndie feindlichen Kr\u00e4fte zu verteidigen.\n\n## Beteiligte\n\n- Die Abenteurergruppe\n- [Withermind](../npcs/withermind.md) als Anf\u00fchrer der Untoten\n- Eine \u00dcbermacht von Untoten\n- Eine Gruppe von Fl\u00fcchtlingen\n\n# Belege\n\n1. Session 2025-09-23, 00:31:51 \u2013 https://www.youtube.com/watch?v=DGzfqVigS0g", "events/schlacht_am_pass": "# Schlacht am Pass\n\nDie Schlacht am Pass war ein milit\u00e4rischer Konflikt, bei dem eine \u00dcbermacht von Untoten einen strategisch wichtigen Pass angriff. Die Verteidiger konnten den Pass erfolgreich halten. Das Gefecht endete mit dem Tod des gegnerischen Generals und dem Erscheinen von [Belorus der Stille](../npcs/belorus_der_stille.md).\n\n# Belege\n1. Session 2025-09-30, 00:10:20: https://www.youtube.com/watch?v=bUT7Mc2hjUY", "events/schlacht_um_das_banditenversteck": "# Schlacht um das Banditenversteck\n\nDie Schlacht um das Banditenversteck war eine gro\u00dfe Verteidigungsschlacht, in der sich die Gruppe gegen [Belorus](../npcs/belorus.md) und seine untote Armee zur Wehr setzte. Die Angreifer konnten erfolgreich abgewehrt werden. Nach dem Scheitern seines Angriffs suchte Belorus das Gespr\u00e4ch mit der Gruppe und zog sich schlie\u00dflich zur\u00fcck.\n\n# Belege\n1. Session 2026-01-20, 00:18:22 \u2013 https://www.youtube.com/watch?v=H3ckYdTv4y8", "events/schlacht_um_steinbachtal": "# Schlacht um Steinbachtal\n\nDie Schlacht um Steinbachtal war ein verheerender Angriff auf die Stadt Steinbachtal, bei dem eine Hunderte starke Untotenarmee die Siedlung \u00fcberrannte.\n\n## Verlauf\n\nDie Untotenarmee wurde von einem schwarzen Ritter angef\u00fchrt und fiel vor einiger Zeit \u00fcber die Stadt her. Die Bewohner von Steinbachtal leisteten ihren letzten Widerstand in der Kathedrale der Stadt, konnten die \u00dcbermacht jedoch nicht aufhalten.\n\n## Folgen\n\nDie Stadt wurde vollst\u00e4ndig \u00fcberrannt. \u00dcber das weitere Schicksal der Bewohner oder den Verbleib des schwarzen Ritters ist nichts bekannt.\n\n# Belege\n\n1. Session 2025-09-09, 01:12:31 \u2013 https://www.youtube.com/watch?v=Zl0qfuI6Goc", "events/schlaegerei_in_haralds_taverne": "# Schl\u00e4gerei in Haralds Taverne\n\nEin Kampf zwischen [Harald](../npcs/harald.md) und Soldaten aus [Willauch](../locations/willauch.md) in Haralds Taverne. Die Auseinandersetzung eskalierte, als [Lunara](../characters/lunara.md) mit einem m\u00e4chtigen, unkontrollierten Zauber eingriff, der alle Anwesenden kurzzeitig l\u00e4hmte. Durch diesen Effekt konnte Harald entkommen. Als direkte Folge des Vorfalls wurde die Stadt abgeriegelt.\n\n# Belege\n1. Session 2026-03-18, 01:20:46 \u2013 https://www.youtube.com/watch?v=HHXxsASLrbQ", "events/sprengung_der_kristallwand": "# Sprengung der Kristallwand\n\nDie Sprengung der Kristallwand war eine taktische Aktion von [Arus](../characters/arus.md) und [Lia](../characters/lia.md) w\u00e4hrend der Auseinandersetzung mit dem Golem. Sie zielte darauf ab, dem Golem den Zugang zu den Kristallen zu verwehren und so eine weitere Steigerung seiner Macht zu unterbinden.\n\n# Belege\n1. Session 2025-10-07 @ 01:57:46 (https://www.youtube.com/watch?v=qVAF_54S8Vw)", "events/teleportation_aus_dem_dungeon": "# Teleportation aus dem Dungeon\n\n## Beschreibung\nW\u00e4hrend des Kampfes gegen die Hexe im Dungeon vollendete [Lindo Laut](../characters/lindo_laut.md) ein Ritual, das die gesamte Gruppe zur\u00fcck zum Eingang des Dungeons teleportierte. Die Teleportation erfolgte unmittelbar, als die Hexe die Gruppe mit einem Todesstrahl angriff.\n\n## Beteiligte\n- [Lindo Laut](../characters/lindo_laut.md) (Ausf\u00fchrender des Rituals)\n\n## Ort\n- Vom Inneren des Dungeons zum Eingang des Dungeons\n\n# Belege\n1. Session 2025-06-17, 01:59:21 \u2013 https://www.youtube.com/watch?v=tl76B4V0io8", "events/tod_von_cookie": "# Tod von Cookie\n\nCookie, der geliebte Hund von [Dodo](../characters/dodo.md), fiel im Kampf gegen einen Lich. Die traurige Nachricht wurde von Dodo selbst \u00fcberbracht, was zu einer r\u00fchrenden Trauerbekundung in der gesamten Taverne f\u00fchrte, in der sich die Gruppe aufhielt.\n\n---\n\n# Belege\n1. Session 2025-11-18, 00:09:47 \u2013 https://www.youtube.com/watch?v=w__ahowb9p0", "events/toetung_des_goblin_spaehers": "# T\u00f6tung des Goblin-Sp\u00e4hers\n\nEin Kampfereignis im Wald nahe der Siedlung, bei dem ein einzelner Goblin-Sp\u00e4her von [Valeria](../characters/valeria.md) und [Rotunas](../characters/rotunas.md) gestellt und get\u00f6tet wurde.\n\n## Verlauf\n\n[Valeria](../characters/valeria.md) und [Rotunas](../characters/rotunas.md) verfolgten das ver\u00e4ngstigte Kind der Kr\u00e4mers in den Wald. Dort entdeckten sie einen Goblin-Sp\u00e4her. Im anschlie\u00dfenden Kampf setzten sie Eis- und Feuerzauber ein, um den Goblin zu t\u00f6ten.\n\n## Beteiligte\n\n- [Valeria](../characters/valeria.md)\n- [Rotunas](../characters/rotunas.md)\n- Das Kind der Kr\u00e4mers (ver\u00e4ngstigt, floh in den Wald)\n\n# Belege\n\n1. Session 2025-04-09, 01:12:02 \u2013 https://www.youtube.com/watch?v=1PWdwvun5ow", "events/turnier_von_willau": "# Turnier von Willau\n\nEin gro\u00dfer Wettkampf, der in der Region um Willau ausgetragen wird. Das Turnier umfasst sechs verschiedene Kategorien (Solo, Duo, Team, Wizard, Monster, Hunt) und ist in vier Tiers unterteilt. Als Hauptpreis winkt den Gewinnern ein St\u00fcck Land.\n\n# Belege\n1. Session 2025-10-14, 00:13:31 \u2013 https://www.youtube.com/watch?v=cUtz87UCHu4", "events/valerias_brief": "# Valerias Brief\n\nEin von einem Boten \u00fcberbrachter Brief von [Valeria](../npcs/valeria.md) an die Gruppe. In diesem Schreiben verabschiedet sich Valeria aufgrund der bevorstehenden Geburt ihres Kindes von den Gef\u00e4hrten. Dem Brief beigef\u00fcgt sind Gold sowie ein r\u00e4tselhafter Ring, die als Unterst\u00fctzung f\u00fcr die Gruppe gedacht sind.\n\n# Belege\n1. Session 2025-11-14, 01:43:18 \u2013 https://www.youtube.com/watch?v=8Khb-Y8XbKY", "events/vereitelung_der_flucht": "# Vereitelung der Flucht\n\nEin Ereignis, bei dem ein Soldat daran gehindert wurde, mit einem wichtigen Dokument zu entkommen.\n\n## Beteiligte\n- Ein namentlich nicht genannter Soldat, der mit dem Dokument fliehen wollte\n- [Lindo Laut](../characters/lindo_laut.md), der den Soldaten aufhielt\n- [Esterossa](../characters/esterossa.md), die versuchte, den Soldaten magisch zu heilen\n\n## Verlauf\nDer Soldat unternahm einen erneuten Fluchtversuch mit dem Dokument, wurde jedoch von Lindo Laut gestoppt. Im Anschluss versuchte Esterossa, den Soldaten mit Magie von einer Korruption zu heilen, die durch einen Kristall in seinem K\u00f6rper verursacht wurde.\n\n# Belege\n1. Session 2026-01-06, 02:04:29 \u2013 https://www.youtube.com/watch?v=VGw81seFvbo", "events/vergiftung_von_rotunas": "# Vergiftung von Rotunas\n\nNach dem Kampf mit dem Attent\u00e4ter in der Taverne bemerkte die Gruppe, dass sich die Wunde von [Rotunas](../npcs/rotunas.md) schwarz verf\u00e4rbt hatte. Er brach aufgrund der Vergiftung zusammen. [Esterossa](../characters/esterossa.md) versuchte sofort, ihm ein Gegengift einzufl\u00f6\u00dfen.\n\n# Belege\n1. Session 2025-09-17, 01:54:30 \u2013 https://www.youtube.com/watch?v=AhIT8dcxw2o", "events/verhandlung_mit_hal": "# Verhandlung mit Hal\n\nEine hitzige Verhandlung \u00fcber die Unterbringung von Fl\u00fcchtlingen, die durch das diplomatische Geschick von [Lindo Laut](../characters/lindo_laut.md) und den Einsatz von zus\u00e4tzlichem Gold gel\u00f6st werden konnte. Die Situation drohte zuvor fast in Gewalt umzuschlagen.\n\n# Belege\n1. Session 2025-09-30 @ 01:14:56 (https://www.youtube.com/watch?v=bUT7Mc2hjUY)", "events/verhoer_und_tod_des_kultistenanfuehrers": "# Verh\u00f6r und Tod des Kultistenanf\u00fchrers\n\nEin Verh\u00f6r, das [Dodo](../characters/dodo.md) mit einem gefangenen Kultistenanf\u00fchrer durchf\u00fchrte. Der Anf\u00fchrer verriet w\u00e4hrend der Befragung keine Informationen. Daraufhin wurde er von Dodo bei lebendigem Leib verbrannt.\n\n# Belege\n1. Session 2025-09-02, 01:03:21 \u2013 https://www.youtube.com/watch?v=TLZOH7TlGhk", "events/verhoer_von_gulrak": "# Verh\u00f6r von Gulrak\n\nDas Verh\u00f6r von Gulrak war ein Ereignis, bei dem die Gruppe den gefangenen Kenku [Gulrak](../npcs/gulrak.md) in seiner Zelle verh\u00f6rte.\n\n## Ablauf\n\nW\u00e4hrend des Verh\u00f6rs bot Gulrak der Gruppe einen Deal an: Informationen im Austausch f\u00fcr seine Freiheit. Noch bevor eine Einigung erzielt werden konnte, unternahm der Kenku einen Fluchtversuch, der jedoch scheiterte. [Cookie](../characters/cookie.md) warf ihn daraufhin gewaltsam zur\u00fcck in die Zelle. Im Anschluss an diesen Vorfall versiegelte [Rotunas](../characters/rotunas.md) die Zellent\u00fcr heimlich mit Magie, um weitere Fluchtversuche zu unterbinden.\n\n# Belege\n\n1. Session 2025-04-30, 01:14:11 \u2013 https://www.youtube.com/watch?v=fsCOiSkKKTE", "events/vernichtung_des_goblindorfs": "# Vernichtung des Goblindorfs\n\nDie Vernichtung des Goblindorfs war die erfolgreiche Ausf\u00fchrung eines Auftrags durch die Gruppe. Sie infiltrierten das Dorf, schalteten die Anf\u00fchrer aus und schlugen die restlichen Goblins in die Flucht.\n\n# Belege\n1. Session 2025-04-01 @ 01:58:40 (https://www.youtube.com/watch?v=LZIuUzc3F18)", "events/verrat_der_dorfsoldaten": "# Verrat der Dorfsoldaten\n\n## \u00dcberblick\n\nDer Verrat der Dorfsoldaten war ein bewaffneter Konflikt, bei dem die Soldaten des Dorfes unter der F\u00fchrung von [Dranara](../npcs/dranara.md) die Gruppe und deren Verb\u00fcndete angriffen. Der Angriff erfolgte unmittelbar, nachdem die Gruppe begonnen hatte, mit den [Kuatau](../factions/kuatau.md) zu verhandeln und das Geheimnis des Brunnens zu untersuchen.\n\n## Beteiligte\n\n- **Angreifer**: Die Dorfsoldaten, angef\u00fchrt von [Dranara](../npcs/dranara.md)\n- **Angegriffene**: Die Gruppe sowie ihre Verb\u00fcndeten [Lobrecht](../npcs/lobrecht.md) und [Miaomani](../npcs/miaomani.md)\n\n## Verlauf\n\nW\u00e4hrend die Gruppe Verhandlungen mit den Kuatau aufnahm und das Geheimnis des Brunnens untersuchte, griffen die Dorfsoldaten unter [Dranara](../npcs/dranara.md) die Gruppe und ihre Verb\u00fcndeten an. [Leandras](../characters/leandras.md) konnte [Dranara](../npcs/dranara.md) mit einem Schlafzauber ausschalten und den Kampf so beenden.\n\n## Auswirkungen\n\n- [Dranara](../npcs/dranara.md) wurde durch den Schlafzauber von [Leandras](../characters/leandras.md) kampfunf\u00e4hig gemacht.\n\n# Belege\n\n1. Session 2025-07-29 @ 01:22:48 (https://www.youtube.com/watch?v=XXgO5Ht4Q0A)", "events/verteidigung_der_kapelle": "# Verteidigung der Kapelle\n\nDie Verteidigung der Kapelle war ein Gefecht, bei dem die Gruppe einer ersch\u00f6pften Priesterin sowie den beiden K\u00e4mpfern [Baran](../npcs/baran.md) und [Brandon](../npcs/brandon.md) zu Hilfe kam. Die Verteidiger hatten sich bereits seit Stunden gegen eine \u00dcbermacht an Gnollen behauptet, als die Gruppe eintraf. Gemeinsam gelang es, die Angreifer zur\u00fcckzuschlagen und die \u00dcberlebenden zu retten.\n\n# Belege\n1. Session 2025-05-06, 00:48:12, https://www.youtube.com/watch?v=e0v6AFGd4mE", "events/vorbereitung_der_verteidigung": "# Vorbereitung der Verteidigung\n\nDie Vorbereitung der Verteidigung war ein taktisches Planungs- und Bauereignis, bei dem die Helden gemeinsam mit den Bewohnern von [Eichendorf](../locations/eichendorf.md) Ma\u00dfnahmen gegen einen erwarteten Goblin-Angriff ergriffen.\n\n## Ablauf\n\nDie Helden und die Dorfbewohner errichteten Verteidigungsanlagen und bereiteten einen Hinterhalt vor. Konkret wurden folgende Ma\u00dfnahmen umgesetzt:\n\n- **Palisaden:** Acht Palisaden wurden als Barrikaden errichtet.\n- **B\u00e4renfallen:** Drei B\u00e4renfallen wurden ausgelegt.\n- **Positionierung:** Die Fallen und Palisaden wurden im Bereich zwischen dem Friedhof und dem Steinplateau platziert.\n- **Taktik:** Die K\u00e4mpfer wurden so positioniert, dass die Goblins in einen Hinterhalt gelockt werden sollten.\n\n# Belege\n\n1. Session 2025-04-09, 01:36:02 \u2013 https://www.youtube.com/watch?v=1PWdwvun5ow", "events/wiederbelebung_des_soldaten": "# Wiederbelebung des Soldaten\n\nEin Soldat der Stadtwache von [Trifas](../orte/trifas.md) erlitt einen schweren medizinischen Notfall, bei dem er beinahe an einer gr\u00fcnen Substanz in seinem eigenen Erbrochenen erstickte. [Lunara](../characters/lunara.md) leistete sofort Erste Hilfe, f\u00fchrte eine Herzdruckmassage durch und setzte ihre Hope-Ressourcen ein, um den Soldaten erfolgreich wiederzubeleben.\n\n# Belege\n1. Session 2026-01-06 @ 01:18:03 (https://www.youtube.com/watch?v=VGw81seFvbo)", "events/zerstoerung_der_statue_und_vision": "# Zerst\u00f6rung der Statue und Vision\n\nIn der Kammer der Statue im [Verlassenen Kloster](../locations/verlassenes_kloster.md) zerst\u00f6rte [Lunara](../characters/lunara.md) die Statue mithilfe ihrer beschworenen Ketten. Dadurch wurde ein gr\u00fcner Kristall im Inneren der Statue freigelegt.\n\n[Dodo](../characters/dodo.md) verbrannte diesen gr\u00fcnen Kristall, was eine Explosion ausl\u00f6ste. Die Explosion verlieh ihm eine kurze Vision, in der er ein Labor und eine Person sah.\n\n# Belege\n1. Session 2026-01-06, 01:11:49 \u2013 https://www.youtube.com/watch?v=VGw81seFvbo", "events/zerstoerung_des_gruenen_kristallgewaechses": "# Zerst\u00f6rung des gr\u00fcnen Kristallgew\u00e4chses\n\nW\u00e4hrend ihrer Reise stie\u00dfen die Abenteurer auf ein unnat\u00fcrliches, pulsierendes Gebilde aus gr\u00fcnen Kristallen. Um dieses zu beseitigen, setzten [Lindo Laut](../characters/lindo_laut.md) und [Cookie](../characters/cookie.md) geb\u00fcndelte Feuermagie ein. Die Aktion f\u00fchrte zu einer intensiven Stichflamme, die das Kristallgew\u00e4chs verbrannte.\n\n# Belege\n1. Session 2025-10-07, 00:39:45 \u2013 https://www.youtube.com/watch?v=qVAF_54S8Vw", "events/zirkusvorfuehrung": "# Zirkusvorf\u00fchrung\n\nEine spontane Darbietung in der Taverne, initiiert von [Nyrella](../characters/nyrella.md) und [Nairuk](../characters/nairuk.md), um die gedr\u00fcckte Stimmung unter den Anwesenden zu heben. Die beiden f\u00fchrten verschiedene Kunstst\u00fccke vor, w\u00e4hrend [Rotunas](../characters/rotunas.md) die Szenerie mit Lichtzaubern untermalte und [Esterossa](../characters/esterossa.md) goldenen Glitzer beisteuerte. Die improvisierte Show erwies sich als voller Erfolg und erreichte ihr Ziel, die Atmosph\u00e4re aufzuhellen.\n\n# Belege\n1. Session 2025-11-18 @ 01:12:24 (https://www.youtube.com/watch?v=w__ahowb9p0)", "events/zweiter_arena_kampf": "# Zweiter Arena-Kampf\n\nDer zweite Arena-Kampf war eine Konfrontation mit einer Phasenspinne und ihrer Brut. Der Kampf gestaltete sich z\u00e4h und forderte die Gruppe heraus. W\u00e4hrend des Gefechts wurde [Esterossa](../characters/esterossa.md) vergiftet. Trotz der Widrigkeiten gelang es der Gruppe, ein Spinnenei zu finden und zu bergen. Unmittelbar nach dem Kampf mussten sie dem einst\u00fcrzenden Dungeon nur knapp entkommen.\n\n# Belege\n1. Session 2025-10-21, 00:56:18, https://www.youtube.com/watch?v=sxFhbtwoefA", "factions/alte_goetter_old_gods": "# Alte G\u00f6tter (Old Gods)\n\nDie Alten G\u00f6tter waren die fr\u00fcheren Herrscher der Welt. Sie wurden von den neuen G\u00f6ttern verdr\u00e4ngt und in eine andere Ebene verbannt. Ihre Diener versuchen, durch Portale in die Welt zur\u00fcckzukehren.\n\n# Belege\n1. Session 2025-05-27, 00:15:00 \u2013 https://www.youtube.com/watch?v=bamCIB_CkR8", "factions/banditen_fraktion": "# Banditen (Fraktion)\n\nEine gro\u00dfe Gruppe von Banditen, die in der n\u00f6rdlichen Schneise operiert. Die Fraktion ist unter zwei Anf\u00fchrern aufgeteilt und kontrolliert die dortigen Handelsrouten.\n\n# Belege\n1. Session 2025-09-23, 00:24:31 \u2013 https://www.youtube.com/watch?v=DGzfqVigS0g", "factions/brabarand_gilde": "# Brabarand-Gilde\n\nDie Brabarand-Gilde ist eine bekannte Assassinengilde, die f\u00fcr Auftragsmorde angeheuert wird.\n\n## Vorgehen und Ausr\u00fcstung\nDie Mitglieder der Gilde setzen bei ihren Auftr\u00e4gen bevorzugt auf:\n- Gifte\n- Armbr\u00fcste\n- Dolche\n\n## Bekannte Aktivit\u00e4ten\nDie Gilde wurde auf die Helden angesetzt. Als Grund wird das Amulett vermutet, das sich im Besitz der Gruppe befindet.\n\n# Belege\n1. Session 2025-07-22, 01:14:50 \u2013 https://www.youtube.com/watch?v=BRRCUgW4xRo", "factions/der_alte_schlangengott": "# Der alte Schlangengott\n\nEine alte Gottheit, die in der versunkenen Stadt verehrt wurde. Darauf deuten die Schlangenk\u00f6pfe auf den Glyphen und Runen hin, die aufleuchten, als die Feuer entz\u00fcndet werden.\n\n# Belege\n1. Session 2025-06-10 @ 00:55:13 (https://www.youtube.com/watch?v=cLkCu3Iq3y8)", "factions/der_einfluss_der_hack": "# Der Einfluss der Hack\n\nEine unheilvolle Macht oder Fraktion, deren Wirken sich in der Welt auf verschiedene Weise manifestiert.\n\n## Bekannte Aktivit\u00e4ten\n\n- **Verkleinerungsfluch:** In der Vergangenheit interagierte diese Entit\u00e4t mit [Dodo](../characters/dodo.md) und belegte sie mit einem Fluch, der sie schrumpfen lie\u00df. Eine Statue von Dodo, die im Zusammenhang mit diesem Ereignis steht, wurde in einer Burg gefunden.\n- **Gr\u00fcne Kristalle & Gew\u00e4chs:** Der Einfluss der Hack ist in gr\u00fcnen Kristallen und einem pulsierenden, pflanzenartigen Gew\u00e4chs erkennbar. Diese Objekte scheinen von ihrer Macht durchdrungen zu sein.\n\n## Verbindungen\n\n- [Dodo](../characters/dodo.md): Wurde in der Vergangenheit Opfer eines Verkleinerungsfluchs durch diese Fraktion.\n\n# Belege\n\n1. Session 2025-05-14 @ 00:54:14 (https://www.youtube.com/watch?v=5eAEDN5ra-4)\n2. Session 2025-10-07 @ 00:23:36 (https://www.youtube.com/watch?v=qVAF_54S8Vw)", "factions/die_alten_goetter": "# Die Alten G\u00f6tter\n\nEine Gruppe ehemaliger G\u00f6tter, die im Krieg besiegt wurden, aber offenbar immer noch \u00fcber Macht verf\u00fcgen. Sie nutzten Seelen-Netze zur Bestrafung. [Dodo](../characters/dodo.md) betet zu einem von ihnen.\n\n# Belege\n1. Session 2025-06-17, 01:05:10 - https://www.youtube.com/watch?v=tl76B4V0io8", "factions/die_gilde": "# Die Gilde\n\nDie Gilde ist eine Organisation, die als zentraler Auftraggeber der Helden fungiert und den Grundpfeiler der Kampagne bildet. Sie verteilt w\u00f6chentlich Auftr\u00e4ge an ihre Mitglieder.\n\n## Aktivit\u00e4ten\n\n*   Die Gilde hatte zuvor eine andere Gruppe entsandt, um ein Goblin-Camp auszuheben.\n*   Sie entsandte [Valeria](../characters/valeria.md) und [Rotunas](../characters/rotunas.md) zur Verteidigung von Breska.\n\n## Belege\n\n1.  Session 2025-04-09 @ 00:01:19 (https://www.youtube.com/watch?v=1PWdwvun5ow)\n2.  Session 2026-01-06 @ 00:12:18 (https://www.youtube.com/watch?v=VGw81seFvbo)", "factions/dwarfmaster_gilde": "# Dwarfmaster Gilde\n\nDie Dwarfmaster Gilde ist eine Organisation, der die Heldengruppe um [Dodo](../characters/dodo.md) und [Cookie](../characters/cookie.md) angeh\u00f6rt. Sie fungiert als Auftraggeberin f\u00fcr Abenteurer und stellt ihren Mitgliedern Unterk\u00fcnfte zur Verf\u00fcgung.\n\n## Aktivit\u00e4ten\n\nDie Gilde beauftragte [Dodo](../characters/dodo.md) und [Cookie](../characters/cookie.md) damit, die Ursache f\u00fcr die Untoten in Zebros zu untersuchen. Neben dieser Mission bietet sie generell Auftr\u00e4ge f\u00fcr ihre Mitglieder an.\n\n## Bekannte Vorf\u00e4lle\n\nEine andere Gruppe der Gilde ist k\u00fcrzlich bei einem Auftrag ums Leben gekommen.\n\n## Bemerkungen\n\nNicht alle Unternehmungen der Heldengruppe erfolgen im offiziellen Auftrag der Gilde. So war eine sp\u00e4tere Session explizit keine offizielle Mission der Organisation.\n\n# Belege\n\n1. Session 2025-05-14, 00:01:30 \u2013 https://www.youtube.com/watch?v=5eAEDN5ra-4\n2. Session 2025-08-05, 00:01:29 \u2013 https://www.youtube.com/watch?v=cRNIWJz_ATo\n3. Session 2025-11-18, 00:00:04 \u2013 https://www.youtube.com/watch?v=w__ahowb9p0", "factions/dwarfmasters_gilde": "# Dwarfmasters-Gilde\n\nDie Dwarfmasters-Gilde ist die Organisation, der die Helden angeh\u00f6ren. Sie betreibt einen Au\u00dfenposten mit dem Ziel, ein Portal zu bewachen und die Kreaturen der alten G\u00f6tter zu studieren.\n\n## Verbindungen\n- Die Helden, darunter [Dodo](../characters/dodo.md), sind Mitglieder dieser Gilde.\n\n# Belege\n1. Session 2025-05-27, 00:00:03 \u2013 https://www.youtube.com/watch?v=bamCIB_CkR8", "factions/fluechtlinge_aus_breska": "# Fl\u00fcchtlinge aus Breska\n\nEine Gruppe von Dorfbewohnern aus Breska, die von der Heldengruppe besch\u00fctzt und zu einem Banditenlager gef\u00fchrt wurde. Auf dem Weg dorthin wurde die Gruppe von Untoten angegriffen.\n\n## Verbindungen\n- Die Fl\u00fcchtlinge stammen aus dem Dorf [Breska](../locations/breska.md).\n- Sie wurden von der Heldengruppe, darunter [Dodo](dodo.md) und [Lenra](../npcs/lenra.md), eskortiert.\n\n# Belege\n1. Session 2025-09-23 @ 00:21:26 (https://www.youtube.com/watch?v=DGzfqVigS0g)", "factions/gilde": "# Gilde\n\nEine Organisation, die als Auftraggeber f\u00fcr die Gruppe fungiert.\n\n## Aktivit\u00e4ten\n\n*   Beauftragte die Gruppe mit der S\u00e4uberung einer Krypta. [1]\n*   K\u00fcndigte die Ankunft der Abenteurer im Dorf [Cornivum](../locations/cornivum.md) durch einen vorausgeschickten Raben an. [2]\n\n# Belege\n1. Session 2025-04-15 @ 00:02:40 (https://www.youtube.com/watch?v=YCpAz_syjaY)\n2. Session 2025-06-03 @ 00:07:45 (https://www.youtube.com/watch?v=jtYR4Je0a18)", "factions/gilde_der_schilder": "# Gilde der Schilder\n\nDie Gilde der Schilder ist eine kleine, aber lukrative Gilde mit Sitz in Tiefwasser. Sie unterh\u00e4lt ein B\u00fcndnis mit [Willauch](../npcs/willauch.md).\n\n## Mitglieder\n\n- **[Lara](../npcs/lara.md)**: Ein bekanntes Mitglied der Gilde.\n\n## Aktivit\u00e4ten\n\nDie Gilde \u00fcbernimmt verschiedenste Auftr\u00e4ge, darunter:\n\n- Auskundschaftung von Ork-Gebieten\n- Jagd auf die sogenannten \"Silberkerne\"\n\n---\n\n# Belege\n\n1. Session 2026-03-18, 00:26:25, https://www.youtube.com/watch?v=HHXxsASLrbQ", "factions/gilde_ehrenfels": "# Gilde (Ehrenfels)\n\n## Allgemeines\nDie Gilde von Ehrenfels ist die Organisation, der die Spielercharaktere angeh\u00f6ren.\n\n## F\u00fchrung\nAnf\u00fchrer der Gilde ist [Nox](../npcs/nox.md). Er erteilt den Spielercharakteren Auftr\u00e4ge.\n\n## Bekannte Aktivit\u00e4ten\n[Nox](../npcs/nox.md) gab den Auftrag, in Breska nach dem Rechten zu sehen. Insgeheim arbeitet er mit [Voras](../npcs/voras.md) zusammen.\n\n# Belege\n1. Session 2026-03-10, 00:02:00, https://www.youtube.com/watch?v=Kr9_AC2XtOw", "factions/gnolle": "# Gnolle\n\nDie Gnolle sind eine Fraktion hy\u00e4nenartiger Humanoider, die als feindselige Angreifer in Erscheinung treten.\n\n## Kampfverhalten\nGnolle sind sowohl im Fern- als auch im Nahkampf versiert und setzen Bogensch\u00fctzen sowie Nahk\u00e4mpfer ein. Sie greifen koordiniert an und scheinen auf eine Hacke zu h\u00f6ren, was auf eine rudiment\u00e4re Kommandostruktur oder einen Anf\u00fchrer hindeutet.\n\n## Bekannte Vorf\u00e4lle\n- **Angriff auf die Kapelle**: Gnolle griffen die Kapelle an, in der sich die Gruppe um [Dodo](../characters/dodo.md) aufhielt.\n\n# Belege\n1. Session 2025-05-06 @ 00:48:47 (https://www.youtube.com/watch?v=e0v6AFGd4mE)", "factions/goblin_goetter": "# Goblin-G\u00f6tter\n\nDie Goblin-G\u00f6tter sind ein Meta-Element der Kampagne, das die vierte Wand durchbricht. Sie repr\u00e4sentieren externe, h\u00f6here M\u00e4chte, die das Schicksal der Goblins und ihrer Umgebung beeinflussen. In der Spielpraxis wird diese Rolle vom Twitch-Chat und dem Spielleiter gemeinsam ausgef\u00fcllt.\n\n## Einflussnahme\n\nDie G\u00f6tter greifen auf verschiedene Weise in das Spielgeschehen ein:\n\n*   **Ungl\u00fcckliche Zuf\u00e4lle:** Sie k\u00f6nnen als boshafte Entit\u00e4t agieren und das Geschehen durch ungl\u00fcckliche Zuf\u00e4lle beeinflussen. Ein Beispiel hierf\u00fcr ist der Versuch des Gottes **Lugasch**, einen Stein auf [Dodo](../characters/dodo.md) fallen zu lassen.\n*   **Unterst\u00fctzung im Kampf:** Die G\u00f6tter k\u00f6nnen die Goblins im Kampf unterst\u00fctzen, indem sie Blitze vom Himmel schicken, welche die Goblins st\u00e4rker machen.\n\n# Belege\n1. Session 2025-04-01 @ 00:17:50 (https://www.youtube.com/watch?v=LZIuUzc3F18)\n2. Session 2025-04-15 @ 00:01:53 (https://www.youtube.com/watch?v=YCpAz_syjaY)\n3. Session 2025-04-23 @ 01:12:39 (https://www.youtube.com/watch?v=z3C-bewKqUs)", "factions/goblins": "# Goblins\n\n## \u00dcberblick\n\nDie Goblins stellen eine aktive Bedrohung f\u00fcr die Region um das Dorf [Breska](../locations/breska.md) dar. Sie treten in zwei unterschiedlichen Kontexten auf: als Angreifer auf die Oberfl\u00e4chensiedlung und als Gegenspieler der Zwerge in deren Minen.\n\n## Bedrohung f\u00fcr Breska\n\nEine unbekannte Anzahl von Goblins plant einen Angriff auf das Dorf [Breska](../locations/breska.md). Es besteht der Verdacht, dass sie dabei m\u00f6glicherweise mit einer weiteren, bislang unbekannten Partei zusammenarbeiten.\n\n## Minen-Goblins\n\nIn den Minen lebt eine zahlreiche Goblin-Population, die als Gegenspieler der dortigen Zwerge auftritt. Diese Gruppe wird von einem Schamanen angef\u00fchrt. Bemerkenswert ist, dass diese Goblins zun\u00e4chst kein Interesse an den Reicht\u00fcmern der Zwerge zeigten.\n\n# Belege\n\n1. Session 2025-04-09 @ 00:02:25 (https://www.youtube.com/watch?v=1PWdwvun5ow)\n2. Session 2026-01-27 @ 00:14:40 (https://www.youtube.com/watch?v=9RzvnnWzV7E)", "factions/kuatau_fischmenschen": "# Kuatau (Fischmenschen)\n\nEine Spezies glitschiger, nackter Fischmenschen, die mit Netzen, Speeren und Fernkampfwaffen ausgestattet sind. Sie werden von okkulten und magischen Dingen angezogen.\n\nDie Kuatau griffen die Siedlung [Windung](../locations/windung.md) an, nachdem sie von der [Sumpfhexe](../npcs/sumpfhexe.md) get\u00e4uscht worden waren. Diese hatte ihnen versprochen, ihr altes Land zur\u00fcckzugewinnen.\n\n# Belege\n1. Session 2025-07-29 @ 00:10:19 (https://www.youtube.com/watch?v=XXgO5Ht4Q0A)", "factions/kultisten": "# Kultisten\n\n## Allgemein\nDie Kultisten sind eine Gruppe von Anh\u00e4ngern des [Varsul](../gods/varsul.md). Ihr Ziel ist es, ein bestehendes Heiligtum f\u00fcr ihre eigenen Zwecke umzuwidmen.\n\n## Bekannte Aktivit\u00e4ten\n- Versuchten, ein Heiligtum umzuwidmen.\n- Wurden in einem Kampf besiegt.\n\n# Belege\n1. Session 2025-09-02, 00:03:13, https://www.youtube.com/watch?v=TLZOH7TlGhk", "factions/neue_gilde_in_breska": "# Neue Gilde in Breska\n\nEine von einem Tiefenzwerg namens [Gorak](../npcs/gorak.md) gef\u00fchrte Gilde in der Stadt [Breska](../locations/breska.md). Die Organisation legt gro\u00dfen Wert auf St\u00e4rke und Reichtum. Ihre Ziele umfassen die Vertreibung der Fl\u00fcchtlinge aus der Stadt sowie die Suche nach einer Kooperation mit der Gilde der Gruppe.\n\n# Belege\n1. Session 2025-09-17 @ 00:28:22 (https://www.youtube.com/watch?v=AhIT8dcxw2o)", "factions/schattenfinger": "# Schattenfinger\n\nDie Schattenfinger sind rabenvogel\u00e4hnliche Kreaturen, die \u00fcber rasiermesserscharfe, vergiftete Klauen verf\u00fcgen. Sie sind magischen Ursprungs, werden von einer unbekannten Macht gesteuert und erf\u00fcllen blind deren Auftr\u00e4ge.\n\n# Belege\n1. Session 2025-05-06, 00:27:35, https://www.youtube.com/watch?v=e0v6AFGd4mE", "factions/silberkerne": "# Silberkerne\n\n## Allgemein\nDie Silberkerne sind eine Gruppierung, die in der Stadt [Willauch](../locations/willauch.md) als Verbrecher gebrandmarkt wurde. Ihnen wird vorgeworfen, eine wichtige Person in der Stadt ermordet zu haben. Die Silberkerne selbst bestreiten die Tat.\n\n## Aktivit\u00e4ten\nEin Bote der Silberkerne trat an die Gruppe heran und bat um Hilfe bei der Suche nach einem S\u00fcndenbock, um die Anschuldigungen gegen die Gruppierung zu entkr\u00e4ften.\n\n# Belege\n1. Session 2026-03-18, 00:34:52, https://www.youtube.com/watch?v=HHXxsASLrbQ", "factions/silberkornbande": "# Silberkornbande\n\nDie Silberkornbande ist eine R\u00e4uberbande, deren Mitglieder [Harl](../characters/harl.md) und [Sarina](../characters/sarina.md) sind. Ein Teil der Bande kampiert nahe der Silbergruft und hat bereits erfolglos versucht, die Mine zu pl\u00fcndern.\n\n# Belege\n1. Session 2026-02-24, 00:39:33, https://www.youtube.com/watch?v=WOFArbwDDIQ", "factions/tarvok": "# Tarvok\n\nEine alte Gottheit, die mit den Bergen, Erdbeben und Best\u00e4ndigkeit assoziiert wird. Eine ihm geweihte Kapelle war das urspr\u00fcngliche Reiseziel der Gruppe.\n\nDie Kultisten, die sich am Gipfel aufhalten, dienen jedoch nicht Tarvok, sondern einer anderen Macht.\n\n# Belege\n1. Session 2025-08-20, 01:12:25 \u2013 https://www.youtube.com/watch?v=-XbO3FLSL_I", "factions/uhoriaks
