0e4nglich f\u00fcr Lindos Kommunikationsversuche und verf\u00fcgt \u00fcber starke Angriffe wie 'Hellfire' und 'Reaper'. [00:46:26]\n* [Skelett-Bogensch\u00fctzen](/npcs/skelett_bogenschuetzen.md) \u2014 F\u00fcnf untote Bogensch\u00fctzen, die als Minions des D\u00e4mons aus dem Portal steigen. Sie sind anf\u00e4llig f\u00fcr magischen Schaden und zerfallen, nachdem ihr Anf\u00fchrer besiegt wurde. [00:46:26]\n* [Gilden-Au\u00dfenposten](/locations/gilden_aussenposten.md) \u2014 Ein Trainingsgel\u00e4nde der Dwarfmasters-Gilde in einem waldigen Tal, das zwei Ruinen und ein zentrales Portal enth\u00e4lt. Es dient als Schauplatz f\u00fcr das Kampftraining. [00:22:55]\n* [Das Portal (Rift)](/locations/das_portal_rift.md) \u2014 Ein magischer Riss im Zentrum des Trainingsgel\u00e4ndes, der eine Verbindung zur Ebene der verbannten alten G\u00f6tter darstellt. Nox kann es mit einem Ritual \u00f6ffnen und wieder versiegeln. [00:23:43]\n* [Dwarfmasters-Gilde](/factions/dwarfmasters_gilde.md) \u2014 Die Organisation, der die Helden angeh\u00f6ren. Sie betreibt den Au\u00dfenposten, um das Portal zu bewachen und die Kreaturen der alten G\u00f6tter zu studieren. [00:00:03]\n* [Alte G\u00f6tter (Old Gods)](/factions/alte_goetter_old_gods.md) \u2014 Die fr\u00fcheren Herrscher der Welt, die von den neuen G\u00f6ttern verdr\u00e4ngt und in eine andere Ebene verbannt wurden. Ihre Diener versuchen durch Portale zur\u00fcckzukehren. [00:15:00]\n* [Schattenfinger-Relikt](/items/schattenfinger_relikt.md) \u2014 Ein verfluchter Gegenstand aus einem fr\u00fcheren Abenteuer, den Lindo Laut bei sich tr\u00e4gt. Nox identifiziert ihn als Relikt einer verfluchten Kreatur dieser Welt, nicht eines D\u00e4mons. [02:02:17]\n* [Perry das Schnabeltier](/npcs/perry_das_schnabeltier.md) \u2014 Cookies tierischer Begleiter, ein Schnabeltier, das wie ein Frettchen aussieht. Es kann sich gut tarnen und wird f\u00fcr Ablenkungsman\u00f6ver in Betracht gezogen, aber nicht aktiv im Kampf eingesetzt. [00:03:06]\n* [Kampf gegen den Miner Demon](/events/kampf_gegen_den_miner_demon.md) \u2014 Der erste gr\u00f6\u00dfere Kampf der Gruppe nach der Regelanpassung. Die Helden locken die Gegner in eine Ruine und besiegen den D\u00e4mon und seine Skelette durch eine Kombination aus Magie, Fernkampf und Tanking. [00:46:26]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=bamCIB_CkR8)", "sessions/2025-06-03": "# Zusammenfassung\n\nDie Gruppe erreicht den Sumpf und das Einsiedlerdorf Cornivum, wo sie vom \u00c4ltesten Rodek empfangen werden. Sie sammeln Informationen \u00fcber die Gegend, kaufen Sumpfhai-Gift und Gegengifte und erfahren von Ruinen und einem Turm im Nordosten. Der Dunkelelf Brass f\u00fchrt sie auf eine Jagd nach einer amphibischen Kreatur, die sie nach einem schwierigen Kampf mit einer Kombination aus Magie und roher Gewalt besiegen, wobei Brass schwer verletzt und von Esterossa geheilt wird. Auf dem weiteren Weg nach Nordosten entdecken sie einen magischen Schrein eines alten Schlangengottes, der von einer geisterhaften Schlangenkreatur bewacht wird. Nach einer gef\u00e4hrlichen Interaktion, bei der Dodo einem Angriff standh\u00e4lt, erhalten sie den Hinweis, dass die gesuchte Hack sich im Nordwesten befindet. Die Gruppe sammelt eine psychoaktive Pflanzensubstanz und erreicht schlie\u00dflich einen alten Turm, in dem sie Schutz vor einer pl\u00f6tzlich hereinbrechenden Flut finden, wo die Session endet.\n\n# Auftretende Entit\u00e4ten\n\n* [Cookie](/characters/cookie.md) \u2014 Ein Frosch-Ranger, der in einer H\u00f6hle aufgewachsen ist und den Sumpf liebt. Er kauft L\u00e4hmungspfeile, versucht im Kampf Rankenmagie und sammelt sp\u00e4ter eine psychoaktive Pflanzensubstanz. [00:05:35]\n* [Esterossa](/characters/esterossa.md) \u2014 Ein prunkvoll gekleideter Norborn mit Bibliotheca-Hintergrund. Er betet f\u00fcr k\u00fchleres Wetter, nutzt Eis- und Frostmagie im Kampf, heilt Brass und identifiziert den Schlangenschrein durch Geschichtswissen. [00:02:50]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Eine fliegende Fee und Barde, die oft vorausfliegt, um die Umgebung zu erkunden. Er befragt die Dorfbewohner, f\u00fchrt Zaubertricks vor, erh\u00e4lt einen Dolch von Brass und entdeckt die magischen Schriftzeichen am Schrein. [00:03:57]\n* [Rotunas](/characters/rotunas.md) \u2014 Ein Runen-Wizard, der sich f\u00fcr die Giftgewinnung der Zwerge interessiert und ihnen Gold f\u00fcr Informationen gibt. Im Kampf setzt er Feuerzauber ein und versucht sp\u00e4ter, mit Magie verborgene Wesen am Schrein zu enth\u00fcllen. [00:24:05]\n* [Dodo](/characters/dodo.md) \u2014 Ein Guardian, der im Kampf das Monster mit seiner Keule zerschmettert, nachdem es von Esterossa eingefroren wurde. Er rettet Rotunas vor einem Biss und widersteht einem Angriff der Schlangenkreatur am Schrein. [01:08:59]\n* [Rodek](/npcs/rodek.md) \u2014 Der \u00c4lteste des Sumpfdorfes Cornivum, ein Druide. Er empf\u00e4ngt die Gruppe im Auftrag der Gilde, bietet ihnen Unterkunft und verkauft ihnen Gift sowie Gegengift. [00:07:45]\n* [Brass](/npcs/brass.md) \u2014 Ein abweisender Dunkelelf aus Cornivum, der die Gruppe zun\u00e4chst argw\u00f6hnisch mustert. Er f\u00fchrt sie auf die Jagd nach einer Sumpfkreatur, wird dabei fast get\u00f6tet und schenkt Lindo Laut aus Scham seinen Dolch. [00:15:45]\n* [Zwei Zwerge](/npcs/zwei_zwerge.md) \u2014 Bewohner von Cornivum, die Fische f\u00fcr die Giftgewinnung verarbeiten. Sie erkl\u00e4ren Rotunas detailliert, wie das Nervengift aus den Flossen der Sumpfhaie extrahiert wird. [00:17:57]\n* [Cornivum](/locations/cornivum.md) \u2014 Ein kleines, auf Survival ausgerichtetes Einsiedlerdorf im Sumpf, das auf Stelzen gebaut ist. Es dient als letzter Au\u00dfenposten vor dem tieferen Sumpf und wird regelm\u00e4\u00dfig von Fluten heimgesucht. [00:04:02]\n* [Alter Turm](/locations/alter_turm.md) \u2014 Ein alter Turm im Nordosten des Sumpfes, der als Zufluchtsort dient. Er ist mit einer wasserdichten T\u00fcr versiegelt und bietet Schutz vor den pl\u00f6tzlich steigenden Fluten. [00:28:25]\n* [Schrein des Schlangengottes](/locations/schrein_des_schlangengottes.md) \u2014 Ein magischer Ort mit zwei Statuen und leuchtenden Kristallen, der einen tiefen Basston ausstrahlt. Er wird von einer geisterhaften, sechsk\u00f6pfigen Schlangenkreatur bewacht, die mit der Gruppe kommuniziert. [01:34:42]\n* [Gilde](/factions/gilde.md) \u2014 Die Auftraggeber der Gruppe, die einen Raben vorausgeschickt haben, um das Dorf Cornivum \u00fcber die Ankunft der Abenteurer zu informieren. [00:07:45]\n* [Sumpfhai-Giftpfeile](/items/sumpfhai_giftpfeile.md) \u2014 Zehn Bet\u00e4ubungspfeile, die mit einem l\u00e4hmenden Nervengift aus Sumpfhaien pr\u00e4pariert sind. Cookie kauft sie f\u00fcr eine Handvoll Gold, sie zeigen im Kampf jedoch keine sofortige Wirkung. [00:20:30]\n* [Gegengift](/items/gegengift.md) \u2014 Ein universelles Gegengift gegen die \u00fcblichen Gifte des Sumpfes, das Esterossa f\u00fcr eine Handvoll Gold erwirbt. [00:21:01]\n* [Verschlingender Dolch (Devouring Dagger)](/items/verschlingender_dolch_devouring_dagger.md) \u2014 Ein magischer Tier-2-Dolch, den Lindo Laut von Brass als Entsch\u00e4digung f\u00fcr dessen miserables Kampfgeschick erh\u00e4lt. Er verursacht magischen Schaden und zwingt getroffene Gegner, einen Stress zu markieren. [01:23:12]\n* [Vulkanpflanze](/items/vulkanpflanze.md) \u2014 Eine Pflanze, deren Beh\u00e4lter eine stark aphrodisierende und aufputschende Tinktur enthalten, die \u00fcber die Haut aufgenommen werden kann. Cookie und Esterossa f\u00fcllen drei Fl\u00e4schchen davon ab. [01:53:31]\n* [Kampf gegen die Sumpfamphibie](/events/kampf_gegen_die_sumpfamphibie.md) \u2014 Die Gruppe jagt mit Brass eine getarnte, giftige Amphibienkreatur. Nachdem Angriffe und Festhaltezauber scheitern, wird das Monster von Esterossas Frostmagie eingefroren und von Dodo mit einem Keulenschlag zerschmettert. Brass wird dabei fast get\u00f6tet. [00:35:37]\n* [Begegnung am Schlangenschrein](/events/begegnung_am_schlangenschrein.md) \u2014 Die Gruppe interagiert mit einer geisterhaften Schlangengottheit. Nachdem Dodo einen Angriff der sechs K\u00f6pfe unbeschadet \u00fcbersteht, beantwortet die Kreatur die Frage nach der Hack und verweist auf den Nordwesten. [01:46:48]\n* [Die Flut](/events/die_flut.md) \u2014 Nach Einbruch der Nacht steigt das Wasser im Sumpf rapide an und \u00fcberflutet das Land. Die Gruppe kann sich rechtzeitig in den versiegelten Turm retten. [02:00:29]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=jtYR4Je0a18)", "sessions/2025-06-10": "# Zusammenfassung\n\nDie Gruppe erholt sich drei Tage lang in einem Turm, rationiert aber ihre Vorr\u00e4te. Nach der Rast brechen sie auf und erreichen eine alte Br\u00fccke, wo sie von zwei Froschwesen (Ribbits) aufgehalten werden, die einen Wegzoll fordern. Rotunas lenkt sie mit einem Schwarm Fliegen ab, und die Gruppe passiert die Br\u00fccke. Sie entdecken einen \u00fcberfluteten Eingang zu einer versunkenen Stadt und tauchen hindurch. In den unterirdischen Gew\u00f6lben aktivieren sie blaues und rotes Feuer, woraufhin Schlangenrunen an der Wand aufleuchten. Rotunas erleidet einen Stromschlag, als er eine Rune ber\u00fchrt. Ein geisterhafter Doppelg\u00e4nger von Rotunas greift an, wird aber von Rotunas selbst mit Magie besiegt. Die Gruppe findet goldene Perlen in riesigen Muscheln, von denen sich eine als Mimic entpuppt und Cookie fast verschlingt, bevor Dodo sie zerschmettert. Sie finden magische Handschuhe und ein Amulett mit Fangz\u00e4hnen. Tiefer im Dungeon werden sie von Wasserelementaren und sp\u00e4ter von kleinen, schleimigen Kreaturen angegriffen, die Cookie erneut schwer verletzen. Dodo wirft sich sch\u00fctzend dazwischen. Rotunas und Dodo besiegen die meisten Gegner, w\u00e4hrend eine Kreatur flieht. Ersch\u00f6pft und mit fast aufgebrauchten Ressourcen diskutiert die Gruppe, ob sie weiter vordringen oder umkehren soll, da sie noch keine Informationen \u00fcber die Hexe 'Hack' gefunden haben. Die Session endet mit der Entscheidung, die Erkundung in der n\u00e4chsten Session fortzusetzen.\n\n# Auftretende Entit\u00e4ten\n\n* [Cookie](/characters/cookie.md) \u2014 Ein Froschwesen (Ribbit) mit gr\u00fcner Haut, das unter der Erde aufgewachsen ist. Sie hat panische Angst vor Spinnen, kann unter Wasser atmen und im Dunkeln sehen. Sie wird im Kampf gegen die Mimic und die Schleimkreaturen zweimal fast get\u00f6tet und ist am Ende stark angeschlagen und ver\u00e4ngstigt. [00:31:05]\n* [Rotunas](/characters/rotunas.md) \u2014 Ein magisch begabter Charakter mit Runen, der ein Buch \u00fcbersetzt, Fliegen beschw\u00f6rt, T\u00fcren magisch versiegelt und Eis- sowie Feuerzauber wirkt. Er erleidet einen Stromschlag von einer Rune und k\u00e4mpft gegen seinen eigenen geisterhaften Doppelg\u00e4nger. Er findet verbesserte arkanische Handschuhe. [00:07:21]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Ein kleines, gefl\u00fcgeltes Wesen, das fliegen kann und einen Dolch (Dagger) benutzt. Er ist neugierig und untersucht die Umgebung, findet ein arkanisches Prisma und entdeckt als Erster die Muscheln mit den Goldperlen. Er wird von einer Mimic und sp\u00e4ter von Schleimkreaturen angegriffen. [00:09:42]\n* [Dodo](/characters/dodo.md) \u2014 Ein gro\u00dfer, l\u00f6wenartiger Bodyguard mit Schild und Streitkolben, der Feuer spucken kann. Er besch\u00fctzt die Gruppe, insbesondere Cookie, vor Angriffen, wirft sich f\u00fcr sie in die Bresche und zerschmettert die Mimic. Er teilt seine Heiltr\u00e4nke mit Cookie. [00:13:16]\n* [Die zwei Froschwesen (Ribbits)](/npcs/die_zwei_froschwesen_ribbits.md) \u2014 Zwei Froschwesen, die auf der Br\u00fccke Wache halten und einen Wegzoll fordern. Sie sind Cookie gegen\u00fcber misstrauisch, lassen die Gruppe aber passieren, nachdem Rotunas sie mit Fliegen f\u00fcttert. Sie kennen die versunkene Stadt nur vom Eingang und haben Angst vor der Dunkelheit. [00:28:56]\n* [Geisterhafter Doppelg\u00e4nger von Rotunas](/npcs/geisterhafter_doppelgaenger_von_rotunas.md) \u2014 Eine geisterhafte, schimmernde Kreatur, die wie Rotunas aussieht und mit seiner Stimme fl\u00fcstert. Sie verursacht magischen Elektrizit\u00e4tsschaden, kann aber von physischen Waffen nicht verletzt werden. Rotunas l\u00f6st sie mit einem magischen Angriff auf. [01:02:48]\n* [Mimic](/npcs/mimic.md) \u2014 Eine als riesige Muschel getarnte Kreatur, die Lindo Laut und Cookie angreift. Sie verschlingt Cookie fast, wird aber von Dodo und Rotunas gemeinsam aufgerissen und schlie\u00dflich von Dodo mit einem gezielten Schlag zerst\u00f6rt. Sie enth\u00e4lt Gold und magische Handschuhe. [01:16:47]\n* [Wasserelementare](/npcs/wasserelementare.md) \u2014 Zwei aus Wasser bestehende Kreaturen, die die Gruppe in einem dunklen, gefluteten Raum angreifen. Dodos Feueratem ist wirkungslos, da sie sich aus dem Wasser regenerieren. Rotunas friert sie mit einem Eiszauber ein, wodurch sie zu einer Eiswand erstarren. [01:38:25]\n* [Schleimkreaturen](/npcs/schleimkreaturen.md) \u2014 Kleine, schleimige Humanoide, die sich im Dunkeln verstecken und die Gruppe aus dem Hinterhalt angreifen. Sie k\u00f6nnen eine l\u00e4hmende Fl\u00fcssigkeit spucken und greifen bevorzugt Cookie an. Drei von ihnen werden get\u00f6tet, eine vierte flieht ins Wasser. [01:49:45]\n* [Cornivum](/locations/cornivum.md) \u2014 Das Dorf, in dem das Abenteuer begann. Die Gruppe hat dort nur wenige Informationen \u00fcber die Hexe 'Hack' sammeln k\u00f6nnen. [00:04:30]\n* [Der Turm](/locations/der_turm.md) \u2014 Ein Turm, in dem die Gruppe drei Tage lang Schutz vor den Fluten sucht und ihre lange Rast abh\u00e4lt. Sie durchsuchen ihn nach Beute und finden verschiedene magische Gegenst\u00e4nde. [00:05:24]\n* [Die alte Br\u00fccke](/locations/die_alte_bruecke.md) \u2014 Eine befestigte Br\u00fccke, auf der vor \u00fcber 100 Jahren ein Kampf stattfand. Sie wird von zwei Froschwesen bewacht und f\u00fchrt zum Eingang der versunkenen Stadt. [00:26:00]\n* [Die versunkene Stadt](/locations/die_versunkene_stadt.md) \u2014 Eine unterirdische, teilweise \u00fcberflutete Ruinenstadt, die durch einen \u00fcberfluteten Gang betreten wird. Sie enth\u00e4lt Gew\u00f6lbe mit Schlangenrunen, Muschelbetten und tiefere, dunkle Ebenen. Sie wurde vermutlich von Anbetern eines alten Schlangengottes bewohnt. [00:32:25]\n* [Der alte Schlangengott](/factions/der_alte_schlangengott.md) \u2014 Eine alte Gottheit, die in der versunkenen Stadt verehrt wurde. Darauf deuten die Schlangenk\u00f6pfe auf den Glyphen und Runen hin, die aufleuchten, als die Feuer entz\u00fcndet werden. [00:55:13]\n* [Glamourstein](/items/glamourstein.md) \u2014 Ein Stein, der eine Illusion einer Person in der N\u00e4he erzeugen kann, um als Ablenkung zu dienen. Gefunden von Rotunas im Turm. [00:19:24]\n* [Arkanes Prisma](/items/arkanes_prisma.md) \u2014 Ein einmalig nutzbarer Stein, der allen Zauberrollen einen Bonus von +1 gibt. Gefunden von Lindo Laut im Turm. [00:20:24]\n* [Arkaner Umhang](/items/arkaner_umhang.md) \u2014 Ein Umhang mit Kapuze, der seine Farbe nach Wunsch des Tr\u00e4gers \u00e4ndern kann. Gefunden von Dodo im Turm. [00:21:36]\n* [Ender-Truhe](/items/ender_truhe.md) \u2014 Eine magische Truhe mit einem geheimen Fach, das sich nur mit einem bestimmten Kommandowort \u00f6ffnen l\u00e4sst. Gefunden von Cookie im Turm. [00:22:14]\n* [Goldene Perlen/Goldbrocken](/items/goldene_perlen_goldbrocken.md) \u2014 In riesigen Muscheln gefundene Goldbrocken, jeder etwa einen Beutel Gold wert. Drei werden aus harmlosen Muscheln, ein weiterer aus der Mimic geborgen. [01:14:24]\n* [Verbesserte Arkane Handschuhe](/items/verbesserte_arkane_handschuhe.md) \u2014 Eine magische Waffe, die 1w10+6 magischen Schaden verursacht. Gefunden in der Mimic und von Lindo Laut an Rotunas \u00fcbergeben. [01:30:51]\n* [Fangzahn-Amulett](/items/fangzahn_amulett.md) \u2014 Ein Amulett mit einem vampir\u00e4hnlichen Gebiss (nur die oberen Fangz\u00e4hne), das magische Energie ausstrahlt. Gefunden von Lindo Laut hinter einem Gitter. [01:44:35]\n* [Vulkanpflanzen-Gift](/items/vulkanpflanzen_gift.md) \u2014 Ein \u00e4tzendes Enzym, das Cookie mit Algen und Schlamm mischt, um neun ihrer Pfeile damit zu tr\u00e4nken. [00:14:11]\n* [Die Jagd nach der Hexe 'Hack'](/events/die_jagd_nach_der_hexe_hack.md) \u2014 Die Hauptmission der Gruppe. Sie suchen nach einer buckligen, alten Hexe mit magischen F\u00e4higkeiten. Die Froschwesen auf der Br\u00fccke kennen sie nicht, und in der versunkenen Stadt wurden bisher keine Hinweise auf sie gefunden. [00:31:47]\n* [Kampf gegen die Mimic](/events/kampf_gegen_die_mimic.md) \u2014 Eine der Muscheln entpuppt sich als Mimic und greift an. Sie verschlingt Cookie und verursacht schweren Schaden. Dodo und Rotunas versuchen vergeblich, sie aufzurei\u00dfen. Erst ein gezielter Schlag Dodos mit dem Streitkolben trennt den Oberkiefer ab und befreit Cookie. [01:16:47]\n* [Angriff der Schleimkreaturen](/events/angriff_der_schleimkreaturen.md) \u2014 In einem Raum mit Illusionsflammen wird die Gruppe von mehreren kleinen, schleimigen Kreaturen \u00fcberrascht. Cookie wird erneut fast get\u00f6tet, aber Dodo wirft sich sch\u00fctzend dazwischen. Die Gruppe t\u00f6tet drei der Kreaturen, eine entkommt. [01:49:45]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=cLkCu3Iq3y8)", "sessions/2025-06-17": "# Zusammenfassung\n\nDie Gruppe setzt ihre Erkundung des Dungeons fort, nachdem sie die Wasserlinge besiegt hat. Sie \u00fcberwinden eine elektrische Falle und k\u00e4mpfen gegen zwei pilz\u00fcberwucherte Goblins, die sich als regenerationsf\u00e4hig erweisen und nur durch Feuermagie endg\u00fcltig vernichtet werden k\u00f6nnen. Tiefer im Dungeon entdecken sie einen Raum voller toter Seraphen, denen etwas aus der Stirn entnommen wurde. Ein magisch versiegeltes Tor wird von Lindo Laut mittels Teleportation \u00fcberwunden. In einem von Seelen-Netzen durchzogenen Bereich werden sie von einem rachs\u00fcchtigen Geist attackiert, der es auf Rotunas abgesehen hat, weil dieser eine Rune ber\u00fchrt hatte. Nach einem harten Kampf kann der Geist vorerst besiegt werden. Die Gruppe findet die eingesperrte Pilzkreatur Luli, befreit sie und nimmt sie mit. Beim weiteren Vordringen belauschen sie die Hexe und eine d\u00e4monische Stimme, die \u00fcber den Grafen sprechen. Auf der Flucht wird Luli von einer gro\u00dfen Kreatur gefressen. Im letzten Moment, als die Hexe sie angreift, gelingt Lindo Laut die Teleportation der gesamten Gruppe zur\u00fcck zum Eingang des Dungeons.\n\n# Auftretende Entit\u00e4ten\n\n* [Rotunas](/characters/rotunas.md) \u2014 Spielercharakter, ein Zauberwirker. Wird vom Geist heimgesucht, weil er eine Rune ber\u00fchrte. Erleidet schweren Schaden, \u00fcberlebt aber knapp durch seine 'Wizards Hope'-F\u00e4higkeit. Nutzt 'Reveal', 'Power Push' und 'Mystic Tether'. [00:04:37]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Spielercharakter, ein Barde oder Magier mit Klangmagie. H\u00e4lt eine motivierende Ansprache, macht Cookie unsichtbar, teleportiert sich durch eine magische T\u00fcr und teleportiert die Gruppe am Ende in Sicherheit. [00:06:19]\n* [Cookie](/characters/cookie.md) \u2014 Spielercharakter, ein Froschwesen (Ribbit) mit Naturverbundenheit. Nutzt Ranken, um Gegner festzuhalten, wehrt Pilzsporen mit einem Gegenmittel ab und befreit die Pilzkreatur Luli. [00:04:20]\n* [Dodo](/characters/dodo.md) \u2014 Spielercharakter, ein drachischer Krieger mit Schild und Feueratem. Fungiert oft als Frontk\u00e4mpfer, h\u00e4lt viel Schaden mit seinem Schild ab und betet zu einem alten Gott, um Seelen zu befreien. [00:05:55]\n* [Die Hack (Hexe)](/npcs/die_hack_hexe.md) \u2014 Die vermeintliche Antagonistin des Dungeons. Wird von der Gruppe belauscht, wie sie mit einer d\u00e4monischen Stimme \u00fcber den 'Grafen' spricht. Greift die Gruppe am Ende mit einem lilanen Todesstrahl an. [01:49:10]\n* [Luli](/npcs/luli.md) \u2014 Eine kleine, sanfte Pilzkreatur, die von der 'gr\u00fcnen Dame' (Hexe) eingesperrt wurde, nachdem ihre Familie in einen Kessel geworfen wurde. Wird von Cookie befreit, rei\u00dft sich sp\u00e4ter los und wird von einer Kreatur gefressen. [01:34:57]\n* [Pilz-Goblins](/npcs/pilz_goblins.md) \u2014 Zwei mit Pilzen \u00fcberwucherte Goblins, die die Gruppe angreifen. Sie verf\u00fcgen \u00fcber regenerative F\u00e4higkeiten und k\u00f6nnen nur durch Feuerschaden endg\u00fcltig vernichtet werden. [00:24:17]\n* [Rachs\u00fcchtiger Geist](/npcs/rachsuechtiger_geist.md) \u2014 Ein Geist, der Rotunas verfolgt, weil dieser eine Rune zu Beginn des Dungeons ber\u00fchrt hat. Erscheint mehrfach, entzieht Energie und kann nur vor\u00fcbergehend besiegt werden. [01:06:10]\n* [D\u00e4monische Stimme](/npcs/daemonische_stimme.md) \u2014 Eine dunkle, tiefe Stimme, die mit der Hexe in d\u00e4monischer Sprache redet. Ihr Gespr\u00e4ch wird von der Gruppe belauscht. [01:48:56]\n* [Gefangene Seelen](/npcs/gefangene_seelen.md) \u2014 In Seelen-Netzen gefangene Geister, die um Hilfe schreien. Einige sind gefallene Krieger aus einem Krieg gegen die 'Alten'. Dodo befreit einen Teil von ihnen durch ein Gebet, was sie zu Asche zerfallen l\u00e4sst. [01:26:50]\n* [Gew\u00f6lbe der Hexe](/locations/gewoelbe_der_hexe.md) \u2014 Ein weitl\u00e4ufiger, mehrst\u00f6ckiger Dungeon, der tiefer in die Erde f\u00fchrt. Enth\u00e4lt Fallen, Pilzwesen, Seelen-Netze und einen Raum voller toter Seraphen. [00:02:31]\n* [Raum der toten Seraphen](/locations/raum_der_toten_seraphen.md) \u2014 Ein Raum voller Leichen von Seraphen (engelsgleichen Wesen). Ihnen wurde mit einem Werkzeug etwas aus der Stirn entnommen. [00:52:19]\n* [Seelen-Netze](/locations/seelen_netze.md) \u2014 Ein Bereich mit Netzen, die Seelen einfangen k\u00f6nnen. Ein Relikt der alten G\u00f6tter, das nicht auf der materiellen Ebene existieren sollte. Verursacht Stress und Schaden an der Seele der Charaktere. [01:04:03]\n* [Die Alten G\u00f6tter](/factions/die_alten_goetter.md) \u2014 Ehemalige G\u00f6tter, die Seelen-Netze zur Bestrafung nutzten. Wurden im Krieg besiegt, haben aber offenbar immer noch Macht. Dodo betet zu einem von ihnen. [01:05:10]\n* [Der Graf](/npcs/der_graf.md) \u2014 Eine Person, die von der Hexe und der d\u00e4monischen Stimme als Hindernis erw\u00e4hnt wird. Sie planen, sich um ihn zu k\u00fcmmern. [01:49:10]\n* [Schleimb\u00e4lle](/items/schleimbaelle.md) \u2014 Von Lindo Laut aus den Genitalien eines besiegten Wasserlings geborgen. Ihre Funktion ist unklar, sie werden als eklig beschrieben. [00:03:30]\n* [Gl\u00fcckstag-Trank](/items/glueckstag_trank.md) \u2014 Ein Trank mit der Aufschrift 'Gl\u00fcckstag', gefunden in einem der R\u00e4ume. Seine Wirkung ist unbekannt. [01:38:07]\n* [Grauenwurz-Trank](/items/grauenwurz_trank.md) \u2014 Ein Trank, der f\u00fcr eine gewisse Zeit st\u00e4rker macht, aber danach einen schlimmen Kater verursacht. Wird von Cookie identifiziert, aber nicht mitgenommen. [01:24:38]\n* [Magischer Schl\u00fcssel](/items/magischer_schluessel.md) \u2014 Ein ungew\u00f6hnlich aussehender, magischer Schl\u00fcssel, gefunden von Rotunas in einer Kiste. [01:44:43]\n* [Seelenstein](/items/seelenstein.md) \u2014 Ein Stein mit einem glitzernden Gesicht darin. Rotunas vermutet, dass beim Zerbrechen ein Geist freigesetzt wird. [01:52:41]\n* [Schwarzer Palantir](/items/schwarzer_palantir.md) \u2014 Eine kleine, runde, schwarze Kugel, die Dodo findet und nicht identifizieren kann. [01:53:34]\n* [Drei S\u00e4cke Gold](/items/drei_saecke_gold.md) \u2014 Von der Gruppe in den sp\u00e4teren R\u00e4umen erbeutetes Gold. [01:51:22]\n* [Kampf gegen die Pilz-Goblins](/events/kampf_gegen_die_pilz_goblins.md) \u2014 Die Gruppe wird von zwei pilz\u00fcberwucherten Goblins \u00fcberrascht. Cookie blockt einen Sporenangriff mit einem Gegenmittel, Lindo Laut vernichtet beide mit einem Feuerlaserstrahl. [00:24:17]\n* [Kampf gegen den rachs\u00fcchtigen Geist](/events/kampf_gegen_den_rachsuechtigen_geist.md) \u2014 Der Geist greift Rotunas mehrfach an und bringt ihn an den Rand des Todes. Rotunas \u00fcberlebt durch 'Wizards Hope' und vernichtet den Geist vorerst mit einem m\u00e4chtigen Schlag. [01:06:10]\n* [Befreiung und Tod von Luli](/events/befreiung_und_tod_von_luli.md) \u2014 Cookie befreit die Pilzkreatur Luli aus einem Gef\u00e4ngnis. Sp\u00e4ter rei\u00dft Luli sich los und wird von einer gro\u00dfen, unsichtbaren Kreatur gefressen. [01:36:37]\n* [Teleportation aus dem Dungeon](/events/teleportation_aus_dem_dungeon.md) \u2014 Als die Hexe die Gruppe mit einem Todesstrahl angreift, vollendet Lindo Laut ein Ritual und teleportiert alle zur\u00fcck zum Eingang des Dungeons. [01:59:21]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=tl76B4V0io8)", "sessions/2025-06-25": "# Zusammenfassung\n\nDie Gruppe kehrt nach Bresca zur\u00fcck, das sich dank der Finanzierung durch Graf Voras zu einer befestigten Stadt entwickelt hat. Sie berichten dem Grafen von ihren Erkenntnissen \u00fcber die Hack und erfahren von seinen Pl\u00e4nen, die Kontrolle \u00fcber den Berg Zebros zu erlangen, wo ein dunkler Paladin Untote anf\u00fchrt. In der Bibliothek des Grafen \u00f6ffnen sie mit einem schwarzen Palantir ein uraltes, versiegeltes Buch, woraufhin ihre Seelen in eine andere Dimension gerissen werden. Dort m\u00fcssen sie gegen himmlische W\u00e4chter k\u00e4mpfen, die sie im Namen Durans angreifen. Nach einem harten Kampf, bei dem Rotunas fast stirbt, kehren sie zur\u00fcck und stellen fest, dass das Amulett von Duran verdunkelt ist und nun vier Seelen in sich tr\u00e4gt. Der Graf ist entsetzt \u00fcber die Vernichtung der Engel. Eine Illusion der Hack deutet an, dass sie dieses Ereignis gewollt hat. Der Magier Orlanius Schwarzhorn warnt Lindo Laut vor der korrumpierenden Macht des Amuletts und identifiziert Rotunas' Schl\u00fcssel als m\u00f6glichen Portalschl\u00fcssel.\n\n# Auftretende Entit\u00e4ten\n\n* [Rotunas](/characters/rotunas.md) \u2014 Spielercharakter, ein Magier. Tr\u00e4gt das Amulett von Duran, das sich nach dem Kampf verdunkelt. Benutzt einen Seelenstein als Schutz und wird im Kampf fast get\u00f6tet. Besitzt einen magischen Schl\u00fcssel, der als Portalschl\u00fcssel identifiziert wird. [00:00:00]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Spielercharakter, ein gefl\u00fcgeltes Wesen (Fee). Wirkt m\u00e4chtige Zauber wie Mystic Tether und Feuerball. Ist nach den Ereignissen stark mitgenommen und sp\u00fcrt die dunkle Pr\u00e4senz im Amulett. [00:00:02]\n* [Dodo](/characters/dodo.md) \u2014 Spielercharakter, ein Krieger mit Keule und Schild. Hat den schwarzen Palantir aus dem Sumpf-Dungeon mitgebracht, mit dem das Buch ge\u00f6ffnet wird. War bereits auf dem Berg Zebros und k\u00e4mpfte gegen den dunklen Paladin. [00:00:02]\n* [Graf Voras der Heilige](/npcs/graf_voras_der_heilige.md) \u2014 Ein Vampir und Herrscher von Bresca. Hat die Stadt mit seinem Verm\u00f6gen ausgebaut. Plant, die Kontrolle \u00fcber den Berg Zebros zu erlangen, um seine Macht \u00fcber Untote zu nutzen. Ist entsetzt, als die Gruppe die himmlischen W\u00e4chter vernichtet. [00:16:43]\n* [B\u00fcrgermeister Bertolt](/npcs/buergermeister_bertolt.md) \u2014 Der redselige B\u00fcrgermeister von Bresca. Ist begeistert vom Ausbau der Stadt und bietet der Gruppe ein Bier in der neuen Taverne an. [00:07:00]\n* [Kerl](/npcs/kerl.md) \u2014 Ehemalige Wache des B\u00fcrgermeisters, jetzt Leibgarde des Grafen. L\u00e4sst die Gruppe zum Grafen vor, nachdem sie von einer Bedrohung berichten. [00:18:44]\n* [Tindra](/npcs/tindra.md) \u2014 Eine Vertraute oder Dienerin des Grafen Voras. Begleitet die Gruppe zur Bibliothek und kommentiert die angespannte Situation nach dem Vorfall. [00:22:08]\n* [Orlanius Schwarzhorn](/npcs/orlanius_schwarzhorn.md) \u2014 Ein Magier in Bresca, Spezialist f\u00fcr altes Wissen. Warnt Lindo Laut vor der korrumpierenden Macht des verdunkelten Amuletts und identifiziert Rotunas' Schl\u00fcssel als Portalschl\u00fcssel. Gibt der Gruppe einen Rabenstein zur Kommunikation. [01:31:45]\n* [Die Hack](/npcs/die_hack.md) \u2014 Eine Hexe und Antagonistin, die mit d\u00e4monischen Kr\u00e4ften arbeitet. Eine Illusion von ihr erscheint auf dem Dach und deutet an, dass sie die \u00d6ffnung des Buches gewollt hat. [00:02:09]\n* [Priesterin Auraniell](/npcs/priesterin_auraniell.md) \u2014 Eine Halbling-Priesterin, die auf Durchreise war und nun in der neuen Kapelle von Bresca arbeitet. Ihr Kloster wurde von der Hack angegriffen. [00:27:12]\n* Bresca \u2014 Ein Dorf, das sich zu einer befestigten Stadt mit Palisade, Kapelle, ausgebauter Taverne und neuen Geb\u00e4uden entwickelt hat. Wurde vom Grafen finanziert. [00:04:00]\n* [Berg Zebros](/locations/berg_zebros.md) \u2014 Ein Berg, von dem Untote ins Tal str\u00f6men. Wird von einem dunklen Paladin angef\u00fchrt. Der Graf plant, die Kontrolle \u00fcber diesen Ort zu erlangen. [00:31:00]\n* [Amulett von Duran](/items/amulett_von_duran.md) \u2014 Ein m\u00e4chtiges Artefakt, das Rotunas tr\u00e4gt. Nach dem Kampf in der Buchebene ist es verdunkelt und tr\u00e4gt einen tief dunkelroten Punkt. Enth\u00e4lt nun vier Seelen und verleiht Macht, korrumpiert aber den Tr\u00e4ger. [00:29:17]\n* [Schwarzer Palantir](/items/schwarzer_palantir.md) \u2014 Ein dunkles Artefakt aus dem Sumpf-Dungeon, das Dodo mitgebracht hat. L\u00f6st sich auf, als es an das versiegelte Buch gehalten wird, und \u00f6ffnet dieses. [00:44:00]\n* [Versiegeltes Buch](/items/versiegeltes_buch.md) \u2014 Ein uraltes Buch in der Bibliothek des Grafen, das Wissen aus den 'Circle Below' enth\u00e4lt. Wird durch den Palantir ge\u00f6ffnet und teleportiert die Seelen der Gruppe in eine andere Dimension. Vergilbt und l\u00f6st sich nach dem Vorfall auf. [00:46:01]\n* [Seelenstein](/items/seelenstein.md) \u2014 Ein Stein mit einer eingeschlossenen Seele, den Rotunas als Schutzschild im Kampf gegen den Celestial einsetzt. Wird dabei zerst\u00f6rt. [01:15:58]\n* [Magischer Schl\u00fcssel](/items/magischer_schluessel.md) \u2014 Ein Schl\u00fcssel, den Rotunas in einem fr\u00fcheren Abenteuer fand. Orlanius identifiziert ihn als m\u00f6glichen Portalschl\u00fcssel, der in einen anderen Realm oder Demiplane f\u00fchren k\u00f6nnte. [00:48:17]\n* [Kampf in der Seelenebene](/events/kampf_in_der_seelenebene.md) \u2014 Die Seelen der Gruppe werden in eine andere Dimension gerissen, wo sie gegen vier Kultisten und himmlische W\u00e4chter (Celestials) k\u00e4mpfen m\u00fcssen. Sie vernichten die W\u00e4chter, was den Grafen entsetzt und das Amulett von Duran verdunkelt. [00:52:00]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=tpkO9uGw6-I)", "sessions/2025-07-09": "# Zusammenfassung\n\nDie Gruppe erwacht in einer fremden, farblosen Dimension vor einer uralten Festung. Lindo Laut wird von seinem Amulett zu einem Schrein im Inneren gezogen. Auf dem Vorhof befreien sie einen brennenden Speer aus magischen Ketten, was die Umgebung weiter ausbleichen l\u00e4sst und eine geisterhafte Gestalt beschw\u00f6rt. In der Kapelle finden sie zwei Schreine: einen f\u00fcr die Entit\u00e4t Kol Meref und einen versteckten, verkehrt herum aufgestellten Schrein f\u00fcr Nerash. Valeria l\u00f6scht die Kerze des Nerash-Schreins, woraufhin eine m\u00e4chtige, in Ketten gelegte Kreatur auf dem Hof erscheint. Die Gruppe analysiert die Situation und kommt zu dem Schluss, dass es sich um einen Konflikt zwischen zwei g\u00f6ttlichen Wesen handelt. Trotz der Warnungen aus Lindo Lauts Amulett entscheiden sie sich, die gefesselte Kreatur zu befreien. Esterossa zerschl\u00e4gt mit dem Speer die Ketten, woraufhin sich die Kreatur als der verschollene Demigott Nerash zu erkennen gibt und die Gruppe vor einem w\u00fctenden Angriff von Kol Meref besch\u00fctzt. Die Gruppe flieht durch ein Portal zur\u00fcck in ihre Welt, wo sie vom Gildenmeister erwartet werden, der ihnen r\u00e4t, \u00fcber das Erlebte zu schweigen. Am Ende findet jeder von ihnen einen kleinen wei\u00dfen Totem von Nerash in seiner Hand.\n\n# Auftretende Entit\u00e4ten\n\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Wird von seinem Amulett stark zu einem Schrein gezogen und h\u00f6rt die Stimmen der darin gefangenen Wesen. Er widersteht der Versuchung der Macht und flieht mit der Gruppe. [00:08:15]\n* [Valeria](/characters/valeria.md) \u2014 L\u00f6scht impulsiv die Kerze am Schrein von Nerash, was die gefesselte Kreatur erscheinen l\u00e4sst. Sie bietet Nerash am Ende spontan ihre Dienste an. [00:46:11]\n* [Cookie](/characters/cookie.md) \u2014 F\u00fchlt sich in der Dimension unwohl und erleidet mehrfach Stress. Sie hebt den Speer auf, was eine Geistererscheinung ausl\u00f6st, und unterst\u00fctzt die Gruppe emotional. [00:26:36]\n* [Esterossa](/characters/esterossa.md) \u2014 Analysiert die religi\u00f6sen Symbole und entwickelt die Theorie \u00fcber den Konflikt der G\u00f6tter. Er ist es, der die entscheidenden Ketten von Nerash mit dem Speer durchtrennt. [00:55:49]\n* [Dodo](/characters/dodo.md) \u2014 Verh\u00e4lt sich vorsichtig und beobachtend. Er schl\u00e4gt vor, die Kreatur anzusprechen, bevor man sie angreift, und unterst\u00fctzt die Entscheidung zur Befreiung. [00:56:56]\n* [Nerash](/npcs/nerash.md) \u2014 Ein verschollener Demigott, der einst f\u00fcr die neuen G\u00f6tter k\u00e4mpfte. Sie war in der Festung in magischen Ketten gefangen und wird von der Gruppe befreit, woraufhin sie ihre Besch\u00fctzer vor Kol Meref verteidigt. [01:14:31]\n* [Kol Meref](/npcs/kol_meref.md) \u2014 Eine gott\u00e4hnliche Entit\u00e4t, die in der oberen Etage der Kapelle verehrt wird und mit Lindo Lauts Amulett in Verbindung steht. Er wird als bedrohlich und fordernd dargestellt und greift die Gruppe an, als Nerash befreit wird. [00:52:18]\n* [Gildenmeister](/npcs/gildenmeister.md) \u2014 Erwartet die Gruppe nach ihrer R\u00fcckkehr am Portal. Er warnt sie eindringlich davor, mit irgendjemandem \u00fcber das Erlebte zu sprechen. [01:23:13]\n* [Die Festung im Abgrund](/locations/die_festung_im_abgrund.md) \u2014 Eine uralte, halb verfallene Festung in einer farblosen Dimension mit schwarzem Wasser und grauem Himmel. Sie beherbergt zwei rivalisierende Schreine und diente als Gef\u00e4ngnis f\u00fcr Nerash. [00:05:34]\n* [Der brennende Speer](/items/der_brennende_speer.md) \u2014 Eine Waffe, die in einem kalten Feuer auf dem Vorhof steckte und von roten, magischen Ketten gehalten wurde. Er wurde von Valeria befreit und sp\u00e4ter von Esterossa benutzt, um Nerashs Ketten zu zerschlagen. [00:18:12]\n* [Lindo Lauts Amulett](/items/lindo_lauts_amulett.md) \u2014 Beherbergt mehrere Stimmen, darunter die von Kol Meref. Es zieht Lindo Laut zum Schrein, reagiert auf die Umgebung und versucht, ihn von der Befreiung Nerashs abzuhalten, indem es ihm Macht anbietet. [00:08:15]\n* [Befreiung von Nerash](/events/befreiung_von_nerash.md) \u2014 Die Gruppe entscheidet sich, die gefesselte Kreatur zu befreien, was sich als der Demigott Nerash herausstellt. Die Befreiung l\u00f6st einen Kampf mit Kol Meref aus, vor dem Nerash die Gruppe besch\u00fctzt, w\u00e4hrend sie durch ein Portal fliehen. [01:14:31]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=XOnHa6CmDbo)", "sessions/2025-07-22": "# Zusammenfassung\n\nDie Helden \u00fcbernachten in der Gildenhauptstadt Ehrenfels, als sie nachts von einem Schrei und verd\u00e4chtigen Ger\u00e4uschen geweckt werden. Sie entdecken vermummte Assassinen der Brabarand-Gilde, die ihr Zimmer pr\u00e4parieren und mit vergifteten Dolchen angreifen wollen. Es kommt zum Kampf im Gasthaus und auf den Stra\u00dfen der Stadt. W\u00e4hrend Lindo Laut und Cookie einige Angreifer im Geb\u00e4ude ausschalten, verfolgen Esterossa und Dodo die Fliehenden nach drau\u00dfen. Cookie wird von einem m\u00e4chtigen Kenku-Hexenmeister mit magischen Angriffen schwer verwundet und f\u00e4llt ohnm\u00e4chtig zu Boden. Lindo Laut kann sie mit Hilfe seines Amuletts und der Macht der darin gefangenen Wesenheiten notd\u00fcrftig heilen. Die Stadtwachen unter Meister Pyrandras greifen ein und durchbrechen eine Dimensionsbarriere, die der Hexenmeister errichtet hat. Gemeinsam gelingt es den Helden, den Hexenmeister zu t\u00f6ten. Der Gildenmeister untersucht die Vorf\u00e4lle und findet heraus, dass ein Kopfgeld auf die Gruppe ausgesetzt wurde. Er warnt Lindo Laut eindringlich vor der wachsenden Macht der drei verbliebenen Seelenst\u00fccke in seinem Amulett und r\u00e4t, das Amulett au\u00dferhalb der Stadt loszuwerden, da es der wahre Grund f\u00fcr den Anschlag sei.\n\n# Auftretende Entit\u00e4ten\n\n* [Esterossa](/characters/esterossa.md) \u2014 Ein gefl\u00fcgelter Krieger (Aasimar/Paladin), der im Kampf lachend seine Gegner mit Axt und Blitzen zerschmettert. Er tr\u00e4gt eine Plattenr\u00fcstung und zeigt im Kampf eine Mischung aus Belustigung und t\u00f6dlichem Ernst. [00:09:00]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Ein nobler Feen-Barde, der sensibel auf Ger\u00e4usche reagiert. Er nutzt Unsichtbarkeit, Telepathie und magische Musik, um Gegner einzuschl\u00e4fern oder festzuhalten. Er tr\u00e4gt ein gef\u00e4hrliches Amulett mit drei gefangenen Seelenst\u00fccken. [00:09:28]\n* [Dodo](/characters/dodo.md) \u2014 Ein Halb-Goblin mit Drachenblut, der mit Keule und Schild k\u00e4mpft und Feuer speien kann. Er ist impulsiv und einsch\u00fcchternd im Kampf, nutzt aber auch Taktik wie das \u00d6ffnen von T\u00fcren mit Seilen. [00:10:13]\n* [Cookie](/characters/cookie.md) \u2014 Ein kleines Froschwesen (Grung) mit einem Schnabeltier-Begleiter namens Parry. Sie ist eine geschickte Bogensch\u00fctzin mit Giftpfeilen und Nachtsicht, aufgewachsen im Untergrund. Sie wird im Kampf schwer verwundet und erh\u00e4lt eine bleibende Narbe. [00:10:26]\n* Parry \u2014 Cookies tierischer Begleiter, ein Schnabeltier, das flink, dunkel und gut getarnt ist. Es kann mit einem Giftstachel angreifen und wird im Kampf panisch, verschwindet aber nicht dauerhaft. [00:11:58]\n* [Meister Pyrandras](/npcs/meister_pyrandras.md) \u2014 Ein goldener Dragonborn und hochrangiger W\u00e4chter der Gilde. Er reagiert sofort auf den Alarm, organisiert die Verteidigung und durchbricht mit seiner Magierin die Dimensionsbarriere des Hexenmeisters. [02:06:20]\n* [Der Gildenmeister](/npcs/der_gildenmeister.md) \u2014 Der Anf\u00fchrer der Gilde in Ehrenfels, ein m\u00e4chtiger Magier. Er untersucht den Anschlag, identifiziert das Kopfgeld und warnt Lindo Laut eindringlich vor der Gefahr des Amuletts und der darin gefangenen Seelenst\u00fccke. [02:33:22]\n* [Kenku-Hexenmeister](/npcs/kenku_hexenmeister.md) \u2014 Ein rabenartiger Magier, der die Assassinen anf\u00fchrt. Er nutzt lila Energiestrahlen, Teleportation, Dimensionsbarrieren und magische Tentakeln. Er wird von den Helden und Wachen gemeinsam get\u00f6tet. [01:52:22]\n* [Brabarand-Gilde](/factions/brabarand_gilde.md) \u2014 Eine bekannte Assassinengilde, die f\u00fcr Auftragsmorde angeheuert wird. Ihre Mitglieder nutzen Gifte, Armbr\u00fcste und Dolche. Sie wurden auf die Helden angesetzt, vermutlich wegen des Amuletts. [01:14:50]\n* [Ehrenfels](/locations/ehrenfels.md) \u2014 Die Gildenhauptstadt, hoch oben in einer Bergsenke gelegen. Sie ist in einen reicheren und einen einfacheren Teil geteilt, beherbergt Schmieden, einen Handelsmarkt, eine Kathedrale und ein altes Heiligtum. [00:02:06]\n* [Das Amulett](/items/das_amulett.md) \u2014 Ein m\u00e4chtiges, gef\u00e4hrliches Artefakt, das Lindo Laut tr\u00e4gt. Es enth\u00e4lt die Seelenst\u00fccke von drei (ehemals vier) alten G\u00f6ttern: Koll, Glut und einem weiteren. Es verleiht Macht, aber die Wesen darin werden st\u00e4rker, je weniger es werden. [02:44:20]\n* [Der Teleportationsring](/items/der_teleportationsring.md) \u2014 Ein magischer Ring, der vom toten Kenku-Hexenmeister geborgen wird. Er erlaubt einmal pro kurzer Rast eine Teleportation bis zu 'very far' Reichweite. [02:37:13]\n* [Das alte Heiligtum](/locations/das_alte_heiligtum.md) \u2014 Ein alter Schrein aus der Zeit der alten G\u00f6tter am Ende der Stadt, der inaktiv ist. Er enth\u00e4lt vier Statuen, die die vier Seelenst\u00fccke symbolisieren, die nun in Lindo Lauts Amulett gefangen sind. [00:04:56]\n* [Nerash](/npcs/nerash.md) \u2014 Eine Demig\u00f6ttin, die von den Helden aus einer anderen Dimension befreit wurde. Sie wird als sympathischer als die Wesen im Amulett beschrieben und hat den Helden Totems als Dank gegeben. [02:48:24]\n* [Der Anschlag in der Taverne](/events/der_anschlag_in_der_taverne.md) \u2014 Ein n\u00e4chtlicher \u00dcberfall von Assassinen der Brabarand-Gilde auf die Helden in ihrer Taverne. Der Angriff wird abgewehrt, aber Cookie wird schwer verwundet. Es stellt sich heraus, dass ein Kopfgeld auf die Gruppe ausgesetzt wurde. [00:13:50]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=BRRCUgW4xRo)", "sessions/2025-07-29": "# Zusammenfassung\n\nDie Gruppe erreicht das Fischerdorf Windung, um es vor Angriffen der Kuatau (Fischmenschen) zu verteidigen. Sie treffen auf Leandras und die Dorfvorsteherin Dranara, die von den wiederholten Attacken berichten. W\u00e4hrend der ersten Verteidigungsk\u00e4mpfe entdecken die Charaktere mysteri\u00f6se sternf\u00f6rmige Broschen und ein Amulett, das mit der Magie des Ortes in Verbindung steht. Rotunas und Lindo Laut aktivieren versehentlich ein Portal unter der Kapelle, indem sie das Amulett in einen Brunnen tauchen. Die Situation eskaliert, als die Dorfsoldaten die Gruppe angreifen, aber von Leandras ausgeschaltet werden. Cookie gelingt es, mit einem gefangenen Kuatau zu kommunizieren und einen Dialog mit deren Anf\u00fchrer herzustellen. Es stellt sich heraus, dass die Kuatau von der Sumpfhexe get\u00e4uscht wurden, die ihnen versprach, ihr altes Land zur\u00fcckzugewinnen. Gemeinsam mit dem Kuatau-Priester schlie\u00dfen die Magier der Gruppe das Portal. Die Gruppe handelt einen Frieden aus, evakuiert die \u00fcberlebenden Dorfbewohner auf ihr Schiff und verl\u00e4sst die Insel mit einem mulmigen Gef\u00fchl, da der Kuatau-Anf\u00fchrer pl\u00f6tzlich flie\u00dfend ihre Sprache spricht und die ganze Situation surreal wirkt.\n\n# Auftretende Entit\u00e4ten\n\n* [Nyrella](/characters/nyrella.md) \u2014 Eine Freeborn-Fairy-Rangerin (Spielerin Katha), beastbound mit einem Eisb\u00e4ren-Companion namens Nyruk. Sie hat ein eisiges, mystisches Erscheinungsbild und kann Dornenranken (Vicious Entangle) wirken. [00:00:39]\n* [Nyruk](/characters/nyruk.md) \u2014 Nyrellas Eisb\u00e4ren-Companion. Er k\u00e4mpft an ihrer Seite, br\u00fcllt, um Gegner zu warnen, und kann auf Befehl handeln. [00:00:39]\n* [Cookie](/characters/cookie.md) \u2014 Ein Frosch-\u00e4hnlicher Charakter (Spielerin Celin), der in der vorherigen Session eine Narbe erhalten hat. Er nutzt einen Bogen und hat die F\u00e4higkeit, die Sprache der Natur zu verstehen, was die Kommunikation mit den Kuatau erm\u00f6glicht. [00:02:06]\n* [Rotunas](/characters/rotunas.md) \u2014 Ein gro\u00dfer, magiebegabter Charakter (Spieler Micha), der Eiszapfen (Ice Spike) wirken, T\u00fcren teleportieren und arkane Magie (Arcane Dawn) einsetzen kann. Er ist mit der Gruppe seit den Ereignissen in Breska. [00:06:48]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Ein kleiner, gefl\u00fcgelter Highborn-Charakter (Spieler Tim), der eine Violine spielt, um Verb\u00fcndete zu unterst\u00fctzen, und Feuermagie sowie Heilzauber (Seraph Hope) wirken kann. Er tr\u00e4gt ein eigenes, pochendes Amulett. [00:07:33]\n* [Esterossa](/characters/esterossa.md) \u2014 Ein Lorborn-Charakter (Spieler Basti) in schwerer R\u00fcstung, der sich mit Kultur und Okkultem auskennt. Er findet ein sternf\u00f6rmiges Amulett an der Grabst\u00e4tte und kann Blitze schie\u00dfen. [00:11:56]\n* Leandras \u2014 Ein wissbegieriger Magier, der den Auftrag zur Verteidigung von Windung erteilt hat. Er kann teleportieren, Feuerb\u00e4lle wirken und Schlafzauber einsetzen. Er ist verwirrt von den Ereignissen, respektiert aber die Gruppe. [00:06:37]\n* [Dranara (Asleina/Aslania)](/npcs/dranara_asleina_aslania.md) \u2014 Das neue Oberhaupt des Dorfes Windung, nachdem ihre Eltern, die vorherigen Oberh\u00e4upter, bei den ersten Angriffen get\u00f6tet wurden. Sie ist zun\u00e4chst grimmig, dann eingesch\u00fcchtert und schlie\u00dflich w\u00fctend \u00fcber die Verhandlungen mit den Kuatau. [00:18:13]\n* [Kapit\u00e4n Lobrecht](/npcs/kapitaen_lobrecht.md) \u2014 Der Kapit\u00e4n des Schiffes der Gruppe. Er und seine Begleiterin Miaomani werden w\u00e4hrend des Konflikts von Dorfsoldaten schwer verletzt, aber von Lindo Laut geheilt. [00:04:14]\n* [Miaomani](/npcs/miaomani.md) \u2014 Begleiterin von Kapit\u00e4n Lobrecht, benutzt eine Muskete. Sie wird zusammen mit Lobrecht von Dorfsoldaten angegriffen und schwer verletzt. [00:04:14]\n* [Kuatau (Fischmenschen)](/factions/kuatau_fischmenschen.md) \u2014 Eine Spezies glitschiger, nackter Fischmenschen mit Netzen, Speeren und Fernkampfwaffen. Sie werden von okkulten und magischen Dingen angezogen. Sie greifen Windung an, weil sie von der Sumpfhexe get\u00e4uscht wurden, die ihnen versprach, ihr altes Land zur\u00fcckzugewinnen. [00:10:19]\n* [Kuatau-Priester (Anf\u00fchrer)](/npcs/kuatau_priester_anfuehrer.md) \u2014 Ein gro\u00dfer Kuatau mit einem magischen Stab, der die Angriffe anf\u00fchrt. Er kann Kreaturen in weitere Kuatau verwandeln. Er spricht gebrochen, aber am Ende flie\u00dfend die Sprache der Charaktere. Er hilft, das Portal zu schlie\u00dfen, nachdem er erkennt, dass die Hexe ihn get\u00e4uscht hat. [01:30:10]\n* [Sumpfhexe (die Hack)](/npcs/sumpfhexe_die_hack.md) \u2014 Eine Antagonistin, die sowohl die Kuatau als auch die Gruppe in der Vergangenheit get\u00e4uscht hat. Sie ist verantwortlich f\u00fcr die Angriffe auf Breska und hat die Kuatau mit den Amuletten nach Windung gelockt, um ein Portal zu \u00f6ffnen. [01:34:48]\n* [Windung](/locations/windung.md) \u2014 Ein idyllisches Fischerdorf auf einer Insel, das von den Kuatau angegriffen wird. Unter der Kapelle befindet sich eine alte Mine und ein Brunnen mit blau leuchtendem Wasser, der als Energiequelle f\u00fcr magische Kristalle diente. [00:04:14]\n* [Kapelle von Windung](/locations/kapelle_von_windung.md) \u2014 Das zentrale Verteidigungsziel des Dorfes. Sie beherbergt die Dorfbewohner und einen Schrein f\u00fcr die get\u00f6teten ehemaligen Oberh\u00e4upter. Unter ihr befindet sich der Zugang zur Mine und zum magischen Brunnen. [00:06:49]\n* [Sternf\u00f6rmige Brosche/Amulett](/items/sternfoermige_brosche_amulett.md) \u2014 F\u00fcnf magische Artefakte (ein gro\u00dfer Stern und vier kleinere Broschen), die von einem wohlhabenden Gast an die Dorfbewohner verteilt wurden. Sie sind mit der Magie des Ortes verbunden. Eines wurde von Esterossa an der Grabst\u00e4tte gefunden und von Rotunas im Brunnen aufgel\u00f6st, was ein Portal \u00f6ffnete. [00:26:46]\n* [Portal unter der Kapelle](/events/portal_unter_der_kapelle.md) \u2014 Ein magisches Portal, das sich \u00f6ffnete, nachdem Rotunas das sternf\u00f6rmige Amulett in den Brunnen getaucht hatte. Es lie\u00df Pilze wachsen und wurde von Rotunas, Lindo Laut und dem Kuatau-Priester gemeinsam wieder geschlossen. [01:21:48]\n* [Verrat der Dorfsoldaten](/events/verrat_der_dorfsoldaten.md) \u2014 Die Soldaten des Dorfes, angef\u00fchrt von Dranara, griffen die Gruppe und ihre Verb\u00fcndeten (Lobrecht, Miaomani) an, nachdem die Gruppe begonnen hatte, mit den Kuatau zu verhandeln und das Geheimnis des Brunnens zu untersuchen. Leandras schaltete Dranara mit einem Schlafzauber aus. [01:22:48]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=XXgO5Ht4Q0A)", "sessions/2025-08-05": "# Zusammenfassung\n\nDie Heldengruppe, bestehend aus Dodo, Nyrella, Cookie, Rotunas, Lindo Laut und Esterossa, g\u00f6nnt sich eine Auszeit von offiziellen Gildenmissionen und verbringt einen entspannten Abend in einer Taverne. Die Session beginnt mit technischen Schwierigkeiten und der Begr\u00fc\u00dfung der gro\u00dfen Spielrunde durch den Spielleiter Deniz. Es wird klargestellt, dass es sich um keine offizielle Mission handelt, sondern um eine Gelegenheit zum Geschichtenerz\u00e4hlen und Erkunden. Die Charaktere k\u00f6nnen die Taverne erkunden und mit den Anwesenden ins Gespr\u00e4ch kommen. Das Transkript endet jedoch bereits nach dieser Einleitung und den technischen Problemen, bevor ein Spielgeschehen in der Spielwelt einsetzt.\n\n# Auftretende Entit\u00e4ten\n\n* [Dodo](/characters/dodo.md) \u2014 Ein Spielercharakter, gespielt von Marco. Er ist Teil der Heldengruppe, die den Tavernenabend verbringt. [00:01:00]\n* [Nyrella](/characters/nyrella.md) \u2014 Ein Spielercharakter, gespielt von Katha. Sie ist Teil der Heldengruppe, die den Tavernenabend verbringt. [00:01:00]\n* [Cookie](/characters/cookie.md) \u2014 Ein Spielercharakter, gespielt von Celin. Sie ist Teil der Heldengruppe, die den Tavernenabend verbringt. [00:01:00]\n* [Rotunas](/characters/rotunas.md) \u2014 Ein Spielercharakter, gespielt von Micha. Der Name wurde zu Beginn der Session korrigiert, da er zuvor falsch aufgeschrieben war. [00:01:14]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Ein Spielercharakter, gespielt von Tim. Er ist Teil der Heldengruppe, die den Tavernenabend verbringt. [00:01:29]\n* [Esterossa](/characters/esterossa.md) \u2014 Ein Spielercharakter, gespielt von Basti. Sie ist Teil der Heldengruppe, die den Tavernenabend verbringt. [00:01:29]\n* [Taverne](/locations/taverne.md) \u2014 Der Haupthandlungsort dieser Session. Die Heldengruppe besucht sie f\u00fcr einen entspannten Abend abseits der Gildenmissionen. Sie bietet Gelegenheit zum Erkunden und f\u00fcr Gespr\u00e4che. [00:01:29]\n* [Dwarfmaster Gilde](/factions/dwarfmaster_gilde.md) \u2014 Die Gilde, der die Heldengruppe angeh\u00f6rt. Diese Session ist explizit keine offizielle Mission der Gilde, wie im Titel und vom Spielleiter erw\u00e4hnt. [00:01:29]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=cRNIWJz_ATo)", "sessions/2025-08-12": "# Zusammenfassung\n\nDie Gruppe 'Rotunas Freunde' erreicht einen d\u00fcsteren Berg, um einen alten Tempel zu erkunden. Esterossa wird beim Auskundschaften von einer geisterhaften Gestalt entdeckt und st\u00fcrzt schwer ab, wird aber von Cookie geheilt. Sie treffen auf ein Lager alter, abgemagerter Nomaden unter der F\u00fchrung von Hendrik, die einen alten Dialekt sprechen und sehr misstrauisch sind. Ein geisterhaftes Kind erscheint, das Hendrik als 'Hass-Spirit' bezeichnet und vor dem er warnt. In der Nacht wird die Gruppe von Ghulen angegriffen, die sie jedoch mit vereinten Kr\u00e4ften und Magie besiegen k\u00f6nnen. Esterossa erkundet heimlich eine H\u00f6hle und entdeckt Zombies sowie ein Geb\u00e4ude. Am n\u00e4chsten Morgen erfahren sie, dass die Nomaden Anh\u00e4nger des alten Gottes Seras sind. Die Gruppe zieht weiter, \u00fcberquert gef\u00e4hrliche Br\u00fccken und erreicht ein okkultes Lager mit einem Opferaltar. Lindo Lauts Amulett wird st\u00e4rker und die Stimmen darin dr\u00e4ngen ihn, ein Opfer darzubringen, um ihre Macht zu mehren.\n\n# Auftretende Entit\u00e4ten\n\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Spielercharakter, ein Elf und Magiewirker. Wirkt Unsichtbarkeit auf Esterossa, kommuniziert mit seinem Amulett und wird von den Stimmen darin zu einem Opfer gedr\u00e4ngt. [00:00:00]\n* [Esterossa](/characters/esterossa.md) \u2014 Spielercharakter, ein gefl\u00fcgelter Seraph. Wird von einer Geistergestalt zum Absturz gebracht, erkundet unsichtbar das Lager und die H\u00f6hle und stellt sich als religi\u00f6s bewandert vor. [00:00:04]\n* [Cookie](/characters/cookie.md) \u2014 Spielercharakter, Heilerin mit einem Begleiter namens Perry. Heilt Esterossa nach seinem Sturz und wirkt im Kampf Eismagie. [00:00:04]\n* [Nyrella](/characters/nyrella.md) \u2014 Spielercharakter, eine Fee mit einem Eisb\u00e4ren-Begleiter namens Nairog. Ist misstrauisch gegen\u00fcber Hendrik und nutzt Eismagie im Kampf. [00:00:21]\n* [Dodo](/characters/dodo.md) \u2014 Spielercharakter, ein gro\u00dfer Goblin mit Feueratem. Leidet unter einem hoffnungslosen Gef\u00fchl auf der Br\u00fccke und wird von den anderen aufgeheitert. [00:04:51]\n* [Hendrik](/npcs/hendrik.md) \u2014 Anf\u00fchrer des Nomadenlagers, misstrauisch und autorit\u00e4r. Warnt die Gruppe vor dem Hass-Spirit und den Ghulen und verbietet ihnen das Betreten der H\u00f6hle. [00:45:26]\n* [Hass-Spirit (geisterhaftes Kind)](/npcs/hass_spirit_geisterhaftes_kind.md) \u2014 Eine geisterhafte Kreatur in Gestalt eines Kindes, die im Lager erscheint. Hendrik zufolge n\u00e4hrt sie sich von Aufmerksamkeit und bringt Ungl\u00fcck. [01:00:01]\n* [Geisterhafte W\u00e4chtergestalt](/npcs/geisterhafte_waechtergestalt.md) \u2014 Eine astrale Gestalt mit Kronenansatz, die den Weg \u00fcberwacht. Kann Unsichtbares sehen und brachte Esterossa zum Absturz. [00:16:42]\n* [Seras](/npcs/seras.md) \u2014 Ein alter Gott, auch 'Herr der Flammen' genannt. Die Nomaden sind seine Anh\u00e4nger, was sie aus Angst vor Verfolgung verheimlichen. [01:42:58]\n* Perry \u2014 Cookies tierischer Begleiter, der sich im Kampf heldenhaft vor sie wirft und einen Ghul mit seinem Giftstachel angreift. [01:07:32]\n* [Nairog](/npcs/nairog.md) \u2014 Nyrellas Eisb\u00e4r-Begleiter, der als Seelentier beschrieben wird und bei den Nomaden f\u00fcr Erschrecken sorgt. [00:43:45]\n* [T-Rex (Stimme im Amulett)](/npcs/t_rex_stimme_im_amulett.md) \u2014 Eine Entit\u00e4t in Lindo Lauts Amulett, die mit ihm kommuniziert. War in fr\u00fcheren Tagen ein Kampfgef\u00e4hrte von Seras. [00:44:57]\n* [Bergpass](/locations/bergpass.md) \u2014 Ein d\u00fcsterer, sturmgepeitschter Berg, auf dem die Gruppe unterwegs ist. Hier befinden sich das Nomadenlager, H\u00f6hlen und ein alter Tempel. [00:06:42]\n* [Nomadenlager](/locations/nomadenlager.md) \u2014 Lager der Anh\u00e4nger von Seras, bestehend aus Zelten und einer H\u00f6hle. Die Bewohner sind abgemagert und sprechen einen alten Dialekt. [00:28:00]\n* [H\u00f6hle](/locations/hoehle.md) \u2014 Eine von Hendrik als tabu erkl\u00e4rte H\u00f6hle im Nomadenlager, in der Esterossa Zombies und ein Geb\u00e4ude entdeckt. [01:33:12]\n* [Okkultes Lager mit Opferaltar](/locations/okkultes_lager_mit_opferaltar.md) \u2014 Ein Lager mit geopferten Personen und einem primitiven Altar, an dem Lindo Lauts Amulett-Stimmen ein Opfer fordern. [01:59:20]\n* [Amulett von Lindo Laut](/items/amulett_von_lindo_laut.md) \u2014 Ein magisches Amulett, das mehrere Wesenheiten beherbergt. Es wird in der N\u00e4he des Tempels st\u00e4rker und die Stimmen dr\u00e4ngen Lindo Laut zu einem Opfer. [00:51:52]\n* [Angriff der Ghule](/events/angriff_der_ghule.md) \u2014 In der Nacht wird die Gruppe von mehreren Ghulen \u00fcberfallen. Die Gruppe kann sie mit Feuer- und Eismagie sowie Nahkampf besiegen. [01:03:37]\n* [Br\u00fccke der Hoffnungslosigkeit](/events/bruecke_der_hoffnungslosigkeit.md) \u2014 Beim \u00dcberqueren einer Br\u00fccke werden mehrere Charaktere von einer l\u00e4hmenden, hoffnungslosen Macht erfasst, die an ihrer Seele zerrt. [01:53:43]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=vHIjua0BZ9Y)", "sessions/2025-08-20": "# Zusammenfassung\n\nDie Gruppe setzt ihren Weg durch die verschneite Berglandschaft fort, wobei Lindo Laut mit den Stimmen in seinem Amulett hadert, die ihn zur Opferung eines Tieres dr\u00e4ngen. Sie begegnen einem zweik\u00f6pfigen Riesen, der sie zun\u00e4chst angreift, aber durch Nyrellas Magie festgesetzt und von Lindo Laut eingesch\u00fcchtert wird. Im Austausch f\u00fcr Essen warnt der Riese sie vor einem Monster, das ein gro\u00dfes Tor bewacht. Die Gruppe entscheidet sich, zuerst den Gipfel zu erklimmen. An einem Brunnen mit einer Statue opfert Lindo Laut sein Blut, woraufhin ein Eimer mit einer dickfl\u00fcssigen Substanz erscheint. Er fischt ein pochendes Herz heraus und bei\u00dft auf Dr\u00e4ngen des Amuletts hinein, was ihn fast ersticken l\u00e4sst. Cookie rettet ihn mit einem geheimnisvollen Trank, woraufhin Lindo Laut mit rot leuchtenden Augen erwacht. Ein geisterhafter W\u00e4chter erscheint und erkl\u00e4rt, sie h\u00e4tten eine g\u00f6ttliche Pr\u00fcfung bestanden, und weist ihnen den Weg zu heiligen Treppen. Oben angekommen, treffen sie auf Kultisten, die Dodo teilweise versteinern. Es stellt sich heraus, dass die Kultisten nicht Tarvok, sondern Varsul (Warzul) dienen, einem Gott, der mit Lindo Lauts Amulett in Verbindung steht.\n\n# Auftretende Entit\u00e4ten\n\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Hadert mit den Stimmen seines Amuletts, die ein Tieropfer fordern. Sch\u00fcchtert den Riesen ein, opfert sein Blut am Brunnen, bei\u00dft in das Herz und \u00fcberlebt dank Cookies Trank. Seine Augen leuchten danach rot und er f\u00fchlt sich m\u00e4chtig. [00:06:02]\n* [Cookie](/characters/cookie.md) \u2014 Spricht Lindo Laut Mut zu und rettet ihm mit einem geheimnisvollen roten Trank eines Alchemisten das Leben, als er nach dem Biss in das Herz zu ersticken droht. [00:56:02]\n* [Esterossa](/characters/esterossa.md) \u2014 Beobachtet die Situation zun\u00e4chst aus der Luft, versucht Lindo Laut zu helfen, als dieser erstickt, und heilt Nyrellas B\u00e4ren Nairuk von Stress. [00:15:14]\n* [Dodo](/characters/dodo.md) \u2014 Gibt dem Riesen H\u00e4hnchenschenkel als Tausch f\u00fcr Informationen. Wird sp\u00e4ter von einem Kultisten teilweise versteinert und ruft die Gruppe zum Angriff. [00:27:33]\n* [Nyrella](/characters/nyrella.md) \u2014 Setzt den zweik\u00f6pfigen Riesen mit 'Vicious Entangle' fest und versucht sp\u00e4ter, Lindo Laut zu helfen, indem sie einen Heiltrank in seinen Mund gie\u00dft. St\u00fctzt eine einsturzgef\u00e4hrdete Br\u00fccke mit Eismagie. [00:21:24]\n* [Zweik\u00f6pfiger Riese](/npcs/zweikoepfiger_riese.md) \u2014 Ein trollartiges Wesen mit zwei K\u00f6pfen, die sich gegenseitig beleidigen. Greift die Gruppe an, wird aber festgesetzt und gibt im Tausch gegen Essen Informationen \u00fcber ein Monster und den Weg zum Altar preis. [00:16:07]\n* [W\u00e4chter des Berges](/npcs/waechter_des_berges.md) \u2014 Eine vermummte, geisterhafte Gestalt, die erscheint, nachdem Lindo Laut die Pr\u00fcfung bestanden hat. Erkl\u00e4rt, dass jeder Kultist diese Pr\u00fcfung durchmacht, und weist den Weg zu den heiligen Treppen. [01:01:25]\n* [Kultisten des Varsul](/npcs/kultisten_des_varsul.md) \u2014 Eine Gruppe von Anh\u00e4ngern des Gottes Varsul (Warzul) nahe dem Gipfel. Sie sp\u00fcren die Pr\u00e4senz der Gruppe, versteinern Dodo teilweise und bereiten einen Kampf vor. [01:18:33]\n* [Schneeberge](/locations/schneeberge.md) \u2014 Eine verschneite, unber\u00fchrte Berglandschaft mit H\u00f6hlen, eingest\u00fcrzten Br\u00fccken und einem Brunnen. Das Gebiet wird von einer dunklen Macht beeinflusst und bei Nacht sehr ungem\u00fctlich. [00:12:20]\n* [Brunnen mit Statue](/locations/brunnen_mit_statue.md) \u2014 Ein funktionsf\u00e4higer Brunnen mit einer Statue, \u00e4hnlich der in der Goblinfestung. Nimmt Blutopfer an und produziert daraufhin eine dickfl\u00fcssige Substanz, die ein pochendes Herz enth\u00e4lt. [00:41:44]\n* [Heilige Treppen / Portal](/locations/heilige_treppen_portal.md) \u2014 Ein altes Steintor mit Treppen, das zum Gipfel des Berges f\u00fchrt. Magie wird durch das Portal nach oben gezogen, und die Gruppe f\u00fchlt ein erdr\u00fcckendes Gef\u00fchl, das jedoch abgewehrt wird. [01:06:44]\n* [Amulett des Lindo Laut](/items/amulett_des_lindo_laut.md) \u2014 Enth\u00e4lt die Stimmen von drei Wesen (darunter Esua), die Lindo Laut zu Opferungen und Macht dr\u00e4ngen. Fordert ihn auf, in das Herz zu bei\u00dfen. Steht in Verbindung mit dem Gott Warzul. [00:07:30]\n* [Pochendes Herz](/items/pochendes_herz.md) \u2014 Ein lebendiges, pochendes Herz, das Lindo Laut aus der Substanz im Brunneneimer fischt. Es bewegt sich in seinen Mund, als er hineinbei\u00dft, und bildet einen Film in seinem Rachen. [00:51:45]\n* [Cookies roter Trank](/items/cookies_roter_trank.md) \u2014 Eine Viole mit einer roten Fl\u00fcssigkeit, die Cookie von einem Alchemisten bekam. Soll widerstandsf\u00e4higer, st\u00e4rker und mutiger machen. L\u00f6st den Film in Lindo Lauts Rachen auf und rettet ihn. [00:56:02]\n* [Tarvok](/factions/tarvok.md) \u2014 Ein alter Gott der Berge, Erdbeben und Best\u00e4ndigkeit, dessen Kapelle das urspr\u00fcngliche Ziel der Gruppe war. Die Kultisten auf dem Gipfel dienen jedoch nicht ihm. [01:12:25]\n* [Varsul / Warzul](/factions/varsul_warzul.md) \u2014 Ein Gott, der in vier Seelen gespalten wurde, die sich in Lindo Lauts Amulett befinden. Die Kultisten auf dem Gipfel sind seine Anh\u00e4nger und nennen ihn Varsurs. [01:26:45]\n* [Pr\u00fcfung des Brunnens](/events/pruefung_des_brunnens.md) \u2014 Eine g\u00f6ttliche Pr\u00fcfung, bei der Lindo Laut in ein Herz bei\u00dft und fast stirbt. Laut dem W\u00e4chter haben alle Kultisten diese Pr\u00fcfung durchgemacht, aber niemand hat ihr je widerstanden. [01:01:25]\n* [Konfrontation mit den Kultisten](/events/konfrontation_mit_den_kultisten.md) \u2014 Die Gruppe wird von Kultisten entdeckt, die Dodo mit einem Versteinerungszauber belegen. Die Situation eskaliert, als die Kultisten den falschen Gott anrufen und Esterossa zum Angriff ruft. [01:19:04]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=-XbO3FLSL_I)", "sessions/2025-09-02": "# Zusammenfassung\n\nDie Gruppe setzt den Kampf gegen die Kultisten fort, die Dodo versteinert haben. Lindo Laut kann einen Kultisten mit einem Tanzzauber belegen, w\u00e4hrend Nyrella und Esterossa angreifen. Der Kultistenanf\u00fchrer beschw\u00f6rt Ghule, die Lindo Laut attackieren, doch eine mysteri\u00f6se Kraft aus einem zuvor getrunkenen Trank verleiht ihm pl\u00f6tzlich St\u00e4rke und l\u00e4sst ihn einen Ghul zerfetzen. Nachdem die Kultisten und Ghule besiegt sind, wird der bewusstlose Anf\u00fchrer gefesselt und verh\u00f6rt, verr\u00e4t aber nichts und wird von Dodo verbrannt. Die Gruppe erkundet die Kapelle und findet Hinweise auf ein Ritual zur Umwidmung des Heiligtums von einem alten Gott zu Varsul. Lindo Laut wird zunehmend von den Stimmen in seinem Amulett (Tyrex und Esua) beeinflusst. In der Krypta unter der Kapelle kommt es zur Konfrontation mit Dormak, einem Diener Varsuls, der Lindo Laut dr\u00e4ngt, sich auf einen Thron zu setzen, um die Macht des Gottes zu empfangen. Eine Armee von Untoten erhebt sich. Im Kampf werden Nyrella und Esterossa schwer verletzt. Lindo Laut, der sich in eine d\u00e4monischere Form verwandelt hat, teleportiert sich auf den Thron und nutzt mit der Hilfe von Tyrex die Macht des Throns, um die b\u00f6sartigen Seelen in seinem Amulett zu vernichten. Dormak flieht. Mit der verbleibenden gottgleichen Kraft w\u00fcnscht sich Lindo Laut die vollst\u00e4ndige Heilung und Wiederbelebung seiner Kameraden, was geschieht. Das Amulett ist nun leer.\n\n# Auftretende Entit\u00e4ten\n\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Spielercharakter, ein Barde. Wird von den Stimmen in seinem Amulett beeinflusst, verwandelt sich kurzzeitig in eine d\u00e4monischere Form und nutzt die Macht des Throns, um seine Kameraden zu retten. [00:06:42]\n* [Dodo](/characters/dodo.md) \u2014 Spielercharakter, ein Krieger. War zu Beginn der Session teilweise versteinert, k\u00e4mpft gegen Kultisten und Ghule und wird sp\u00e4ter durch Lindo Lauts Wunsch geheilt. [00:08:36]\n* [Esterossa](/characters/esterossa.md) \u2014 Spielercharakter, ein Kleriker. Wirkt Schutzzauber auf Dodo, heilt Verb\u00fcndete und wird im finalen Kampf schwer verletzt, aber durch Lindo Lauts Wunsch wiederbelebt. [00:13:34]\n* [Cookie](/characters/cookie.md) \u2014 Spielercharakter, eine Waldl\u00e4uferin mit einem Schnabeltier namens Perry. Nutzt Eisranken, um Gegner festzusetzen, und beteiligt sich am Kampf. [00:24:38]\n* [Nyrella](/characters/nyrella.md) \u2014 Spielercharakter, eine Waldl\u00e4uferin mit einem B\u00e4ren namens Nai Ruk. K\u00e4mpft mit Pfeil und Bogen, wird im finalen Kampf schwer verletzt und durch Lindo Lauts Wunsch geheilt. [00:09:23]\n* Perry \u2014 Cookies Schnabeltier-Begleiter. Lenkt im Kampf einen Ghul ab und \u00fcberlebt die finale Explosion. [00:48:53]\n* [Nai Ruk](/npcs/nai_ruk.md) \u2014 Nyrellas Eisb\u00e4ren-Begleiter. Zeigt im Verlauf der Session Anzeichen von Schmerz und Angst. [01:27:16]\n* [Kultistenanf\u00fchrer (Mage)](/npcs/kultistenanfuehrer_mage.md) \u2014 Ein Kultist, der Dodos Versteinerung verursacht hat und Ghule beschw\u00f6rt. Wird von Esterossa bewusstlos geschlagen, gefesselt und sp\u00e4ter von Dodo verbrannt. [00:08:08]\n* [Dormak](/npcs/dormak.md) \u2014 Ein Diener von Varsul, der in der Krypta erscheint und Lindo Laut dr\u00e4ngt, die Macht des Gottes anzunehmen. Flieht, nachdem Lindo Laut die Seelen im Amulett vernichtet. [01:46:04]\n* [Tyrex](/npcs/tyrex.md) \u2014 Eine Stimme in Lindo Lauts Amulett, die ihm hilft und r\u00e4t. Erm\u00f6glicht Lindo Laut, die Macht des Throns zu nutzen, um die anderen Seelen zu vernichten. [00:21:20]\n* [Esua](/npcs/esua.md) \u2014 Eine b\u00f6sartige Stimme in Lindo Lauts Amulett, die ihn zur Machtergreifung dr\u00e4ngt. Wird zusammen mit Sintra von Tyrex' Kraft vernichtet. [01:20:54]\n* [Sintra](/npcs/sintra.md) \u2014 Eine weitere b\u00f6sartige Stimme in Lindo Lauts Amulett, die zusammen mit Esua vernichtet wird. [02:12:38]\n* [Varsul](/npcs/varsul.md) \u2014 Ein Gott, dem die Kultisten dienen und dessen Macht in der Kapelle pr\u00e4sent ist. Eine Statue von ihm steht in der Krypta. [01:34:11]\n* [Nerash](/npcs/nerash.md) \u2014 Eine G\u00f6ttin, die die Gruppe zuvor befreit hat. Die Gruppe versucht, sie in der Krypta um Hilfe zu bitten, aber die Verbindung wird durch eine st\u00f6rende Macht blockiert. [01:25:28]\n* [Schneegebiet](/locations/schneegebiet.md) \u2014 Das Gebiet, in dem sich das Abenteuer abspielt und in dem sich das alte Heiligtum befindet. [00:03:13]\n* [Altes Heiligtum / Kapelle](/locations/altes_heiligtum_kapelle.md) \u2014 Ein Ort, der urspr\u00fcnglich einem alten Gott (Tavok) geweiht war und nun f\u00fcr Varsul umgewidmet werden soll. Die Gruppe erkundet die Kapelle und die darunterliegende Krypta. [00:03:13]\n* [Krypta](/locations/krypta.md) \u2014 Der Raum unter der Kapelle, in dem sich der Thron, die Statue von Varsul und Gr\u00e4ber befinden. Hier findet der finale Kampf statt. [01:36:21]\n* [Kultisten](/factions/kultisten.md) \u2014 Anh\u00e4nger von Varsul, die das Heiligtum umwidmen wollen. Sie werden im Kampf besiegt. [00:03:13]\n* [Amulett](/items/amulett.md) \u2014 Lindos Amulett, das die Seelen von Tyrex, Esua und Sintra enth\u00e4lt. Nach der Vernichtung der b\u00f6sartigen Seelen f\u00fchlt es sich leer an. [00:59:05]\n* [Zeremonieller Dolch](/items/zeremonieller_dolch.md) \u2014 Ein Dolch, den der Kultistenanf\u00fchrer benutzt und den Cookie nach dem Kampf an sich nimmt. [00:58:41]\n* [Beschw\u00f6rungsbuch](/items/beschwoerungsbuch.md) \u2014 Ein Buch, das der Kultistenanf\u00fchrer bei sich tr\u00e4gt und das Lindo Laut an sich nimmt. [00:53:15]\n* [Totem von Nerash](/items/totem_von_nerash.md) \u2014 Ein Totem, das die Gruppe von Nerash erhalten hat. Sie versuchen, es in der Krypta zu benutzen, um Nerash um Hilfe zu bitten. [01:25:17]\n* [Trank](/items/trank.md) \u2014 Ein Trank, den Lindo Laut vor einiger Zeit getrunken hat und der ihm im Kampf pl\u00f6tzlich d\u00e4monische Kr\u00e4fte verleiht. [00:20:46]\n* [Kampf gegen Kultisten und Ghule](/events/kampf_gegen_kultisten_und_ghule.md) \u2014 Die Gruppe k\u00e4mpft gegen die Kultisten und die von ihnen beschworenen Ghule. Lindo Lauts verborgene Kraft kommt zum Vorschein. [00:06:42]\n* [Verh\u00f6r und Tod des Kultistenanf\u00fchrers](/events/verhoer_und_tod_des_kultistenanfuehrers.md) \u2014 Der gefangene Kultistenanf\u00fchrer wird verh\u00f6rt, verr\u00e4t aber nichts und wird von Dodo bei lebendigem Leib verbrannt. [01:03:21]\n* [Konfrontation mit Dormak und finale Entscheidung](/events/konfrontation_mit_dormak_und_finale_entscheidung.md) \u2014 In der Krypta werden die Helden von Dormak und einer Armee Untoter konfrontiert. Lindo Laut setzt sich auf den Thron und vernichtet die b\u00f6sen Seelen in seinem Amulett, woraufhin Dormak flieht. [01:46:04]\n* [Lindo Lauts Wunsch](/events/lindo_lauts_wunsch.md) \u2014 Mit der gottgleichen Macht des Throns w\u00fcnscht sich Lindo Laut die vollst\u00e4ndige Heilung und Wiederbelebung seiner schwer verletzten Kameraden. [02:15:44]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=TLZOH7TlGhk)", "sessions/2025-09-06": "# Zusammenfassung\n\nDie Helden werden von Vasul, der nun Tyrex' K\u00f6rper beherrscht, in eine d\u00fcstere Zwischenebene teleportiert. Vasul dr\u00e4ngt zur Eile, um eine F\u00e4hre zu finden, bevor andere D\u00e4monen seine R\u00fcckkehr bemerken. Auf dem Weg werden sie von einem rachs\u00fcchtigen D\u00e4mon in Rattengestalt aufgehalten, der einen alten Pakt mit Vasul einfordert. Lindo Laut verbannt ihn kurzzeitig mit Vasuls Kraft. Die Gruppe irrt durch die trostlose Landschaft, widersteht psychischen Angriffen und findet schlie\u00dflich einen Steg. Um Vasul eine physische Form zu geben, opfern sie eine erjagte Kreatur in einem Ritual, woraufhin Vasul in einer neuen Gestalt erscheint und mit der F\u00e4hre in den Nebel entschwindet. Zur\u00fcckgeblieben werden sie erneut von der rachs\u00fcchtigen Ratte konfrontiert, die sie zur Unterzeichnung eines Seelenknechtschaftsvertrags zwingen will. Lindo Laut nutzt erneut Vasuls Kraft und einen magischen Stab, um die Ratte und einen angreifenden Balor zur\u00fcckzuschlagen. Die Gruppe flieht durch ein Portal und findet sich an einem unbekannten Ort wieder, wo sie den m\u00e4chtigen, b\u00f6sen Thron und eine Truhe Gold bergen.\n\n# Auftretende Entit\u00e4ten\n\n* [Vasul](/npcs/vasul.md) \u2014 Ein alter D\u00e4monenf\u00fcrst, der nun Tyrex' K\u00f6rper und Pers\u00f6nlichkeit \u00fcbernommen hat. Er teleportiert die Gruppe in eine Zwischenebene, um seine R\u00fcckkehr zu vollziehen, und verleiht Lindo Laut gro\u00dfe Macht. [00:02:44]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Ein Spielercharakter, der eine besondere Verbindung zu Vasul/Tyrex hat. Er fungiert als Kanal f\u00fcr Vasuls Macht, verbannt einen D\u00e4mon und nutzt einen magischen Stab, um einen Balor zu schw\u00e4chen. [00:02:44]\n* [Esterossa](/characters/esterossa.md) \u2014 Ein Spielercharakter mit Wissen \u00fcber die Unterwelt. Er erinnert sich an die Legende des F\u00e4hrmanns und widersteht erfolgreich den mentalen Einfl\u00fcssen der Zwischenebene. [00:07:00]\n* [Cookie](/characters/cookie.md) \u2014 Eine Spielercharakterin und J\u00e4gerin. Sie sp\u00fcrt Kreaturen auf, die sp\u00e4ter f\u00fcr das Opferritual genutzt werden, und widersteht ebenfalls den Einfl\u00fcssen der Ebene. [00:05:47]\n* [Dodo](/characters/dodo.md) \u2014 Ein Spielercharakter, der eine verst\u00f6rende Vision eines Goblins aus seiner Heimat an einem Baum aufgespie\u00dft sieht und dem Ort misstraut. [00:21:38]\n* [Rachs\u00fcchtiger D\u00e4mon (Ratte)](/npcs/rachsuechtiger_daemon_ratte.md) \u2014 Ein D\u00e4mon, der einen alten Vertrag mit Vasul \u00fcber 10.000 Seelen und Halbg\u00f6tter einfordert. Er wird von Lindo Laut verbannt, kehrt sp\u00e4ter zur\u00fcck und versucht, die Gruppe zur Seelenknechtschaft zu zwingen. [00:12:05]\n* [Balor](/npcs/balor.md) \u2014 Ein gro\u00dfer, balrog\u00e4hnlicher D\u00e4mon, der die Gruppe in der Zwischenebene verfolgt. Er wird durch die Macht von Lindo Lauts Stab geschw\u00e4cht, als dieser die Ratte angreift. [00:29:01]\n* [Zwischenebene (Vorebene des Circle Below)](/locations/zwischenebene_vorebene_des_circle_below.md) \u2014 Eine d\u00fcstere, trostlose Dimension voller verfaulter B\u00e4ume, alter Schlachtfelder und seelenloser Kreaturen. Sie dient als Vorhof zur H\u00f6lle und beherbergt den F\u00e4hrmann. [00:09:10]\n* [F\u00e4hre / F\u00e4hrmann](/locations/faehre_faehrmann.md) \u2014 Ein mystischer Steg und eine F\u00e4hre, die Vasul ben\u00f6tigt, um seinen Platz in der Unterwelt wieder einzunehmen. Es stellt sich heraus, dass Vasul selbst der F\u00e4hrmann oder Herrscher dieser Ebene ist. [00:28:37]\n* [Magischer Stab](/items/magischer_stab.md) \u2014 Ein Artefakt im Besitz von Lindo Laut, das als Portalschl\u00fcssel dient und immense zerst\u00f6rerische Energie gegen D\u00e4monen freisetzen kann. [00:48:52]\n* [Der Thron](/items/der_thron.md) \u2014 Ein m\u00e4chtiger, b\u00f6ser Thron, den die Gruppe aus dem Heiligtum bergen sollte. Er wird durch das Portal transportiert und muss noch untersucht werden. [00:50:04]\n* [Seelenknechtschaftsvertrag](/items/seelenknechtschaftsvertrag.md) \u2014 Ein Vertrag, den der rachs\u00fcchtige D\u00e4mon der Gruppe zur Unterzeichnung vorlegt und der den Verkauf ihrer Seelen bedeutet. [00:46:15]\n* Perry \u2014 Cookies tierischer Begleiter, der nicht mit in die Zwischenebene teleportiert wurde, sondern in der Obhut von Nyrella blieb. [00:05:52]\n* [Nyrella](/characters/nyrella.md) \u2014 Eine Verb\u00fcndete, die auf die Tiere der Gruppe (Perry und Nairo) aufpasst, w\u00e4hrend die Helden in der Zwischenebene sind. [00:05:52]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=vo1xnyLQDJk)", "sessions/2025-09-09": "# Zusammenfassung\n\nDie Gruppe kehrt nach Ehrenfels zur\u00fcck und nimmt eine Mission in Steinbachtal an, einer von Untoten \u00fcberrannten Minenstadt. Nach einem Kampf gegen Zombies und Skelette am Stadttor erkunden sie die zerst\u00f6rte Stadt. Sie treffen auf einen m\u00e4chtigen untoten Minotauren, den sie mit vereinten Kr\u00e4ften besiegen. In der Kathedrale finden sie die letzten \u00dcberlebenden, die Zwerge Brandoran und Meister Grimm, die den Tod des Prinzen Bran betrauern. Von einer untoten Kriegerin erfahren sie, dass die Armee von einem schwarzen Ritter angef\u00fchrt wurde. Die Gruppe \u00fcberzeugt die Zwerge, gemeinsam ein verborgenes Artefakt zu bergen. Unter Zeitdruck, verfolgt von einer Horde Untoter, \u00f6ffnen sie ein magisches Siegel mit dem Namen der Stadt 'Drunbran'. In einer unterirdischen Kammer finden sie den magischen Streitkolben 'Zebrus Zorn', den Rotunas durch einen Spiegel bergen kann. Sie fliehen durch einen engen Tunnel, wobei Dodo fast stecken bleibt, und entkommen knapp dem untoten General, w\u00e4hrend Steinbachtal im Nebel versinkt.\n\n# Auftretende Entit\u00e4ten\n\n* [Steinbachtal](/locations/steinbachtal.md) \u2014 Ein von Untoten \u00fcberranntes Minendorf am Fu\u00dfe des Berges Zebros, umgeben von Wasser. Die Geb\u00e4ude sind gr\u00f6\u00dftenteils intakt, aber von Kampfspuren gezeichnet. [00:07:30]\n* [Ehrenfels](/locations/ehrenfels.md) \u2014 Der Standort der Gilde, von dem aus die Helden ihre Missionen starten. [00:07:30]\n* [Berg Zebros](/locations/berg_zebros.md) \u2014 Ein gro\u00dfer Berg, an dessen Fu\u00df Steinbachtal liegt. Der Berg ist von Wasser umringt. [00:07:30]\n* [Varsul](/npcs/varsul.md) \u2014 Ein Gott, dessen Pers\u00f6nlichkeiten in einer vorherigen Session wiederbelebt bzw. ausgel\u00f6scht wurden. Er gab Lindo Laut einen Zauberstab und hat nun einen eigenen K\u00f6rper. [00:03:53]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Ein NSC, der in der vorherigen Session eine wichtige Rolle bei der Wiederbelebung von Varsul spielte und von diesem einen portalf\u00e4higen Zauberstab erhielt. [00:03:53]\n* [Dodo](/characters/dodo.md) \u2014 Ein Drachen-Goblin-Geborener mit Schild und Keule, der Feuer spucken kann. Er ist widerstandsf\u00e4hig und \u00fcbernimmt oft die Rolle des Frontk\u00e4mpfers. [00:13:16]\n* [Esterossa](/characters/esterossa.md) \u2014 Ein gefl\u00fcgelter Charakter, der Blitze schleudern, Verb\u00fcndete heilen und fliegen kann. Er kann andere Charaktere tragen. [00:17:14]\n* [Rotunas](/characters/rotunas.md) \u2014 Ein riesenhafter Richborn-Zauberer mit magischen Ringen und Runen, der Feuer- und Eiszauber wirkt. Er kann sich teleportieren und magische H\u00e4nde erschaffen. [00:10:34]\n* [Nyrella](/characters/nyrella.md) \u2014 Eine fliegende Pixie-Bogensch\u00fctzin, die Eis- und Wurzelzauber (Entangle) einsetzt. Sie reitet auf einem B\u00e4ren namens Nairog/Nyruk. [00:10:54]\n* [Nairog/Nyruk](/npcs/nairog_nyruk.md) \u2014 Nyrellas B\u00e4rengef\u00e4hrte, der im Kampf unterst\u00fctzt und auf den sie reitet. [00:10:54]\n* [Brandoran](/npcs/brandoran.md) \u2014 Ein zwergischer \u00dcberlebender in Steinbachtal, der zusammen mit Meister Grimm in der Kathedrale ausharrte. Er ist besonnener als Grimm. [01:21:36]\n* [Meister Grimm](/npcs/meister_grimm.md) \u2014 Ein zwergischer \u00dcberlebender, der leicht aufbrausend und misstrauisch ist. Er trauert um den gefallenen Prinzen Bran. [01:21:36]\n* [Prinz Bran](/npcs/prinz_bran.md) \u2014 Ein verstorbener Zwergenprinz, der in der Kathedrale von Steinbachtal begraben wurde. Sein Tod geschah vor wenigen Tagen. [01:23:59]\n* [Schwarzer Ritter](/npcs/schwarzer_ritter.md) \u2014 Der Anf\u00fchrer der Untoten-Armee, der Steinbachtal \u00fcberrannt hat. Er tr\u00e4gt eine m\u00e4chtige R\u00fcstung und ein dunkles Schwert. [01:12:53]\n* [Belorus der Stille](/npcs/belorus_der_stille.md) \u2014 Eine Entit\u00e4t, der die Gruppe durch ihre Aktionen in Steinbachtal einen Streich gespielt zu haben glaubt. M\u00f6glicherweise mit der Untotenarmee verbunden. [01:59:28]\n* [Zebrus Zorn](/items/zebrus_zorn.md) \u2014 Ein magischer Streitkolben, der in einer unterirdischen Kammer in Steinbachtal gefunden wurde. Er kann den Schaden um 1w10 erh\u00f6hen und als Lichtquelle dienen. [02:00:00]\n* [Sprengfalle](/items/sprengfalle.md) \u2014 Eine von den Zwergen im Eingang der Kathedrale angebrachte Falle, um Eindringlinge abzuwehren. [01:15:32]\n* [Schriftrolle mit Totensprechen](/items/schriftrolle_mit_totensprechen.md) \u2014 Eine magische Rolle, die es erm\u00f6glicht, mit einer untoten Leiche zu sprechen. Wurde von einem gr\u00fcnen Blitz auf eine Leiche gelenkt. [01:09:27]\n* [Schlacht um Steinbachtal](/events/schlacht_um_steinbachtal.md) \u2014 Die Stadt wurde vor einiger Zeit von einer Hunderte starken Untotenarmee unter F\u00fchrung eines schwarzen Ritters \u00fcberrannt. Die Bewohner leisteten in der Kathedrale letzten Widerstand. [01:12:31]\n* [Bergung von Zebrus Zorn](/events/bergung_von_zebrus_zorn.md) \u2014 Die Gruppe \u00f6ffnet ein zwergisches Siegel mit dem Stadtnamen 'Drunbran', findet die Waffe in einem magischen Pentagramm und kann sie durch einen Spiegel bergen. [01:37:52]\n* [Flucht aus Steinbachtal](/events/flucht_aus_steinbachtal.md) \u2014 Verfolgt von einem untoten General und einer Horde, fliehen die Helden und die geretteten Zwerge durch einen engen Tunnel aus der Stadt. [01:56:08]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=Zl0qfuI6Goc)", "sessions/2025-09-17": "# Zusammenfassung\n\nDie Gruppe um Rotunas, Dodo, Nyrella und Esterossa kehrt nach Breska zur\u00fcck und wird in der neuen, wohlhabenden Gilde empfangen. Der Gildenmeister Gorak bittet sie, eine Nachricht an ihren eigenen Gildenmeister zu \u00fcberbringen, um eine Zusammenarbeit zu arrangieren. Zus\u00e4tzlich bietet er ihnen eine Aufnahmepr\u00fcfung an: Sie sollen den Anf\u00fchrer eines Fl\u00fcchtlingslagers vor der Stadt beseitigen. Die Gruppe lehnt den Auftrag ab und besucht stattdessen das Lager, wo sie auf den ihnen bekannten Roland treffen. Sie erfahren von der Not der Fl\u00fcchtlinge und beschlie\u00dfen zu helfen. Rotunas \u00fcberzeugt Roland, mit den Fl\u00fcchtlingen zu einem alten Banditenlager aufzubrechen, w\u00e4hrend die Gruppe zur eigenen Gilde eilt, um Unterst\u00fctzung zu holen. Auf dem R\u00fcckweg werden sie von drei Halborks konfrontiert, die denselben Au
