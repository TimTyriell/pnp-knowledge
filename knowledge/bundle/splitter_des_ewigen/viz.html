pf einen Goblin mit seiner Axt m\u00fchelos zerfetzt und auf die Sicherheit des Zwergenlords bedacht ist. [00:01:51]\n* [Loran Silberbart](/npcs/loran_silberbart.md) \u2014 Ein Zwerg, der die Helden an der Festung empf\u00e4ngt und sie durch die Anlage f\u00fchrt. Er begleitet die Gruppe bei den Verhandlungen und verteidigt Lord Harik. [00:05:25]\n* [Krevis](/npcs/krevis.md) \u2014 Der oberste Feldherr und Hauptmann der Zwergenfestung. Er ist grimmig, hasst Goblins und ist strikt gegen jegliche Zugest\u00e4ndnisse an sie. [00:13:53]\n* [Lurk](/npcs/lurk.md) \u2014 Ein intelligenter Goblin-Anf\u00fchrer, der die erste Verhandlungsrunde f\u00fchrt. Er ist misstrauisch und lehnt das Angebot von magischem Erz ab. Am Ende ist er als Einziger nicht vom Friedensschluss \u00fcberzeugt. [00:40:04]\n* [Arik](/npcs/arik.md) \u2014 Ein magisch begabter Goblin in Lurks Gefolge, der jedoch ebenfalls kein Interesse an dem angebotenen magischen Erz zeigt. [00:40:04]\n* [Lord Harik](/npcs/lord_harik.md) \u2014 Der Zwergenf\u00fcrst in prunkvoller R\u00fcstung. Er ist verhandlungsbereiter als sein Hauptmann, will Blutvergie\u00dfen vermeiden und geht das Risiko ein, pers\u00f6nlich mit den Goblins zu verhandeln. [01:00:40]\n* [Der Schamane](/npcs/der_schamane.md) \u2014 Das magiebegabte, uralte Oberhaupt der Goblins. Er ist weise, erkennt den Wert des Zwergenhandwerks und willigt in den Friedensvertrag ein. [01:48:07]\n* [Ehrenfels](/locations/ehrenfels.md) \u2014 Die Stadt, von der die Helden kommen und die stark von den Erzeugnissen der Zwergenmine profitiert. [00:01:29]\n* [Die Zwergenfestung](/locations/die_zwergenfestung.md) \u2014 Eine fast uneinnehmbare Festung in den Bergen mit einer gro\u00dfen Mauer, einer Werkstatt und einem magischen Kristall zur Beheizung. [00:01:29]\n* [Die Minen](/locations/die_minen.md) \u2014 Ein weit verzweigtes, altes Minensystem unter der Festung, reich an magischem Erz, das von Zwergen und Goblins beansprucht wird. Ein unterirdischer Fluss mit einer Br\u00fccke trennt die Reviere. [00:14:40]\n* [Die Br\u00fccke](/locations/die_bruecke.md) \u2014 Eine Br\u00fccke \u00fcber einen Abgrund in den Minen, die die Gebiete der Zwerge und Goblins trennt. Sie ist ein strategisch wichtiger Punkt und Schauplatz der finalen Verhandlung. [01:38:44]\n* [Zwerge](/factions/zwerge.md) \u2014 Die Bewohner der Festung, angef\u00fchrt von Lord Harik und Hauptmann Krevis. Sie sind geschickte Handwerker und Schmiede, die das magische Erz der Minen abbauen und verarbeiten. [00:00:59]\n* [Goblins](/factions/goblins.md) \u2014 Die in den Minen lebenden Gegenspieler der Zwerge. Sie sind zahlreich, werden von einem Schamanen angef\u00fchrt und haben zun\u00e4chst kein Interesse an den Reicht\u00fcmern der Zwerge. [00:14:40]\n* [Magisches Erz](/items/magisches_erz.md) \u2014 Ein wertvoller, energiegeladener Rohstoff aus den Minen, der f\u00fcr magische Artefakte und Waffen genutzt wird. Ein gro\u00dfer Brocken davon wird den Goblins als Teil des Friedensangebots offeriert. [00:09:22]\n* [Goblin-Buch](/items/goblin_buch.md) \u2014 Ein Buch, das Esterossa besitzt und Rotunas nutzt, um w\u00e4hrend der Abenteuers bruchst\u00fcckhaft die Goblin-Sprache zu lernen. [00:21:57]\n* [Friedensschluss zwischen Zwergen und Goblins](/events/friedensschluss_zwischen_zwergen_und_goblins.md) \u2014 Die zentrale diplomatische Errungenschaft der Session. Nach gescheiterten Verhandlungen mit Lurk gelingt es, durch ein Treffen von Lord Harik und dem Schamanen ein Abkommen zu erzielen, das Wissenstransfer im Schmieden gegen Frieden vorsieht. [01:57:39]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=9RzvnnWzV7E)", "sessions/2026-02-11": "# Zusammenfassung\n\nDie Gruppe erkundet den Dungeon unter der Casa de la Cookie, der von einem s\u00fc\u00dflichen, bet\u00e4ubenden Gestank und gef\u00e4hrlichen Gasen erf\u00fcllt ist. Nachdem Dodo fast in einer Grube versinkt und von Nyrella gerettet wird, entdecken Lindo Laut und Nyrella in einer Sackgasse ein Lederb\u00fcndel mit einem silbernen Artefakt und einem Umhang, der das Symbol des alten Gottes Tarvok tr\u00e4gt. Versuche, die stinkenden Pflanzen mit Feuer oder Magie zu zerst\u00f6ren, scheitern und verletzen Dodo. Von der bedr\u00fcckenden Atmosph\u00e4re und den Gefahren zerm\u00fcrbt, beschlie\u00dft die Gruppe den R\u00fcckzug. Zur\u00fcck im Haus untersuchen sie den Altar im Keller, der ebenfalls Tarvok gewidmet ist. In Dodos Taschen-Dimension offenbart Lindo Laut, dass er die Seele von Kronos gefangen h\u00e4lt, woraufhin sein d\u00e4monischer Begleiter Slix die Kontrolle \u00fcbernimmt und die Gruppe bedroht. Ein erbitterter Kampf entbrennt, in dem Dodo und Esterossa angreifen, doch erst Lunaras w\u00fctende Willenskraft zwingt Slix zur\u00fcck und befreit Lindo Laut. Die Gruppe bleibt ersch\u00fcttert und im Zwiespalt zur\u00fcck.\n\n# Auftretende Entit\u00e4ten\n\n* [Casa de la Cookie](/locations/casa_de_la_cookie.md) \u2014 Das von der Gruppe erworbene Anwesen, unter dem sich der erkundete Dungeon befindet. Es wurde zu Ehren einer verstorbenen Mitstreiterin benannt. [00:01:24]\n* [Dungeon unter der Casa de la Cookie](/locations/dungeon_unter_der_casa_de_la_cookie.md) \u2014 Ein tief in die Erde f\u00fchrender, feuchter Dungeon mit Dschungelbewuchs, s\u00fc\u00dflichem Verwesungsgeruch, giftigen Gasen und einem Raum voller aufgestapelter Skelette. [00:01:24]\n* [Tarvok (Der Erdrichter)](/npcs/tarvok_der_erdrichter.md) \u2014 Ein alter, wahrscheinlich nicht mehr existierender Gott, dessen Symbol (ein Granitblock mit Bergspitze) auf einem Umhang gefunden wurde. Ihm ist ein Schrein im Keller des Hauses gewidmet. [00:40:12]\n* [Lunara Velora](/characters/lunara_velora.md) \u2014 Eine Wasserhexe, die versucht, den Dungeon-Pflanzen Wasser zu entziehen (scheitert) und sp\u00e4ter mit ihrer emotionalen Willenskraft den D\u00e4mon Slix aus Lindo Laut vertreibt. [00:03:14]\n* [Dodo](/characters/dodo.md) \u2014 Ein K\u00e4mpfer mit Schild und Streitkolben, der fast in einer Matschgrube ertrinkt, von einem K\u00e4fer attackiert wird und im Kampf gegen den verwandelten Lindo Laut den ersten Schlag f\u00fchrt. [00:01:07]\n* [Esterossa](/characters/esterossa.md) \u2014 Ein Seraph, der das Symbol von Tarvok identifiziert, Dodos Wunde behandelt (mit gemischtem Erfolg) und im finalen Kampf sofort bereit ist, gegen Slix vorzugehen. [00:07:38]\n* [Nyrella](/characters/nyrella.md) \u2014 Eine Fee, die Dodo mit Ranken aus der Grube rettet und am Ende der Session zutiefst ersch\u00fcttert und verunsichert \u00fcber die Enth\u00fcllungen und das Gef\u00fchl, von Fremden umgeben zu sein, reagiert. [00:23:33]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Ein Charakter, der eine d\u00e4monische Seite (Slix) in sich tr\u00e4gt. Er zeigt der Gruppe das gefangene Splitterkalb von Kronos, wird von Slix \u00fcbernommen und schlie\u00dflich von Lunara befreit. [00:10:16]\n* [Slix](/npcs/slix.md) \u2014 Ein d\u00e4monischer Diener, der in Lindo Laut wohnt. Er \u00fcbernimmt die Kontrolle \u00fcber Lindo Laut, nachdem dieser Geheimnisse verr\u00e4t, bedroht die Gruppe und wird von Lunara zur\u00fcckgedr\u00e4ngt. [01:32:51]\n* [Splitterkalb von Kronos](/items/splitterkalb_von_kronos.md) \u2014 Die gefangene Seele von Kronos, die Lindo Laut in seiner Taschen-Dimension aufbewahrt und kontrolliert. Slix nutzt es als Druckmittel gegen die Gruppe. [01:29:25]\n* [Silbernes Artefakt (Ei)](/items/silbernes_artefakt_ei.md) \u2014 Ein silbernes, ei-\u00e4hnliches Objekt, das in einem Lederb\u00fcndel mit dem Tarvok-Umhang im Dungeon gefunden wurde. Seine Funktion ist unbekannt. [00:39:20]\n* [Tarvok-Umhang](/items/tarvok_umhang.md) \u2014 Ein dunkelbrauner Mantel mit dem Symbol von Tarvok, in den das silberne Artefakt eingewickelt war. [00:39:20]\n* [Stinkende Pflanzen/Schw\u00e4mme](/items/stinkende_pflanzen_schwaemme.md) \u2014 Unterirdische Gew\u00e4chse im Dungeon, die einen s\u00fc\u00dflich-bet\u00e4ubenden Geruch verstr\u00f6men und auf Feuer oder Magie mit der Abgabe einer bet\u00e4ubenden Duftwolke reagieren. [00:08:50]\n* [Schrein des Tarvok](/locations/schrein_des_tarvok.md) \u2014 Ein Altar im Keller der Casa de la Cookie, der dem alten Gott Tarvok gewidmet ist und mit dem man m\u00f6glicherweise Erschaffungsmagie wirken kann. [01:18:12]\n* [Taschen-Dimension (Pocket Domain)](/locations/taschen_dimension_pocket_domain.md) \u2014 Ein privater, extravaganter Raum von Dodo, in dem das Splitterkalb aufbewahrt wird und der Schauplatz des finalen Kampfes gegen Slix ist. [01:27:20]\n* [R\u00fcckzug aus dem Dungeon](/events/rueckzug_aus_dem_dungeon.md) \u2014 Die Gruppe entscheidet sich aufgrund der gef\u00e4hrlichen Gase, der bedr\u00fcckenden Atmosph\u00e4re und mangelnder Vorbereitung, die Erkundung des Dungeons abzubrechen und zur Oberfl\u00e4che zur\u00fcckzukehren. [01:14:20]\n* [Konfrontation mit Slix](/events/konfrontation_mit_slix.md) \u2014 Nach Lindo Lauts Enth\u00fcllung \u00fcber Kronos \u00fcbernimmt Slix die Kontrolle, bedroht die Gruppe und wird in einem Kampf von Lunara durch pure Willenskraft besiegt, was die Gruppe zutiefst ersch\u00fcttert zur\u00fcckl\u00e4sst. [01:32:51]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=3C8SD-cyNPM)", "sessions/2026-02-17": "# Zusammenfassung\n\nDie Gruppe, bestehend aus Lindo Laut, Lunara, Dodo und Rotunas, folgt der Einladung des Gildenmeisters Nox nach Crowfin Manor. Dort werden sie von Lionel Magno, dem Verwalter, empfangen und erhalten Zimmer. Nach einem \u00fcppigen Mahl treffen sie auf Nox, der in einer magisch gesch\u00fctzten Umgebung offenbart, dass er Lindo Lauts d\u00e4monischen Mitbewohner Slix (einen Teil von Vasul) \u00fcberwacht hat. Nox diskutiert mit der Gruppe die Bedrohung durch die alten und neuen G\u00f6tter und pr\u00e4sentiert L\u00f6sungsans\u00e4tze: eine Reise nach Abyssalis, um Vasul mit einem von der G\u00f6ttin Nerash erhaltenen Ritual zu zerst\u00f6ren, oder das Studium von Lunaras Runen im Magia Tower. Er bietet magische Handschellen an, um Lindo Lauts Kr\u00e4fte zu unterdr\u00fccken. Als der Schutzzauber nachl\u00e4sst, \u00fcbernimmt Slix die Kontrolle \u00fcber Lindo Laut. Lionel opfert sich, um die Gruppe zu sch\u00fctzen, wird aber von Slix get\u00f6tet. In einem verzweifelten Kampf verbindet Lunara die Welten, Rotunas verliert einen Arm, kann Slix aber schwer verletzen. Lindo Laut gewinnt kurz die Kontrolle zur\u00fcck und legt die magischen Handschellen an, woraufhin er sich zur\u00fcckverwandelt und die Situation entsch\u00e4rft wird.\n\n# Auftretende Entit\u00e4ten\n\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Spielercharakter, der von einem Teil des alten Gottes Vasul (genannt Slix) besessen ist. Erh\u00e4lt magische Handschellen, um seine Kr\u00e4fte zu unterdr\u00fccken, und legt diese am Ende der Session an, um die Kontrolle zur\u00fcckzugewinnen. [00:00:41]\n* [Lunara Velora](/characters/lunara_velora.md) \u2014 Spielercharakterin mit mysteri\u00f6sen Runen am K\u00f6rper, die mit der Splitterwelt in Verbindung stehen. Sie sp\u00fcrt den Schutzzauber des Anwesens und verbindet im Kampf die Welten, um Slix zu schw\u00e4chen. [00:03:53]\n* [Dodo](/characters/dodo.md) \u2014 Spielercharakter, ein Krieger. Er ist misstrauisch gegen\u00fcber Slix, stellt sich im Kampf sch\u00fctzend vor Lunara und besitzt Waffen mit dem Symbol von Zebros. [00:00:01]\n* [Rotunas](/characters/rotunas.md) \u2014 Spielercharakter, ein Magier. Er versucht, die Gruppe vor Slix wegzuteleportieren, scheitert aber. Im Kampf opfert er seinen Arm, um Slix mit einem m\u00e4chtigen Schlag zu verletzen und zu vertreiben. [00:00:01]\n* [Nox](/npcs/nox.md) \u2014 Der Gildenmeister, der die Gruppe nach Crowfin Manor eingeladen hat. Er ist sehr belesen, hat einen Schutzzauber gegen Lindo Lauts d\u00e4monische Kr\u00e4fte entwickelt und diskutiert philosophisch \u00fcber die Rolle der G\u00f6tter. [00:05:28]\n* [Lionel Magno](/npcs/lionel_magno.md) \u2014 Der \u00e4ltere Verwalter von Crowfin Manor. Er f\u00fchrt die Gruppe durch das Haus, erz\u00e4hlt von dessen Geschichte und opfert sich im Kampf gegen Slix, um die Gruppe zu sch\u00fctzen, wird aber get\u00f6tet. [00:14:27]\n* [Slix](/npcs/slix.md) \u2014 Ein Teil des alten Gottes Vasul, der in Lindo Laut wohnt und zeitweise die Kontrolle \u00fcbernimmt. Er ist manipulativ, gewaltt\u00e4tig und auf der Suche nach dem letzten Teil seiner Macht in Ehrenfels. [00:02:18]\n* [Vasul](/npcs/vasul.md) \u2014 Ein alter Gott, dessen Teile in Lindo Laut existieren. Er ist in der Splitterwelt Abyssalis gefangen und versucht, seine volle Macht wiederzuerlangen, was eine existenzielle Bedrohung darstellt. [00:57:10]\n* [Nerash](/npcs/nerash.md) \u2014 Eine neue G\u00f6ttin, die Dodo und Lindo Laut im Traum erschienen ist. Sie gab Dodo eine Schriftrolle mit einem Ritual, um Vasul in Abyssalis zu zerst\u00f6ren. [00:56:42]\n* [Fluffy](/npcs/fluffy.md) \u2014 Ein gro\u00dfer, wolfs\u00e4hnlicher Hund in Crowfin Manor, der sehr anh\u00e4nglich ist und von den Charakteren gestreichelt wird. [00:16:06]\n* [Crowfin Manor](/locations/crowfin_manor.md) \u2014 Eine jahrhundertealte, ehemals k\u00f6nigliche Villa, die jetzt als Gildenhaus dient. Sie ist mit einem m\u00e4chtigen Schutzzauber belegt, der das Betreten ohne Einladung verhindert und Lindo Lauts Verwandlung unterdr\u00fcckt. [00:05:28]\n* [Abyssalis](/locations/abyssalis.md) \u2014 Eine Gef\u00e4ngniswelt f\u00fcr alte G\u00f6tter, auch Splitterwelt genannt. Der Gruppe wird geraten, dorthin zu reisen, um Vasul mit einem Ritual endg\u00fcltig zu zerst\u00f6ren. [00:57:10]\n* [Ehrenfels](/locations/ehrenfels.md) \u2014 Ein Ort, an dem sich der letzte Teil von Vasuls Macht befindet. Slix will dorthin, um seine volle St\u00e4rke zu erlangen, was die Gruppe unbedingt verhindern muss. [00:02:18]\n* [Zebrosia (Schwert des K\u00f6nigs)](/items/zebrosia_schwert_des_koenigs.md) \u2014 Ein legend\u00e4res Schwert, das im Garten von Crowfin Manor in einem Stein steckt. Es soll G\u00f6ttlichkeit spalten k\u00f6nnen, aber jeden Unw\u00fcrdigen zu Asche zerfallen lassen. Es geh\u00f6rte einst K\u00f6nig Zebros. [00:36:37]\n* [Magische Handschellen](/items/magische_handschellen.md) \u2014 G\u00f6ttliche Artefakte, die von Nox angeboten werden. Sie k\u00f6nnen m\u00e4chtige Wesen bannen und alle magischen F\u00e4higkeiten des Tr\u00e4gers unterdr\u00fccken. Lindo Laut legt sie am Ende an, um Slix zu kontrollieren. [01:07:18]\n* [Schriftrolle von Nerash](/items/schriftrolle_von_nerash.md) \u2014 Eine von der G\u00f6ttin Nerash erhaltene Schriftrolle, die ein Ritual beschreibt, um den Teil von Vasul in Lindo Laut zu vertreiben. Das Ritual muss in Abyssalis durchgef\u00fchrt werden. [00:56:42]\n* [Stab von Vasul](/items/stab_von_vasul.md) \u2014 Ein m\u00e4chtiges Artefakt, das die Gruppe besitzt und bereits benutzt hat. Nox vermutet, dass seine Benutzung zur Erschaffung des f\u00fcnften Teils von Vasul (Slix) gef\u00fchrt haben k\u00f6nnte. [01:19:21]\n* [Kampf gegen Slix in Crowfin Manor](/events/kampf_gegen_slix_in_crowfin_manor.md) \u2014 Nachdem der Schutzzauber f\u00e4llt, \u00fcbernimmt Slix die Kontrolle \u00fcber Lindo Laut, t\u00f6tet Lionel und greift die Gruppe an. Lunara verbindet die Welten, Rotunas opfert seinen Arm und Lindo Laut legt die Handschellen an, um Slix zu besiegen. [02:01:52]\n* [Diskussion \u00fcber das Schicksal der G\u00f6tter](/events/diskussion_ueber_das_schicksal_der_goetter.md) \u2014 Nox stellt die provokante These auf, dass die Welt vielleicht gar keine G\u00f6tter brauche, und diskutiert mit der Gruppe die Optionen, die alten oder neuen G\u00f6tter zu unterst\u00fctzen oder einen dritten Weg zu gehen. [00:54:55]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=Z2jlzpoTWVw)", "sessions/2026-02-24": "# Zusammenfassung\n\nDie Gruppe, bestehend aus Dodo, Lunara, Lindo Laut und Nyrella, begibt sich zur Silbergruft, einer alten Mine. Auf dem Weg treffen sie auf Mitglieder der Silberkornbande, die ihnen Informationen \u00fcber die Minenbewohner geben \u2013 giftige, wasserscheue Silberbestien. In der Gruft entdecken sie eine Mimik, die als Silberbarren getarnt ist, und steigen tiefer hinab, wobei sie kaputte Leitern und br\u00fcchige B\u00f6den \u00fcberwinden m\u00fcssen. In den Tiefen der Mine finden sie einen riesigen, von Ranken durchzogenen Silberberg mit lebendig wirkenden Kristallen, die Lunara an Abyssalis erinnern. Sie k\u00e4mpfen gegen mehrere Silberbestien und deren Schatten-Illusionen, bevor sie auf eine Brutst\u00e4tte sto\u00dfen. Nyrella gelingt es, die besch\u00fctzende Mutterbestie zu beruhigen, sodass die Gruppe ein schwebendes Artefakt \u2013 eine Kugel, die Spiegelbilder erzeugt \u2013 bergen kann. Nachdem sie etwas Silber abgebaut und den tieferen Gang gesprengt haben, kehren sie zu den Banditen zur\u00fcck und verschleiern ihre Funde, bevor sie mit diesen den Abend ausklingen lassen.\n\n# Auftretende Entit\u00e4ten\n\n* [Dodo](/characters/dodo.md) \u2014 Der Halbdrachen-Goblin ist ungew\u00f6hnlich gut vorbereitet, besorgt Gegengifte und eine Armbrust f\u00fcr Lindo Laut. Er \u00fcbernimmt im Kampf die Rolle des Verteidigers und f\u00fchrt die Gruppe durch die Mine. [00:02:20]\n* [Lunara Velora](/characters/lunara_velora.md) \u2014 Die mit Runen bedeckte Magierin hat gemischte Gef\u00fchle und versucht, versteckte Runen loszuwerden. Sie nutzt Schattenfeuer im Kampf und hat Flashbacks an Abyssalis, als sie die lebenden Kristalle in der Mine sieht. [00:02:57]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Die Fee wirkt ruhiger und unauff\u00e4lliger als sonst. Er hat seine magischen Kr\u00e4fte und die Verbindung zu einer zweiten Seele in sich eingeschlossen, um seine Freunde zu sch\u00fctzen, und ist nun auf eine Armbrust angewiesen. [00:03:57]\n* [Nyrella](/characters/nyrella.md) \u2014 Die Waldelfe ist distanziert und in sich gekehrt. Ihr Begleiter Nairuk ist extrem misstrauisch gegen\u00fcber der Gruppe, besonders Lindo Laut. Sie kann mit der Natur kommunizieren und beruhigt die Silberbestien-Mutter. [00:05:16]\n* [Nairuk](/npcs/nairuk.md) \u2014 Nairellas tierischer Begleiter, der der Gruppe nach den j\u00fcngsten Vorf\u00e4llen sehr misstrauisch und besch\u00fctzend gegen\u00fcbersteht. Er muss aufgrund seiner Gr\u00f6\u00dfe in der Mine zur\u00fcckbleiben. [00:05:16]\n* [Marus](/npcs/marus.md) \u2014 Der Anf\u00fchrer der in der N\u00e4he der Silbergruft lagernden Silberkornbande. Er ist misstrauisch, aber kooperativ, nachdem die Gruppe ihr Wissen \u00fcber die Bande beweist. [00:44:54]\n* [Silberkornbande](/factions/silberkornbande.md) \u2014 Eine R\u00e4uberbande, deren Mitglieder Harl und Sarina sind. Ein Teil von ihnen kampiert nahe der Silbergruft und hat bereits erfolglos versucht, die Mine zu pl\u00fcndern. [00:39:33]\n* [Silbergruft](/locations/silbergruft.md) \u2014 Eine verlassene, tief in einen Wald eingewachsene Silbermine s\u00fcdlich von Ehrenfels. Sie ist die Heimat giftiger Silberbestien und birgt einen riesigen, unber\u00fchrten Silberberg sowie ein magisches Artefakt. [00:07:51]\n* [Silberbestien](/npcs/silberbestien.md) \u2014 Giftige, herzartige Kreaturen mit Stacheln, die in der Silbergruft leben. Sie sind wasserscheu, k\u00f6nnen Illusionen aus Schatten erzeugen und besch\u00fctzen ihre Brut in den tiefsten Ebenen der Mine. [00:10:31]\n* [Lebende Kristalle](/items/lebende_kristalle.md) \u2014 Ein leuchtendes, silbernes Material in der Mine, das eine eigene Lebensform zu sein scheint und sich langsam bewegt. Es erinnert Lunara an Kreaturen aus Abyssalis und kann zur Herstellung m\u00e4chtiger Waffen gegen Untote genutzt werden. [01:34:05]\n* [Artefakt-Kugel](/items/artefakt_kugel.md) \u2014 Eine tennisballgro\u00dfe, silberne Kugel, die in der Tiefe der Mine schwebt. Nach der Bergung kann Nyrella sie aktivieren, wodurch sie zwei illusion\u00e4re Doppelg\u00e4ngerinnen von sich selbst erschafft. [02:15:26]\n* [Absturz in die Tiefe](/events/absturz_in_die_tiefe.md) \u2014 Lunara tritt auf eine br\u00fcchige Steinplatte und st\u00fcrzt in einen tiefen Spalt, wird aber dank ihres vorbereiteten Knochens und Lindo Lauts Rettung vor dem t\u00f6dlichen Fall bewahrt. [02:01:37]\n* [Konfrontation mit der Brutst\u00e4tte](/events/konfrontation_mit_der_brutstaette.md) \u2014 Die Gruppe entdeckt eine gro\u00dfe Silberbestie, die ihre Jungen besch\u00fctzt. Nyrella gelingt es durch Kommunikation, die Kreatur zu beruhigen und die kampflose Bergung des Artefakts zu erm\u00f6glichen. [02:12:44]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=WOFArbwDDIQ)", "sessions/2026-03-03": "# Zusammenfassung\n\nDie Gruppe kehrt nach Willauch zur\u00fcck, um das Kopfgeld f\u00fcr den get\u00f6teten Schamanen Kronos einzutreiben. Im prunkvollen 'Haus des L\u00f6wen' verhandeln sie mit einer schurkischen Dame und erhalten schlie\u00dflich zwei Truhen und f\u00fcnf S\u00e4cke Gold. Anschlie\u00dfend suchen sie in einer zwielichtigen Taverne den Goblin-Alchemisten Sys Fizik auf, der f\u00fcr Lindo Laut einen teuren Verwandlungstrank herstellen soll. Nach einer unruhigen Nacht in einer Taverne neben der Kirche erhalten sie am n\u00e4chsten Tag Zugang zur streng bewachten Bibliothek. Dort studieren sie B\u00fccher \u00fcber den alten Gott Vorgulta, Fl\u00fcche und magieresistente Materialien. Ein mysteri\u00f6ses Pergament \u00fcber 'Rote Magie' l\u00f6st bei Lindo Laut eine unerkl\u00e4rliche, starke Reaktion aus, was den misstrauischen Bibliothekar Safin Al Barak dazu veranlasst, das Dokument sicher zu verwahren. Eine Woche sp\u00e4ter holen sie den fertigen Trank ab und Lindo Laut verwandelt sich au\u00dferhalb der Stadt in die Katari-Identit\u00e4t 'Pedro die Katze'.\n\n# Auftretende Entit\u00e4ten\n\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Der Barde der Gruppe, der aufgrund seiner Anf\u00e4lligkeit ohne Magie einen Verwandlungstrank sucht. Er reagiert stark auf ein Pergament \u00fcber 'Rote Magie' und nimmt am Ende der Session die neue Identit\u00e4t 'Pedro die Katze' an. [00:03:35]\n* [Lunara Velora](/characters/lunara_velora.md) \u2014 Die Hexe der Gruppe, die ihr Aussehen mit einer Lederr\u00fcstung und \u00fcberschminkten Runen ver\u00e4ndert hat, um unerkannt zu bleiben. Sie sucht in der Bibliothek nach Wissen \u00fcber Bindungs-, Blut- und Schwurmagie. [00:05:43]\n* [Dodo](/characters/dodo.md) \u2014 Der Krieger und 'Champion der Arena', dessen Titel der Gruppe Zugang zur Bibliothek verschafft. Er sucht nach einem Buch \u00fcber Schutz vor Magie und erh\u00e4lt eine Art Schatzkarte f\u00fcr magieresistente Materialien. [00:02:32]\n* [Kronos](/npcs/kronos.md) \u2014 Ein toter, meistgesuchter Schamane und Kultist, f\u00fcr dessen Leiche die Gruppe in Willauch ein hohes Kopfgeld kassiert. Sein Kopf fehlt, was den Preis mindert. [00:02:32]\n* [Haloras](/npcs/haloras.md) \u2014 Ein Ifriti (Dschinn) und Gehilfe der schurkischen Dame im 'Haus des L\u00f6wen'. Er materialisiert die Belohnung f\u00fcr Kronos und bietet an, die Gruppe als Helden auszuh\u00e4ngen. [00:20:30]\n* [Sys Fizik](/npcs/sys_fizik.md) \u2014 Ein zwielichtiger, Zigarre rauchender Goblin-Alchemist in einer Schmuggler-Taverne. Er stellt f\u00fcr Lindo Laut einen Verwandlungstrank her, der fast ein Jahr h\u00e4lt, und verlangt daf\u00fcr zwei Truhen und zwei S\u00e4cke Gold. [00:45:27]\n* [Safin Al Barak](/npcs/safin_al_barak.md) \u2014 Der H\u00fcter der Schriften und Bibliothekar aus Wabarask. Er ist sehr wissbegierig und misstrauisch, beobachtet die Gruppe genau und konfisziert ein Pergament \u00fcber 'Rote Magie', nachdem Lindo Laut seltsam darauf reagiert. [01:16:39]\n* [Pedro die Katze](/characters/pedro_die_katze.md) \u2014 Lindo Lauts neue Identit\u00e4t als kleinw\u00fcchsiger Katari, die er durch den Trank von Sys Fizik annimmt, um seine Anf\u00e4lligkeit ohne Magie zu kaschieren und unerkannt zu bleiben. [01:58:44]\n* [Willauch](/locations/willauch.md) \u2014 Eine wohlhabende und sichere Gro\u00dfstadt, in der die Gruppe das Kopfgeld eintreibt, die Bibliothek besucht und den Verwandlungstrank erwirbt. Sie ist Schauplatz der gesamten Session. [00:07:07]\n* [Haus des L\u00f6wen](/locations/haus_des_loewen.md) \u2014 Ein prunkvolles Etablissement in Willauch, das als eine Art Freudenhaus und zentraler Umschlagplatz f\u00fcr Kopfgeldjagden dient. Hier wird die Belohnung f\u00fcr Kronos ausgehandelt. [00:17:22]\n* [Bibliothek von Willauch](/locations/bibliothek_von_willauch.md) \u2014 Eine von W\u00fcstenw\u00e4chtern bewachte und mit einem magischen Siegel gesch\u00fctzte Bibliothek, die das gesammelte Wissen der Region beherbergt. Sie wird von Safin Al Barak geh\u00fctet. [01:14:07]\n* [Vorgulta](/factions/vorgulta.md) \u2014 Ein alter Gott, bekannt als 'Herr der Tausend Seelen', der im gro\u00dfen Krieg in Abyssalis war. Ein Buch von Tyrael beschreibt ihn wohlwollender als erwartet und gibt Anleitungen zur Seelenmagie. [01:21:46]\n* [Tyrael](/npcs/tyrael.md) \u2014 Der Autor eines Buches \u00fcber Vorgulta. Er war ein Anh\u00e4nger des alten Gottes und hat das Buch \u00fcber einen langen Zeitraum geschrieben. Es enth\u00e4lt unvollst\u00e4ndige Anleitungen zur Seelenmagie. [01:21:46]\n* [Verwandlungstrank](/items/verwandlungstrank.md) \u2014 Ein von Sys Fizik gebrauter Trank, der Lindo Laut f\u00fcr fast ein Jahr in einen kleinw\u00fcchsigen Katari verwandelt. Ein zweiter Trank kann die Wirkung vorzeitig beenden. [00:55:36]\n* [Pergament \u00fcber Rote Magie](/items/pergament_ueber_rote_magie.md) \u2014 Ein uraltes, einzigartiges Dokument in einer unbekannten Sprache, das 'Rote Magie' behandelt. Es l\u00f6st bei Lindo Laut eine starke physische Reaktion aus und wird vom Bibliothekar konfisziert. [01:37:48]\n* [Buch 'Fl\u00fcche und das Schweigen'](/items/buch_flueche_und_das_schweigen.md) \u2014 Ein von Safin Al Barak restauriertes, wertvolles Buch voller Fl\u00fcche, das f\u00fcr eine Hexe perfekt ist. Es enth\u00e4lt unter anderem einen Fluch, der eine Person \u00fcber Zeit in den Wahnsinn treibt. [01:23:57]\n* [Arena-Kampf](/events/arena_kampf.md) \u2014 Ein vergangenes Ereignis, bei dem Dodo und Lindo Laut zu 'Champions der Arena' wurden. Dieser Titel wird genutzt, um Zugang zur Bibliothek zu erhalten. [00:10:09]\n* [Kopfgeld f\u00fcr Kronos](/events/kopfgeld_fuer_kronos.md) \u2014 Die erfolgreiche Aushandlung und Entgegennahme von zwei Truhen und f\u00fcnf S\u00e4cken Gold f\u00fcr die Leiche des Schamanen Kronos im 'Haus des L\u00f6wen'. [00:30:45]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=BRUNuNKTeOg)", "sessions/2026-03-10": "# Zusammenfassung\n\nDie Gilde, verst\u00e4rkt durch den Zwergenkrieger Brim, erreicht das zerst\u00f6rte Breska, das in einem unnat\u00fcrlichen Nebel liegt. Nach einem kurzen Kampf gegen Ghule werden sie von einem namenlosen W\u00e4chter zu Voras gef\u00fchrt. Voras, der Vampirf\u00fcrst, gibt sich zun\u00e4chst erz\u00fcrnt \u00fcber die Zerst\u00f6rung seiner Stadt und die Rolle der Gruppe dabei, enth\u00fcllt dann aber, dass dies eine T\u00e4uschung f\u00fcr die Begleiter von Ser Eulenweiss war. Er hat mit Nox einen Plan geschmiedet und ein Portal in die Splitterwelt vorbereitet. Die Gruppe reist durch das Portal und wird zu den Toren von Abyssalis gef\u00fchrt, wo ihnen die M\u00f6glichkeit er\u00f6ffnet wird, das Tor mit einem Schl\u00fcssel zu \u00f6ffnen, um die darin gefangenen Seelen zu befreien. Ein gef\u00e4hrlicher Kampf gegen eine riesige Schattenkreatur dient als Test, den die Gruppe erfolgreich besteht. Voras ist von ihrer St\u00e4rke \u00fcberzeugt und gibt ihnen seinen Segen f\u00fcr die bevorstehende Mission in Abyssalis.\n\n# Auftretende Entit\u00e4ten\n\n* [Brim](/characters/brim.md) \u2014 Ein zwergischer Krieger (Slayer), der neu zur Gruppe gesto\u00dfen ist. Er beweist im Kampf gegen die Ghule und die Schattenkreatur seine St\u00e4rke und Tapferkeit, ist aber von den Ereignissen und der Splitterwelt sichtlich \u00fcberfordert. [00:00:35]\n* [Lindo Laut (Pedro)](/characters/lindo_laut_pedro.md) \u2014 Ein Spielercharakter, der von Voras als 'das ganze \u00dcbel' bezeichnet wird, da er etwas in sich tr\u00e4gt. Er beruhigt die Gruppe gegen\u00fcber Vampiren, tr\u00f6stet Lunara und stellt Voras kritische Fragen zu dessen Pl\u00e4nen und G\u00f6ttern. [00:10:47]\n* [Lunara Velora](/characters/lunara_velora.md) \u2014 Eine Magierin, deren Schattenmagie gegen die Kreatur in der Splitterwelt wirkungslos ist. Sie offenbart Voras, dass er ihr vor zw\u00f6lf Jahren das Leben rettete und sie ihm als Dank ein Buch gab, was unwissentlich die sp\u00e4teren Katastrophen ausl\u00f6ste. [00:06:57]\n* [Dodo](/characters/dodo.md) \u2014 Ein K\u00e4mpfer, der als Anf\u00fchrer der Gruppe agiert und von den Untoten als 'Trollschlechter' erkannt wird. Er geht allein zu Voras, verhandelt mit ihm und f\u00fchrt im Kampf gegen die Schattenkreatur den entscheidenden Schlag aus. [00:07:37]\n* [Voras](/npcs/voras.md) \u2014 Ein zivilisierter Vampirf\u00fcrst und ehemaliger Besch\u00fctzer von Breska. Er hat durch den Angriff von Belorus alles verloren und arbeitet nun mit Nox zusammen, um der Gruppe den Weg nach Abyssalis zu ebnen. Er hegt einen Groll gegen Lunara wegen des Buches, akzeptiert aber ihre Unwissenheit. [00:04:00]\n* [Ser Eulenweiss](/npcs/ser_eulenweiss.md) \u2014 Ein Ritter der Gilde aus Ehrenfels, der die Gruppe nach Breska begleitet. Er ist misstrauisch gegen\u00fcber Vampiren und wird von Voras vor dem Anwesen zur\u00fcckgelassen, w\u00e4hrend die Gruppe ins Innere gebeten wird. [00:09:38]\n* [Tindrael](/npcs/tindrael.md) \u2014 Einst die rechte Hand des B\u00fcrgermeisters von Breska, nun ein Diener von Voras. Er empf\u00e4ngt Dodo in der Gruft und f\u00fchrt ihn zu seinem Herrn. [00:40:29]\n* [Sandro](/npcs/sandro.md) \u2014 Ein vampirischer Magier in Diensten von Voras, der die Gruppe durch das Portal in die Splitterwelt und zu den Toren von Abyssalis f\u00fchrt. Er k\u00e4mpft an ihrer Seite gegen die Schattenkreatur und wird dabei schwer verletzt. [01:19:56]\n* [Nox](/npcs/nox.md) \u2014 Der Gildenmeister von Ehrenfels, der als emotionslos beschrieben wird. Er hat mit Voras den Plan geschmiedet, das Portal nach Abyssalis zu \u00f6ffnen und die Ringe f\u00fcr Lindo Laut geschmiedet. [00:14:08]\n* [Belorus](/npcs/belorus.md) \u2014 Der untote General von Zebras, der Breska zerst\u00f6rt und fast alle Bewohner get\u00f6tet hat. Er zog sich nach einer \u00dcbereinkunft mit der Gruppe auf seinen Berg zur\u00fcck, aber seine Ghule streifen noch durch die Ruinen. [00:02:00]\n* [Breska](/locations/breska.md) \u2014 Ein ehemaliges Bauerndorf, das zu einer kleinen Festung ausgebaut wurde, aber von Belorus' Armee vollst\u00e4ndig zerst\u00f6rt wurde. Es liegt in einem Tal und ist nun von einem dichten, magischen Nebel umgeben. [00:02:00]\n* [Splitterwelt](/locations/splitterwelt.md) \u2014 Eine fremde, be\u00e4ngstigende Dimension, die durch ein Portal in Voras' Anwesen betreten werden kann. Sie beherbergt umherirrende Seelen und den Weg zu den Toren von Abyssalis. [01:06:30]\n* [Abyssalis](/locations/abyssalis.md) \u2014 Eine Demiplane, die hinter einem gro\u00dfen Tor in der Splitterwelt liegt. Man kann hineingehen, aber ohne den 'Schl\u00fcssel' nicht wieder herauskommen. Sie ist das Ziel der Gruppe, um etwas oder jemanden zu befreien. [01:06:30]\n* [Gilde (Ehrenfels)](/factions/gilde_ehrenfels.md) \u2014 Die Organisation, der die Spielercharaktere angeh\u00f6ren. Ihr Anf\u00fchrer Nox hat den Auftrag gegeben, in Breska nach dem Rechten zu sehen und arbeitet insgeheim mit Voras zusammen. [00:02:00]\n* [Das Buch](/items/das_buch.md) \u2014 Ein Buch, das Lunara vor zw\u00f6lf Jahren Voras als Dank gab. Es konnte lange nicht ge\u00f6ffnet werden, bis ein Hexenartefakt verwendet wurde. Seine \u00d6ffnung f\u00fchrte zum Erwachen von Belorus und der Zerst\u00f6rung Breskas. [01:09:03]\n* [Die Ringe](/items/die_ringe.md) \u2014 Von Nox und Voras geschmiedete Ringe an Lindo Lauts Handgelenken, die einen Weltenwechsel erm\u00f6glichen oder verhindern sollen. Ihr Funktionieren war der Grund f\u00fcr den Testlauf in der Splitterwelt. [01:03:17]\n* [Der Kampf gegen die Schattenkreatur](/events/der_kampf_gegen_die_schattenkreatur.md) \u2014 Ein von Voras und Nox arrangierter Testkampf in der Splitterwelt gegen eine riesige, schattenartige Kreatur mit H\u00f6rnern. Die Gruppe besiegt sie gemeinsam, wobei sich zeigt, dass Schattenmagie wirkungslos ist, und beweist so ihre St\u00e4rke f\u00fcr die Mission in Abyssalis. [01:30:51]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=Kr9_AC2XtOw)", "sessions/2026-03-18": "# Zusammenfassung\n\nDie Gruppe, bestehend aus Dodo, Lunara, Rotunas und dem neuen Zwerg Brim, erreicht die n\u00f6rdliche Handelsstadt Tiefwasser auf dem Weg zu den Orks, um Informationen \u00fcber das gef\u00e4hrliche Gebiet 'Ende' zu sammeln. Auf dem Marktplatz werden sie von der Gildenmitglied Lara angesprochen, die von einem Auftrag gegen ein Piratenlager der 'Silberkerne' berichtet, einer Gruppe, mit der die Helden bereits eine Vorgeschichte haben. In der Taverne 'Zum gr\u00fcnen Sichelmond' erhalten sie von Wirt Hans wichtige Reiseinformationen \u00fcber die Route zu den Orks und werden von einem alten, gebrechlich wirkenden Magier namens Trickler f\u00fcr eine Mission angeworben, was die Gruppe jedoch misstrauisch macht. Auf der Suche nach dem Freibeuter Harald geraten sie in eine zwielichtige Hafenkneipe, wo sie Zeugen eines Kampfes zwischen Harald und Soldaten aus Willauch werden. Als die Situation eskaliert und weitere Soldaten eintreffen, greift Lunara mit einem m\u00e4chtigen, unkontrollierten Zauber ein, der alle Anwesenden kurzzeitig l\u00e4hmt und Harald die Flucht erm\u00f6glicht. Nach der chaotischen Flucht aus der Stadt schl\u00e4gt die Gruppe ein Nachtlager auf, wo ein Bote der 'Silberkerne' sie mit einer Nachricht von HAL erreicht, die sie bittet, einen 'S\u00fcndenbock' zu finden, um die Gruppe von falschen Anschuldigungen zu entlasten. Die Session endet mit der Entscheidung, sich auf die Suche nach dem wahren Schuldigen zu konzentrieren, anstatt direkt zu den Orks weiterzuziehen.\n\n# Auftretende Entit\u00e4ten\n\n* [Brim](/characters/brim.md) \u2014 Ein neu zur Gruppe gesto\u00dfener Zwergenkrieger, der noch keiner Gilde fest beigetreten ist. Er \u00fcbernimmt oft die Initiative in Gespr\u00e4chen, zeigt seine St\u00e4rke und ist pragmatisch. [00:05:39]\n* [Dodo](/characters/dodo.md) \u2014 Ein Mitglied der Gruppe, das nach einem emotionalen Gespr\u00e4ch mit Lindo Laut nachdenklich und w\u00e4hrend der gesamten Session ungew\u00f6hnlich ruhig ist. Er unterst\u00fctzt seine Freunde vorbehaltlos. [00:07:23]\n* [Lunara Velora](/characters/lunara_velora.md) \u2014 Eine Magierin, die aufgrund von Neumond emotional aufgew\u00fchlt und unkonzentriert ist. Sie hat in einer Bibliothek Informationen \u00fcber das 'Ende' gesammelt und setzt in der Kneipenschl\u00e4gerei einen m\u00e4chtigen, unkontrollierten Zauber ein, der mit dem Abyssalis verbunden zu sein scheint. [00:08:11]\n* [Rotunas](/characters/rotunas.md) \u2014 Ein drei Meter gro\u00dfer Riese und Magier, der nach einem Unfall mit einem Freund seinen rechten Unterarm verloren hat und nun eine von Zwergen gefertigte Metallprothese tr\u00e4gt. Er ist misstrauisch gegen\u00fcber dem alten Magier Trickler und schl\u00e4gt vor, den wahren Schuldigen der Anschuldigungen gegen die Silberkerne zu finden. [00:09:52]\n* [Lara](/npcs/lara.md) \u2014 Ein Mitglied der 'Gilde der Schilder' in Tiefwasser. Sie spricht die Gruppe auf dem Marktplatz an, ist von Brims St\u00e4rke beeindruckt und bietet ihnen einen Auftrag gegen ein Lager der 'Silberkerne' an. [00:27:34]\n* [Hans](/npcs/hans.md) \u2014 Ein Tiefling und Barkeeper der Taverne 'Zum gr\u00fcnen Sichelmond'. Er ist freundlich, kennt sich gut in der Region aus und gibt der Gruppe detaillierte Informationen \u00fcber die Route zu den Orks und die Gefahren des Passes. [00:39:43]\n* [Trickler](/npcs/trickler.md) \u2014 Ein extrem alt und gebrechlich wirkender Magier, der die Gruppe in der Taverne anspricht und f\u00fcr eine geheime Mission gegen die 'Silberkerne' anwerben will. Die Gruppe, insbesondere Rotunas, ist ihm gegen\u00fcber misstrauisch. [00:53:48]\n* [Harald](/npcs/harald.md) \u2014 Ein gro\u00dfer Freibeuter-Kapit\u00e4n mit Hut, der fr\u00fcher f\u00fcr Brandau gearbeitet hat. Er verteidigt sich und seine Leute gegen die Anschuldigungen, mit den 'Silberkernen' zu kooperieren, und wird in seiner eigenen Taverne von Soldaten aus Willauch angegriffen. [00:48:39]\n* [Tiefwasser](/locations/tiefwasser.md) \u2014 Eine kleine, aber wichtige n\u00f6rdliche Handelsstadt unter der Kontrolle von Willauch, die als letzte menschliche Grenze vor dem Ork-Gebiet gilt. Sie verf\u00fcgt \u00fcber einen Hafen und ist ein Knotenpunkt f\u00fcr Reisen zu den Sanddorninseln. [00:21:17]\n* [Zum gr\u00fcnen Sichelmond](/locations/zum_gruenen_sichelmond.md) \u2014 Eine gut besuchte und schick eingerichtete Taverne in Tiefwasser, gef\u00fchrt vom Tiefling Hans. Sie dient als Ort f\u00fcr Informationen und das Abendessen der Gruppe. [00:41:42]\n* [Ende](/locations/ende.md) \u2014 Ein gef\u00e4hrliches, instabiles Gebiet im Norden mit einem Vulkan, aus dem noch niemand zur\u00fcckgekehrt ist. Es beherbergt angeblich eine alte Bibliothek, die die Gruppe erreichen will. [00:16:32]\n* [Gilde der Schilder](/factions/gilde_der_schilder.md) \u2014 Eine kleine, aber lukrative Gilde in Tiefwasser, die mit Willauch verb\u00fcndet ist. Ihre Mitglieder, wie Lara, \u00fcbernehmen Auftr\u00e4ge wie das Auskundschaften von Ork-Gebieten oder die Jagd auf die 'Silberkerne'. [00:26:25]\n* [Silberkerne](/factions/silberkerne.md) \u2014 Eine als Verbrecher gebrandmarkte Gruppe, die beschuldigt wird, eine wichtige Person in Willauch ermordet zu haben. Ein Bote von ihnen bittet die Gruppe um Hilfe, einen 'S\u00fcndenbock' zu finden, da sie die Tat abstreiten. [00:34:52]\n* [Metallarm von Rotunas](/items/metallarm_von_rotunas.md) \u2014 Eine von Zwergeningenieuren gefertigte Prothese aus Metall, die Rotunas' verlorenen rechten Unterarm ersetzt. Sie ist kein perfekter Ersatz, erm\u00f6glicht ihm aber, wieder zu agieren. [00:12:34]\n* [Nachricht von HAL](/items/nachricht_von_hal.md) \u2014 Eine kleine Notiz, die ein Bote der 'Silberkerne' der Gruppe \u00fcbergibt. Darauf steht die Botschaft 'findet einen S\u00fcndenbock', unterzeichnet mit 'H-Punkt'. [00:45:04]\n* [Schl\u00e4gerei in Haralds Taverne](/events/schlaegerei_in_haralds_taverne.md) \u2014 Ein Kampf zwischen Harald und Soldaten aus Willauch eskaliert, als Lunara mit einem m\u00e4chtigen, unkontrollierten Zauber eingreift, der alle Anwesenden kurzzeitig l\u00e4hmt und Harald die Flucht erm\u00f6glicht. Dies f\u00fchrt zur Abriegelung der Stadt. [01:20:46]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=HHXxsASLrbQ)"}, "types": ["Character", "Event", "Faction", "Item", "Location", "NPC", "Session", "Unknown"], "palette": {"BigQuery Dataset": "#8b5cf6", "BigQuery Table": "#3b82f6", "Reference": "#10b981"}};
</script>
<script>
(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  // Populate type filter
  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  // Build reverse-link index for backlinks
  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  // Look up node label/type by id
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": "#0f172a",
          "font-size": 11,
          "text-valign": "bottom",
          "text-margin-y": 4,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 1,
          "border-color": "#0f172a",
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": "#f59e0b",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.9,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#f59e0b",
          "target-arrow-color": "#f59e0b",
          "width": 2.5,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.15 },
      },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay =
        (d.label || "").toLowerCase() + " " +
        d.id.toLowerCase() + " " +
        (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      const src = edge.source();
      const tgt = edge.target();
      edge.toggleClass("dim", src.hasClass("dim") || tgt.hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      n.toggleClass("dim", n.data("type") !== t);
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.startsWith("/") && href.endsWith(".md")) {
        const target = href.slice(1, -3);
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // Auto-show the first node (a dataset if available, else first concept)
  const initial =
    bundle.nodes.find((n) => n.data.type === "BigQuery Dataset") ||
    bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();

</script>
