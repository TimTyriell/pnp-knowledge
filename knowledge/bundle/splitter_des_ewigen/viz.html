en_aussenposten": "# Gilden-Au\u00dfenposten\n\nDer Gilden-Au\u00dfenposten ist ein Trainingsgel\u00e4nde der [Dwarfmasters-Gilde](../factions/dwarfmasters_gilde.md), das in einem waldigen Tal liegt. Das Gel\u00e4nde umfasst zwei Ruinen sowie ein zentrales Portal und dient als Schauplatz f\u00fcr das Kampftraining der Gilde.\n\n# Belege\n1. Session 2025-05-27, 00:22:55 \u2013 https://www.youtube.com/watch?v=bamCIB_CkR8", "locations/gildenhauptsitz_ehrenfels": "# Gildenhauptsitz (Ehrenfels)\n\nDer Gildenhauptsitz der Abenteurergilde befindet sich in einem kleinen, gut bewachten Dorf auf einem Berg. Hier wird [Rotuna](../npcs/rotuna.md) medizinisch versorgt.\n\n# Belege\n1. Session 2025-09-23, 00:13:03, https://www.youtube.com/watch?v=DGzfqVigS0g", "locations/goblindorf": "# Goblindorf\n\n## Allgemein\nDas Goblindorf ist eine von Goblins eroberte und besetzte Siedlung, die das Ziel einer Mission darstellt.\n\n## Beschreibung\nDas Dorf liegt in einem sumpfigen Waldgebiet. Es ist mit Palisaden befestigt und besteht aus Zelten sowie einem Hauptgeb\u00e4ude.\n\n## Verbindungen\n- Wird von Goblins kontrolliert und bewohnt.\n\n# Belege\n1. Session 2025-04-01 @ 00:03:52 (https://www.youtube.com/watch?v=LZIuUzc3F18)", "locations/grenzland": "# Grenzland\n\nDas Grenzland ist ein gef\u00e4hrliches Gebiet s\u00fcdlich von [Willau](willau.md). Vor elf Jahren war es der Schauplatz eines gro\u00dfen Krieges. Aus dieser Region stammen viele der Monster, die in der Arena von Willau eingesetzt werden.\n\n# Belege\n1. Session 2025-10-14 @ 01:14:02 (https://www.youtube.com/watch?v=cUtz87UCHu4)", "locations/haus_des_loewen": "# Haus des L\u00f6wen\n\nEin prunkvolles Etablissement in [Willauch](../locations/willauch.md), das eine Doppelfunktion erf\u00fcllt: Es dient sowohl als eine Art Freudenhaus als auch als zentraler Umschlagplatz f\u00fcr Kopfgeldjagden. Hier wurde die Belohnung f\u00fcr [Kronos](../npcs/kronos.md) ausgehandelt.\n\n# Belege\n1. Session 2026-03-03, 00:17:22, https://www.youtube.com/watch?v=BRUNuNKTeOg", "locations/heilige_treppen_portal": "# Heilige Treppen / Portal\n\nEin altes Steintor mit Treppen, das zum Gipfel des Berges f\u00fchrt. Magie wird durch das Portal nach oben gezogen. Die Gruppe f\u00fchlt beim Betreten ein erdr\u00fcckendes Gef\u00fchl, das jedoch abgewehrt wird.\n\n# Belege\n1. Session 2025-08-20 @ 01:06:44 (https://www.youtube.com/watch?v=-XbO3FLSL_I)", "locations/hoehle": "# H\u00f6hle\n\nEine von [Hendrik](../npcs/hendrik.md) als tabu erkl\u00e4rte H\u00f6hle im Nomadenlager. [Esterossa](../npcs/esterossa.md) entdeckte in ihr Zombies und ein Geb\u00e4ude.\n\n# Belege\n1. Session 2025-08-12 @ 01:33:12 (https://www.youtube.com/watch?v=vHIjua0BZ9Y)", "locations/huette_am_berghang": "# H\u00fctte am Berghang\n\nDie H\u00fctte am Berghang ist ein notd\u00fcrftig repariertes Geb\u00e4ude au\u00dferhalb des Fl\u00fcchtlingslagers. Sie dient der Gruppe als Unterschlupf und Ausguck und fungiert w\u00e4hrend ihres Aufenthalts als zentraler R\u00fcckzugsort.\n\n# Belege\n1. Session 2026-01-06, 00:14:46, https://www.youtube.com/watch?v=VGw81seFvbo", "locations/insel_der_kapelle": "# Insel der Kapelle\n\nDie Insel der Kapelle ist eine befestigte Insel, die Schauplatz der K\u00e4mpfe zwischen Gnollen und den Verteidigern ist. Auf der Insel befinden sich eine Ruine, ein provisorisches Lager und eine Kapelle.\n\n# Belege\n1. Session 2025-05-06 @ 00:01:51 (https://www.youtube.com/watch?v=e0v6AFGd4mE)", "locations/kapelle": "# Kapelle\n\nDie Kapelle ist ein religi\u00f6ses Geb\u00e4ude, das das Ziel der Mission der Gruppe darstellt. Sie wird von Gnollen angegriffen. In ihr haben die Priesterin [Auranil](../npcs/auranil.md) und [Baran](../npcs/baran.md) Zuflucht gesucht.\n\n# Belege\n1. Session 2025-05-06, 01:12:00, https://www.youtube.com/watch?v=e0v6AFGd4mE", "locations/kapelle_von_windung": "# Kapelle von Windung\n\nDie Kapelle von Windung ist das zentrale Verteidigungsziel des Dorfes [Windung](../locations/windung.md). Sie dient in Krisenzeiten als Zufluchtsort f\u00fcr die Dorfbewohner und beherbergt einen Schrein, der den get\u00f6teten ehemaligen Oberh\u00e4uptern gewidmet ist.\n\nUnter der Kapelle befindet sich der Zugang zur Mine sowie zum magischen Brunnen.\n\n# Belege\n1. Session 2025-07-29 @ 00:06:49 (https://www.youtube.com/watch?v=XXgO5Ht4Q0A)", "locations/kristallmine": "# Kristallmine\n\nDie Kristallmine ist eine feuchte H\u00f6hle, in der sowohl lila als auch gr\u00fcne Kristalle wachsen. In dieser H\u00f6hle wurde eine Kontrollrune unter einem gro\u00dfen gr\u00fcnen Kristall gefunden.\n\n# Belege\n1. Session 2025-10-07 @ 00:50:11 (https://www.youtube.com/watch?v=qVAF_54S8Vw)", "locations/krypta": "# Krypta\n\nDie Krypta ist ein unterirdischer Raum, der sich direkt unter der Kapelle befindet. Sie ist der Schauplatz des finalen Kampfes.\n\n## Beschreibung\n\nIn der Krypta befinden sich mehrere markante Elemente:\n*   Ein Thron\n*   Eine Statue von [Varsul](../npcs/varsul.md)\n*   Mehrere Gr\u00e4ber\n\n# Belege\n1.  Session 2025-09-02, 01:36:21, https://www.youtube.com/watch?v=TLZOH7TlGhk", "locations/magischer_wald": "# Magischer Wald\n\nDer Magische Wald umgibt den Berg der Gilde und ist von einer sch\u00fctzenden Aura durchdrungen. Diese Aura wehrt Kreaturen der Splitterwelt sowie Untote ab. Die B\u00e4ume des Waldes nehmen die sch\u00fctzende Energie aus dem Wasser des Waldes auf.\n\n# Belege\n1. Session 2025-11-25, 00:24:22, https://www.youtube.com/watch?v=wd5R4fJfngY", "locations/nomadenlager": "# Nomadenlager\n\nDas Nomadenlager ist eine Siedlung der Anh\u00e4nger von [Seras](../npcs/seras.md). Es besteht aus Zelten und einer H\u00f6hle. Die Bewohner des Lagers sind abgemagert und sprechen einen alten Dialekt.\n\n# Belege\n1. Session 2025-08-12 @ 00:28:00 (https://www.youtube.com/watch?v=vHIjua0BZ9Y)", "locations/okkultes_lager_mit_opferaltar": "# Okkultes Lager mit Opferaltar\n\nEin abgelegenes Lager, das Schauplatz eines blutigen Rituals war. Der Ort ist gepr\u00e4gt von einem primitiven Altar und den Leichen geopferter Personen.\n\n## Verbindung zu Lindo Laut\n\nDas Lager steht in direktem Zusammenhang mit [Lindo Laut](../characters/lindo_laut.md). Die Stimmen aus seinem Amulett forderten an diesem Altar ein Opfer.\n\n# Belege\n1. Session 2025-08-12 @ 01:59:20 (https://www.youtube.com/watch?v=vHIjua0BZ9Y)", "locations/orkgebiet_nahe_hartwacht_und_das_ende": "# Orkgebiet (nahe Hartwacht und 'das Ende')\n\nDas Orkgebiet ist eine trockene und karge Region im Norden, in der die Gruppe unterwegs ist. Die Landschaft ist gepr\u00e4gt von Palmen, Felsen und Kakteen.\n\n# Belege\n1. Session 2025-10-07 @ 00:00:03 (https://www.youtube.com/watch?v=qVAF_54S8Vw)", "locations/phipps_turm": "# Phipps' Turm\n\nEin alter, zerbr\u00f6ckelter Turm in der N\u00e4he der Burg, der als Wohnsitz des Gnoms [Phipps](../npcs/phipps.md) dient.\n\n# Belege\n1. Session 2025-04-15 @ 00:09:54 (https://www.youtube.com/watch?v=YCpAz_syjaY)", "locations/raum_der_toten_seraphen": "# Raum der toten Seraphen\n\nEin Raum, der mit den Leichen von [Seraphen](../species/seraphen.md) gef\u00fcllt ist \u2013 engelsgleichen Wesen. Allen toten Seraphen wurde mit einem Werkzeug etwas aus der Stirn entnommen.\n\n# Belege\n1. Session 2025-06-17, 00:52:19, https://www.youtube.com/watch?v=tl76B4V0io8", "locations/ritualplatz": "# Ritualplatz\n\nEin hektisch verlassener Ort im Wald, der offenbar f\u00fcr ein Ritual genutzt wurde. Im Zentrum befindet sich ein gro\u00dfer, brodelnder Kessel, der eine Beschw\u00f6rungsfl\u00fcssigkeit enth\u00e4lt.\n\n# Belege\n1. Session 2025-03-26, 01:15:58, https://www.youtube.com/watch?v=ROCKGeeRUFw", "locations/ruine_aussenposten_fort": "# Ruine (Au\u00dfenposten/Fort)\n\nEine alte, teils gepl\u00fcnderte Ruine, die einst dem Heiligen [Duran](../npcs/duran.md) gewidmet war. Die Gruppe fand hier eine vergiftete Klaue und ein goldenes Amulett.\n\n# Belege\n1. Session 2025-05-06, 00:05:26, https://www.youtube.com/watch?v=e0v6AFGd4mE", "locations/sanddorninseln": "# Sanddorninseln\n\nEine karibisch-tropische Inselgruppe, die das Hauptziel der aktuellen Mission darstellt. Die Hauptinsel zeichnet sich durch Wohlstand aus, ist jedoch von Korruption durchzogen und wird von Dieben und Piraten bewohnt. Eine unnat\u00fcrliche Ausbreitung von Pilzen gibt derzeit Anlass zur Sorge.\n\n# Belege\n1. Session 2025-04-30, 00:04:36, https://www.youtube.com/watch?v=fsCOiSkKKTE", "locations/schiffswrack": "# Schiffswrack\n\nEin altes, schwer besch\u00e4digtes Galeerenschiff, das in der Bucht der Inseln auf Grund gelaufen ist.\n\n## Funde\n\n- Ein nasses Logbuch, das von einer Expedition zu einer Kirche berichtet. Es wurde von [Rotunas](../characters/rotunas.md) entdeckt.\n\n# Belege\n\n1. Session 2025-04-30, 00:19:09, https://www.youtube.com/watch?v=fsCOiSkKKTE", "locations/schneeberge": "# Schneeberge\n\nDie Schneeberge sind eine verschneite, unber\u00fchrte Berglandschaft. Das Gebiet ist gepr\u00e4gt von H\u00f6hlen, eingest\u00fcrzten Br\u00fccken und einem Brunnen. Eine dunkle Macht \u00fcbt ihren Einfluss auf die Region aus, wodurch die N\u00e4chte dort besonders ungem\u00fctlich werden.\n\n# Belege\n1. Session 2025-08-20 @ 00:12:20 (https://www.youtube.com/watch?v=-XbO3FLSL_I)", "locations/schneegebiet": "# Schneegebiet\n\nDas Schneegebiet ist die Region, in der das Abenteuer stattfindet. In diesem Gebiet befindet sich das [alte Heiligtum](altes_heiligtum.md).\n\n# Belege\n1. Session 2025-09-02 @ 00:03:13 (https://www.youtube.com/watch?v=TLZOH7TlGhk)", "locations/schrein_des_schlangengottes": "# Schrein des Schlangengottes\n\nDer Schrein des Schlangengottes ist ein magischer Ort, der von einer geisterhaften, sechsk\u00f6pfigen Schlangenkreatur bewacht wird. Die Kreatur ist in der Lage, mit der Gruppe zu kommunizieren.\n\n## Beschreibung\n\nDer Schrein beherbergt zwei Statuen und leuchtende Kristalle. Von dem Ort geht ein tiefer Basston aus.\n\n## Bewohner\n\n- Eine geisterhafte, sechsk\u00f6pfige Schlangenkreatur, die als W\u00e4chter des Schreins fungiert.\n\n# Belege\n1. Session 2025-06-03 @ 01:34:42 (https://www.youtube.com/watch?v=jtYR4Je0a18)", "locations/schrein_des_tarvok": "# Schrein des Tarvok\n\nEin Altar im Keller der [Casa de la Cookie](casa_de_la_cookie.md), der dem alten Gott [Tarvok](../gods/tarvok.md) gewidmet ist. M\u00f6glicherweise kann man mit diesem Schrein Erschaffungsmagie wirken.\n\n# Belege\n1. Session 2026-02-11, 01:18:12, https://www.youtube.com/watch?v=3C8SD-cyNPM", "locations/schutzhuette": "# Schutzh\u00fctte\n\nDie Schutzh\u00fctte ist ein kleines, verlassenes Geb\u00e4ude auf einem freien Feld. Sie diente fr\u00fcher Reisenden als Schutz vor den Elementen und bot der Gruppe am Ende ihrer Reise Zuflucht vor der K\u00e4lte. Bei ihrer Ankunft fanden sie die H\u00fctte leer vor.\n\n# Belege\n1. Session 2025-11-25, 01:50:33, https://www.youtube.com/watch?v=wd5R4fJfngY", "locations/seelen_netze": "# Seelen-Netze\n\nDie Seelen-Netze sind ein Relikt der alten G\u00f6tter, das sich in einem Bereich befindet, der eigentlich nicht auf der materiellen Ebene existieren sollte. Sie bestehen aus Netzen, die in der Lage sind, Seelen einzufangen.\n\nDie Netze haben eine sch\u00e4dliche Wirkung auf die Seelen der Charaktere, die mit ihnen in Kontakt kommen. Sie verursachen sowohl Stress als auch direkten Schaden an der Seele.\n\n# Belege\n1. Session 2025-06-17, 01:04:03 - https://www.youtube.com/watch?v=tl76B4V0io8", "locations/silbergruft": "# Silbergruft\n\nDie Silbergruft ist eine verlassene Silbermine, die tief in einen Wald eingewachsen s\u00fcdlich von [Ehrenfels](ehrenfels.md) liegt. Sie ist die Heimat giftiger Silberbestien und birgt einen riesigen, unber\u00fchrten Silberberg sowie ein magisches Artefakt.\n\n# Belege\n1. Session 2026-02-24 @ 00:07:51 (https://www.youtube.com/watch?v=WOFArbwDDIQ)", "locations/spinnennest_arena": "# Spinnennest-Arena\n\nDie Spinnennest-Arena ist der zweite Kampfort, den die Gruppe aufsucht. Es handelt sich um ein abgelegenes Gebiet, das von Netzen \u00fcberspannt ist und ein unterirdisches H\u00f6hlensystem beherbergt. Dieses H\u00f6hlensystem wird von der Phasenspinne bewohnt. Die K\u00e4mpfe, die in dieser Arena stattfinden, werden mittels Magie in die Hauptarena \u00fcbertragen.\n\n# Belege\n1. Session 2025-10-21 @ 00:56:18 (https://www.youtube.com/watch?v=sxFhbtwoefA)", "locations/splitterwelt": "# Splitterwelt\n\nDie Splitterwelt ist eine Zwischenwelt oder Paralleldimension, die infolge des Krieges der G\u00f6tter entstanden ist. Sie liegt zwischen den \"Circle Below\" und den \"Hallows Above\" und kann unter bestimmten Umst\u00e4nden mit der realen Welt verschmelzen.\n\n## Eigenschaften\n\n*   **Entstehung:** Durch den Krieg der G\u00f6tter geschaffen.\n*   **Lage:** Zwischen den \"Circle Below\" und den \"Hallows Above\".\n*   **Natur:** Eine fremde und be\u00e4ngstigende Dimension, die umherirrende Seelen beherbergt.\n\n## Zug\u00e4nge\n\n*   Ein Tor zur vergessenen Welt **Abyssalis** (auch Abyssares genannt) befindet sich in der Splitterwelt.\n*   Ein Portal im Anwesen von [Voras](../npcs/voras.md) erm\u00f6glicht den Zugang zur Splitterwelt und von dort aus zu den Toren von Abyssalis.\n\n## Wirkung auf die reale Welt\n\n[Lunara](../npcs/lunara.md) kann mit ihrer Macht die Splitterwelt teilweise mit der realen Welt verschmelzen lassen. In diesem Zustand werden die meisten Untoten vernichtet, was dazu f\u00fchrte, dass [Belorus](../npcs/belorus.md) aufgab.\n\n# Belege\n1. Session 2025-09-30 @ 01:50:02 (https://www.youtube.com/watch?v=bUT7Mc2hjUY)\n2. Session 2026-01-20 @ 01:34:52 (https://www.youtube.com/watch?v=H3ckYdTv4y8)\n3. Session 2026-03-10 @ 01:06:30 (https://www.youtube.com/watch?v=Kr9_AC2XtOw)", "locations/steinbachtal": "# Steinbachtal\n\nEin von Untoten \u00fcberranntes Minendorf am Fu\u00dfe des Berges [Zebros](zebros.md). Die Geb\u00e4ude des Dorfes sind gr\u00f6\u00dftenteils intakt, jedoch von Kampfspuren gezeichnet. Das Dorf ist von Wasser umgeben.\n\n# Belege\n1. Session 2025-09-09, 00:07:30, https://www.youtube.com/watch?v=Zl0qfuI6Goc", "locations/taschen_dimension_pocket_domain": "# Taschen-Dimension (Pocket Domain)\n\nEine private, extravagante Dimension, die [Dodo](../characters/dodo.md) geh\u00f6rt. Sie dient als Aufbewahrungsort f\u00fcr das Splitterkalb und ist der Schauplatz des finalen Kampfes gegen [Slix](../npcs/slix.md).\n\n# Belege\n1. Session 2026-02-11, 01:27:20 \u2013 https://www.youtube.com/watch?v=3C8SD-cyNPM", "locations/taverne": "# Taverne\n\nDie Taverne ist ein zentraler Treffpunkt und Handlungsort, der von der Heldengruppe f\u00fcr entspannte Abende abseits ihrer Gildenmissionen aufgesucht wird. Sie bietet den Charakteren Gelegenheit zum Erkunden der Umgebung und f\u00fcr vertiefende Gespr\u00e4che untereinander.\n\n## Funktion\n\n*   Dient als R\u00fcckzugsort und sozialer Treffpunkt f\u00fcr die Helden.\n*   Erm\u00f6glicht Erkundung und Konversation au\u00dferhalb des offiziellen Gildenkontextes.\n\n# Belege\n1. Session 2025-08-05, 00:01:29, https://www.youtube.com/watch?v=cRNIWJz_ATo", "locations/taverne_in_willau": "# Taverne in Willau\n\nEine magische Taverne in der Stadt Willau, die f\u00fcr ihre ungew\u00f6hnlichen Eigenschaften bekannt ist.\n\n## Besonderheiten\n*   **Magisches Geb\u00e4ude:** Die Taverne selbst ist von Magie durchdrungen.\n*   **Teleportationsf\u00e4higes Personal:** Die Angestellten der Taverne besitzen die F\u00e4higkeit zur Teleportation.\n\n## Verbindungen\n*   In dieser Taverne trifft die Gruppe auf [Lisa](../npcs/lisa.md).\n\n# Belege\n1. Session 2025-10-14, 00:25:04, https://www.youtube.com/watch?v=cUtz87UCHu4", "locations/taverne_kyla": "# Taverne Kyla\n\nDie Taverne Kyla ist ein gro\u00dfes Etablissement auf der Hauptinsel, das von [Baran](../npcs/baran.md) gef\u00fchrt wird. Sie dient als Treffpunkt f\u00fcr Abenteurer und magisch Begabte. In der Taverne befindet sich zudem Barans Forschungslabor.\n\n# Belege\n1. Session 2025-04-30 @ 01:47:25 (https://www.youtube.com/watch?v=fsCOiSkKKTE)", "locations/tiefwasser": "# Tiefwasser\n\nTiefwasser ist eine kleine, aber bedeutende n\u00f6rdliche Handelsstadt. Sie steht unter der Kontrolle von [Willauch](../factions/willauch.md) und gilt als die letzte menschliche Grenze vor dem Ork-Gebiet. Die Stadt verf\u00fcgt \u00fcber einen Hafen und dient als wichtiger Knotenpunkt f\u00fcr Reisen zu den Sanddorninseln.\n\n# Belege\n1. Session 2026-03-18 @ 00:21:17 (https://www.youtube.com/watch?v=HHXxsASLrbQ)", "locations/ueberfallenes_lager": "# \u00dcberfallenes Lager\n\nEin Lagerplatz im Wald, der k\u00fcrzlich von Goblins \u00fcberfallen wurde. Die Gruppe fand hier drei Leichen und einen pl\u00fcndernden Goblin vor.\n\n# Belege\n1. Session 2025-04-01 @ 00:05:06 (https://www.youtube.com/watch?v=LZIuUzc3F18)", "locations/wald": "# Wald\n\nEin tiefes, dicht bewachsenes Waldst\u00fcck, das von Nebel durchzogen und von einer d\u00fcsteren Atmosph\u00e4re gepr\u00e4gt ist. In seinem Inneren verbirgt sich ein verlassener Ritualplatz, der von der Gruppe als Versteck eines Monsters ausgemacht wurde.\n\n# Belege\n1. Session 2025-03-26 @ 01:09:35 (https://www.youtube.com/watch?v=ROCKGeeRUFw)", "locations/wald_nahe_der_huette": "# Wald nahe der H\u00fctte\n\nEin verschneiter und unheimlich stiller Wald, in dem die Gruppe patrouilliert.\n\n## Ereignisse\n\n*   Die Gruppe findet hier eine sich bewegende Statue.\n*   Sie entdecken einen verwundeten Soldaten.\n*   Die Gruppe wird von Untoten und einem Seelenkalb angegriffen.\n\n# Belege\n\n1.  Session 2026-01-06 @ 00:17:17 (https://www.youtube.com/watch?v=VGw81seFvbo)", "locations/willau": "# Willau\n\nWillau ist eine gro\u00dfe, lebendige Stadt im Norden. Sie hat den Konflikt gegen [Brandau](brandau.md) gewonnen und richtet in der Folge ein Turnier aus.\n\nIn Willau fanden die Arena-K\u00e4mpfe statt. Nach dem Sieg \u00fcber [Brandau](brandau.md) mobilisiert die Stadt erneut ihr Milit\u00e4r, um Macht zu demonstrieren.\n\n# Belege\n1. Session 2025-10-14 @ 00:00:32 (https://www.youtube.com/watch?v=cUtz87UCHu4)\n2. Session 2025-11-18 @ 00:56:57 (https://www.youtube.com/watch?v=w__ahowb9p0)", "locations/willauch": "# Willauch\n\nWillauch ist eine wohlhabende und sichere Gro\u00dfstadt. Sie dient der Gruppe als zentraler Anlaufpunkt und ist Schauplatz umfangreicher Aktivit\u00e4ten.\n\n## Bedeutung f\u00fcr die Gruppe\n\nDer Lord von Willauch \u00fcberlie\u00df der Gruppe ein Anwesen als Belohnung f\u00fcr ihren Sieg \u00fcber den Lich.\n\n## Aktivit\u00e4ten der Gruppe\n\nIn Willauch trieb die Gruppe ein Kopfgeld ein, besuchte die Bibliothek und erwarb einen Verwandlungstrank.\n\n# Belege\n1. Session 2025-11-14 @ 00:01:38 (https://www.youtube.com/watch?v=8Khb-Y8XbKY)\n2. Session 2026-03-03 @ 00:07:07 (https://www.youtube.com/watch?v=BRUNuNKTeOg)", "locations/windung": "# Windung\n\nWindung ist ein idyllisches Fischerdorf auf einer Insel, das von den [Kuatau](../factions/kuatau.md) angegriffen wird. Unter der Kapelle des Dorfes befindet sich eine alte Mine sowie ein Brunnen mit blau leuchtendem Wasser, der einst als Energiequelle f\u00fcr magische Kristalle diente.\n\n# Belege\n1. Session 2025-07-29 @ 00:04:14 (https://www.youtube.com/watch?v=XXgO5Ht4Q0A)", "locations/winterlager": "# Winterlager\n\nDas Winterlager ist eine befestigte Siedlung, die \u00fcber den Winter hinweg errichtet wurde und als Zufluchtsort f\u00fcr Fl\u00fcchtlinge und Banditen dient.\n\n## Befestigungen\n*   Graben\n*   Palisaden\n*   Aussichtsturm\n\n## Geb\u00e4ude\n*   Drei Holzh\u00fctten\n\n## Aktuelle Lage\nAm Ende der dokumentierten Session wird das Winterlager von einer Armee Untoter belagert.\n\n# Belege\n1.  Session 2026-01-13, 00:14:58, https://www.youtube.com/watch?v=w4LB1s9_3rs", "locations/zebros": "# Zebros\n\nZebros ist eine kalte, neblige Bergregion, die f\u00fcr ihre Ruinen bekannt ist. Die Siedlung wurde nach einem katastrophalen Einsturz des umliegenden Plateaus von ihren Bewohnern verlassen. Heute wird die Gegend von Untoten und Eisb\u00e4ren heimgesucht.\n\n# Belege\n1. Session 2025-05-14 @ 00:02:15 (https://www.youtube.com/watch?v=5eAEDN5ra-4)", "locations/zum_gruenen_sichelmond": "# Zum gr\u00fcnen Sichelmond\n\nEine gut besuchte und schick eingerichtete Taverne in der Stadt Tiefwasser. Sie wird vom Tiefling [Hans](../npcs/hans.md) gef\u00fchrt. Die Gruppe nutzte die Taverne als Anlaufstelle f\u00fcr Informationen und nahm dort ihr Abendessen ein.\n\n# Belege\n1. Session 2026-03-18, 00:41:42, https://www.youtube.com/watch?v=HHXxsASLrbQ", "locations/zwischenebene_vorebene_des_circle_below": "# Zwischenebene (Vorebene des Circle Below)\n\nDie Zwischenebene ist eine d\u00fcstere, trostlose Dimension, die als Vorhof zur H\u00f6lle dient. Sie fungiert als \u00dcbergangsbereich vor dem eigentlichen Circle Below.\n\n## Erscheinungsbild\n\nDie Landschaft der Zwischenebene ist gepr\u00e4gt von Verfall und Trostlosigkeit. Verfaulte B\u00e4ume s\u00e4umen die Umgebung, und alte Schlachtfelder zeugen von vergangenen Konflikten. Die gesamte Dimension ist von seelenlosen Kreaturen bev\u00f6lkert.\n\n## Bewohner und Funktion\n\nIn dieser Vorebene residiert der [F\u00e4hrmann](../npcs/faehrmann.md), der eine wichtige Rolle beim \u00dcbergang in tiefere Bereiche zu spielen scheint.\n\n# Belege\n\n1. Session 2025-09-06 @ 00:09:10 (https://www.youtube.com/watch?v=vo1xnyLQDJk)", "log": "# Update Log\n\n## 2026-03-18\n* **Session**: [LIVE  PLAY\ud83d\udd34 - Daggerheart \ud83c\udfb2](/sessions/2026-03-18.md)\n\n## 2026-03-10\n* **Session**: [LIVE  PLAY\ud83d\udd34 - Daggerheart \ud83c\udfb2](/sessions/2026-03-10.md)\n\n## 2026-03-03\n* **Session**: [LIVE  PLAY\ud83d\udd34 - Daggerheart \ud83c\udfb2](/sessions/2026-03-03.md)\n\n## 2026-02-24\n* **Session**: [LIVE  PLAY\ud83d\udd34 - Daggerheart \ud83c\udfb2](/sessions/2026-02-24.md)\n\n## 2026-02-17\n* **Session**: [Daggerheart - Crowfen!](/sessions/2026-02-17.md)\n\n## 2026-02-11\n* **Session**: [Daggerheart - Ab in den Dungeon!](/sessions/2026-02-1 ion**: [Daggerheart | Dwarfmaster Gilde im Einsatz | DM: Deniz](/sessions/2025-09-02.md)\n\n## 2025-08-20\n* **Session**: [Daggerheart | Dwarfmaster Gilde im Einsatz | DM: Deniz](/sessions/2025-08-20.md)\n\n## 2025-08-12\n* **Session**: [Daggerheart | Dwarfmaster Gilde im Einsatz | DM: Deniz](/sessions/2025-08-12.md)\n\n## 2025-08-05\n* **Session**: [Daggerheart | Dwarfmaster Gilde im Einsatz | DM: Deniz](/sessions/2025-08-05.md)\n\n## 2025-07-29\n* **Session**: [Daggerheart | Dwarfmaster Gilde im Einsatz | DM: Deniz](/sessions/2025-07-29.md)\n\n## 2025-07-22\n* **Session**: [Daggerheart | Dwarfmaster Gilde im Einsatz | DM: Deniz](/sessions/2025-07-22.md)\n\n## 2025-07-09\n* **Session**: [Daggerheart | Dwarfmaster Gilde im Einsatz | DM: Deniz](/sessions/2025-07-09.md)\n\n## 2025-06-25\n* **Session**: [Daggerheart | Dwarfmaster Gilde im Einsatz | DM: Deniz](/sessions/2025-06-25.md)\n\n## 2025-06-17\n* **Session**: [Daggerheart | Dwarfmaster Gilde im Einsatz | DM: Deniz](/sessions/2025-06-17.md)\n\n## 2025-06-10\n* **Session**: [Daggerheart | Dwarfmaster Gilde im Einsatz | DM: Deniz](/sessions/2025-06-10.md)\n\n## 2025-06-03\n* **Session**: [Daggerheart | Dwarfmaster Gilde im Einsatz | DM: Deniz](/sessions/2025-06-03.md)\n\n## 2025-05-27\n* **Session**: [Daggerheart | Dwarfmaster Gilde im Einsatz | DM: Deniz](/sessions/2025-05-27.md)\n\n## 2025-05-14\n* **Session**: [Daggerheart | Dwarfmaster Gilde im Einsatz | DM: Deniz](/sessions/2025-05-14.md)\n\n## 2025-05-06\n* **Session**: [Daggerheart | Dwarfmaster Gilde im Einsatz | DM: Deniz](/sessions/2025-05-06.md)\n\n## 2025-04-30\n* **Session**: [Daggerheart | Dwarfmaster Gilde im Einsatz | DM: Deniz](/sessions/2025-04-30.md)\n\n## 2025-04-23\n* **Session**: [Daggerheart & Tale Spire | #daggerheart #talespire #ttrpg #vtt](/sessions/2025-04-23.md)\n\n## 2025-04-15\n* **Session**: [Daggerheart & Tale Spire | #daggerheart #talespire #ttrpg #vtt](/sessions/2025-04-15.md)\n\n## 2025-04-09\n* **Session**: [Daggerheart & Tale Spire | #daggerheart #talespire #ttrpg #vtt](/sessions/2025-04-09.md)\n\n## 2025-04-01\n* **Session**: [Daggerheart & Tale Spire | #daggerheart #talespire #ttrpg #vtt](/sessions/2025-04-01.md)\n\n## 2025-03-26\n* **Session**: [Daggerheart & Tale Spire | #daggerheart #talespire #ttrpg #vtt](/sessions/2025-03-26.md)\n", "npcs/adjani": "# Adjani\n\nAdjani ist die Katze von [Esterossa](../npcs/esterossa.md), die zuvor f\u00e4lschlich f\u00fcr einen Kater gehalten und \"G\u00fcnther\" genannt wurde. Sie bleibt bei [Nyrella](../npcs/nyrella.md), um ihr als Botin zu dienen.\n\n# Belege\n1. Session 2025-09-30 @ 01:35:07 (https://www.youtube.com/watch?v=bUT7Mc2hjUY)", "npcs/anton_grosswurz": "# Anton Gro\u00dfwurz\n\nEin gut betuchter Magier und Heiler der Stadt.\n\n## Ereignisse\n\n- **Taverne:** Schl\u00e4ferte einen betrunkenen Gast ein, um eine Eskalation zu verhindern. Er scheint \u00fcber einflussreiche F\u00e4higkeiten zu verf\u00fcgen.\n\n# Belege\n\n1. Session 2025-04-30, 00:46:50, https://www.youtube.com/watch?v=fsCOiSkKKTE", "npcs/arik": "# Arik\n\nArik ist ein magisch begabter Goblin, der zum Gefolge von [Lurk](lurk.md) geh\u00f6rt.\n\n## Pers\u00f6nlichkeit & Verhalten\nArik zeigte, ebenso wie Lurk, kein Interesse an einem angebotenen magischen Erz.\n\n# Belege\n1. Session 2026-01-27 @ 00:40:04 (https://www.youtube.com/watch?v=9RzvnnWzV7E)", "npcs/arus": "# Arus\n\n*Magier, Bruder von [Lia](lia.md)*\n\nArus ist ein Magier und der Bruder von [Lia](lia.md). Gemeinsam mit ihr hat er einen Golem erschaffen. Er bittet die Gruppe um Hilfe bei der Zerst\u00f6rung dieses Golems und warnt sie eindringlich vor den Kristallen.\n\n# Belege\n1. Session 2025-10-07, 00:03:00 \u2013 https://www.youtube.com/watch?v=qVAF_54S8Vw", "npcs/auranie": "# Auranie\n\nAuranie ist eine Priesterin, die aus der Stadt [Breska](../orte/breska.md) vertrieben wurde.\n\n## Hintergrund\n\nSie wurde aus Breska verbannt, nachdem ihre Predigten dort kein Geh\u00f6r mehr fanden.\n\n## Begegnung mit der Gruppe\n\nAuranie wandte sich an die Gruppe und \u00e4u\u00dferte ihre tiefe Besorgnis \u00fcber Breska. Sie bef\u00fcrchtet, dass die Stadt von Untoten \u00fcberrannt worden sein k\u00f6nnte und m\u00f6glicherweise nicht mehr existiert.\n\n# Belege\n\n1. Session 2025-11-18, 01:23:00 \u2013 https://www.youtube.com/watch?v=w__ahowb9p0", "npcs/auranil": "# Auranil\n\nAuranil ist die Priesterin der Kapelle. Sie \u00fcbergibt [Lindo Laut](../characters/lindo_laut.md) das Amulett des Heiligen Duran, um die Flucht zu erm\u00f6glichen. Nach der Rettung zeigt sie sich besorgt \u00fcber die Motive der Angreifer.\n\n# Belege\n1. Session 2025-05-06 @ 01:57:38 (https://www.youtube.com/watch?v=e0v6AFGd4mE)", "npcs/balor": "# Balor\n\nEin gro\u00dfer, balrog\u00e4hnlicher D\u00e4mon, der die Gruppe in der Zwischenebene verfolgt.\n\n## Begegnung in der Zwischenebene\nBalor stellte der Gruppe in der Zwischenebene nach. Als [Lindo Laut](../characters/lindo_laut.md) mit seinem Stab die Ratte angriff, wurde der D\u00e4mon durch die Macht dieses Stabes geschw\u00e4cht.\n\n# Belege\n1. Session 2025-09-06, 00:29:01 \u2013 https://www.youtube.com/watch?v=vo1xnyLQDJk", "npcs/baran": "# Baran\n\nBaran ist der Schankwirt der Taverne [Kyla](../locations/kyla.md) und Besitzer eines magischen Forschungslabors. Er wurde von [Gulrak](gulrak.md) bestohlen. In seinem Besitz befindet sich ein kleiner Schl\u00fcssel, der zu einem alten Labor im Westen f\u00fchrt.\n\nBaran ist ein Druide, der sich in ein Federvieh verwandeln kann. Er flog der Gruppe voraus, um die Kapelle zu verteidigen, und k\u00e4mpfte dort ersch\u00f6pft an der Seite der Verteidiger.\n\n# Belege\n1. Session 2025-04-30 @ 01:48:46 (https://www.youtube.com/watch?v=fsCOiSkKKTE)\n2. Session 2025-05-06 @ 01:18:29 (https://www.youtube.com/watch?v=e0v6AFGd4mE)", "npcs/belorus": "# Belorus\n\nEin dunkler Paladin und untoter General von Zebras, der als Anf\u00fchrer einer untoten Armee agiert. Er ist f\u00fcr die Zerst\u00f6rung von Breska verantwortlich, bei der fast alle Bewohner get\u00f6tet wurden.\n\n## Motivation\n\nBelorus verfolgte urspr\u00fcnglich das Ziel, [Lindo Laut](../characters/lindo_laut.md) zu t\u00f6ten, um die Macht des alten Gottes Vasul zu vernichten.\n\n## Konfrontation und R\u00fcckzug\n\nIm Kampf gegen die Gruppe wurde Belorus besiegt. Durch die Worte von [Lindo Laut](../characters/lindo_laut.md) lie\u00df er sich \u00fcberzeugen, von seinem Vorhaben abzulassen. Nach einer \u00dcbereinkunft mit der Gruppe zog er sich auf seinen Berg zur\u00fcck. Seine Ghule streifen jedoch weiterhin durch die Ruinen von Breska.\n\n# Belege\n\n1. Session 2026-01-20, 00:06:59 \u2013 https://www.youtube.com/watch?v=H3ckYdTv4y8\n2. Session 2026-03-10, 00:02:00 \u2013 https://www.youtube.com/watch?v=Kr9_AC2XtOw", "npcs/belorus_der_stille": "# Belorus der Stille\n\nEin m\u00e4chtiger Todesritter und ehemaliger General von [K\u00f6nig Zebros](../npcs/koenig_zebros.md). Einst ein gefallener Paladin, der seinen Eid brach und daraufhin verflucht wurde. Er ist der Herr der Burg und beschw\u00f6rt Untote.\n\nDie Gruppe glaubt, ihm durch ihre Aktionen in Steinbachtal einen Streich gespielt zu haben. M\u00f6glicherweise steht er mit der Untotenarmee in Verbindung.\n\nNach dem Tod des Generals erscheint eine geisterhafte, magische Kreatur, die mit Belorus in Verbindung steht. Diese kommuniziert telepathisch und bietet der Gruppe eine Waffenruhe an, da sie ihren General besiegt haben. Die Kreatur sucht nach zwei Personen und einem entrissenen Gegenstand.\n\n# Belege\n1. Session 2025-05-14, 01:05:33 \u2013 https://www.youtube.com/watch?v=5eAEDN5ra-4\n2. Session 2025-09-09, 01:59:28 \u2013 https://www.youtube.com/watch?v=Zl0qfuI6Goc\n3. Session 2025-09-30, 00:52:20 \u2013 https://www.youtube.com/watch?v=bUT7Mc2hjUY", "npcs/berthold": "# Berthold\n\nBerthold ist der B\u00fcrgermeister der Stadt [Breska](../locations/breska.md). Er ist ein Handelsmann und oft mit Papieren besch\u00e4ftigt. Er verkauft [Valeria](valeria.md) eine Armbrust f\u00fcr eine Handvoll Gold.\n\n# Belege\n1. Session 2025-04-09 @ 00:11:33 (https://www.youtube.com/watch?v=1PWdwvun5ow)", "npcs/bertie": "# Bertie\n\n*Zahme Ziege*\n\nBertie ist die zahme Ziege von [Tindrael](tindrael.md). Sie tr\u00e4gt ein Gl\u00f6ckchen und reagiert auf Ziegenlaute, mit denen [Valeria](../characters/valeria.md) sie anlocken und anschlie\u00dfend reiten kann.\n\n# Belege\n1. Session 2025-04-09 @ 00:21:54 (https://www.youtube.com/watch?v=1PWdwvun5ow)", "npcs/bosar": "# Bosar\n\n*Galappa, Heiler*\n\nBosar ist ein begnadeter Heiler vom Volk der Galappa. Er begleitet [Tyrael](../characters/tyrael.md) und wurde hinzugezogen, um den Zustand von [Lindo Laut](../characters/lindo_laut.md) mit zu untersuchen.\n\n---\n\n# Belege\n1. Session 2025-10-14 @ 01:22:44 (https://www.youtube.com/watch?v=cUtz87UCHu4)", "npcs/brandon": "# Brandon\n\nBrandon ist ein Ritter und einer der letzten lebenden Anh\u00e4nger, die den [Heiligen Duran](heiliger_duran.md) noch pers\u00f6nlich kannten. Er f\u00fchrt den Morgenstern des Heiligen Duran und setzt ihn im Kampf ein.\n\n# Belege\n1. Session 2025-05-06 @ 01:57:38 (https://www.youtube.com/watch?v=e0v6AFGd4mE)", "npcs/brandoran": "# Brandoran\n\nBrandoran ist ein zwergischer \u00dcberlebender in [Steinbachtal](../locations/steinbachtal.md), der zusammen mit [Meister Grimm](meister-grimm.md) in der Kathedrale ausharrt. Er zeichnet sich durch eine besonnene Art aus, die ihn von dem impulsiveren Grimm unterscheidet.\n\n# Belege\n1. Session 2025-09-09 @ 01:21:36 (https://www.youtube.com/watch?v=Zl0qfuI6Goc)", "npcs/brass": "# Brass\n\nEin abweisender Dunkelelf aus [Cornivum](../locations/cornivum.md), der die Gruppe zun\u00e4chst argw\u00f6hnisch mustert.\n\n## Hintergrund & Pers\u00f6nlichkeit\nBrass begegnet Fremden mit Misstrauen und einer abweisenden Haltung. Seine Herkunft aus Cornivum pr\u00e4gt sein Auftreten.\n\n## Beziehung zur Gruppe\nBrass f\u00fchrt die Gruppe auf die Jagd nach einer Sumpfkreatur. W\u00e4hrend dieser Jagd wird er fast get\u00f6tet. Aus Scham \u00fcber diesen Vorfall schenkt er [Lindo Laut](../characters/lindo_laut.md) seinen Dolch.\n\n# Belege\n1. Session 2025-06-03, 00:15:45 \u2013 https://www.youtube.com/watch?v=jtYR4Je0a18", "npcs/brock": "# Brock\n\nBrock ist ein Dorfw\u00e4chter von [D\u00f6rflein](../locations/doerflein.md). Gemeinsam mit [Kerl](kerl.md) bewacht er das Haus des B\u00fcrgermeisters.\n\n# Belege\n1. Session 2025-04-09, 00:17:25 \u2013 https://www.youtube.com/watch?v=1PWdwvun5ow", "npcs/buergermeister_bertolt": "# B\u00fcrgermeister Bertolt\n\n*   **Typ:** NPC\n*   **Rolle:** B\u00fcrgermeister von [Bresca](../orte/bresca.md)\n*   **Eigenschaften:** redselig, begeistert vom Stadtausbau\n\nB\u00fcrgermeister Bertolt ist der redselige B\u00fcrgermeister der Stadt [Bresca](../orte/bresca.md). Er zeigt gro\u00dfe Begeisterung f\u00fcr den Ausbau der Stadt und ist der Gruppe gegen\u00fcber gastfreundlich eingestellt, indem er sie auf ein Bier in die neue Taverne einl\u00e4dt.\n\n# Belege\n1.  Session 2025-06-25, 00:07:00, https://www.youtube.com/watch?v=tpkO9uGw6-I", "npcs/bugbears_grottenschrate": "# Bugbears (Grottenschrate)\n\n## \u00dcbersicht\nBugbears, auch als Grottenschrate bekannt, sind stinkende, fellbewachsene Kreaturen, die als Wachen fungieren.\n\n## Rolle in der Kampagne\nIn der Burgruine wurden Bugbears als Wachposten eingesetzt. Sie waren mit Armbr\u00fcsten bewaffnet und bewachten das Gebiet. Die Gruppe stellte sich ihnen im Kampf und konnte sie besiegen.\n\n## Belege\n1. Session 2025-04-15, 00:16:48 \u2013 https://www.youtube.com/watch?v=YCpAz_syjaY", "npcs/bullrin": "# Bullrin\n\nEin Zwerg, der einer fr\u00fcheren Abenteurergruppe angeh\u00f6rte. Er blieb im Dungeon zur\u00fcck, um seinen Gef\u00e4hrten die Flucht zu erm\u00f6glichen.\n\nSein Tagebuch enth\u00e4lt die entscheidende Information, dass die Kreatur im Dungeon immer st\u00e4rker wiederkehrt und nicht einfach nur besiegt werden kann.\n\n# Belege\n1. Session 2025-10-28 @ 00:34:11 - https://www.youtube.com/watch?v=V6NzNakqxXM", "npcs/daemonische_stimme": "# D\u00e4monische Stimme\n\nEine dunkle, tiefe Stimme, die mit der [Hexe](hexe.md) in d\u00e4monischer Sprache redet. Ihr Gespr\u00e4ch wurde von der Gruppe belauscht.\n\n# Belege\n1. Session 2025-06-17 @ 01:48:56 (https://www.youtube.com/watch?v=tl76B4V0io8)", "npcs/das_monster": "# Das Monster\n\nEin tentakelbewehrtes Wesen, das durch ein Ritual beschworen wurde. Es tr\u00e4gt ein Halsband und eine Nachricht bei sich, was darauf hindeutet, dass es jemandes Haustier oder Bote war.\n\n# Belege\n1. Session 2025-03-26 @ 01:28:13 (https://www.youtube.com/watch?v=ROCKGeeRUFw)", "npcs/der_auftraggeber": "# Der Auftraggeber\n\nEine nicht n\u00e4her benannte Person oder Gruppe, die der Gruppe den Auftrag erteilt hat.\n\n## Auftrag\nDer Auftraggeber hat die Gruppe beauftragt, ein Monster zu t\u00f6ten und einen Teil davon als Beweis mitzubringen.\n\n# Belege\n1. Session 2025-03-26, 01:09:48, https://www.youtube.com/watch?v=ROCKGeeRUFw", "npcs/der_buergermeister": "# Der B\u00fcrgermeister\n\nDer B\u00fcrgermeister ist der Anf\u00fchrer des Dorfes. Er nimmt nicht aktiv an K\u00e4mpfen teil und h\u00e4lt sich in seinem Haus auf.\n\n# Belege\n1. Session 2025-04-23 @ 00:06:44 (https://www.youtube.com/watch?v=z3C-bewKqUs)", "npcs/der_gildenmeister": "# Der Gildenmeister\n\nDer Gildenmeister ist der Anf\u00fchrer der Gilde in [Ehrenfels](../orte/ehrenfels.md) und ein m\u00e4chtiger Magier.\n\n## Rolle in der Handlung\n\nNach dem Anschlag in Ehrenfels untersuchte der Gildenmeister den Vorfall und identifizierte das auf [Lindo Laut](../characters/lindo_laut.md) ausgesetzte Kopfgeld. Er warnte Lindo eindringlich vor der Gefahr, die von dessen Amulett ausgeht, insbesondere vor den darin gefangenen Seelenst\u00fccken.\n\n# Belege\n\n1. Session 2025-07-22 @ 02:33:22 (https://www.youtube.com/watch?v=BRRCUgW4xRo)", "npcs/der_graf": "# Der Graf\n\n## Kurzbeschreibung\nEine Person, die von der [Hexe](hexe.md) und der d\u00e4monischen Stimme als Hindernis betrachtet wird.\n\n## Rolle in der Handlung\nDie Hexe und die d\u00e4monische Stimme erw\u00e4hnten den Grafen als ein Hindernis f\u00fcr ihre Pl\u00e4ne und planen, sich um ihn zu k\u00fcmmern.\n\n## Beziehungen\n- [Hexe](hexe.md): Sieht den Grafen als Hindernis und plant, gegen ihn vorzugehen.\n\n# Belege\n1. Session 2025-06-17, 01:49:10, https://www.youtube.com/watch?v=tl76B4V0io8", "npcs/der_haarige_werwolf": "# Der Haarige / Werwolf\n\nEin Mann, der sich gegen seinen Willen in einen Werwolf verwandelt. Er tritt als erster Gegner in der Arena an. Schwer verletzt und voller Reue \u00fcber seine Taten wird er schlie\u00dflich von [Dodo](../characters/dodo.md) auf Gehei\u00df von [Lord Kalidarn](lord_kalidarn.md) mit einem einzigen Schlag get\u00f6tet.\n\n# Belege\n1. Session 2025-10-21 @ 00:12:45 (https://www.youtube.com/watch?v=sxFhbtwoefA)", "npcs/der_schamane": "# Der Schamane\n\nDer Schamane ist das magiebegabte, uralte Oberhaupt der Goblins. Er zeichnet sich durch Weisheit aus und erkennt den Wert des Zwergenhandwerks an. Aufgrund dieser Einsicht willigt er in den Friedensvertrag mit den Zwergen ein.\n\n# Belege\n1. Session 2026-01-27 @ 01:48:07 (https://www.youtube.com/watch?v=9RzvnnWzV7E)", "npcs/der_schmied": "# Der Schmied\n\nEin Bewohner des Dorfes, das von den Helden besucht wurde. W\u00e4hrend eines Kampfes wurde er von einem Oger angegriffen und dabei schwer verletzt.\n\n# Belege\n1. Session 2025-04-23, 00:23:17 - https://www.youtube.com/watch?v=z3C-bewKqUs", "npcs/der_wirt_barkeeper": "# Der Wirt / Barkeeper\n\n## Kurzbeschreibung\nEin kampff\u00e4higer Dorfbewohner, der aktiv am Kampfgeschehen teilnimmt.\n\n## Rolle in der Handlung\nW\u00e4hrend der Kampfhandlungen wird der Wirt von [Lindo Laut](../characters/lindo_laut.md) \u00fcberzeugt, die Dorfbewohner ins Rathaus zu f\u00fchren, um sie in Sicherheit zu bringen.\n\n---\n\n# Belege\n1. Session 2025-04-23 @ 00:05:04 (https://www.youtube.com/watch?v=z3C-bewKqUs)", "npcs/die_hack": "# Die Hack\n\nEine Moorhexe und Antagonistin, die mit d\u00e4monischen Kr\u00e4ften arbeitet. Sie ist die Auftraggeberin des Goblin-Angriffs und auf der Suche nach der Gemahlin von [Voras](../npcs/voras.md). Eine Illusion von ihr erschien auf einem Dach und deutete an, dass sie die \u00d6ffnung des Buches gewollt hat.\n\n# Belege\n1. Session 2025-04-23 @ 00:03:07 (https://www.youtube.com/watch?v=z3C-bewKqUs)\n2. Session 2025-06-25 @ 00:02:09 (https://www.youtube.com/watch?v=tpkO9uGw6-I)", "npcs/die_hack_hexe": "# Die Hack (Hexe)\n\n## Kurzbeschreibung\nDie Hack ist eine Hexe, die von der Gruppe zun\u00e4chst als Antagonistin des Dungeons wahrgenommen wurde.\n\n## Begegnung mit der Gruppe\nDie Gruppe belauschte die Hack, als sie mit einer d\u00e4monischen Stimme \u00fcber den [Grafen](../npcs/graf.md) sprach. Am Ende der Begegnung griff sie die Gruppe mit einem lilanen Todesstrahl an.\n\n# Belege\n1. Session 2025-06-17 @ 01:49:10 (https://www.youtube.com/watch?v=tl76B4V0io8)", "npcs/die_herrin_von_hal": "# Die Herrin von Hal\n\n*   **Typ:** NPC\n*   **Konzept:** Anf\u00fchrerin der Banditen\n*   **Spezies:** Elbin\n\nEine geheimnisvolle Elbin, die als Anf\u00fchrerin der Banditen auftritt. Sie willigte ein, die Fl\u00fcchtlinge unterzubringen, und bekundete Interesse, die Gruppe bei Gelegenheit zu treffen. Ihren Aussagen zufolge kennt sie bereits einige der Gruppenmitglieder.\n\n# Belege\n1.  Session 2025-09-30 @ 02:08:47 (https://www.youtube.com/watch?v=bUT7Mc2hjUY)", "npcs/die_schwarze_kreatur_nebengegner": "# Die schwarze Kreatur\n\nEine groteske, untote Kreatur mit langen Armen, die von einer klebrigen, schwarzen Fl\u00fcssigkeit \u00fcberzogen ist. Diese Substanz verleiht ihr die F\u00e4higkeit, sich st\u00e4ndig zu regenerieren.\n\nDie Kreatur wurde von [Dodo](../characters/dodo.md) mit einem neu geschmiedeten, brennenden Dolch endg\u00fcltig vernichtet und zerfiel daraufhin zu Staub.\n\n# Belege\n1. Session 2025-10-28, 01:19:20 \u2013 https://www.youtube.com/watch?v=V6NzNakqxXM", "npcs/die_untote_kreatur_hauptgegner": "# Die untote Kreatur (Hauptgegner)\n\nEine gro\u00dfe, intelligente untote Gestalt, die als Quelle des \u00dcbels im Dungeon auftritt. Sie verf\u00fcgt \u00fcber magische Fernangriffe und die F\u00e4higkeit zur Gedankenkontrolle. Die Kreatur kann nur mit einer speziell pr\u00e4parierten Waffe vernichtet werden.\n\n# Belege\n1. Session 2025-10-28 @ 01:19:20 (https://www.youtube.com/watch?v=V6NzNakqxXM)", "npcs/die_zwei_froschwesen_ribbits": "# Die zwei Froschwesen (Ribbits)\n\nZwei amphibische Wesen, die auf einer Br\u00fccke Wache halten und von Reisenden einen Wegzoll fordern.\n\n## Begegnung mit der Gruppe\nDie Froschwesen begegnen der Gruppe auf einer Br\u00fccke und verlangen einen Wegzoll. Gegen\u00fcber [Cookie](../characters/cookie.md) zeigen sie sich misstrauisch. [Rotunas](../characters/rotunas.md) gelingt es jedoch, sie mit Fliegen zu f\u00fcttern, woraufhin sie die Gruppe passieren lassen.\n\n## Wissen \u00fcber die versunkene Stadt\nDie beiden kennen die versunkene Stadt lediglich vom Eingang her. Sie haben Angst vor der Dunkelheit und wagen sich nicht tiefer hinein.\n\n# Belege\n1. Session 2025-06-10, 00:28:56 \u2013 https://www.youtube.com/watch?v=cLkCu3Iq3y8", "npcs/dormak": "# Dormak\n\nDormak ist ein Diener des Gottes [Varsul](../glaube_und_kulte/varsul.md).\n\n## Rolle in der Krypta\nDormak erschien in der Krypta und konfrontierte [Lindo Laut](../characters/lindo_laut.md). Er dr\u00e4ngte Lindo Laut eindringlich, die Macht von Varsul anzunehmen. Nachdem Lindo Laut die im Amulett gefangenen Seelen vernichtete, ergriff Dormak die Flucht.\n\n# Belege\n1. Session 2025-09-02 @ 01:46:04 (https://www.youtube.com/watch?v=TLZOH7TlGhk)", "npcs/dranara_asleina_aslania": "# Dranara (Asleina/Aslania)\n\n## Kurzbeschreibung\nDranara ist das neue Oberhaupt des Dorfes [Windung](../../locations/windung.md), nachdem ihre Eltern, die vorherigen Oberh\u00e4upter, bei den ersten Angriffen get\u00f6tet wurden.\n\n## Pers\u00f6nlichkeit\nDranaras Verhalten w\u00e4hrend der Verhandlungen mit den [Kuatau](../../factions/kuatau.md) durchl\u00e4uft eine deutliche Entwicklung: Sie zeigt sich zun\u00e4chst grimmig, wird dann eingesch\u00fcchtert und reagiert schlie\u00dflich w\u00fctend auf den Verlauf der Gespr\u00e4che.\n\n## Hintergrund\n- \u00dcbernahm die F\u00fchrung des Dorfes Windung nach dem Tod ihrer Eltern\n- Ihre Eltern starben als vorherige Oberh\u00e4upter bei den ersten Angriffen\n\n# Belege\n1. Session 2025-07-29, 00:18:13 \u2013 https://www.youtube.com/watch?v=XXgO5Ht4Q0A", "npcs/elisa": "# Elisa\n\nElisa ist eine J\u00e4gerin aus [Steinwacht](../locations/steinwacht.md). Sie ist ge\u00fcbt im Umgang mit dem Bogen. Fremden gegen\u00fcber zeigt sie sich zun\u00e4chst skeptisch, ist jedoch bereit, sich an der Verteidigung des Dorfes zu beteiligen.\n\n# Belege\n1. Session 2025-04-09 @ 00:50:53 (https://www.youtube.com/watch?v=1PWdwvun5ow)", "npcs/esua": "# Esua\n\nEsua ist eine b\u00f6sartige Entit\u00e4t, die in einem Amulett gefangen war, welches sich im Besitz von [Lindo Laut](../characters/lindo_laut.md) befand. Aus dem Amulett heraus sprach Esua mit einer Stimme zu Lindo und dr\u00e4ngte ihn dazu, die Macht zu ergreifen.\n\n## Verbindung zu Sintra\nEsua stand in Verbindung mit [Sintra](sintra.md), einer weiteren Entit\u00e4t, mit der sie gemeinsam auftrat.\n\n## Schicksal\nEsua wurde zusammen mit [Sintra](sintra.md) durch die Kraft von [Tyrex](../characters/tyrex.md) vernichtet.\n\n# Belege\n1. Session 2025-09-02, 01:20:54 \u2013 https://www.youtube.com/watch?v=TLZOH7TlGhk", "npcs/familie_kraemer": "# Familie Kr\u00e4mer\n\nEine Bauernfamilie, die in der N\u00e4he des Waldes lebt.\n\n## Mitglieder & Lebensgrundlage\n*   **Berufe:** Die Familie betreibt Landwirtschaft mit K\u00fchen und verf\u00fcgt \u00fcber einen Schmied.\n*   **Kind:** Ein Kind der Familie wurde von [Valeria](../characters/valeria.md) erschreckt und floh daraufhin in den Wald. Diese Flucht f\u00fchrte zur Entdeckung des Goblin-Sp\u00e4hers.\n\n# Belege\n1.  Session 2025-04-09, 00:41:30, https://www.youtube.com/watch?v=1PWdwvun5ow", "npcs/familie_schmid": "# Familie Schmid\n\nEine Bauernfamilie aus [Dorf D\u00fcsterbruch](../orte/duesterbruch.md), die sich auf die Arbeit mit Holz spezialisiert hat.\n\n## Rolle im Dorf\nDie Schmids unterst\u00fctzen die Dorfgemeinschaft mit ihrer Holzarbeit. Sie stellten den Helden acht Palisaden zur Verf\u00fcgung, um die Verteidigung von D\u00fcsterbruch zu verst\u00e4rken.\n\n## Beziehungen\n- Stellten Palisaden f\u00fcr die Heldengruppe her\n\n# Belege\n1. Session 2025-04-09, 00:41:27 \u2013 https://www.youtube.com/watch?v=1PWdwvun5ow", "npcs/fluffy": "# Fluffy\n\nFluffy ist ein gro\u00dfer, wolfs\u00e4hnlicher Hund, der sich in [Crowfin Manor](../locations/crowfin-manor.md) aufh\u00e4lt. Er zeigt ein sehr anh\u00e4ngliches Wesen und l\u00e4sst sich bereitwillig von den Charakteren streicheln.\n\n# Belege\n1. Session 2026-02-17 @ 00:16:06 (https://www.youtube.com/watch?v=Z2jlzpoTWVw)", "npcs/garlin_der_weise": "# Garlin der Weise\n\nGarlin der Weise ist ein warforged-artiger Magier, der als Berater des Lords fungiert. Er tr\u00e4gt einen roten Mantel und f\u00fchrt ein magisches Buch mit sich. Im Rahmen der Arena-K\u00e4mpfe ist er f\u00fcr die magische \u00dcbertragung der zweiten Arena verantwortlich.\n\n# Belege\n1. Session 2025-10-21, 00:14:00 \u2013 https://www.youtube.com/watch?v=sxFhbtwoefA", "npcs/gefangene_seelen": "# Gefangene Seelen\n\nDie Gefangenen Seelen sind Geister, die in sogenannten Seelen-Netzen festgehalten werden und um Hilfe schreien. Bei einigen von ihnen handelt es sich um gefallene Krieger, die in einem Krieg gegen die \"Alten\" gek\u00e4mpft haben.\n\n[Dodo](../characters/dodo.md) befreite einen Teil dieser Seelen durch ein Gebet, woraufhin sie zu Asche zerfielen.\n\n# Belege\n1. Session 2025-06-17, 01:26:50 \u2013 https://www.youtube.com/watch?v=tl76B4V0io8", "npcs/geisterhafte_waechtergestalt": "# Geisterhafte W\u00e4chtergestalt\n\nEine astrale Gestalt, die einen Weg \u00fcberwacht. Sie besitzt die F\u00e4higkeit, Unsichtbares zu sehen, und war f\u00fcr den Absturz von [Esterossa](../characters/esterossa.md) verantwortlich. In ihrer Erscheinung ist ein Kronenansatz erkennbar.\n\n# Belege\n1. Session 2025-08-12, 00:16:42 \u2013 https://www.youtube.com/watch?v=vHIjua0BZ9Y", "npcs/geisterhafter_doppelgaenger_von_rotunas": "# Geisterhafter Doppelg\u00e4nger von Rotunas\n\nEine geisterhafte, schimmernde Kreatur, die das exakte Abbild von [Rotunas](../characters/rotunas.md) annimmt und mit dessen Stimme fl\u00fcstert. Der Doppelg\u00e4nger verursacht magischen Elektrizit\u00e4tsschaden, ist jedoch immun gegen physische Waffen. [Rotunas](../characters/rotunas.md) gelingt es, die Erscheinung mit einem eigenen magischen Angriff aufzul\u00f6sen.\n\n# Belege\n1. Session 2025-06-10 @ 01:02:48 (https://www.youtube.com/watch?v=cLkCu3Iq3y8)", "npcs/gildenmeister": "# Gildenmeister\n\nDer Gildenmeister ist der Anf\u00fchrer der Gilde und eine Autorit\u00e4tsperson f\u00fcr die Gruppe.\n\n## Rolle und Autorit\u00e4t\n*   Er ist der Leiter der Gilde und fungiert als deren oberster Ansprechpartner f\u00fcr die Gruppe.\n*   In dieser Funktion erteilt er der Gruppe die Erlaubnis, Land zu besiedeln, verbunden mit einer Warnung vor bestimmten Gebieten.\n\n## Interaktionen mit der Gruppe\n*   **Nach der R\u00fcckkehr vom Portal:** Der Gildenmeister erwartet die Gruppe am Portal und warnt sie eindringlich davor, mit irgendjemandem \u00fcber das Erlebte zu sprechen.\n*   **N\u00e4chtliche Begegnung:** Sp\u00e4t in der Nacht trifft die Gruppe blutverschmiert, aber v\u00f6llig gefasst auf den Gildenmeister. Er winkt besorgte Nachfragen ab.\n\n# Belege\n1.  Session 2025-07-09 @ 01:23:13 (https://www.youtube.com/watch?v=XOnHa6CmDbo)\n2.  Session 2025-09-23 @ 00:16:13 (https://www.youtube.com/watch?v=DGzfqVigS0g)\n3.  Session 2025-11-18 @ 01:40:34 (https://www.youtube.com/watch?v=w__ahowb9p0)", "npcs/gnoll_heiler": "# Gnoll (Heiler)\n\nEin vermummter Heiler, der in einer abgelegenen Waldh\u00fctte lebt. Er behandelte [Rotunas](../../characters/rotunas.md) mit einer selbst hergestellten Tinktur und lehnte jegliche Bezahlung f\u00fcr seine Dienste ab. Auf ihn ist ein Kopfgeld ausgesetzt.\n\n# Belege\n1. Session 2025-09-23, 00:02:01, https://www.youtube.com/watch?v=DGzfqVigS0g", "npcs/goblin_magier": "# Goblin-Magier\n\nEin Goblin, der \u00fcber magische F\u00e4higkeiten verf\u00fcgt. Er kann Feuerkugeln und Druckwellen beschw\u00f6ren sowie sich in Nebel aufl\u00f6sen und teleportieren.\n\nEr wurde von [Esterossa](../characters/esterossa.md) von einem Balkon in den Tod gest\u00fcrzt.\n\n# Belege\n1. Session 2025-04-01 @ 01:43:22 (https://www.youtube.com/watch?v=LZIuUzc3F18)", "npcs/goblin_spaeher": "# Goblin-Sp\u00e4her\n\nEin einzelner Goblin, der das Dorf ausspioniert hat.\n\n## Aktivit\u00e4ten\n\n*   Verfolgte das Kind der Kr\u00e4mers im Wald.\n*   Wurde von [Rotunas](../characters/rotunas.md) und [Valeria](../characters/valeria.md) gestellt und get\u00f6tet.\n\n## Besitz\n\n*   Trug Notizen mit Angriffspl\u00e4nen bei sich.\n\n# Belege\n\n1.  Session 2025-04-09 @ 01:12:02 ([YouTube](https://www.youtube.com/watch?v=1PWdwvun5ow))", "npcs/gorak": "# Gorak\n\nGorak ist ein Tiefenzwerg und der Anf\u00fchrer der neuen Gilde in [Breska](../locations/breska.md). Er tritt an die Gruppe heran, um sie f\u00fcr seine Gilde zu gewinnen. In diesem Zusammenhang bittet er sie, eine Nachricht an ihren Gildenmeister zu \u00fcberbringen, und bietet ihnen eine Aufnahmepr\u00fcfung an.\n\n# Belege\n1. Session 2025-09-17, 00:24:13, https://www.youtube.com/watch?v=AhIT8dcxw2o", "npcs/graf_voras_der_heilige": "# Graf Voras der Heilige\n\nGraf Voras der Heilige ist ein Vampir und der Herrscher der Stadt [Bresca](../locations/bresca.md). Er nutzte sein betr\u00e4chtliches Verm\u00f6gen, um die Stadt auszubauen und zu entwickeln.\n\n## Ziele und Pl\u00e4ne\n\nDer Graf verfolgt das Ziel, die Kontrolle \u00fcber den [Berg Zebros](../locations/berg_zebros.md) zu erlangen. Mit der Macht \u00fcber diesen Berg will er seine F\u00e4higkeiten, Einfluss auf Untote auszu\u00fcben, einsetzen und verst\u00e4rken.\n\n## Reaktion auf die Gruppe\n\nAls die Gruppe die himmlischen W\u00e4chter vernichtete, zeigte sich Graf Voras entsetzt \u00fcber diese Tat.\n\n---\n\n# Belege\n\n1. Session 2025-06-25, 00:16:43, https://www.youtube.com/watch?v=tpkO9uGw6-I", "npcs/guenther_ajani": "# G\u00fcnther (Ajani)\n\nG\u00fcnther, auch Ajani genannt, ist der tierische Begleiter von [Esterossa](../npcs/esterossa.md). Es handelt sich um eine Katze, die eigentlich weiblich ist. Sie dient als Botin zwischen [Nyrella](../npcs/nyrella.md) und der Gruppe.\n\n# Belege\n1. Session 2025-09-23 @ 00:17:27 (https://www.youtube.com/watch?v=DGzfqVigS0g)", "npcs/guenther_ehem_adjani": "# G\u00fcnther (ehem. Adjani)\n\nG\u00fcnther ist eine Katze, die sich der Gruppe um [Esterossa](../characters/esterossa.md) angeschlossen hat. Urspr\u00fcnglich geh\u00f6rte sie dem Barkeeper Hermann, zeigt jedoch eine starke Bindung zu Esterossa. Ihren Namen erhielt sie, nachdem sie von den Goblin-G\u00f6ttern von ihrem urspr\u00fcnglichen Namen Adjani in G\u00fcnther umbenannt wurde.\n\n# Belege\n1. Session 2025-04-30, 00:39:29, https://www.youtube.com/watch?v=fsCOiSkKKTE", "npcs/gulrak": "# Gulrak\n\nGulrak ist ein gerupfter Kenku (Federwesen), der im Gef\u00e4ngnis sitzt. Er wurde inhaftiert, weil er versuchte, ein Familienerbst\u00fcck von [Baran](../characters/baran.md) zur\u00fcckzustehlen. Gulrak behauptet, die Insel habe urspr\u00fcnglich seiner Familie geh\u00f6rt. Er bietet den Charakteren Informationen als Gegenleistung f\u00fcr seine Freiheit an.\n\n# Belege\n1. Session 2025-04-30 @ 01:12:29 (https://www.youtube.com/watch?v=fsCOiSkKKTE)", "npcs/hal": "# Hal\n\nHal ist der Anf\u00fchrer der Banditen, die in der Festung ihr Lager aufgeschlagen haben. Sein Charakter hat sich im Laufe der Zeit stark gewandelt.\n\n## Pers\u00f6nlichkeit und Entwicklung\n\n*   **Fr\u00fcher:** Hal war zun\u00e4chst arrogant, aufbrausend und sehr auf den Respekt seiner M\u00e4nner bedacht. In Verhandlungen mit [Lindo Laut](../characters/lindo_laut.md) \u00fcber die Unterbringung von Fl\u00fcchtlingen drohte er zeitweise damit, die Dorfbewohner zu t\u00f6ten.\n*   **Heute:** Sp\u00e4ter hat er seine grimmige Art abgelegt und das Lager liebgewonnen.\n\n## Rolle im Lager\n\nHal ist f\u00fcr die Organisation der Verteidigung des Lagers verantwortlich. W\u00e4hrend eines Angriffs bot er an, die Balliste auf [Belorus](../npcs/belorus.md) zu schie\u00dfen. Nachdem die Verteidiger schwere Verluste erlitten hatten, blies er zum R\u00fcckzug in die zweite Verteidigungslinie.\n\n## Beziehungen und Handlungen\n\n*   Er verhandelte mit [Lindo Laut](../characters/lindo_laut.md) \u00fcber die Unterbringung von Fl\u00fcchtlingen.\n*   Er erhielt einen Hilferuf aus [Breska](../locations/breska.md) und beriet daraufhin mit der Gruppe die n\u00e4chsten Schritte, da der Winter bald endet.\n\n# Belege\n\n1.  Session 2025-09-30 @ 01:01:51 (https://www.youtube.com/watch?v=bUT7Mc2hjUY)\n2.  Session 2026-01-13 @ 00:18:17 (https://www.youtube.com/watch?v=w4LB1s9_3rs)\n3.  Session 2026-01-20 @ 00:08:27 (https://www.youtube.com/watch?v=H3ckYdTv4y8)", "npcs/haloras": "# Haloras\n\nHaloras ist ein Ifriti (Dschinn) und dient als Gehilfe der schurkischen Dame im [Haus des L\u00f6wen](../locations/haus-des-loewen.md).\n\n## Rolle im Haus des L\u00f6wen\nHaloras trat in Erscheinung, um die Belohnung f\u00fcr [Kronos](kronos.md) zu materialisieren. Dar\u00fcber hinaus bot er an, die gesamte Gruppe als Helden im Haus des L\u00f6wen aush\u00e4ngen zu lassen.\n\n# Belege\n1. Session 2026-03-03, 00:20:30 \u2013 https://www.youtube.com/watch?v=BRUNuNKTeOg", "npcs/hans": "# Hans\n\n## Barkeeper & Bote\n\nHans ist ein freundlicher Tiefling, der die Taverne \"Zum gr\u00fcnen Sichelmond\" betreibt. Er verf\u00fcgt \u00fcber ausgezeichnete Ortskenntnisse und gibt bereitwillig detaillierte Informationen \u00fcber Reiserouten und regionale Gefahren preis.\n\n## Rolle in der Handlung\n\nHans trat urspr\u00fcnglich als Soldat aus Breska in Erscheinung, der im Auftrag von Lord Belorus eine Nachricht an [Lindo Laut](../characters/lindo_laut.md) \u00fcberbrachte. Ahnungslos \u00fcbergab er dabei einen magischen Kristall, aus dem sp\u00e4ter der Todesritter beschworen wurde.\n\nSp\u00e4ter begegnete die Gruppe ihm erneut als Barkeeper der Taverne \"Zum gr\u00fcnen Sichelmond\", wo er ihnen detaillierte Informationen \u00fcber die Route zu den Orks und die Gefahren des Passes mitteilte.\n\n# Belege\n\n1. Session 2026-01-13 @ 00:52:04 (https://www.youtube.com/watch?v=w4LB1s9_3rs)\n2. Session 2026-03-18 @ 00:39:43 (https://www.youtube.com/watch?v=HHXxsASLrbQ)", "npcs/harald": "# Harald\n\nHarald ist ein gro\u00dfer Freibeuter-Kapit\u00e4n, der einen markanten Hut tr\u00e4gt. Er hat fr\u00fcher f\u00fcr [Brandau](../orte/brandau.md) gearbeitet.\n\n## Konflikt mit Willauch\nHarald wurde in seiner eigenen Taverne von Soldaten aus [Willauch](../orte/willauch.md) angegriffen. Zuvor verteidigte er sich und seine Leute gegen die Anschuldigung, mit den sogenannten \"Silberkernen\" zu kooperieren.\n\n# Belege\n1. Session 2026-03-18, 00:48:39 \u2013 https://www.youtube.com/watch?v=HHXxsASLrbQ", "npcs/harl": "# Harl\n\n**Typ:** NPC\n**Zugeh\u00f6rigkeit:** Anf\u00fchrer des Banditenlagers\n\nHarl ist einer der Anf\u00fchrer des Banditenlagers. Er tritt charismatisch und verhandlungsbereit auf. F\u00fcr die Unterbringung von Fl\u00fcchtlingen verlangt er Gold.\n\n# Belege\n1. Session 2025-09-23, 00:10:12, https://www.youtube.com/watch?v=DGzfqVigS0g", "npcs/hass_spirit_geisterhaftes_kind": "# Hass-Spirit (geisterhaftes Kind)\n\n## Beschreibung\nEine geisterhafte Kreatur, die in der Gestalt eines Kindes erscheint. Sie manifestierte sich im Lager der Gruppe.\n\n## Eigenschaften & Verhalten\nLaut [Hendrik](../characters/hendrik.md) n\u00e4hrt sich diese Entit\u00e4t von Aufmerksamkeit und bringt Ungl\u00fcck \u00fcber jene, die ihr Beachtung schenken.\n\n## Auftritte\n- **Session 2025-08-12**: Erscheint im Lager der Gruppe.\n\n# Belege\n1. Session 2025-08-12 @ 01:00:01 (https://www.youtube.com/watch?v=vHIjua0BZ9Y)", "npcs/heiliger_duran": "# Heiliger Duran\n\nEin historischer, von G\u00f6ttern auserw\u00e4hlter Heiliger, der einst sein Volk anf\u00fchrte und schlie\u00dflich verschwand. Seine Erkennungsmerkmale sind ein Amulett und ein magischer Morgenstern.\n\n# Belege\n1. Session 2025-05-06 @ 00:14:33 (https://www.youtube.com/watch?v=e0v6AFGd4mE)", "npcs/hendrik": "# Hendrik\n\nHendrik ist der Anf\u00fchrer eines Nomadenlagers. Er tritt misstrauisch und autorit\u00e4r auf. Gegen\u00fcber der Gruppe zeigt er eine abweisende Haltung, warnt sie vor den Gefahren der Umgebung \u2013 namentlich einem Hass-Spirit und Ghulen \u2013 und verbietet ihnen ausdr\u00fccklich das Betreten einer nahegelegenen H\u00f6hle.\n\n# Belege\n1. Session 2025-08-12, 00:45:26, https://www.youtube.com/watch?v=vHIjua0BZ9Y", "npcs/hexenmeister_goblin": "# Hexenmeister-Goblin\n\nEin intelligenter, aber misstrauischer Goblin, der von [Dodo](../characters/dodo.md) angetroffen wurde. Er studierte ein Buch mit dem Titel *Goblinisch f\u00fcr Dummies*. Nachdem [Dodo](../characters/dodo.md) einen magischen Blitz einsetzte, wurde der Goblin ihm gegen\u00fcber vertrauensvoller.\n\n# Belege\n1. Session 2025-11-14, 00:14:48 \u2013 https://www.youtube.com/watch?v=8Khb-Y8XbKY", "npcs/horatio": "# Horatio\n\nHoratio ist ein menschlicher Adliger, der als \"Herr des Hauses\" \u00fcber ein verfallenes Anwesen herrscht. Er hat dieses Anwesen gemeinsam mit einer Gruppe von Goblins wieder aufgebaut und instand gesetzt.\n\n## Begegnung mit der Gruppe\n\nHoratio zeigte sich verhandlungsbereit und handelte einen friedlichen Vertrag mit der Gruppe aus. Im Rahmen dieser Vereinbarung \u00fcbergab er [Rotunas](../characters/rotunas.md) ein magisches Amulett, das f\u00fcr die Tore des Anwesens bestimmt ist.\n\n# Belege\n\n1. Session 2025-11-14, 00:16:33 \u2013 https://www.youtube.com/watch?v=8Khb-Y8XbKY", "npcs/hubert": "# Hubert\n\n**Typ:** NPC  \n**Rolle:** Wirt der Dorftaverne\n\n## Beschreibung\n\nHubert ist der freundliche Wirt der \u00f6rtlichen Taverne. Er bewirtet seine G\u00e4ste mit Bier und Wein und bietet H\u00fchnerkeulen als Proviant f\u00fcr Reisende an.\n\n## Auftritte\n\n- **Session 2025-04-09:** Die Gruppe begegnete Hubert in der Dorftaverne, wo er sie mit Getr\u00e4nken und Proviant versorgte.\n\n## Belege\n\n1. Session 2025-04-09 @ 00:46:13 \u2013 https://www.youtube.com/watch?v=1PWdwvun5ow", "npcs/joar_vanur": "# Joar Vanur\n\nJoar Vanur ist der reiche und m\u00e4chtige Chef der Sanddorninseln. Er beauftragte die Gruppe damit, den gefangenen Kenku [Gulrak](gulrak.md) zu verh\u00f6ren. Als die Gruppe Informationen \u00fcber eine Kirche vor ihm zur\u00fcckhielt, zeigte er sich ver\u00e4rgert.\n\n# Belege\n1. Session 2025-04-30 @ 00:59:57 (https://www.youtube.com/watch?v=fsCOiSkKKTE)", "npcs/kaept_n_lobrecht": "# K\u00e4pt'n Lobrecht\n\nK\u00e4pt'n Lobrecht ist ein Kapit\u00e4n, der gemeinsam mit [Miaomani](miaomani.md) unterwegs ist.\n\n## Wissen \u00fcber die Region Breska\n\nLobrecht best\u00e4tigt, dass die Gegend um [Breska](../locations/breska.md) aufgrund von Untoten unpassierbar ist. Zudem berichtet er, dass die Stadt keine Hilfe von au\u00dfen annehmen will.\n\n# Belege\n1. Session 2025-11-18, 01:28:51, https://www.youtube.com/watch?v=w__ahowb9p0", "npcs/kahnfuehrer_lobrecht": "# Kahnf\u00fchrer Lobrecht\n\n*Kapit\u00e4n des Schiffes zur Insel*\n\n## Allgemein\n\nKahnf\u00fchrer Lobrecht ist der Kapit\u00e4n des Schiffes, mit dem die Gruppe zur Insel gereist ist.\n\n## Beziehungen\n\nLobrecht brachte die gesamte Gruppe, bestehend aus [Dodo](../characters/dodo.md), [Gerrang](../characters/gerrang.md), [Korvin](../characters/korvin.md), [Luribuk](../characters/luribuk.md) und [Talon](../characters/talon.md), auf die Insel.\n\n# Belege\n\n1. Session 2025-05-06, 00:03:04 \u2013 https://www.youtube.com/watch?v=e0v6AFGd4mE", "npcs/kapitaen_lobrecht": "# Kapit\u00e4n Lobrecht\n\nKapit\u00e4n Lobrecht ist der Kapit\u00e4n des Schiffes, mit dem die Gruppe reist. W\u00e4hrend eines Konflikts mit Dorfsoldaten wurden er und seine Begleiterin [Miaomani](miaomani.md) schwer verletzt. Beide wurden anschlie\u00dfend von [Lindo Laut](../characters/lindo_laut.md) geheilt.\n\n# Belege\n1. Session 2025-07-29 @ 00:04:14 (https://www.youtube.com/watch?v=XXgO5Ht4Q0A)", "npcs/kenku_hexenmeister": "# Kenku-Hexenmeister\n\nDer Kenku-Hexenmeister war ein rabenartiger Magier, der als Anf\u00fchrer einer Gruppe von Assassinen agierte.\n\n## F\u00e4higkeiten & Kampfstil\nIm Kampf setzte er eine Vielzahl m\u00e4chtiger arkener Techniken ein:\n*   **Lila Energiestrahlen**: Sein prim\u00e4rer magischer Angriff.\n*   **Teleportation**: Erlaubte ihm, sich schnell \u00fcber das Schlachtfeld zu bewegen.\n*   **Dimensionsbarrieren**: Wurden defensiv eingesetzt, um Angriffe abzuwehren.\n*   **Magische Tentakeln**: Dienten zur Kontrolle des Kampfes und zum Angriff auf Gegner.\n\n## Schicksal\nDer Kenku-Hexenmeister wurde im Kampf durch das vereinte Eingreifen der Helden und der Stadtwache get\u00f6tet.\n\n# Belege\n1.  Session 2025-07-22 @ 01:52:22 (https://www.youtube.com/watch?v=BRRCUgW4xRo)", "npcs/kerl": "# Kerl\n\nKerl ist ein ehemaliger Dorfw\u00e4chter von [D\u00f6rfchen](../locations/doerfchen.md), der sp\u00e4ter in den Dienst des Grafen getreten ist.\n\n## Pers\u00f6nlichkeit & Verhalten\n\n*   Ist neuen Gesichtern gegen\u00fcber grunds\u00e4tzlich misstrauisch eingestellt.\n*   Besteht auf offizielle Best\u00e4tigungen, bevor er Fremden Zutritt zu Autorit\u00e4tspersonen gew\u00e4hrt.\n\n## Werdegang\n\n*   **Dorfw\u00e4chter:** War einer der beiden W\u00e4chter in [D\u00f6rfchen](../locations/doerfchen.md). Er verlangte von den Neuank\u00f6mmlingen eine Best\u00e4tigung von [Tindrael](tindrael.md), bevor er ihnen erlaubte, den B\u00fcrgermeister aufzusuchen.\n*   **Leibgarde des Grafen:** Diente sp\u00e4ter als Leibgarde des Grafen. In dieser Funktion lie\u00df er die Gruppe zum Grafen vor, nachdem sie von einer Bedrohung berichtet hatten.\n\n# Belege\n1.  Session 2025-04-09 @ 00:17:25 (https://www.youtube.com/watch?v=1PWdwvun5ow)\n2.  Session 2025-06-25 @ 00:18:44 (https://www.youtube.com/watch?v=tpkO9uGw6-I)", "npcs/koenig_zebros": "# K\u00f6nig Zebros\n\nK\u00f6nig Zebros war der verstorbene Herrscher der Region, die nach ihm benannt ist. Sein Andenken wird durch eine Statue bewahrt, die in einer Ruine des Gebiets steht.\n\n# Belege\n1. Session 2025-05-14 @ 00:10:22 (https://www.youtube.com/watch?v=5eAEDN5ra-4)", "npcs/kol_meref": "# Kol Meref\n\nKol Meref ist eine gott\u00e4hnliche Entit\u00e4t, die in der oberen Etage der Kapelle verehrt wird. Sie steht in Verbindung mit [Lindo Lauts](../characters/lindo_laut.md) Amulett. Kol Meref wird als bedrohlich und fordernd dargestellt. Als [Nerash](../characters/nerash.md) befreit wird, greift die Entit\u00e4t die Gruppe an.\n\n# Belege\n1. Session 2025-07-09, 00:52:18, https://www.youtube.com/watch?v=XOnHa6CmDbo", "npcs/krevis": "# Krevis\n\nKrevis ist der oberste Feldherr und Hauptmann der Zwergenfestung. Er gilt als grimmiger Anf\u00fchrer, der einen tiefsitzenden Hass auf Goblins hegt und jegliche Zugest\u00e4ndnisse ihnen gegen\u00fcber strikt ablehnt.\n\n# Belege\n1. Session 2026-01-27 @ 00:13:53 (https://www.youtube.com/watch?v=9RzvnnWzV7E)", "npcs/kronos": "# Kronos\n\nKronos war ein toter Schamane und Kultist, der auf einer Liste der meistgesuchten Verbrecher stand. Die Gruppe fand seine Leiche und brachte sie nach Willauch, um das auf ihn ausgesetzte Kopfgeld zu kassieren. Da der Kopf der Leiche fehlte, wurde der ausgezahlte Preis gemindert.\n\n# Belege\n1. Session 2026-03-03 @ 00:02:32 (https://www.youtube.com/watch?v=BRUNuNKTeOg)", "npcs/kuatau_priester_anfuehrer": "# Kuatau-Priester (Anf\u00fchrer)\n\nEin gro\u00dfer Kuatau, der als Anf\u00fchrer der Angriffe fungiert. Er tr\u00e4gt einen magischen Stab bei sich und besitzt die F\u00e4higkeit, Kreaturen in weitere Kuatau zu verwandeln. Seine Sprachkenntnisse der Sprache der Charaktere sind zun\u00e4chst gebrochen, werden aber im Verlauf der Begegnung flie\u00dfend.\n\nNachdem er erkennt, dass die Hexe ihn get\u00e4uscht hat, hilft er den Charakteren, das Portal zu schlie\u00dfen.\n\n# Belege\n1. Session 2025-07-29, 01:30:10 \u2013 https://www.youtube.com/watch?v=XXgO5Ht4Q0A", "npcs/kultisten_des_varsul": "# Kultisten des Varsul\n\nEine Gruppe von Anh\u00e4ngern des Gottes [Varsul](../goetter/varsul.md), die sich in der N\u00e4he des Gipfels aufhalten.\n\n## Aktivit\u00e4ten\n\n*   Sie sp\u00fcren die Pr\u00e4senz der Gruppe um [Dodo](dodo.md).\n*   Sie versteinern [Dodo](dodo.md) teilweise.\n*   Sie bereiten einen Kampf gegen die Gruppe vor.\n\n# Belege\n\n1.  Session 2025-08-20 @ 01:18:33 (https://www.youtube.com/watch?v=-XbO3FLSL_I)", "npcs/kultistenanfuehrer_mage": "# Kultistenanf\u00fchrer (Mage)\n\nEin Kultist, der f\u00fcr die Versteinerung von [Dodo](../characters/dodo.md) verantwortlich war und die F\u00e4higkeit besa\u00df, Ghule zu beschw\u00f6ren. Er wurde von [Esterossa](../characters/esterossa.md) im Kampf bewusstlos geschlagen und gefesselt. Sp\u00e4ter wurde er von [Dodo](../characters/dodo.md) verbrannt.\n\n# Belege\n1. Session 2025-09-02, 00:08:08, https://www.youtube.com/watch?v=TLZOH7TlGhk", "npcs/lady_lyra_von_willoch": "# Lady Lyra von Willoch\n\nLady Lyra von Willoch ist eine Adlige, die der Gruppe bei ihrem Auftritt in der Stadt begegnete.\n\n## Pers\u00f6nlichkeit\n\nIm Gegensatz zu [Lord Kalidarn von Willoch](lord_kalidarn_von_willoch.md) zeigte sich Lady Lyra von [Cookie](../characters/cookie.md)'s magischer Lichtshow am Ende der Vorstellung sichtlich beeindruckt und applaudierte der Gruppe.\n\n# Belege\n\n1. Session 2025-10-21, 00:13:00 \u2013 https://www.youtube.com/watch?v=sxFhbtwoefA", "npcs/lara": "# Lara\n\nLara ist ein Mitglied der [Gilde der Schilder](../factions/gilde-der-schilder.md) in [Tiefwasser](../locations/tiefwasser.md).\n\n## Begegnung mit der Gruppe\nAuf dem Marktplatz von Tiefwasser sprach Lara die Gruppe an. Sie zeigte sich von [Brim](../characters/brim.md)s St\u00e4rke beeindruckt und unterbreitete den Abenteurern ein Auftragsangebot: Sie sollten ein Lager der [Silberkerne](../factions/silberkerne.md) angreifen.\n\n# Belege\n1. Session 2026-03-18, 00:27:34, https://www.youtube.com/watch?v=HHXxsASLrbQ", "npcs/lendras": "# Leandras\n\nEin menschlicher Magier, der zur\u00fcckgezogen im Dorf Windung lebt. Er ist wissbegierig und besch\u00e4ftigt, zeigt sich gegen\u00fcber Fremden jedoch oft abweisend. Sein Haus hat er mit magischen Runen gesichert.\n\nEr ist der Auftraggeber f\u00fcr die Verteidigung von Windung. Im Kampf setzt er m\u00e4chtige Zauber ein, darunter Teleportation, Feuerb\u00e4lle und Schlafzauber. Die j\u00fcngsten Ereignisse scheinen ihn zu verwirren, doch er bringt der Gruppe Respekt entgegen.\n\n# Belege\n1. Session 2025-04-09 @ 00:08:51 (https://www.youtube.com/watch?v=1PWdwvun5ow)\n2. Session 2025-07-29 @ 00:06:37 (https://www.youtube.com/watch?v=XXgO5Ht4Q0A)", "npcs/lendras_joseph": "# Lendras (Joseph)\n\nLendras, auch Joseph genannt, ist der Magier des Dorfes, in dem die Gruppe ihre Reise beginnt.\n\n## Rolle im Dorf\nEr lebt in einem Turm, der zu Beginn der Geschehnisse angegriffen wird.\n\n## Handlungen\n*   Lendras f\u00fchrt die Gruppe in die Katakomben unter dem Dorf.\n*   Er \u00f6ffnet dort ein magisches Tor.\n*   Durch seine Handlung erweckt er den Vampir [Voras](voras.md).\n\n# Belege\n1.  Session 2025-04-23 @ 01:32:25 (https://www.youtube.com/watch?v=z3C-bewKqUs)", "npcs/lenra": "# Lenra\n\nLenra ist eine m\u00e4chtige Nekromantin, die als \"Hack\" beschrieben wird. Sie residiert in einer Krypta.\n\n## Begegnung mit den Helden\nLenra begegnete [Dodo](../characters/dodo.md) und [Cookie](../characters/cookie.md) in ihrer Krypta. W\u00e4hrend dieser Begegnung schrumpfte sie die beiden. Anschlie\u00dfend entkam sie durch einen Altar.\n\n## Ziele\nLenra sucht einen Magier in Breska.\n\n# Belege\n1. Session 2025-04-15 @ 01:53:48 (https://www.youtube.com/watch?v=YCpAz_syjaY)", "npcs/lia": "# Lia\n\nLia ist eine Magierin und die Schwester von [Arus](arus.md). Sie war mitverantwortlich f\u00fcr die Erschaffung des Golems. Lia zeigte sich beeindruckt von [Rotunas](../characters/rotunas.md) als \u201eTrollschlechter\u201c.\n\n# Belege\n1. Session 2025-10-07 @ 00:03:00 (https://www.youtube.com/watch?v=qVAF_54S8Vw)", "npcs/lilly": "# Lilly\n\nLilly ist ein Sukkubus und arbeitet als Empfangsdame in der neuen Gilde. Sie ist nach eigener Aussage f\u00fcr \"jegliches Am\u00fcsement\" verf\u00fcgbar.\n\n# Belege\n1. Session 2025-09-17 @ 00:17:08 (https://www.youtube.com/watch?v=AhIT8dcxw2o)", "npcs/link": "# Link\n\n**Typ:** NPC (Wirt)\n**Spezies:** Mensch\n**Aufenthaltsort:** Das Anwesen\n\n## Kurzbeschreibung\nLink ist der menschliche Wirt des Anwesens. Er bewirtet seine G\u00e4ste mit Essen und Bier und verwendet ein s\u00fc\u00dfes Pilzsekret, um Wein zu s\u00fc\u00dfen.\n\n## Belege\n1. Session 2025-11-14, 00:29:37, https://www.youtube.com/watch?v=8Khb-Y8XbKY", "npcs/lionel_magno": "# Lionel Magno\n\nLionel Magno ist der \u00e4ltere Verwalter von [Crowfin Manor](../locations/crowfin_manor.md).\n\n## Rolle und Pers\u00f6nlichkeit\nEr f\u00fchrt Besucher durch das Anwesen und kennt sich mit dessen Geschichte aus. Lionel zeigt sich f\u00fcrsorglich gegen\u00fcber der Gruppe und ist bereit, sich f\u00fcr deren Schutz zu opfern.\n\n## Schicksal\nW\u00e4hrend eines Kampfes gegen [Slix](slix.md) stellt sich Lionel sch\u00fctzend vor die Gruppe. Er wird dabei get\u00f6tet.\n\n# Belege\n1. Session 2026-02-17, 00:14:27 \u2013 https://www.youtube.com/watch?v=Z2jlzpoTWVw", "npcs/lisa": "# Lisa\n\nEine Einheimische aus [Willau](../locations/willau.md), die der Gruppe aus [Ehrenfels](../locations/ehrenfels.md) bekannt ist.\n\n## Rolle in der Handlung\nLisa begegnete der Gruppe in Willau und versorgte sie mit Informationen \u00fcber die Stadt und das dort stattfindende Turnier.\n\n# Belege\n1. Session 2025-10-14 @ 00:32:38 (https://www.youtube.com/watch?v=cUtz87UCHu4)", "npcs/loran_silberbart": "# Loran Silberbart\n\nLoran Silberbart ist ein Zwerg, der an der Festung von [Lord Harik](lord_harik.md) stationiert ist.\n\n## Rolle und T\u00e4tigkeiten\n\n*   Empf\u00e4ngt ankommende Besucher an der Festung und f\u00fchrt sie durch die Anlage.\n*   Begleitet G\u00e4ste bei offiziellen Anl\u00e4ssen, wie beispielsweise Verhandlungen.\n*   Verteidigt [Lord Harik](lord_harik.md) und steht ihm zur Seite.\n\n# Belege\n1.  Session 2026-01-27 @ 00:05:25 (https://www.youtube.com/watch?v=9RzvnnWzV7E)", "npcs/lord_belorus": "# Lord Belorus\n\nEin m\u00e4chtiger untoter Lord in schwarzer R\u00fcstung, der die Kontrolle \u00fcber die Untoten aus\u00fcbt und die Stadt [Breska](../locations/breska.md) belagert. Er erscheint pers\u00f6nlich, um [Lindo Laut](lindo_laut.md) zu t\u00f6ten, da dieser ein g\u00f6ttliches Fragment in sich tr\u00e4gt, das einen neuen Krieg der G\u00f6tter ausl\u00f6sen k\u00f6nnte.\n\n# Belege\n1. Session 2026-01-13 @ 02:07:07 (https://www.youtube.com/watch?v=w4LB1s9_3rs)", "npcs/lord_harik": "# Lord Harik\n\nLord Harik ist der Zwergenf\u00fcrst, der \u00fcber die Region herrscht. Er tritt in einer prunkvollen R\u00fcstung auf und zeigt sich im Gegensatz zu seinem Hauptmann verhandlungsbereit. Sein vorrangiges Ziel ist es, Blutvergie\u00dfen zu vermeiden. Um dies zu erreichen, geht er das pers\u00f6nliche Risiko ein, direkt mit den Goblins zu verhandeln.\n\n# Belege\n1. Session 2026-01-27, 01:00:40, https://www.youtube.com/watch?v=9RzvnnWzV7E", "npcs/lord_kaledan_und_lady_lyra_von_willau": "# Lord Kaledan und Lady Lyra von Willau\n\n## Kurzbeschreibung\nDie Herrscher von Willau, die kunstvolle K\u00e4mpfe sch\u00e4tzen.\n\n## Rolle in der Kampagne\nLord Kaledan und Lady Lyra von Willau sind die adligen Herrscher der Region Willau. Sie haben ein St\u00fcck Land als Hauptpreis f\u00fcr den Solo-Champion eines Wettkampfs ausgelobt, was ihre Wertsch\u00e4tzung f\u00fcr kunstvolle K\u00e4mpfe unterstreicht.\n\n## Belege\n1. Session 2025-10-14, 00:38:07 \u2013 [YouTube](https://www.youtube.com/watch?v=cUtz87UCHu4)", "npcs/lord_kalidarn_von_willoch": "# Lord Kalidarn von Willoch\n\n*   **Typ:** NPC\n*   **Zugeh\u00f6rigkeit:** Herrscher von Willoch\n\n## Beschreibung\n\nLord Kalidarn von Willoch ist der Herrscher der Stadt Willoch. Er wird als emotionslos und schwer zu beeindrucken beschrieben.\n\n## Rolle in der Handlung\n\nW\u00e4hrend eines Aufenthalts der Gruppe in Willoch entschied Lord Kalidarn per Daumenzeichen \u00fcber das Schicksal eines Werwolfs. Selbst nach einem zweiten Sieg der Gruppe zeigte er sich weiterhin unbeeindruckt.\n\n## Belege\n\n1.  Session 2025-10-21, 00:14:00, [YouTube](https://www.youtube.com/watch?v=sxFhbtwoefA)", "npcs/lukas": "# Lukas\n\nEin freundlicher Goblin-Alchemist, der der Gruppe sein Haus zeigt und ihnen selbstgebraute Tr\u00e4nke anbietet. Zu seinem Sortiment geh\u00f6ren ein dubioser Heiltrank sowie ein Zaubertrank.\n\n---\n\n# Belege\n\n1. Session 2025-11-14, 00:09:48 \u2013 https://www.youtube.com/watch?v=8Khb-Y8XbKY", "npcs/luli": "# Luli\n\nLuli ist eine kleine, sanfte Pilzkreatur, die von der Hexe, der sogenannten \"gr\u00fcnen Dame\", gefangen gehalten wurde. Ihre Familie wurde von der Hexe in einen Kessel geworfen.\n\n## Befreiung und Tod\n\nLuli wurde von [Cookie](../characters/cookie.md) aus ihrer Gefangenschaft befreit. Kurz nach der Befreiung riss sie sich jedoch los und wurde von einer unbekannten Kreatur gefressen.\n\n# Belege\n\n1. Session 2025-06-17, 01:34:57 \u2013 https://www.youtube.com/watch?v=tl76B4V0io8", "npcs/lurk": "# Lurk\n\nLurk ist ein intelligenter Goblin-Anf\u00fchrer, der die erste Verhandlungsrunde zwischen den Goblins und der Gruppe anf\u00fchrt. Er zeigt sich w\u00e4hrend der Gespr\u00e4che \u00e4u\u00dferst misstrauisch und lehnt das Angebot von magischem Erz ab. Im Gegensatz zu den anderen Goblins ist Lurk am Ende der Verhandlungen als Einziger nicht vom Friedensschluss \u00fcberzeugt.\n\n# Belege\n1. Session 2026-01-27, 00:40:04, https://www.youtube.com/watch?v=9RzvnnWzV7E", "npcs/marktschreier": "# Marktschreier\n\nEin Nachrichtenverbreiter, der in der Taverne Neuigkeiten verk\u00fcndet.\n\n## Bekannte Auftritte\n- In einer Taverne, wo er Neuigkeiten verk\u00fcndete, darunter die milit\u00e4rische Aufr\u00fcstung in [Willau](../orte/willau.md), die Nachrichtensperre aus [Breska](../orte/breska.md) und die Sichtung von Untoten am Fu\u00dfe des Berges.\n\n# Belege\n1. Session 2025-11-18 @ 00:55:14 (https://www.youtube.com/watch?v=w__ahowb9p0)", "npcs/marus": "# Marus\n\nMarus ist der Anf\u00fchrer der [Silberkornbande](../factions/silberkornbande.md), die in der N\u00e4he der [Silbergruft](../locations/silbergruft.md) ihr Lager aufgeschlagen hat. Er begegnet Fremden zun\u00e4chst mit Misstrauen, zeigt sich jedoch kooperativ, sobald die Gruppe glaubhaft ihr Wissen \u00fcber die Bande unter Beweis stellt.\n\n# Belege\n1. Session 2026-02-24 @ 00:44:54 (https://www.youtube.com/watch?v=WOFArbwDDIQ)", "npcs/meister_grimm": "# Meister Grimm\n\nMeister Grimm ist ein zwergischer \u00dcberlebender, der durch den Verlust von [Prinz Bran](../characters/prinz_bran.md) gepr\u00e4gt ist. Er trauert um den gefallenen Prinzen und zeigt sich in seinem Auftreten leicht aufbrausend sowie misstrauisch gegen\u00fcber anderen.\n\n# Belege\n1. Session 2025-09-09 @ 01:21:36 (https://www.youtube.com/watch?v=Zl0qfuI6Goc)", "npcs/meister_pyrandras": "# Meister Pyrandras\n\nMeister Pyrandras ist ein goldener Dragonborn und ein hochrangiger W\u00e4chter der Gilde.\n\n## Rolle in der Gilde\nEr reagiert sofort auf den Alarm und \u00fcbernimmt die Organisation der Verteidigung. Gemeinsam mit seiner Magierin gelingt es ihm, die Dimensionsbarriere des Hexenmeisters zu durchbrechen.\n\n## Verbindungen\n- Mitglied der Gilde\n- Arbeitet mit einer Magierin zusammen\n- Steht im Konflikt mit dem Hexenmeister\n\n# Belege\n1. Session 2025-07-22 @ 02:06:20 (https://www.youtube.com/watch?v=BRRCUgW4xRo)", "npcs/miaomani": "# Miaomani\n\nMiaomani ist ein Mitglied der Besatzung von [Kapit\u00e4n Lobrecht](lobrecht.md). Sie ist mit einer Muskete bewaffnet.\n\n## Rolle in der Geschichte\n\nMiaomani beobachtete die Insel aus der Ferne und entdeckte dabei die vielen Fackeln. Sp\u00e4ter wurde sie zusammen mit Kapit\u00e4n Lobrecht von Dorfsoldaten angegriffen und dabei schwer verletzt.\n\n# Belege\n\n1. Session 2025-05-06 @ 00:03:04 (https://www.youtube.com/watch?v=e0v6AFGd4mE)\n2. Session 2025-07-29 @ 00:04:14 (https://www.youtube.com/watch?v=XXgO5Ht4Q0A)", "npcs/mil": "# Mil\n\nEin katzenartiger Berserker und zweifacher Solo-Champion. Mil steht [Lindo Laut](../characters/lindo_laut.md) misstrauisch gegen\u00fcber, da er eine d\u00e4monische Pr\u00e4senz in ihm sp\u00fcrt.\n\n# Belege\n1. Session 2025-10-14, 00:47:02 \u2013 https://www.youtube.com/watch?v=cUtz87UCHu4", "npcs/mimic": "# Mimic\n\nEin als riesige Muschel getarnter Mimic, der in der N\u00e4he des Strandes lauert.\n\n## Begegnung mit der Gruppe\n\nDer Mimic griff [Lindo Laut](../characters/lindo_laut.md) und [Cookie](../characters/cookie.md) an und verschlang Cookie beinahe. [Dodo](../characters/dodo.md) und [Rotunas](../characters/rotunas.md) rissen die Kreatur gemeinsam auf, woraufhin Dodo sie mit einem gezielten Schlag endg\u00fcltig zerst\u00f6rte.\n\n## Beute\n\nIm Inneren des Mimics fanden sich Gold sowie magische Handschuhe.\n\n# Belege\n\n1. Session 2025-06-10, 01:16:47 \u2013 https://www.youtube.com/watch?v=cLkCu3Iq3y8", "npcs/miner_demon": "# Miner Demon\n\nEin feuerbeschw\u00f6render D\u00e4mon, der den alten Gottheiten dient. Er ist ein intelligenter Gegner der Stufe 1 (Solo), der sich telepathischen Kommunikationsversuchen widersetzt \u2013 so blieben [Lindos](../characters/lindo.md) Versuche, mit ihm in Kontakt zu treten, erfolglos. Im Kampf setzt er verheerende Angriffe wie *Hellfire* und *Reaper* ein.\n\n# Belege\n1. Session 2025-05-27, 00:46:26 \u2013 https://www.youtube.com/watch?v=bamCIB_CkR8", "npcs/nai_ruk": "# Nai Ruk\n\nNai Ruk ist der Eisb\u00e4ren-Begleiter von [Nyrell](../characters/nyrella.md).\n\n## Verhalten\nIm Verlauf der bekannten Ereignisse zeigte Nai Ruk deutliche Anzeichen von Schmerz und Angst.\n\n# Belege\n1. Session 2025-09-02 @ 01:27:16 (https://www.youtube.com/watch?v=TLZOH7TlGhk)", "npcs/nairog": "# Nairog\n\nNairog ist der Eisb\u00e4r-Begleiter von [Nyrell](../characters/nyrella.md). Er wird als ihr Seelentier beschrieben. Bei den Nomaden sorgt seine Erscheinung f\u00fcr Erschrecken.\n\n# Belege\n1. Session 2025-08-12, 00:43:45, https://www.youtube.com/watch?v=vHIjua0BZ9Y", "npcs/nairog_nyruk": "# Nairog/Nyruk\n\n## Allgemein\nNairog/Nyruk ist der B\u00e4rengef\u00e4hrte von [Nyrell](../characters/nyrella.md). Er unterst\u00fctzt sie im Kampf und dient ihr als Reittier.\n\n## F\u00e4higkeiten & Rolle\n- Kampfunterst\u00fctzung\n- Reittier f\u00fcr Nyrella\n\n# Belege\n1. Session 2025-09-09 @ 00:10:54 (https://www.youtube.com/watch?v=Zl0qfuI6Goc)", "npcs/nairuk": "# Nairuk\n\nNairuk ist ein gro\u00dfer Eisb\u00e4r und der treue tierische Begleiter von [Nyrella](../npcs/nyrella.md) (auch Nairella genannt).\n\n## Rolle in der Gruppe\nNairuk agiert als Besch\u00fctzer und k\u00e4mpft in der ersten Reihe. Im Kampf gegen Untote wehrt er Angriffe ab [1] und kann auf Kommando selbst gro\u00dfe Gegner wie untote Tempelritter vernichten [4].\n\n## Verhalten\nGegen\u00fcber der Gruppe zeigt sich Nairuk nach belastenden Vorf\u00e4llen misstrauisch und besch\u00fctzend [5]. Auf die Nachricht von Cookies Tod reagiert er mit einem traurige
