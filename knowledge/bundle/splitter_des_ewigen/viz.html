": "# Uhoriaks\n\n**Typ:** Fraktion/Gottheit\n**Alias:** Die Vernichterin\n\n## Beschreibung\n\nUhoriaks ist eine uralte Gottheit oder Macht, die als \"Vernichterin\" bezeichnet wird. Ihr Symbol ist ein Auge, mit dem sie die Gruppe beobachtet.\n\n## Kultst\u00e4tten & Rituale\n\nIm Dungeon befinden sich ein Altar und eine Statue, die mit Uhoriaks in Verbindung stehen. Diese Kultst\u00e4tten scheinen Blutopfer zu fordern.\n\n## Verbindungen\n\n- Die Gruppe wurde von Uhoriaks durch ihr Symbol \u2013 ein Auge \u2013 beobachtet.\n\n---\n\n# Belege\n\n1. Session 2025-10-28, 00:28:07 \u2013 [YouTube](https://www.youtube.com/watch?v=V6NzNakqxXM)", "factions/untote_armee": "# Untote Armee\n\nEine Streitmacht von Untoten, die die Karawane angreift. Sie wird von einem m\u00e4chtigen Wesen angef\u00fchrt, das die F\u00e4higkeit besitzt, Gefallene wiederzubeleben.\n\n# Belege\n1. Session 2025-09-23, 00:28:20 \u2013 https://www.youtube.com/watch?v=DGzfqVigS0g", "factions/untote_horde_zebras": "# Untote Horde (Zebras)\n\nEine gro\u00dfe untote Bedrohung, die sich \u00fcber das Land ausbreitet und gegen die die Helden k\u00e4mpfen. Die Horde besteht aus verschiedenen untoten Kreaturen, darunter Skelett-Bogensch\u00fctzen und Nahk\u00e4mpfer, die gemeinsam angreifen.\n\n# Belege\n1. Session 2026-01-06, 00:12:18 - https://www.youtube.com/watch?v=VGw81seFvbo", "factions/varsul_warzul": "# Varsul / Warzul\n\n**Varsul**, auch **Warzul** genannt, ist eine g\u00f6ttliche Entit\u00e4t, die in vier Seelen gespalten wurde. Diese vier Seelen befinden sich im Amulett von [Lindo Laut](../characters/lindo_laut.md).\n\n## Anh\u00e4ngerschaft\n\nDie Kultisten, die auf dem Gipfel angetroffen wurden, verehren diese Entit\u00e4t und bezeichnen sie als **Varsurs**.\n\n---\n\n# Belege\n\n1. Session 2025-08-20, 01:26:45 \u2013 [YouTube](https://www.youtube.com/watch?v=-XbO3FLSL_I)", "factions/vorgulta": "# Vorgulta\n\n**Herr der Tausend Seelen**\n\n## Allgemein\n\nVorgulta ist ein alter Gott, der im gro\u00dfen Krieg in Abyssalis k\u00e4mpfte. Er ist unter dem Titel \"Herr der Tausend Seelen\" bekannt.\n\n## \u00dcberlieferung\n\nEin Buch von [Tyrael](../npcs/tyrael.md) befasst sich mit Vorgulta. Darin wird der Gott wohlwollender beschrieben, als man es gemeinhin erwarten w\u00fcrde. Das Werk enth\u00e4lt zudem Anleitungen zur Seelenmagie.\n\n# Belege\n\n1. Session 2026-03-03, 01:21:46 \u2013 https://www.youtube.com/watch?v=BRUNuNKTeOg", "factions/zwerge": "# Zwerge\n\nDie Zwerge sind die Bewohner der Festung, angef\u00fchrt von [Lord Harik](../npcs/lord_harik.md) und [Hauptmann Krevis](../npcs/hauptmann_krevis.md). Sie sind geschickte Handwerker und Schmiede, die das magische Erz der Minen abbauen und verarbeiten.\n\n# Belege\n- [1] Session 2026-01-27 @ 00:00:59 (https://www.youtube.com/watch?v=9RzvnnWzV7E)", "items/amulett": "# Amulett\n\nEin magisches Amulett, das einst die Seelen von [Tyrex](../npcs/tyrex.md), [Esua](../npcs/esua.md) und [Sintra](../npcs/sintra.md) in sich trug. Es befand sich im Besitz von [Lindo](../npcs/lindo.md).\n\nNachdem die b\u00f6sartigen Seelen vernichtet wurden, f\u00fchlt sich das Amulett nun leer an.\n\n# Belege\n1. Session 2025-09-02, 00:59:05 \u2013 https://www.youtube.com/watch?v=TLZOH7TlGhk", "items/amulett_des_heiligen_duran": "# Amulett des Heiligen Duran\n\nEin m\u00e4chtiges Artefakt, das von der Priesterin [Auranil](../npcs/auranil.md) \u00fcbergeben wurde. Es verlieh [Lindo Laut](../characters/lindo_laut.md) genug Kraft, um ein Portal zur Flucht zu erschaffen.\n\n# Belege\n1. Session 2025-05-06, 01:30:45 - https://www.youtube.com/watch?v=e0v6AFGd4mE", "items/amulett_des_lindo_laut": "# Amulett des Lindo Laut\n\n## \u00dcberblick\nDas Amulett des Lindo Laut ist ein m\u00e4chtiger, verderbter Gegenstand, der eine direkte Verbindung zum Gott [Warzul](../g\u00f6tter/warzul.md) herstellt. Es enth\u00e4lt die gebundenen Stimmen dreier Wesen, die seinen Tr\u00e4ger unabl\u00e4ssig zu Gewalttaten und Opferungen antreiben.\n\n## Eigenschaften\n- **Enthaltene Stimmen:** Drei Wesen, darunter [Esua](../npcs/esua.md)\n- **Einfluss:** Dr\u00e4ngt den Tr\u00e4ger zu Opferungen und Machtergreifung\n- **Konkrete Aufforderung:** Fordert Lindo Laut auf, in ein Herz zu bei\u00dfen\n- **G\u00f6ttliche Verbindung:** Steht in Verbindung mit dem Gott [Warzul](../g\u00f6tter/warzul.md)\n\n## Wirkung\nDas Amulett \u00fcbt einen korrumpierenden Einfluss auf seinen Tr\u00e4ger aus. Die drei darin gefangenen Stimmen fl\u00fcstern dem Tr\u00e4ger unabl\u00e4ssig zu und treiben ihn zu immer extremeren Taten an, um Macht zu erlangen.\n\n---\n\n# Belege\n1. Session 2025-08-20, 00:07:30 \u2013 [YouTube](https://www.youtube.com/watch?v=-XbO3FLSL_I)", "items/amulett_von_duran": "# Amulett von Duran\n\nEin m\u00e4chtiges Artefakt, das von [Rotunas](../npcs/rotunas.md) getragen wird. Es besitzt die F\u00e4higkeit, Seelen zu enthalten, und verleiht seinem Tr\u00e4ger Macht, \u00fcbt jedoch einen korrumpierenden Einfluss auf ihn aus.\n\n## Aktueller Zustand\n\nNach dem Kampf in der Buchebene hat sich das Amulett \u00e4u\u00dferlich ver\u00e4ndert: Es ist nun verdunkelt und weist einen tief dunkelroten Punkt auf. In seinem Inneren befinden sich gegenw\u00e4rtig vier Seelen.\n\n# Belege\n\n1. Session 2025-06-25, 00:29:17 \u2013 https://www.youtube.com/watch?v=tpkO9uGw6-I", "items/amulett_von_lindo_laut": "# Amulett von Lindo Laut\n\nEin magisches Amulett, das [Lindo Laut](../npcs/lindo_laut.md) geh\u00f6rt. Es beherbergt mehrere Wesenheiten in seinem Inneren. In der N\u00e4he des Tempels wird das Amulett st\u00e4rker, und die darin enthaltenen Stimmen dr\u00e4ngen Lindo Laut zu einem Opfer.\n\n# Belege\n1. Session 2025-08-12, 00:51:52, https://www.youtube.com/watch?v=vHIjua0BZ9Y", "items/angriffsplan": "# Angriffsplan\n\nEin Dokument, das nach dem Sieg der Gruppe im Goblindorf aufgefunden wurde. Es handelt sich um eine Karte, die einen geplanten Angriff auf ein nahegelegenes Dorf zeigt \u2013 jenes Dorf, aus dem die Gruppe urspr\u00fcnglich stammt.\n\n# Belege\n1. Session 2025-04-01 @ 01:59:22 (https://www.youtube.com/watch?v=LZIuUzc3F18)", "items/arkaner_umhang": "# Arkaner Umhang\n\nEin Umhang mit Kapuze, der seine Farbe nach Wunsch des Tr\u00e4gers \u00e4ndern kann. Er wurde von [Dodo](../characters/dodo.md) im Turm gefunden.\n\n# Belege\n1. Session 2025-06-10, 00:21:36 \u2013 https://www.youtube.com/watch?v=cLkCu3Iq3y8", "items/arkanes_prisma": "# Arkanes Prisma\n\nEin einmalig nutzbarer magischer Stein, der die Wirkung von Zauberrollen verst\u00e4rkt.\n\n## Eigenschaften\n- Gew\u00e4hrt allen Zauberrollen einen Bonus von +1\n- Einmalige Verwendung\n\n## Geschichte\nDas Arkanen Prisma wurde von [Lindo Laut](../characters/lindo_laut.md) im Turm gefunden.\n\n# Belege\n1. Session 2025-06-10 @ 00:20:24 (https://www.youtube.com/watch?v=cLkCu3Iq3y8)", "items/armbrust_von_berthold": "# Armbrust von Berthold\n\nEine \u00fcbergro\u00dfe Armbrust, die [Valeria](../characters/valeria.md) von [B\u00fcrgermeister Berthold](../npcs/berthold.md) erwirbt. Die Waffe ist so gro\u00df wie Valeria selbst und wird daher von [Rotunas](../characters/rotunas.md) getragen. Der Kaufpreis betr\u00e4gt eine Handvoll Gold.\n\n# Belege\n1. Session 2025-04-09 @ 00:37:06 (https://www.youtube.com/watch?v=1PWdwvun5ow)", "items/artefakt_kugel": "# Artefakt-Kugel\n\nEine tennisballgro\u00dfe, silberne Kugel, die in der Tiefe der Mine schwebend vorgefunden wurde. Nach ihrer Bergung entdeckte [Nyrella](../characters/nyrella.md), dass sich die Kugel aktivieren l\u00e4sst. Bei Aktivierung erschafft sie zwei illusion\u00e4re Doppelg\u00e4ngerinnen der Anwenderin.\n\n---\n\n# Belege\n1. Session 2026-02-24, 02:15:26 \u2013 [YouTube](https://www.youtube.com/watch?v=WOFArbwDDIQ)", "items/auftragsschriftrolle": "# Auftragsschriftrolle\n\nEine Schriftrolle, die einen inoffiziellen Eil-Mordauftrag enth\u00e4lt. Sie wurde beim Attent\u00e4ter gefunden, der es auf [Rotunas](../characters/rotunas.md) abgesehen hatte.\n\nAuf der Rolle sind Rotunas' Name sowie eine Zeichnung von ihm vermerkt. Ein Auftraggeber ist nicht angegeben.\n\n# Belege\n1. Session 2025-09-17 @ 01:53:24 (https://www.youtube.com/watch?v=AhIT8dcxw2o)", "items/beschwoerungsbuch": "# Beschw\u00f6rungsbuch\n\nEin Buch, das der Anf\u00fchrer der Kultisten bei sich trug. Nach dem Kampf gegen die Kultisten nahm [Lindo Laut](../characters/lindo_laut.md) das Buch an sich.\n\n# Belege\n1. Session 2025-09-02 @ 00:53:15 (https://www.youtube.com/watch?v=TLZOH7TlGhk)", "items/beschwoerungsfluessigkeit": "# Beschw\u00f6rungsfl\u00fcssigkeit\n\nEine brodelnde Substanz, die aus einem Kessel stammt und f\u00fcr ein Ritual ben\u00f6tigt wird.\n\n## Eigenschaften\n- Brodelnde Konsistenz\n- Befindet sich in einem Kessel\n\n## Verwendung\n- Wird f\u00fcr ein Ritual ben\u00f6tigt\n\n## Bekannte Vorkommnisse\n- [Barde](../characters/barde.md) erwog, die Fl\u00fcssigkeit abzuf\u00fcllen\n\n# Belege\n1. Session 2025-03-26 @ 01:49:37 (https://www.youtube.com/watch?v=ROCKGeeRUFw)", "items/beschwoerungsstab": "# Beschw\u00f6rungsstab\n\nEin gef\u00e4hrliches Artefakt, das von einer vernichteten Splitterwelt-Kreatur zur\u00fcckgelassen wurde. Der Stab dient dazu, Kreaturen aus anderen Reichen zu beschw\u00f6ren. [Lindo Laut](../characters/lindo_laut.md) kann ihn gefahrlos an sich nehmen.\n\n# Belege\n1. Session 2025-11-25, 00:56:25 \u2013 https://www.youtube.com/watch?v=wd5R4fJfngY", "items/buch_der_namen": "# Buch der Namen\n\nEin mysteri\u00f6ses Buch, das [Lindo Laut](../characters/lindo_laut.md) in einer fr\u00fcheren Session gefunden hat. Es enth\u00e4lt Aufzeichnungen von Namen, darunter den Eintrag \"Voras der Schrecken\". Dieser Eintrag erwies sich als n\u00fctzlich bei der Identifizierung des richtigen Sarges.\n\n# Belege\n1. Session 2025-04-23 @ 01:48:15 (https://www.youtube.com/watch?v=z3C-bewKqUs)", "items/buch_flueche_und_das_schweigen": "# Fl\u00fcche und das Schweigen\n\nEin wertvolles Buch, das von [Safin Al Barak](../npcs/safin_al_barak.md) restauriert wurde. Es enth\u00e4lt eine Sammlung von Fl\u00fcchen und ist besonders f\u00fcr eine Hexe geeignet. Unter den enthaltenen Fl\u00fcchen befindet sich einer, der eine Person \u00fcber einen l\u00e4ngeren Zeitraum hinweg in den Wahnsinn treibt.\n\n# Belege\n1. Session 2026-03-03, 01:23:57 \u2013 https://www.youtube.com/watch?v=BRUNuNKTeOg", "items/buch_mit_namensliste": "# Buch mit Namensliste\n\nEin in der Krypta aufgefundenes Buch, das eine Auflistung von Namen enth\u00e4lt. Die letzten Eintr\u00e4ge in dieser Liste \u2013 [Grog](../characters/grog.md) und [Greg](../characters/greg.md) \u2013 wirkten zum Zeitpunkt der Entdeckung noch frisch.\n\n# Belege\n1. Session 2025-04-15, 01:18:57 \u2013 https://www.youtube.com/watch?v=YCpAz_syjaY", "items/buch_von_vasul": "# Buch von Vasul\n\nEin mysteri\u00f6ses Buch, das Runen enth\u00e4lt, die jenen von [Lunara](../npcs/lunara.md) \u00e4hneln. Es steht in Verbindung mit der Splitterwelt.\n\n## Geschichte\nDas Buch wurde von [Lindo Laut](../npcs/lindo_laut.md) genutzt, um seine Aufrichtigkeit gegen\u00fcber [Belorus](../npcs/belorus.md) zu beweisen, indem er es diesem vor die F\u00fc\u00dfe warf.\n\n# Belege\n1. Session 2026-01-20, 01:39:46, https://www.youtube.com/watch?v=H3ckYdTv4y8", "items/cookies_roter_trank": "# Cookies roter Trank\n\nEin alchemistisches Gebr\u00e4u in einer Viole, das [Cookie](../characters/cookie.md) von einem Alchemisten erhielt. Die rote Fl\u00fcssigkeit soll den Trinkenden widerstandsf\u00e4higer, st\u00e4rker und mutiger machen.\n\n## Wirkung\n\nDer Trank l\u00f6ste den Film in [Lindo Lauts](../npcs/lindo_laut.md) Rachen auf und rettete ihm damit das Leben.\n\n# Belege\n\n1. Session 2025-08-20 @ 00:56:02 (https://www.youtube.com/watch?v=-XbO3FLSL_I)", "items/daemon_in_lindo_laut": "# D\u00e4mon in Lindo Laut\n\nEine b\u00f6sartige, d\u00e4monische Pr\u00e4senz, die in Lindo Laut von [Mil](../characters/mil.md) und [Tyrael](../characters/tyrael.md) entdeckt wurde. Es besteht eine m\u00f6gliche Verbindung zu dem Gott [Basul](../gods/basul.md).\n\n# Belege\n1. Session 2025-10-14, 01:02:21 \u2013 https://www.youtube.com/watch?v=cUtz87UCHu4", "items/das_amulett": "# Das Amulett\n\nEin m\u00e4chtiges und gef\u00e4hrliches Artefakt, das sich derzeit im Besitz von [Lindo Laut](../characters/lindo_laut.md) befindet. Es enth\u00e4lt die Seelenst\u00fccke von urspr\u00fcnglich vier alten G\u00f6ttern, von denen aktuell noch drei vorhanden sind: Koll, Glut und ein weiterer, namentlich nicht genannter Gott. Das Amulett verleiht seinem Tr\u00e4ger Macht, birgt jedoch die Gefahr, dass die darin gefangenen Wesen an St\u00e4rke gewinnen, je weniger von ihnen \u00fcbrig sind.\n\nZudem besitzt das Amulett die F\u00e4higkeit, Tore zum Keller und zum Dungeon zu \u00f6ffnen und zu verschlie\u00dfen. Es wurde urspr\u00fcnglich von [Horatio](../characters/horatio.md) gefunden, der es sp\u00e4ter an [Rotunas](../characters/rotunas.md) \u00fcbergab.\n\n# Belege\n1. Session 2025-07-22 @ 02:44:20 (https://www.youtube.com/watch?v=BRRCUgW4xRo)\n2. Session 2025-11-14 @ 00:58:04 (https://www.youtube.com/watch?v=8Khb-Y8XbKY)", "items/das_buch": "# Das Buch\n\n## Allgemein\n\nDas Buch ist ein mysteri\u00f6ses Artefakt, das [Lunara](../npcs/lunara.md) vor zw\u00f6lf Jahren [Voras](../npcs/voras.md) als Dank \u00fcberreichte. Es handelte sich um ein verschlossenes Buch, das \u00fcber lange Zeit nicht ge\u00f6ffnet werden konnte.\n\n## \u00d6ffnung\n\nDie \u00d6ffnung des Buches gelang erst durch den Einsatz eines Hexenartefakts. Dieser Vorgang hatte schwerwiegende Konsequenzen: Er f\u00fchrte zum Erwachen von [Belorus](../npcs/belorus.md) und in der Folge zur Zerst\u00f6rung von [Breska](../locations/breska.md).\n\n## Eigenschaften\n\n- Urspr\u00fcnglich ein Geschenk von Lunara an Voras\n- War \u00fcber zw\u00f6lf Jahre hinweg verschlossen\n- Konnte nur mit einem Hexenartefakt ge\u00f6ffnet werden\n- Seine \u00d6ffnung l\u00f6ste katastrophale Ereignisse aus\n\n# Belege\n\n1. Session 2026-03-10 @ 01:09:03 (https://www.youtube.com/watch?v=Kr9_AC2XtOw)", "items/das_buch_des_belorus": "# Das Buch des Belorus\n\n*   **Typ:** Buch / Schriftst\u00fcck\n*   **Besitzer:** [Belorus](../npcs/belorus.md) (ehemals)\n*   **Fundort:** Gem\u00e4cher des Todesritters\n\nEin selbstgeschriebenes Buch aus den Gem\u00e4chern des [Todesritters](../npcs/belorus.md). Es enth\u00fcllt die wahre Identit\u00e4t des Todesritters als gefallener Paladin und ehemaliger General von [Zebros](../npcs/zebros.md).\n\n# Belege\n1.  Session 2025-05-14, 01:16:06, https://www.youtube.com/watch?v=5eAEDN5ra-4", "items/das_tagebuch": "# Das Tagebuch\n\nEin Buch, das [Cookie](../characters/cookie.md) und [Dodo](../characters/dodo.md) zuvor gestohlen haben. Die Gruppe vermutet, dass die Untoten auf der Suche nach diesem Gegenstand sind.\n\n# Belege\n1. Session 2025-09-30 @ 00:56:23 (https://www.youtube.com/watch?v=bUT7Mc2hjUY)", "items/der_altar": "# Der Altar\n\nEin alter Opferaltar, der sich im Keller eines Geb\u00e4udes befindet. Auf ihm brennt eine ewige Flamme, die magisch aufgeladen ist und in der Nacht zu brummen beginnt. Der Altar scheint mit einem Kult der alten G\u00f6tter in Verbindung zu stehen.\n\n# Belege\n1. Session 2025-11-14, 00:53:34, https://www.youtube.com/watch?v=8Khb-Y8XbKY", "items/der_altar_des_uhoriaks": "# Der Altar des Uhoriaks\n\nEin Altar, der mit dem Symbol von [Uhoriaks](../glaube/uhoriaks.md) versehen ist und \u00fcber ein Pendel verf\u00fcgt.\n\n## Bekannte Eigenschaften\n\nDer Altar reagiert auf Blutopfer. Als [Cookie](../charaktere/cookie.md) ihr Blut auf den Altar tropfen lie\u00df, wurde ihre Hand mit starker Kraft in Richtung des Pendels gezogen. Dies deutet darauf hin, dass f\u00fcr eine vollst\u00e4ndige Aktivierung ein gr\u00f6\u00dferes Opfer erforderlich ist.\n\n# Belege\n1. Session 2025-10-28 @ 01:23:29 (https://www.youtube.com/watch?v=V6NzNakqxXM)", "items/der_brennende_speer": "# Der brennende Speer\n\nEine magische Waffe, die in einem kalten Feuer auf dem Vorhof steckte und von roten, magischen Ketten gehalten wurde. Der Speer wurde von [Valeria](../characters/valeria.md) aus seiner Verankerung befreit.\n\nSp\u00e4ter setzte [Esterossa](../characters/esterossa.md) den Speer ein, um die Ketten von [Nerash](../npcs/nerash.md) zu zerschlagen.\n\n# Belege\n1. Session 2025-07-09 @ 00:18:12 (https://www.youtube.com/watch?v=XOnHa6CmDbo)", "items/der_heilige_dolch": "# Der heilige Dolch\n\nEine von [Dodo](../characters/dodo.md) nach den Pl\u00e4nen des Zwergs [Bullrin](../npcs/bullrin.md) gefertigte Waffe.\n\n## Anwendung\nUm die untoten Kreaturen im Dungeon endg\u00fcltig vernichten zu k\u00f6nnen, muss der Dolch mit heiligem \u00d6l getr\u00e4nkt und an der blauen Flamme entz\u00fcndet werden.\n\n# Belege\n1. Session 2025-10-28 @ 01:36:45 (https://www.youtube.com/watch?v=V6NzNakqxXM)", "items/der_teleportationsring": "# Der Teleportationsring\n\nEin magischer Ring, der von der Gruppe vom toten Kenku-Hexenmeister geborgen wurde. Der Ring erlaubt es seinem Tr\u00e4ger, einmal pro kurzer Rast eine Teleportation bis zu einer Reichweite von \"very far\" durchzuf\u00fchren.\n\n# Belege\n1. Session 2025-07-22 @ 02:37:13 (https://www.youtube.com/watch?v=BRRCUgW4xRo)", "items/der_thron": "# Der Thron\n\n*   **Typ:** Artefakt\n*   **Status:** In Besitz der Gruppe, unerforscht\n\n## Beschreibung\n\nEin m\u00e4chtiger, b\u00f6ser Thron, den die Gruppe aus dem Heiligtum bergen sollte.\n\n## Geschichte\n\nDer Thron wurde von der Gruppe durch ein Portal transportiert. Eine genauere Untersuchung des Artefakts steht noch aus.\n\n# Belege\n1.  Session 2025-09-06 @ 00:50:04 (https://www.youtube.com/watch?v=vo1xnyLQDJk)", "items/die_blaue_flamme": "# Die blaue Flamme\n\nEine seltsame, blaue Flamme, die in einem kleinen Raum existiert und den Anschein erweckt, sich in einer anderen Dimension zu befinden. Sie dient einem bestimmten rituellen Zweck: An ihr muss der pr\u00e4parierte Dolch entz\u00fcndet werden.\n\n# Belege\n1. Session 2025-10-28, 01:07:20 - https://www.youtube.com/watch?v=V6NzNakqxXM", "items/die_drachenstatue": "# Die Drachenstatue\n\nEine Statue, die sich in einem sporenfreien Raum befindet. Sie strahlt eine sch\u00fctzende Aura aus. Auf der Statue ist eine Inschrift angebracht, die \"Das Blut des Heiligen Drachens\" erw\u00e4hnt. Der Hauptgegner versuchte, [Cookie](../characters/cookie.md) dazu zu zwingen, die Statue zu zerst\u00f6ren.\n\n# Belege\n1. Session 2025-10-28 @ 02:01:47 (https://www.youtube.com/watch?v=V6NzNakqxXM)", "items/die_ringe": "# Die Ringe\n\n**Typ:** Magisches Artefakt (Schmiedewerk)\n**Sch\u00f6pfer:** [Nox](../npcs/nox.md) und [Voras](../npcs/voras.md)\n**Tr\u00e4ger:** [Lindo Laut](../npcs/lindo_laut.md)\n\n## Beschreibung\nVon Nox und Voras geschmiedete Ringe, die an Lindo Lauts Handgelenken getragen werden.\n\n## Funktion\nDie Ringe sollen einen Weltenwechsel entweder erm\u00f6glichen oder verhindern \u2013 die genaue Wirkungsweise ist nicht abschlie\u00dfend gekl\u00e4rt. Ihr Funktionieren war der zentrale Grund f\u00fcr den Testlauf in der Splitterwelt.\n\n# Belege\n1. Session 2026-03-10, 01:03:17 \u2013 https://www.youtube.com/watch?v=Kr9_AC2XtOw", "items/drei_saecke_gold": "# Drei S\u00e4cke Gold\n\n## Allgemein\n- **Typ:** Beute / W\u00e4hrung\n- **Besitzer:** [Die Gruppe](../characters/gruppe.md)\n\n## Beschreibung\nDrei S\u00e4cke voller Gold, die von der Gruppe in den sp\u00e4teren R\u00e4umen eines nicht n\u00e4her bezeichneten Ortes erbeutet wurden.\n\n## Erlangung\nDas Gold wurde w\u00e4hrend der Erkundung sp\u00e4terer R\u00e4ume gefunden und von der Gruppe als Beute mitgenommen.\n\n---\n\n# Belege\n1. Session 2025-06-17, 01:51:22 \u2013 [YouTube](https://www.youtube.com/watch?v=tl76B4V0io8)", "items/ekliges_fleischstueck": "# Ekliges Fleischst\u00fcck\n\n## Beschreibung\nEin brauner Brei.\n\n## Wirkung\nWird von [Tyrael](../characters/tyrael_lindo.md) dem D\u00e4mon in ihm verabreicht, um diesen f\u00fcr eine Weile zu stillen.\n\n# Belege\n1. Session 2025-10-14 @ 01:31:35 (https://www.youtube.com/watch?v=cUtz87UCHu4)", "items/ender_truhe": "# Ender-Truhe\n\nEine magische Truhe, die \u00fcber ein verborgenes Fach verf\u00fcgt. Dieses geheime Fach l\u00e4sst sich nur durch die Verwendung eines spezifischen Kommandowortes \u00f6ffnen.\n\n[Cookie](../characters/cookie.md) entdeckte diese Truhe im Turm.\n\n# Belege\n1. Session 2025-06-10 @ 00:22:14 (https://www.youtube.com/watch?v=cLkCu3Iq3y8)", "items/fahndungsplakat": "# Fahndungsplakat\n\nEin von [Esterossa](../characters/esterossa.md) gefundenes Dokument. Es zeigt das Bild eines Gnolls und verspricht eine Belohnung von \"vier H\u00e4nden\".\n\n# Belege\n1. Session 2025-09-23 @ 00:05:52 (https://www.youtube.com/watch?v=DGzfqVigS0g)", "items/fangzahn_amulett": "# Fangzahn-Amulett\n\nEin magisches Amulett, das einem vampir\u00e4hnlichen Gebiss \u00e4hnelt, wobei nur die oberen Fangz\u00e4hne vorhanden sind. Es strahlt eine sp\u00fcrbare magische Energie aus.\n\nDas Amulett wurde von [Lindo Laut](../characters/lindo_laut.md) hinter einem Gitter entdeckt.\n\n# Belege\n1. Session 2025-06-10, 01:44:35 \u2013 https://www.youtube.com/watch?v=cLkCu3Iq3y8", "items/gegengift": "# Gegengift\n\nEin universelles Gegengift, das gegen die \u00fcblichen Gifte des Sumpfes wirkt.\n\n## Eigenschaften\n\n- **Typ:** Heiltrank / Gegenmittel\n- **Wirkung:** Neutralisiert die \u00fcblichen Gifte des Sumpfes\n- **Preis:** Eine Handvoll Gold\n\n## Besitzer\n\n- [Esterossa](../characters/esterossa.md) erwarb das Gegengift f\u00fcr eine Handvoll Gold.\n\n# Belege\n1. Session 2025-06-03, 00:21:01 \u2013 https://www.youtube.com/watch?v=jtYR4Je0a18", "items/glamourstein": "# Glamourstein\n\nEin magischer Stein, der eine Illusion einer Person in der N\u00e4he erzeugen kann, um als Ablenkung zu dienen. Er wurde von [Rotunas](../characters/rotunas.md) im Turm gefunden.\n\n# Belege\n1. Session 2025-06-10, 00:19:24, https://www.youtube.com/watch?v=cLkCu3Iq3y8", "items/gluecksbringer": "# Gl\u00fccksbringer\n\nEin kleiner, gekerbter Stein, in den eine Rune eingraviert ist, die f\u00fcr \"Leben\" steht.\n\n## Besitzer\n- [Nyrella](../characters/nyrella.md) erhielt den Stein von einer Zwergin als Dank f\u00fcr ihre Gro\u00dfz\u00fcgigkeit.\n\n# Belege\n1. Session 2025-09-17, 01:03:07 - https://www.youtube.com/watch?v=AhIT8dcxw2o", "items/glueckstag_trank": "# Gl\u00fcckstag-Trank\n\nEin Trank mit der Aufschrift \"Gl\u00fcckstag\", der in einem der R\u00e4ume gefunden wurde.\n\n## Eigenschaften\n- **Effekt:** Unbekannt\n\n## Verbindungen\n- Wurde in einem der R\u00e4ume gefunden.\n\n# Belege\n1. Session 2025-06-17 @ 01:38:07 (https://www.youtube.com/watch?v=tl76B4V0io8)", "items/goblin_buch": "# Goblin-Buch\n\nEin Buch im Besitz von [Esterossa](../npcs/esterossa.md), das von [Rotunas](rotunas.md) genutzt wird, um w\u00e4hrend des Abenteuers bruchst\u00fcckhaft die Goblin-Sprache zu lernen.\n\n# Belege\n1. Session 2026-01-27 @ 00:21:57 (https://www.youtube.com/watch?v=9RzvnnWzV7E)", "items/goblin_notizen": "# Goblin-Notizen\n\nEin B\u00fcndel Aufzeichnungen, das die Helden bei einem get\u00f6teten Goblin-Sp\u00e4her fanden. Die Notizen enthielten eingezeichnete Angriffspunkte f\u00fcr einen geplanten \u00dcberfall auf das Dorf.\n\nDie Gruppe nutzte diese Informationen, um die Aufzeichnungen zu f\u00e4lschen und die Goblins damit in eine Falle zu locken.\n\n# Belege\n1. Session 2025-04-09, 01:26:22 \u2013 https://www.youtube.com/watch?v=1PWdwvun5ow", "items/goldene_perlen_goldbrocken": "# Goldene Perlen/Goldbrocken\n\n## Beschreibung\nGoldene Perlen oder Goldbrocken, die in riesigen Muscheln gefunden wurden. Jeder einzelne Brocken hat ungef\u00e4hr den Wert eines Beutels voll Gold.\n\n## Fundorte\n- Harmlose Muscheln (3 Brocken)\n- Eine [Mimic](../npcs/mimic.md) (1 Brocken)\n\n## Wert\nEin Goldbrocken entspricht etwa einem Beutel Gold.\n\n# Belege\n1. Session 2025-06-10 @ 01:14:24 (https://www.youtube.com/watch?v=cLkCu3Iq3y8)", "items/goldenes_amulett": "# Goldenes Amulett\n\nEin wertvolles, aber nicht magisches Amulett mit der Insignie des Heiligen Duran.\n\n## Geschichte\n[Dodo](../characters/dodo.md) fand das Amulett in einer Kiste in einer Ruine.\n\n# Belege\n1. Session 2025-05-06, 00:28:28 \u2013 https://www.youtube.com/watch?v=e0v6AFGd4mE", "items/grauenwurz_trank": "# Grauenwurz-Trank\n\nEin alchemistisches Gebr\u00e4u, das dem Konsumenten f\u00fcr eine begrenzte Zeit gesteigerte St\u00e4rke verleiht, jedoch nach Abklingen der Wirkung einen heftigen Kater hervorruft.\n\n## Eigenschaften\n- **Effekt:** Zeitlich begrenzte St\u00e4rkesteigerung\n- **Nebenwirkung:** Schlimmer Kater nach Wirkungsende\n\n## Bekannte Vorkommnisse\n- Wurde von [Cookie](../characters/cookie.md) identifiziert, aber nicht mitgenommen.\n\n# Belege\n1. Session 2025-06-17, 01:24:38 \u2013 https://www.youtube.com/watch?v=tl76B4V0io8", "items/gruene_kristalle": "# Gr\u00fcne Kristalle\n\nMagische Kristalle mit der F\u00e4higkeit, [Lila Kristalle](lila_kristalle.md) zu assimilieren. Sie sind feueranf\u00e4llig und stehen in Verbindung mit der Entit\u00e4t [Hack](../npcs/hack.md). Es wird vermutet, dass die gr\u00fcnen Kristalle gezielt zur Sabotage platziert wurden.\n\n# Belege\n1. Session 2025-10-07, 00:29:36 \u2013 https://www.youtube.com/watch?v=qVAF_54S8Vw", "items/gruener_kristall": "# Gr\u00fcner Kristall\n\nEin leuchtender Kristall, der im Inneren einer Statue gefunden wurde. Bei seiner Zerst\u00f6rung explodierte er und l\u00f6ste bei [Dodo](../characters/dodo.md) eine Vision aus. In dieser Vision sah Dodo ein Labor mit einem gro\u00dfen Kristall und einer Gestalt. \u00c4hnliche Kristalle waren der Gruppe bereits zuvor begegnet.\n\n# Belege\n1. Session 2026-01-06, 01:12:58 \u2013 https://www.youtube.com/watch?v=VGw81seFvbo", "items/gruener_kristall_seelenstein": "# Gr\u00fcner Kristall / Seelenstein\n\n## Allgemein\nDer Gr\u00fcne Kristall, auch als Seelenstein bezeichnet, ist ein magischer Kristall, der als m\u00e4chtige Energiequelle dient.\n\n## Eigenschaften & Verwendung\n*   **Energiequelle:** Der Kristall kann genutzt werden, um magische Vorg\u00e4nge mit Energie zu versorgen. Konkret wurde er als Energiequelle f\u00fcr eine Teleportation eingesetzt.\n*   **Beschw\u00f6rung:** Aus dem Kristall wurden der [Todesritter](../npcs/todesritter.md) und der [Fliegende Sch\u00e4del](../npcs/fliegender_schaedel.md) beschworen.\n\n## Besitzer & Geschichte\nDer Kristall wurde von [Hans](../npcs/hans.md) \u00fcberbracht.\n\n# Belege\n1.  Session 2026-01-13, 01:15:10: [https://www.youtube.com/watch?v=w4LB1s9_3rs](https://www.youtube.com/watch?v=w4LB1s9_3rs)", "items/halsband_und_nachricht": "# Halsband und Nachricht\n\nEin Halsband mit einer Markierung, an dem eine Nachricht befestigt war.\n\n## Fundort\n\nDas Halsband wurde am K\u00f6rper eines toten Monsters entdeckt.\n\n## Inhalt der Nachricht\n\nDie daran befestigte Nachricht enthielt einen Hinweis auf eine nahe gelegene Ortschaft.\n\n# Belege\n\n1. Session 2025-03-26, 01:47:46 \u2013 https://www.youtube.com/watch?v=ROCKGeeRUFw", "items/heilige_pfeile": "# Heilige Pfeile\n\n*   **Typ:** Item\n*   **Seltenheit:** Selten\n*   **Menge:** 3 St\u00fcck\n\n## Beschreibung\nBei den Heiligen Pfeilen handelt es sich um drei Silberpfeile, die in Weihwasser getaucht wurden. Sie sind \u00e4u\u00dferst effektiv gegen Untote.\n\n## Effekt\nDie immense Wirksamkeit gegen Untote zeigte sich deutlich, als ein kritischer Treffer mit einem dieser Pfeile einen untoten W\u00e4chter sofort ausschaltete.\n\n## Besitzer\n*   [Dodo](../characters/dodo.md)\n\n# Belege\n1.  Session 2025-05-14 @ 00:42:42 (https://www.youtube.com/watch?v=5eAEDN5ra-4)", "items/heiliger_streitkolben_aus_zebras": "# Heiliger Streitkolben aus Zebras\n\nEine Waffe im Besitz von [Dodo](../characters/dodo.md).\n\n## Eigenschaften\n\n*   Besitzt die F\u00e4higkeit, magische Schutzschilde zu durchdringen.\n*   Konnte dem Todesritter schweren Schaden zuf\u00fcgen, nachdem dessen magisches Schutzschild durchbrochen wurde.\n\n# Belege\n1.  Session 2026-01-13 @ 01:37:13 (https://www.youtube.com/watch?v=w4LB1s9_3rs)", "items/heiliges_oel": "# Heiliges \u00d6l\n\nEin spezieller Trank, der f\u00fcr ein Ritual ben\u00f6tigt wird.\n\n## Fundort\nDas Heilige \u00d6l wurde bei einer Leiche gefunden, die ein rotes Gewand trug.\n\n## Verwendungszweck\nDas \u00d6l dient dazu, einen Dolch zu pr\u00e4parieren. Erst nach dieser Behandlung kann der Dolch an der heiligen Flamme entz\u00fcndet werden.\n\n# Belege\n1. Session 2025-10-28 @ 00:56:55 (https://www.youtube.com/watch?v=V6NzNakqxXM)", "items/heiltinktur_des_gnolls": "# Heiltinktur des Gnolls\n\n## Beschreibung\nDie Heiltinktur des Gnolls ist eine breiige Mixtur aus Kr\u00e4utern und einer nicht n\u00e4her bestimmten Fl\u00fcssigkeit. Ihre Wirkung ist zweischneidig: Sie vermag Vergiftungen zu neutralisieren, versetzt den Behandelten jedoch unmittelbar nach der Einnahme in einen Zustand der Bewusstlosigkeit.\n\n## Wirkung\n*   Heilt Vergiftungen\n*   L\u00e4sst den Anwender kurzzeitig in Ohnmacht fallen\n\n## Bekannte Anwendungen\n*   Wurde eingesetzt, um die Vergiftung von [Rotuna](../characters/rotuna.md) zu kurieren.\n\n# Belege\n1.  Session 2025-09-23, 00:08:32, https://www.youtube.com/watch?v=DGzfqVigS0g", "items/heiltrank": "# Heiltrank\n\nEin Heiltrank, der bei der Leiche des ersten besiegten Goblins gefunden wurde. [Dodo](../characters/dodo.md) nahm den Trank an sich.\n\n# Belege\n1. Session 2025-04-01, 00:18:50 \u2013 https://www.youtube.com/watch?v=LZIuUzc3F18", "items/kontrollrune": "# Kontrollrune\n\nEine magische Rune, die zur Kontrolle dient.\n\n## Vorkommen in der Kampagne\n\n*   Eine Kontrollrune wurde unter einem gr\u00fcnen Kristall gefunden und zerst\u00f6rt.\n*   Eine weitere Kontrollrune wurde im Torso des zerst\u00f6rten Golems entdeckt.\n\n# Belege\n1. Session 2025-10-07 @ 01:02:28 (https://www.youtube.com/watch?v=qVAF_54S8Vw)", "items/kornklatscher": "# Kornklatscher\n\nEin starkes alkoholisches Getr\u00e4nk, das von Goblins gebraut wird. Es schmeckt wie Putzalkohol und blubbert im Magen.\n\n## Bekannte Verwendung\nIn einer Taverne wurde der Kornklatscher bei einem Trinkwettbewerb zwischen [Nyrella](../characters/nyrella.md) und [Lunara](../characters/lunara.md) getrunken.\n\n# Belege\n1. Session 2025-11-18 @ 00:26:56 (https://www.youtube.com/watch?v=w__ahowb9p0)", "items/kristall": "# Kristall\n\nEin magisches Artefakt, das von den Magiern [Belorus'](../npcs/belorus.md) getragen wird.\n\n## Eigenschaften\n\nDas Artefakt weist eine hohe Widerstandsf\u00e4higkeit auf. Es wurde von [Hal](../characters/hal.md) mit einer Balliste beschossen und sp\u00e4ter von [Rotunas](../characters/rotunas.md) mit einem Feuerball getroffen, jedoch in beiden F\u00e4llen nicht zerst\u00f6rt.\n\n# Belege\n\n1. Session 2026-01-20 @ 00:51:06 (https://www.youtube.com/watch?v=H3ckYdTv4y8)", "items/lebende_kristalle": "# Lebende Kristalle\n\nEin leuchtendes, silbernes Material, das in einer Mine entdeckt wurde. Es scheint eine eigene Lebensform zu sein und bewegt sich langsam. [Lunara](../characters/lunara.md) erinnert das Material an Kreaturen aus Abyssalis. Den Kristallen wird das Potenzial zugeschrieben, zur Herstellung m\u00e4chtiger Waffen gegen Untote genutzt werden zu k\u00f6nnen.\n\n# Belege\n1. Session 2026-02-24, 01:34:05 \u2013 https://www.youtube.com/watch?v=WOFArbwDDIQ", "items/lila_kristalle": "# Lila Kristalle\n\nBesondere, nicht-magische Kristalle aus dem Norden, die bei Ber\u00fchrung Lebewesen kristallisieren lassen. Sie wurden f\u00fcr die Erschaffung des [Golems](../npcs/golem.md) verwendet.\n\n# Belege\n1. Session 2025-10-07 @ 00:11:53 (https://www.youtube.com/watch?v=qVAF_54S8Vw)", "items/lindo_lauts_amulett": "# Lindo Lauts Amulett\n\nEin magisches Amulett, das [Lindo Laut](../characters/lindo_laut.md) bei sich tr\u00e4gt. Es beherbergt mehrere Stimmen, darunter die von [Kol Meref](kol_meref.md).\n\n## Eigenschaften und Verhalten\n\nDas Amulett zeigt eine eigenst\u00e4ndige Willenskraft und interagiert aktiv mit seiner Umgebung:\n\n- Es zieht Lindo Laut zu einem Schrein und reagiert auf die Umgebung.\n- Es versucht, Lindo von der Befreiung [Nerashs](nerash.md) abzuhalten, indem es ihm Macht anbietet.\n\n# Belege\n\n1. Session 2025-07-09, 00:08:15 \u2013 https://www.youtube.com/watch?v=XOnHa6CmDbo", "items/logbuch_der_expedition": "# Logbuch der Expedition\n\nEin besch\u00e4digtes Buch, das aus dem Schiffswrack geborgen wurde. Es beschreibt eine Expedition zu einer Kirche auf einer der Inseln, die das Schiff jedoch nie erreichte. Das Buch wurde von [Rotunas](../characters/rotunas.md) mittels Magie repariert.\n\n# Belege\n1. Session 2025-04-30, 01:10:05, https://www.youtube.com/watch?v=fsCOiSkKKTE", "items/magische_handschellen": "# Magische Handschellen\n\nG\u00f6ttliche Artefakte, die von [Nox](../npcs/nox.md) angeboten werden. Sie besitzen die F\u00e4higkeit, m\u00e4chtige Wesen zu bannen und s\u00e4mtliche magischen F\u00e4higkeiten ihres Tr\u00e4gers zu unterdr\u00fccken.\n\n[Lindo Laut](../characters/lindo_laut.md) legt die Handschellen am Ende an, um [Slix](../characters/slix.md) zu kontrollieren.\n\n# Belege\n1. Session 2026-02-17, 01:07:18 - https://www.youtube.com/watch?v=Z2jlzpoTWVw", "items/magischer_schluessel": "# Magischer Schl\u00fcssel\n\nEin ungew\u00f6hnlich aussehender, magischer Schl\u00fcssel, der im Besitz der Gruppe ist.\n\n## Geschichte\nDer Schl\u00fcssel wurde urspr\u00fcnglich von [Rotunas](../characters/rotunas.md) in einer Kiste w\u00e4hrend eines fr\u00fcheren Abenteuers gefunden. Sp\u00e4ter wurde er von [Orlanius](../npcs/orlanius.md) magisch untersucht, der ihn als m\u00f6glichen Portalschl\u00fcssel identifizierte, der in einen anderen Realm oder eine Demiplane f\u00fchren k\u00f6nnte.\n\nZuvor hatte der Magier [Lendras](../npcs/lendras.md) nach einem Kampf einen Gegenstand an [Esterossa](../characters/esterossa.md) \u00fcbergeben, bei dem es sich um diesen Schl\u00fcssel handeln k\u00f6nnte.\n\n## Eigenschaften & Funktion\n*   **Aussehen:** Ungew\u00f6hnlich.\n*   **Magische Natur:** Magisch.\n*   **Funktion:** Wurde von [Orlanius](../npcs/orlanius.md) als m\u00f6glicher Portalschl\u00fcssel identifiziert, der in einen anderen Realm oder eine Demiplane f\u00fchren k\u00f6nnte.\n\n## Besitzer\n*   Gefunden von [Rotunas](../characters/rotunas.md).\n*   M\u00f6glicherweise zuvor von [Lendras](../npcs/lendras.md) an [Esterossa](../characters/esterossa.md) \u00fcbergeben.\n\n# Belege\n1.  Session 2025-04-23 @ 01:32:25 (https://www.youtube.com/watch?v=z3C-bewKqUs)\n2.  Session 2025-06-17 @ 01:44:43 (https://www.youtube.com/watch?v=tl76B4V0io8)\n3.  Session 2025-06-25 @ 00:48:17 (https://www.youtube.com/watch?v=tpkO9uGw6-I)", "items/magischer_stab": "# Magischer Stab\n\n## Allgemein\n\n*   **Typ:** Artefakt\n*   **Besitzer:** [Lindo Laut](../characters/lindo_laut.md)\n\n## Eigenschaften & F\u00e4higkeiten\n\nDer Magische Stab ist ein m\u00e4chtiges Artefakt, das sich im Besitz von [Lindo Laut](../characters/lindo_laut.md) befindet. Er erf\u00fcllt prim\u00e4r zwei Funktionen:\n\n*   **Portalschl\u00fcssel:** Der Stab dient als Schl\u00fcssel, um Portale zu \u00f6ffnen oder zu aktivieren.\n*   **Zerst\u00f6rerische Energie:** In ihm ist eine immense zerst\u00f6rerische Energie gespeichert, die gezielt gegen D\u00e4monen freigesetzt werden kann.\n\n# Belege\n\n1.  Session 2025-09-06 @ 00:48:52 (https://www.youtube.com/watch?v=vo1xnyLQDJk)", "items/magisches_erz": "# Magisches Erz\n\nEin wertvoller, energiegeladener Rohstoff, der aus den Minen gewonnen wird. Es dient als Grundmaterial f\u00fcr die Herstellung magischer Artefakte und Waffen.\n\n## Vorkommen\n- Stammt aus den Minen\n\n## Verwendung\n- Herstellung magischer Artefakte\n- Schmieden magischer Waffen\n\n## Geschichte\nEin gro\u00dfer Brocken Magisches Erz wurde den Goblins als Teil eines Friedensangebots offeriert.\n\n# Belege\n1. Session 2026-01-27, 00:09:22 \u2013 https://www.youtube.com/watch?v=9RzvnnWzV7E", "items/metallarm_von_rotunas": "# Metallarm von Rotunas\n\n*   **Typ:** Prothese\n*   **Tr\u00e4ger:** [Rotunas](../characters/rotunas.md)\n*   **Herkunft:** Zwergeningenieure\n\nEine von Zwergeningenieuren gefertigte Prothese aus Metall, die [Rotunas](../characters/rotunas.md)' verlorenen rechten Unterarm ersetzt. Sie ist kein perfekter Ersatz, erm\u00f6glicht ihm aber, wieder zu agieren.\n\n# Belege\n1.  Session 2026-03-18 @ 00:12:34 (https://www.youtube.com/watch?v=HHXxsASLrbQ)", "items/morgenstern_des_heiligen_duran": "# Morgenstern des Heiligen Duran\n\n*   **Typ:** Waffe (Morgenstern)\n*   **Tr\u00e4ger:** [Brandon](../npcs/brandon.md)\n\nEine m\u00e4chtige Waffe, die der Ritter [Brandon](../npcs/brandon.md) vom Heiligen Duran erhalten hat. Mit diesem Morgenstern konnte er die Verteidigung der Kapelle lange aufrechterhalten.\n\n# Belege\n1. Session 2025-05-06 @ 01:57:38 (https://www.youtube.com/watch?v=e0v6AFGd4mE)", "items/mysterioese_statue": "# Mysteri\u00f6se Statue\n\nEine verwitterte Statue, die sich unbemerkt bewegt, wenn sie nicht beobachtet wird. Sie enth\u00e4lt einen gr\u00fcnen Kristall und scheint eine Verbindung zu dem korrumpierten Soldaten zu haben.\n\n## Zerst\u00f6rung\n\nDie Statue wurde von [Lunara](../characters/lunara.md) mit Ketten zerst\u00f6rt.\n\n# Belege\n\n1. Session 2026-01-06 @ 00:28:10 (https://www.youtube.com/watch?v=VGw81seFvbo)", "items/mysterioese_statuen": "# Mysteri\u00f6se Statuen\n\nZwei uralte Statuen, die auf den H\u00fcgeln rund um das Lager positioniert sind. Jede der Statuen tr\u00e4gt eine Maske.\n\n## Magische Eigenschaften\nDie Statuen sind in der Lage, beschworenen Untoten im Kampf ein magisches Schutzschild zu verleihen.\n\n## Zerst\u00f6rung\nDie Statuen wurden von [Esterossa](../npcs/esterossa.md) zerst\u00f6rt.\n\n# Belege\n1. Session 2026-01-13, 01:12:17 \u2013 https://www.youtube.com/watch?v=w4LB1s9_3rs", "items/nachricht_von_hal": "# Nachricht von HAL\n\nEine kleine Notiz, die der Gruppe von einem Boten der [Silberkerne](../factions/silberkerne.md) \u00fcbergeben wurde. Die Nachricht enth\u00e4lt die kryptische Anweisung: \"Findet einen S\u00fcndenbock.\" Unterzeichnet ist sie mit \"H-Punkt\".\n\n# Belege\n1. Session 2026-03-18, 00:45:04, https://www.youtube.com/watch?v=HHXxsASLrbQ", "items/notiz_von_vora": "# Notiz von Vora\n\nEine alte Notiz, die [Lindo Laut](../characters/lindo_laut.md) am Ende der Session vorliest. Sie enth\u00fcllt die Existenz eines f\u00fcnften Teils von Vasul, der in [Ehrenfels](../locations/ehrenfels.md) liegt und vom Gildenmeister bewacht wird.\n\n# Belege\n1. Session 2026-01-20, 02:03:43 \u2013 https://www.youtube.com/watch?v=H3ckYdTv4y8", "items/pergament_ueber_rote_magie": "# Pergament \u00fcber Rote Magie\n\nEin uraltes, einzigartiges Dokument, das in einer unbekannten Sprache verfasst ist und sich mit dem Thema \"Rote Magie\" befasst.\n\n## Besondere Eigenschaften\n\nDas Pergament l\u00f6st bei [Lindo Laut](../characters/lindo_laut.md) eine starke physische Reaktion aus.\n\n## Besitzverh\u00e4ltnisse\n\nDas Dokument wurde vom Bibliothekar konfisziert.\n\n# Belege\n1. Session 2026-03-03, 01:37:48 - https://www.youtube.com/watch?v=BRUNuNKTeOg", "items/pochendes_herz": "# Pochendes Herz\n\nEin lebendiges, pochendes Herz, das [Lindo Laut](../characters/lindo_laut.md) aus der Substanz im Brunneneimer fischt. Als er hineinbei\u00dft, bewegt es sich in seinen Mund und bildet einen Film in seinem Rachen.\n\n# Belege\n1. Session 2025-08-20, 00:51:45, https://www.youtube.com/watch?v=-XbO3FLSL_I", "items/schattenfinger_klaue": "# Schattenfinger-Klaue\n\n## Eigenschaften\n- Extrem scharfe Klaue eines Schattenfingers\n- Mit einem l\u00e4hmenden Gift versehen\n- Steckte in einem Tisch\n\n## Wirkung\nBei Ber\u00fchrung verursacht die Klaue Schnittwunden und setzt das l\u00e4hmende Gift frei. Das Gift kann durch Hitzeeinwirkung neutralisiert werden.\n\n# Belege\n1. Session 2025-05-06 @ 00:20:35 (https://www.youtube.com/watch?v=e0v6AFGd4mE)", "items/schattenfinger_relikt": "# Schattenfinger-Relikt\n\nEin verfluchter Gegenstand aus einem fr\u00fcheren Abenteuer, der sich im Besitz von [Lindo Laut](../characters/lindo_laut.md) befindet.\n\n## Eigenschaften\n\n*   **Typ:** Verfluchtes Relikt\n*   **Tr\u00e4ger:** [Lindo Laut](../characters/lindo_laut.md)\n\n## Hintergrund\n\nDas Relikt stammt von einer verfluchten Kreatur dieser Welt. Bei einer Untersuchung durch [Nox](../characters/nox.md) wurde festgestellt, dass es sich nicht um einen Gegenstand d\u00e4monischen Ursprungs handelt.\n\n# Belege\n\n1.  Session 2025-05-27, 02:02:17 \u2013 [Link](https://www.youtube.com/watch?v=bamCIB_CkR8)", "items/schleimbaelle": "# Schleimb\u00e4lle\n\n## Beschreibung\nSchleimb\u00e4lle sind eklige, kugelf\u00f6rmige Objekte, die von [Lindo Laut](../npcs/lindo_laut.md) aus den Genitalien eines besiegten Wasserlings geborgen wurden. Ihre genaue Funktion oder ihr Zweck sind unklar.\n\n## Herkunft\n- Entnommen aus einem besiegten Wasserling\n\n## Besitzer\n- [Lindo Laut](../npcs/lindo_laut.md) (Entdecker)\n\n# Belege\n1. Session 2025-06-17 @ 00:03:30 - https://www.youtube.com/watch?v=tl76B4V0io8", "items/schluessel_stab_von_lindo_laut": "# Schl\u00fcssel (Stab von Lindo Laut)\n\nDer Stab von [Lindo Laut](../npcs/lindo_laut.md) wird als \u201eSchl\u00fcssel\u201c bezeichnet. Er dient Lindo als Medium, um Energie zu fokussieren und Verbindungen zur Splitterwelt herzustellen.\n\n# Belege\n1. Session 2025-11-25 @ 00:15:15 (https://www.youtube.com/watch?v=wd5R4fJfngY)", "items/schluessel_zum_labor": "# Schl\u00fcssel zum Labor\n\nEin kleiner Schl\u00fcssel, der sich im Besitz von [Baran](../npcs/baran.md) befindet. Er gew\u00e4hrt Zugang zu einem alten Labor, das im Westen der Inseln liegt. Es wird vermutet, dass [Gulrak](../npcs/gulrak.md) hinter diesem Schl\u00fcssel her war.\n\n# Belege\n1. Session 2025-04-30, 01:53:09, https://www.youtube.com/watch?v=fsCOiSkKKTE", "items/schriftrolle": "# Schriftrolle\n\nEine mystische Schriftrolle, die am Ritualplatz aufgefunden wurde. Sie enth\u00e4lt eine Beschw\u00f6rungsformel, die ben\u00f6tigt wird, um das Monster zu rufen.\n\n# Belege\n1. Session 2025-03-26 @ 01:20:23 (https://www.youtube.com/watch?v=ROCKGeeRUFw)", "items/schriftrolle_mit_der_natur_reden": "# Schriftrolle 'Mit der Natur reden'\n\nEine magische Schriftrolle, die es dem Anwender erlaubt, mit Pflanzen und B\u00e4umen zu interagieren.\n\n## Fundort\n\nDie Schriftrolle wurde im Zelt des ersten Goblin-Lagers entdeckt.\n\n# Belege\n1. Session 2025-04-01 @ 00:19:48 (https://www.youtube.com/watch?v=LZIuUzc3F18)", "items/schriftrolle_mit_totensprechen": "# Schriftrolle mit Totensprechen\n\nEine magische Schriftrolle, die es dem Anwender erm\u00f6glicht, mit einer untoten Leiche zu sprechen. Die Aktivierung erfolgt, indem ein gr\u00fcner Blitz von der Rolle auf die betreffende Leiche gelenkt wird.\n\n# Belege\n1. Session 2025-09-09 @ 01:09:27 - https://www.youtube.com/watch?v=Zl0qfuI6Goc", "items/schriftrolle_von_belorus": "# Schriftrolle von Belorus\n\nDie Schriftrolle von Belorus ist eine Nachricht des Gottes [Belorus](../npcs/belorus.md), adressiert an [Lindo Laut](../characters/lindo_laut.md).\n\n## Inhalt\n\nIn der Nachricht erkl\u00e4rt [Belorus](../npcs/belorus.md), dass [Lindo Laut](../characters/lindo_laut.md) nicht existieren d\u00fcrfe. Als Begr\u00fcndung f\u00fchrt er an, dass Lindo ein Produkt des G\u00f6tterkrieges sei und seine Existenz einen neuen Krieg ausl\u00f6sen k\u00f6nnte.\n\n# Belege\n1. Session 2026-01-13, 01:03:00 - https://www.youtube.com/watch?v=w4LB1s9_3rs", "items/schriftrolle_von_nerash": "# Schriftrolle von Nerash\n\nEine von der G\u00f6ttin [Nerash](../npcs/nerash.md) erhaltene Schriftrolle. Sie beschreibt ein Ritual, um den Teil von [Vasul](../npcs/vasul.md) in [Lindo Laut](../characters/lindo_laut.md) zu vertreiben. Das Ritual muss in [Abyssalis](../locations/abyssalis.md) durchgef\u00fchrt werden.\n\n# Belege\n1. Session 2026-02-17 @ 00:56:42 (https://www.youtube.com/watch?v=Z2jlzpoTWVw)", "items/schriftrollen_aus_der_krypta": "# Schriftrollen aus der Krypta\n\nEin B\u00fcndel hinterlassener Dokumente, das die Gruppe am Altar von [Lenra](../npcs/lenra.md) in einer Krypta entdeckte. Die Schriftrollen enth\u00fcllten eine wichtige Information: In Breska wird ein Magier gesucht, der etwas f\u00fcr einen magischen Ort gefunden hat.\n\n# Belege\n1. Session 2025-04-15, 02:00:25 - https://www.youtube.com/watch?v=YCpAz_syjaY", "items/schutzzauber_kristall": "# Schutzzauber-Kristall\n\n## Beschreibung\nEin magischer Kristall, der bei Aktivierung eine Schutzzone erschafft. Diese Zone vertreibt Untote und l\u00f6st sie auf.\n\n## Fundort\nDer Kristall wurde in einem Schmugglerversteck entdeckt.\n\n# Belege\n1. Session 2025-05-14, 00:20:28 \u2013 https://www.youtube.com/watch?v=5eAEDN5ra-4", "items/schwarzer_palantir": "# Schwarzer Palantir\n\nDer Schwarze Palantir ist ein kleines, rundes, schwarzes Artefakt, das von [Dodo](../characters/dodo.md) in einem Sumpf-Dungeon entdeckt wurde. Seine genaue Natur oder Herkunft konnte zun\u00e4chst nicht bestimmt werden.\n\n## Eigenschaften\n- Kleine, runde, schwarze Kugel\n- Dunkles, nicht identifizierbares Artefakt\n\n## Wirkung\nAls der Schwarze Palantir an das versiegelte Buch gehalten wurde, l\u00f6ste er sich auf und \u00f6ffnete dieses dadurch.\n\n# Belege\n1. Session 2025-06-17 @ 01:53:34 (https://www.youtube.com/watch?v=tl76B4V0io8)\n2. Session 2025-06-25 @ 00:44:00 (https://www.youtube.com/watch?v=tpkO9uGw6-I)", "items/seelenknechtschaftsvertrag": "# Seelenknechtschaftsvertrag\n\nEin Vertrag, der von dem rachs\u00fcchtigen D\u00e4mon der Gruppe vorgelegt wurde. Die Unterzeichnung dieses Vertrages bedeutet den Verkauf der eigenen Seele.\n\n# Belege\n1. Session 2025-09-06, 00:46:15, https://www.youtube.com/watch?v=vo1xnyLQDJk", "items/seelenstein": "# Seelenstein\n\nEin Seelenstein ist ein magischer Gegenstand, der eine eingeschlossene Seele enth\u00e4lt. In seinem Inneren ist ein glitzerndes Gesicht zu erkennen.\n\n## Eigenschaften und Verwendung\n\n[Rotunas](../characters/rotunas.md) vermutete, dass beim Zerbrechen des Steins ein Geist freigesetzt wird. Er setzte einen Seelenstein als Schutzschild im Kampf gegen den Celestial ein, wobei der Stein zerst\u00f6rt wurde.\n\n# Belege\n1. Session 2025-06-17 @ 01:52:41 (https://www.youtube.com/watch?v=tl76B4V0io8)\n2. Session 2025-06-25 @ 01:15:58 (https://www.youtube.com/watch?v=tpkO9uGw6-I)", "items/silbernes_artefakt_ei": "# Silbernes Artefakt (Ei)\n\nEin mysteri\u00f6ses, ei-\u00e4hnliches Objekt aus Silber, dessen Zweck und Funktion bislang unbekannt sind.\n\n## Eigenschaften\n- **Material:** Silber\n- **Form:** Ei-\u00e4hnlich\n\n## Fundort\nDas Artefakt wurde in einem Dungeon entdeckt. Es befand sich in einem Lederb\u00fcndel, zusammen mit dem [Tarvok-Umhang](tarvok_umhang.md).\n\n# Belege\n1. Session 2026-02-11, 00:39:20 \u2013 https://www.youtube.com/watch?v=3C8SD-cyNPM", "items/spinnenei": "# Spinnenei\n\nDas Spinnenei ist ein gro\u00dfes, gr\u00fcnes und schweres Ei, das von [Dodo](../characters/dodo.md) in einer magischen Kiste im Spinnennest gefunden wurde. Es diente als Zielobjekt der zweiten Pr\u00fcfung. Nach der Bergung wurde es der Menge pr\u00e4sentiert.\n\n# Belege\n1. Session 2025-10-21, 01:51:23, https://www.youtube.com/watch?v=sxFhbtwoefA", "items/splitterkalb_von_kronos": "# Splitterkalb von Kronos\n\nDas Splitterkalb von Kronos ist die gefangene Seele des Drachen [Kronos](../npcs/kronos.md), die von [Lindo Laut](../npcs/lindo_laut.md) in seiner Taschen-Dimension aufbewahrt und kontrolliert wird. [Slix](../npcs/slix.md) nutzt das Splitterkalb als Druckmittel gegen die Gruppe.\n\n# Belege\n1. Session 2026-02-11 @ 01:29:25 (https://www.youtube.com/watch?v=3C8SD-cyNPM)", "items/sprengfalle": "# Sprengfalle\n\nEine von den Zwergen im Eingang der Kathedrale angebrachte Falle, die dazu dient, Eindringlinge abzuwehren.\n\n# Belege\n1. Session 2025-09-09 @ 01:15:32 (https://www.youtube.com/watch?v=Zl0qfuI6Goc)", "items/stab_von_vasul": "# Stab von Vasul\n\nDer Stab von Vasul ist ein m\u00e4chtiges Artefakt im Besitz der Gruppe.\n\n## Eigenschaften & Nutzung\n- Die Gruppe hat den Stab bereits benutzt.\n- Die genauen F\u00e4higkeiten des Stabs sind nicht dokumentiert.\n\n## Verbindung zu Slix\n- [Nox](../characters/nox.md) vermutet, dass die Benutzung des Stabs zur Erschaffung des f\u00fcnften Teils von Vasul, [Slix](../npcs/slix.md), gef\u00fchrt haben k\u00f6nnte.\n\n# Belege\n1. Session 2026-02-17, 01:19:21 \u2013 https://www.youtube.com/watch?v=Z2jlzpoTWVw", "items/sternfoermige_brosche_amulett": "# Sternf\u00f6rmige Brosche/Amulett\n\nEin Set aus f\u00fcnf magischen Artefakten, bestehend aus einem gro\u00dfen Stern und vier kleineren Broschen. Sie wurden von einem wohlhabenden Gast an die Dorfbewohner verteilt und sind mit der Magie des Ortes verbunden.\n\n## Bekannte Exemplare\n\n- **Eine Brosche** wurde von [Esterossa](../npcs/esterossa.md) an der Grabst\u00e4tte gefunden.\n- Diese Brosche wurde sp\u00e4ter von [Rotunas](../npcs/rotunas.md) im Brunnen aufgel\u00f6st, wodurch sich ein Portal \u00f6ffnete.\n\n---\n\n# Belege\n\n1. Session 2025-07-29, 00:26:46 \u2013 https://www.youtube.com/watch?v=XXgO5Ht4Q0A", "items/stinkende_pflanzen_schwaemme": "# Stinkende Pflanzen/Schw\u00e4mme\n\nUnterirdische Gew\u00e4chse, die in Dungeons vorkommen. Sie verstr\u00f6men einen s\u00fc\u00dflich-bet\u00e4ubenden Geruch. Werden sie mit Feuer oder Magie in Kontakt gebracht, reagieren sie mit der Abgabe einer bet\u00e4ubenden Duftwolke.\n\n# Belege\n1. Session 2026-02-11, 00:08:50 \u2013 https://www.youtube.com/watch?v=3C8SD-cyNPM", "items/sumpfhai_giftpfeile": "# Sumpfhai-Giftpfeile\n\nEin Satz von zehn Bet\u00e4ubungspfeilen, die mit einem l\u00e4hmenden Nervengift aus Sumpfhaien pr\u00e4pariert sind.\n\n## Eigenschaften\n\n- **Anzahl:** 10 Pfeile\n- **Effekt:** L\u00e4hmendes Nervengift (Bet\u00e4ubung)\n- **Herkunft des Gifts:** Sumpfhaie\n\n## Besitzer\n\n- [Cookie](../characters/cookie.md) erwarb die Pfeile f\u00fcr eine Handvoll Gold.\n\n## Wirkung im Kampf\n\nIm Kampfeinsatz zeigten die Pfeile keine sofortige Wirkung.\n\n# Belege\n\n1. Session 2025-06-03, 00:20:30 \u2013 https://www.youtube.com/watch?v=jtYR4Je0a18", "items/tarvok_umhang": "# Tarvok-Umhang\n\nEin dunkelbrauner Mantel, der das Symbol von [Tarvok](../glaube/tarvok.md) tr\u00e4gt. Er diente als Umh\u00fcllung f\u00fcr das silberne Artefakt.\n\n# Belege\n1. Session 2026-02-11, 00:39:20 \u2013 https://www.youtube.com/watch?v=3C8SD-cyNPM", "items/totem_von_nerash": "# Totem von Nerash\n\nEin von [Nerash](../npcs/nerash.md) erhaltenes Totem, das die Gruppe bei sich tr\u00e4gt. Es dient als ritueller Gegenstand, um Nerash um Hilfe zu bitten.\n\n## Verwendung\n\nDie Gruppe versuchte, das Totem in der Krypta einzusetzen, um Nerash anzurufen und seine Unterst\u00fctzung zu erbitten.\n\n# Belege\n\n1. Session 2025-09-02, 01:25:17 \u2013 https://www.youtube.com/watch?v=TLZOH7TlGhk", "items/trank": "# Trank\n\nEin mysteri\u00f6ses Gebr\u00e4u, das [Lindo Laut](../characters/lindo_laut.md) vor einiger Zeit zu sich genommen hat. Die Wirkung des Tranks manifestierte sich erst sp\u00e4ter w\u00e4hrend eines Kampfes, als er Lindo pl\u00f6tzlich d\u00e4monische Kr\u00e4fte verlieh.\n\n# Belege\n1. Session 2025-09-02, 00:20:46 \u2013 https://www.youtube.com/watch?v=TLZOH7TlGhk", "items/verbesserte_arkane_handschuhe": "# Verbesserte Arkane Handschuhe\n\nEine magische Waffe, die von [Lindo Laut](../npcs/lindo_laut.md) in einer Mimic gefunden und anschlie\u00dfend an [Rotunas](../characters/rotunas.md) \u00fcbergeben wurde.\n\n## Eigenschaften\n- **Schaden:** 1w10+6 magischer Schaden\n\n# Belege\n1. Session 2025-06-10 @ 01:30:51 (https://www.youtube.com/watch?v=cLkCu3Iq3y8)", "items/verschlingender_dolch_devouring_dagger": "# Verschlingender Dolch (Devouring Dagger)\n\nEin magischer Dolch der Stufe 2, der sich im Besitz von [Lindo Laut von Brass](../characters/lindo_laut_von_brass.md) befindet.\n\n## Eigenschaften\n- **Typ:** Waffe (Dolch)\n- **Stufe:** 2\n- **Schaden:** Magisch\n\n## Effekt\nTrifft der Tr\u00e4ger mit diesem Dolch einen Gegner, muss dieser einen Stress markieren.\n\n## Herkunft\n[Lindo Laut von Brass](../characters/lindo_laut_von_brass.md) erhielt den Dolch als Entsch\u00e4digung f\u00fcr sein miserables Kampfgeschick.\n\n---\n\n# Belege\n1. Session 2025-06-03, 01:23:12 \u2013 https://www.youtube.com/watch?v=jtYR4Je0a18", "items/versiegeltes_buch": "# Versiegeltes Buch\n\n## Eigenschaften\n*   **Typ:** Item\n*   **Bekannt als:** Versiegeltes Buch\n\n## Beschreibung\nEin uraltes Buch, das in der Bibliothek des Grafen aufbewahrt wurde. Es enthielt Wissen aus den \"Circle Below\". Das Buch war vergilbt und l\u00f6ste sich nach seiner Aktivierung auf.\n\n## Wirkung\nDas Buch konnte durch den [Palantir](../items/palantir.md) ge\u00f6ffnet werden. Bei seiner \u00d6ffnung teleportierte es die Seelen der gesamten Gruppe in eine andere Dimension.\n\n# Belege\n1.  Session 2025-06-25, 00:46:01, https://www.youtube.com/watch?v=tpkO9uGw6-I", "items/versiegeltes_dokument": "# Versiegeltes Dokument\n\nEine wichtige, unge\u00f6ffnete Schriftrolle, die urspr\u00fcnglich von [Lord Voras](../npcs/lord_voras.md) stammt. Der Kommandant der Soldaten trug sie bei sich, mit der Bestimmung, sie nach Ehrenfels zu bringen. Nach der Konfrontation mit den fliehenden Soldaten sicherte [Lindo Laut](../characters/lindo_laut.md) das Dokument an sich.\n\n# Belege\n1. Session 2026-01-06 @ 01:37:04 (https://www.youtube.com/watch?v=VGw81seFvbo)", "items/verwandlungstrank": "# Verwandlungstrank\n\nEin von [Sys Fizik](../npcs/sys_fizik.md) gebrauter Trank mit starker magischer Wirkung.\n\n## Wirkung\nDer Trank verwandelt eine Person in einen kleinw\u00fcchsigen Katari. Die Wirkung h\u00e4lt f\u00fcr fast ein Jahr an, kann aber durch die Einnahme eines zweiten Tranks vorzeitig beendet werden.\n\n## Bekannte Anwendung\n- [Lindo Laut](../characters/lindo_laut.md) wurde durch diesen Trank verwandelt.\n\n# Belege\n1. Session 2026-03-03, 00:55:36, https://www.youtube.com/watch?v=BRUNuNKTeOg", "items/voodoo_puppe": "# Voodoo-Puppe\n\nEine kleine, aus Holz geflochtene Puppe, die [Cookie](../characters/cookie.md) in einem Nebengeb\u00e4ude findet. Sie verletzt sich sp\u00e4ter selbst damit, als sie versucht, [Lenra](../npcs/lenra.md) zu schaden.\n\n# Belege\n1. Session 2025-04-15 @ 00:29:32 (https://www.youtube.com/watch?v=YCpAz_syjaY)", "items/vulkanpflanze": "# Vulkanpflanze\n\nDie Vulkanpflanze ist eine Pflanze, deren Beh\u00e4lter eine stark aphrodisierende und aufputschende Tinktur enthalten. Diese Tinktur kann \u00fcber die Haut aufgenommen werden.\n\nW\u00e4hrend ihres Abenteuers f\u00fcllten [Cookie](../characters/cookie.md) und [Esterossa](../characters/esterossa.md) drei Fl\u00e4schchen dieser Tinktur ab.\n\n# Belege\n1. Session 2025-06-03, 01:53:31, https://www.youtube.com/watch?v=jtYR4Je0a18", "items/vulkanpflanzen_gift": "# Vulkanpflanzen-Gift\n\nEin \u00e4tzendes Enzym, das aus Vulkanpflanzen gewonnen wird.\n\n## Eigenschaften\n\nDas Gift besitzt eine stark \u00e4tzende Wirkung.\n\n## Verwendung\n\n[Cookie](../characters/cookie.md) mischte das Enzym mit Algen und Schlamm, um neun ihrer Pfeile mit der Substanz zu tr\u00e4nken.\n\n# Belege\n\n1. Session 2025-06-10, 00:14:11 \u2013 https://www.youtube.com/watch?v=cLkCu3Iq3y8", "items/zebrosia_schwert_des_koenigs": "# Zebrosia (Schwert des K\u00f6nigs)\n\nEin legend\u00e4res Schwert, das einst K\u00f6nig Zebros geh\u00f6rte. Es steckt im Garten von [Crowfin Manor](../locations/crowfin_manor.md) in einem Stein.\n\n## Eigenschaften\n- Soll G\u00f6ttlichkeit spalten k\u00f6nnen.\n- L\u00e4sst jeden Unw\u00fcrdigen, der es zu f\u00fchren versucht, zu Asche zerfallen.\n\n# Belege\n1. Session 2026-02-17, 00:36:37, https://www.youtube.com/watch?v=Z2jlzpoTWVw", "items/zebrus_zorn": "# Zebrus Zorn\n\n**Typ:** Magischer Streitkolben\n**Fundort:** Unterirdische Kammer in [Steinbachtal](../orte/steinbachtal.md)\n\n## Eigenschaften\n\n- Kann den verursachten Schaden um 1w10 erh\u00f6hen\n- Dient als Lichtquelle\n\n---\n\n# Belege\n\n1. Session 2025-09-09 @ 02:00:00 \u2013 [YouTube](https://www.youtube.com/watch?v=Zl0qfuI6Goc)", "items/zeremonieller_dolch": "# Zeremonieller Dolch\n\n*   **Typ:** Waffe / Ritualgegenstand\n*   **Besitzer:** [Cookie](../characters/cookie.md)\n\nEin Dolch, der urspr\u00fcnglich von einem Kultistenanf\u00fchrer benutzt wurde. Nach dem Kampf gegen diesen nahm [Cookie](../characters/cookie.md) den Dolch an sich.\n\n# Belege\n1.  Session 2025-09-02, 00:58:41, https://www.youtube.com/watch?v=TLZOH7TlGhk", "locations/abyssalis": "# Abyssalis\n\nAbyssalis ist eine Gef\u00e4ngniswelt f\u00fcr alte G\u00f6tter, die auch als Splitterwelt bezeichnet wird. Der Gruppe wurde nahegelegt, dorthin zu reisen, um [Vasul](../npcs/vasul.md) mit einem Ritual endg\u00fcltig zu zerst\u00f6ren.\n\n## Die Demiplane\n\nHinter einem gro\u00dfen Tor in der Splitterwelt liegt eine Demiplane, die ebenfalls Teil von Abyssalis ist. Sie kann betreten werden, jedoch ist es ohne den entsprechenden \u201eSchl\u00fcssel\u201c nicht m\u00f6glich, sie wieder zu verlassen. Diese Demiplane ist das Ziel der Gruppe, um etwas oder jemanden zu befreien.\n\n# Belege\n1. Session 2026-02-17, 00:57:10 \u2013 https://www.youtube.com/watch?v=Z2jlzpoTWVw\n2. Session 2026-03-10, 01:06:30 \u2013 https://www.youtube.com/watch?v=Kr9_AC2XtOw", "locations/alter_turm": "# Alter Turm\n\nEin alter Turm im Nordosten des Sumpfes, der als Zufluchtsort dient. Er ist mit einer wasserdichten T\u00fcr versiegelt und bietet Schutz vor den pl\u00f6tzlich steigenden Fluten.\n\n# Belege\n1. Session 2025-06-03 @ 00:28:25 (https://www.youtube.com/watch?v=jtYR4Je0a18)", "locations/altes_heiligtum_kapelle": "# Altes Heiligtum / Kapelle\n\nEin urspr\u00fcnglich dem alten Gott [Tavok](../g\u00f6tter/tavok.md) geweihter Ort, der nun f\u00fcr [Varsul](../g\u00f6tter/varsul.md) umgewidmet werden soll. Die Kapelle und die darunterliegende Krypta wurden von der Gruppe erkundet.\n\n## Aufbau\n- **Kapelle**: Oberirdischer Teil des Heiligtums.\n- **Krypta**: Unter der Kapelle gelegener Bereich.\n\n## Geschichte\nDie Kapelle war einst [Tavok](../g\u00f6tter/tavok.md) geweiht. Zum Zeitpunkt der Erkundung durch die Gruppe wird sie f\u00fcr [Varsul](../g\u00f6tter/varsul.md) umgewidmet.\n\n# Belege\n1. Session 2025-09-02, 00:03:13 \u2013 https://www.youtube.com/watch?v=TLZOH7TlGhk", "locations/arena_von_willau": "# Arena von Willau\n\nDie Arena von Willau ist der Austragungsort eines Turniers und befindet sich etwa eine Stunde au\u00dferhalb der Stadt [Willau](../locations/willau.md). F\u00fcr die Teilnehmer des Turniers ist vor Ort ein Zeltlager errichtet.\n\n# Belege\n1. Session 2025-10-14 @ 00:53:22 (https://www.youtube.com/watch?v=cUtz87UCHu4)", "locations/arena_von_willoch": "# Arena von Willoch\n\nDie Arena von Willoch ist der Hauptaustragungsort f\u00fcr die K\u00e4mpfe in der Stadt Willoch. Es handelt sich um eine gro\u00dfe Arena, die Platz f\u00fcr ein jubelndes Publikum bietet. F\u00fcr die Obrigkeit ist eine separate Loge vorhanden. Die Gruppe tritt hier in Kategorie 3 an und muss mindestens drei K\u00e4mpfe bestehen.\n\n# Belege\n1. Session 2025-10-21, 00:01:01, https://www.youtube.com/watch?v=sxFhbtwoefA", "locations/banditenfestung": "# Banditenfestung\n\nDie Banditenfestung ist eine gut befestigte, jedoch teilweise notd\u00fcrftig reparierte Anlage. Sie wird von [Hal](../npcs/hal.md) und etwa drei Dutzend Soldaten bewohnt und dient als Zufluchtsort f\u00fcr die Fl\u00fcchtlinge.\n\n# Belege\n1. Session 2025-09-30 @ 02:04:15 (https://www.youtube.com/watch?v=bUT7Mc2hjUY)", "locations/banditenlager": "# Banditenlager\n\nEin alter, verlassener St\u00fctzpunkt von Banditen, der als m\u00f6glicher Zufluchtsort f\u00fcr die Fl\u00fcchtlinge aus [D\u00fcsterbruch](../locations/duesterbruch.md) in Betracht gezogen wird. [Roland](../characters/roland.md) schl\u00e4gt das Lager als Ziel vor. Die Gruppe vereinbart, sich in zehn Tagen dort mit den Fl\u00fcchtlingen zu treffen.\n\n# Belege\n1. Session 2025-09-17 @ 01:13:21 (https://www.youtube.com/watch?v=AhIT8dcxw2o)", "locations/banditenlager_festung": "# Banditenlager / Festung\n\nEine gut befestigte, aktive Festung, die in einem Talkessel gelegen ist. Sie wird von einer gro\u00dfen Banditengruppe bewohnt und stellt einen m\u00f6glichen Zufluchtsort f\u00fcr die Fl\u00fcchtlinge dar.\n\n# Belege\n1. Session 2025-09-23 @ 00:28:19 (https://www.youtube.com/watch?v=DGzfqVigS0g)", "locations/banditenversteck": "# Banditenversteck\n\nEin befestigtes Lager, das als Zufluchtsort f\u00fcr Fl\u00fcchtlinge aus [Bereska](../locations/bereska.md) dient. Die Anlage wird durch eine Palisade, ein Tor und eine Br\u00fccke gesch\u00fctzt. Das Versteck ist der Schauplatz der gro\u00dfen Schlacht gegen [Belorus](../npcs/belorus.md).\n\n# Belege\n1. Session 2026-01-20 @ 00:06:33 (https://www.youtube.com/watch?v=H3ckYdTv4y8)", "locations/berg_zebros": "# Berg Zebros\n\nDer Berg Zebros ist ein gro\u00dfer Berg, an dessen Fu\u00df [Steinbachtal](../orte/steinbachtal.md) liegt. Der Berg ist von Wasser umringt. Von diesem Berg str\u00f6men Untote ins Tal, angef\u00fchrt von einem dunklen Paladin. Der Graf plant, die Kontrolle \u00fcber diesen Ort zu erlangen.\n\n# Belege\n1. Session 2025-06-25 @ 00:31:00 (https://www.youtube.com/watch?v=tpkO9uGw6-I)\n2. Session 2025-09-09 @ 00:07:30 (https://www.youtube.com/watch?v=Zl0qfuI6Goc)", "locations/bergpass": "# Bergpass\n\nEin d\u00fcsterer, sturmgepeitschter Berg, auf dem die Gruppe unterwegs ist. In dieser Region befinden sich mehrere markante Orte, darunter ein Nomadenlager, H\u00f6hlen und ein alter Tempel.\n\n## Bemerkenswerte Orte\n\n- **Nomadenlager**: Ein Lager, das sich am Bergpass befindet.\n- **H\u00f6hlen**: Ein H\u00f6hlensystem in der Bergregion.\n- **Alter Tempel**: Ein alter Tempel, der sich ebenfalls am Bergpass befindet.\n\n# Belege\n1. Session 2025-08-12 @ 00:06:42 (https://www.youtube.com/watch?v=vHIjua0BZ9Y)", "locations/bibliothek_von_willauch": "# Bibliothek von Willauch\n\nDie Bibliothek von Willauch ist eine bedeutende Wissensst\u00e4tte in der Region. Sie beherbergt das gesammelte Wissen der Gegend und wird durch besondere Sicherheitsvorkehrungen gesch\u00fctzt.\n\n## Sicherheit\n\n*   **W\u00fcstenw\u00e4chter:** Die Bibliothek wird von W\u00fcstenw\u00e4chtern bewacht.\n*   **Magischer Schutz:** Zus\u00e4tzlich ist sie mit einem magischen Siegel gesch\u00fctzt.\n\n## Personal\n\n*   **H\u00fcter:** Die Bibliothek wird von [Safin Al Barak](../npcs/safin_al_barak.md) geh\u00fctet.\n\n# Belege\n1. Session 2026-03-03, 01:14:07, https://www.youtube.com/watch?v=BRUNuNKTeOg", "locations/breska": "# Breska\n\nBreska (auch Bresca genannt) ist ein Dorf, das im Laufe der Zeit zu einer befestigten Stadt ausgebaut, sp\u00e4ter jedoch von einer Armee der Untoten belagert und schlie\u00dflich vollst\u00e4ndig zerst\u00f6rt wurde.\n\n## Geographie & Aufbau\n\nUrspr\u00fcnglich lag Breska auf einer Lichtung, umgeben von Wald, und bestand aus zwei Bauernh\u00f6fen, einer Taverne, einem Wirtshaus und einem Friedhof.[1] Sp\u00e4ter wurde der Ort mit finanzieller Unterst\u00fctzung des Grafen zu einer befestigten Stadt ausgebaut, erg\u00e4nzt um eine Palisade, eine Kapelle und weitere neue Geb\u00e4ude; die Taverne wurde ebenfalls erweitert.[3] Die Stadt liegt in einem Tal.[8]\n\n## Geschichte\n\n### Fr\u00fche Zeit\n\nIn der Krypta des Dorfes wurde enth\u00fcllt, dass dort ein Magier gesucht wird.[2] Breska war Ziel eines bevorstehenden gro\u00dfen Angriffs.[2]\n\n### Aufstieg zur Stadt\n\nDurch die Finanzierung des Grafen entwickelte sich das Bauerndorf zu einer befestigten Stadt mit erweiterter Infrastruktur.[3] Sp\u00e4ter geriet die Stadt unter die Kontrolle einer neuen, wohlhabenden Gilde, die keine mittellosen Fl\u00fcchtlinge mehr einlie\u00df, was zur Entstehung eines gro\u00dfen Fl\u00fcchtlingslagers vor den Toren f\u00fchrte.[4]\n\n### Belagerung und Zerst\u00f6rung\n\nBreska wurde von einer massiven Armee von Untoten belagert oder bereits \u00fcberrannt. Es kamen keine Nachrichten mehr aus der Stadt, und die Priesterin [Auranie](../npcs/auranie.md) spekulierte \u00fcber ihren Untergang.[5] W\u00e4hrend der Belagerung litt die Stadt unter schwerer Nahrungsmittelknappheit.[6] Ein verwundeter Soldat aus Breska \u00fcberbrachte eine wichtige Nachricht von [Lord Voras](../npcs/voras.md).[6] Ein sp\u00e4terer Hilferuf von [Voras dem Heiligen](../npcs/voras.md) berichtete, dass die Mauern gefallen und die Bev\u00f6lkerung fast verhungert sei.[7] Schlie\u00dflich wurde das ehemalige Bauerndorf, das zur kleinen Festung ausgebaut worden war, von [Belorus](../npcs/belorus.md)' Armee vollst\u00e4ndig zerst\u00f6rt. Das Tal, in dem es liegt, ist nun von einem dichten, magischen Nebel umgeben.[8]\n\n# Belege\n\n1. Session 2025-04-09 @ 00:01:19 (https://www.youtube.com/watch?v=1PWdwvun5ow)\n2. Session 2025-04-15 @ 01:33:07 (https://www.youtube.com/watch?v=YCpAz_syjaY)\n3. Session 2025-06-25 @ 00:04:00 (https://www.youtube.com/watch?v=tpkO9uGw6-I)\n4. Session 2025-09-17 @ 00:08:22 (https://www.youtube.com/watch?v=AhIT8dcxw2o)\n5. Session 2025-11-18 @ 00:56:57 (https://www.youtube.com/watch?v=w__ahowb9p0)\n6. Session 2026-01-06 @ 00:39:59 (https://www.youtube.com/watch?v=VGw81seFvbo)\n7. Session 2026-01-13 @ 00:38:23 (https://www.youtube.com/watch?v=w4LB1s9_3rs)\n8. Session 2026-03-10 @ 00:02:00 (https://www.youtube.com/watch?v=Kr9_AC2XtOw)", "locations/brunnen_mit_statue": "# Brunnen mit Statue\n\nEin funktionsf\u00e4higer Brunnen, der eine Statue beinhaltet, die jener in der Goblinfestung \u00e4hnelt. Der Brunnen nimmt Blutopfer an und produziert daraufhin eine dickfl\u00fcssige Substanz, die ein pochendes Herz enth\u00e4lt.\n\n# Belege\n1. Session 2025-08-20 @ 00:41:44 (https://www.youtube.com/watch?v=-XbO3FLSL_I)", "locations/burgruine_krypta": "# Burgruine / Krypta\n\nEine alte Burg mit einer darunterliegenden Krypta. Sie dient als Schauplatz des Abenteuers. Die Anlage wird von Bugbears bewacht und von [Lenra](../npcs/lenra.md) bewohnt.\n\n# Belege\n1. Session 2025-04-15 @ 00:08:52 - https://www.youtube.com/watch?v=YCpAz_syjaY", "locations/burgruine_von_zebros": "# Burgruine von Zebros\n\nEine intakte Burg, die als Versteck f\u00fcr Abenteurer dient. Sie wird von [Belorus dem Stillen](../npcs/belorus_der_stille.md) bewohnt. Die Burg enth\u00e4lt eine Krypta und ist mit Fallen gesichert.\n\n# Belege\n1. Session 2025-05-14 @ 00:33:01 (https://www.youtube.com/watch?v=5eAEDN5ra-4)", "locations/casa_de_cookie": "# Casa de Cookie\n\nEin Geb\u00e4ude im Besitz der Gruppe, das als Basis und sicherer R\u00fcckzugsort dient.\n\n## Besonderheiten\n\n- **Portal**: [Lindo Laut](../npcs/lindo_laut.md) hat im Haus ein Portal platziert.\n- **Magischer Baum**: [Lunara](../characters/lunara.md) schlug vor, einen magischen Baum zu pflanzen, um Fl\u00fcchtlinge \u00fcber diesen Weg ins Haus zu evakuieren.\n\n# Belege\n1. Session 2026-01-13, 00:47:53, https://www.youtube.com/watch?v=w4LB1s9_3rs", "locations/casa_de_la_cookie": "# Casa de la Cookie\n\nDie **Casa de la Cookie** ist das von der Gruppe erworbene Anwesen, unter dem sich der erkundete Dungeon befindet. Der Name wurde von der Gruppe und dem Chat gew\u00e4hlt, nachdem das Anwesen zuvor namenlos war. Es wurde zu Ehren einer verstorbenen Mitstreiterin benannt.\n\n# Belege\n1. Session 2025-11-14 @ 01:21:09 (https://www.youtube.com/watch?v=8Khb-Y8XbKY)\n2. Session 2026-02-11 @ 00:01:24 (https://www.youtube.com/watch?v=3C8SD-cyNPM)", "locations/cornivum": "# Cornivum\n\nCornivum ist ein kleines, auf Survival ausgerichtetes Einsiedlerdorf im Sumpf. Die Siedlung ist auf Stelzen erbaut und dient als letzter Au\u00dfenposten vor dem tieferen Sumpf. Das Dorf wird regelm\u00e4\u00dfig von Fluten heimgesucht.\n\nHier begann das Abenteuer der Gruppe. Die Gef\u00e4hrten konnten in Cornivum nur wenige Informationen \u00fcber die Hexe [Hack](../npcs/hack.md) sammeln.\n\n# Belege\n1. Session 2025-06-03 @ 00:04:02 (https://www.youtube.com/watch?v=jtYR4Je0a18)\n2. Session 2025-06-10 @ 00:04:30 (https://www.youtube.com/watch?v=cLkCu3Iq3y8)", "locations/crowfin_manor": "# Crowfin Manor\n\nCrowfin Manor ist eine jahrhundertealte, ehemals k\u00f6nigliche Villa, die heute als Gildenhaus genutzt wird. Das Anwesen ist mit einem m\u00e4chtigen Schutzzauber belegt, der zwei wesentliche Effekte hat: Er verhindert das Betreten des Geb\u00e4udes ohne Einladung und unterdr\u00fcckt die Verwandlung von [Lindo Laut](../npcs/lindo_laut.md).\n\n---\n\n# Belege\n1. Session 2026-02-17, 00:05:28 \u2013 https://www.youtube.com/watch?v=Z2jlzpoTWVw", "locations/das_alte_heiligtum": "# Das alte Heiligtum\n\nDas alte Heiligtum ist ein inaktiver Schrein aus der Zeit der alten G\u00f6tter, der sich am Ende der Stadt befindet.\n\n## Beschreibung\n\nIm Inneren des Heiligtums stehen vier Statuen, die die vier Seelenst\u00fccke symbolisieren. Diese Seelenst\u00fccke sind nun im Amulett von [Lindo Laut](../npcs/lindo_laut.md) gefangen.\n\n# Belege\n\n1. Session 2025-07-22, 00:04:56 \u2013 https://www.youtube.com/watch?v=BRRCUgW4xRo", "locations/das_dorf_bresca": "# Das Dorf (Bresca)\n\nDas Dorf Bresca ist ein kleiner Ort und war der Hauptschauplatz einer gro\u00dfen Schlacht. Es verf\u00fcgt \u00fcber mehrere markante Geb\u00e4ude und Orte:\n\n- Eine Taverne\n- Ein Rathaus\n- Ein Magierturm\n- Ein Friedhof mit Katakomben\n\n# Belege\n1. Session 2025-04-23, 00:03:07, https://www.youtube.com/watch?v=z3C-bewKqUs", "locations/das_portal_rift": "# Das Portal (Rift)\n\nEin magischer Riss im Zentrum des Trainingsgel\u00e4ndes, der eine Verbindung zur Ebene der verbannten alten G\u00f6tter darstellt. [Nox](../characters/nox.md) kann es mit einem Ritual \u00f6ffnen und wieder versiegeln.\n\n# Belege\n1. Session 2025-05-27 @ 00:23:43 (https://www.youtube.com/watch?v=bamCIB_CkR8)", "locations/der_dungeon": "# Der Dungeon\n\nEine unerforschte H\u00f6hle unter dem Anwesen, die [Horatio](../npcs/horatio.md) der Gruppe zur Erkundung anbietet.\n\n# Belege\n1. Session 2025-11-14 @ 00:54:36 (https://www.youtube.com/watch?v=8Khb-Y8XbKY)", "locations/der_magierturm": "# Der Magierturm\n\nDer Magierturm ist das Haus des Magiers [Lenra](../npcs/lenra.md). W\u00e4hrend der Schlacht wurde der Magier in seinem Turm von einer rabenartigen Kreatur angegriffen.\n\n# Belege\n1. Session 2025-04-23 @ 01:23:00 (https://www.youtube.com/watch?v=z3C-bewKqUs)", "locations/der_turm": "# Der Turm\n\nDer Turm ist eine verlassene Struktur, die der Gruppe \u00fcber drei Tage hinweg als Zufluchtsort vor den Fluten diente. W\u00e4hrend dieser Zeit hielten die Charaktere hier ihre lange Rast ab und nutzten die Gelegenheit, das Geb\u00e4ude gr\u00fcndlich zu durchsuchen. Bei der Erkundung stie\u00dfen sie auf verschiedene magische Gegenst\u00e4nde, die sie als Beute mitnahmen.\n\n# Belege\n1. Session 2025-06-10, 00:05:24, https://www.youtube.com/watch?v=cLkCu3Iq3y8", "locations/der_uralte_dungeon": "# Der uralte Dungeon\n\nEine uralte, unterirdische Anlage, die als dritte Arena-Pr\u00fcfung dient. Der Dungeon ist mit einem magischen Schutz versiegelt, der sich erst nach langer Zeit wieder \u00f6ffnet. Er ist erf\u00fcllt von fleischfressenden Sporen und beherbergt eine m\u00e4chtige, intelligente untote Kreatur.\n\n# Belege\n1. Session 2025-10-28 @ 00:07:20 (https://www.youtube.com/watch?v=V6NzNakqxXM)", "locations/die_alte_bruecke": "# Die alte Br\u00fccke\n\nDie alte Br\u00fccke ist eine befestigte Br\u00fccke, die den Zugang zur versunkenen Stadt markiert. Vor \u00fcber 100 Jahren fand auf ihr ein Kampf statt. Heute wird sie von zwei Froschwesen bewacht.\n\n# Belege\n1. Session 2025-06-10 @ 00:26:00 (https://www.youtube.com/watch?v=cLkCu3Iq3y8)", "locations/die_bruecke": "# Die Br\u00fccke\n\nDie Br\u00fccke ist ein strategisch bedeutsamer \u00dcbergang in den Minen, der einen Abgrund \u00fcberspannt. Sie markiert die Grenze zwischen den Territorien der Zwerge und der Goblins.\n\nAufgrund ihrer Lage als Verbindungspunkt zwischen den beiden Gebieten diente die Br\u00fccke als Schauplatz f\u00fcr die finale Verhandlung zwischen den verfeindeten Fraktionen.\n\n# Belege\n1. Session 2026-01-27 @ 01:38:44 (https://www.youtube.com/watch?v=9RzvnnWzV7E)", "locations/die_festung_im_abgrund": "# Die Festung im Abgrund\n\nDie Festung im Abgrund ist eine uralte, halb verfallene Festung, die sich in einer farblosen Dimension befindet. Diese Dimension ist gepr\u00e4gt von schwarzem Wasser und einem grauen Himmel.\n\nDie Festung beherbergt zwei rivalisierende Schreine. Zudem diente sie als Gef\u00e4ngnis f\u00fcr [Nerash](../npcs/nerash.md).\n\n# Belege\n1. Session 2025-07-09 @ 00:05:34 (https://www.youtube.com/watch?v=XOnHa6CmDbo)", "locations/die_katakombe": "# Die Katakombe\n\nDie Katakombe ist ein unterirdischer Ort, der sich unter dem Friedhof befindet. Der Zugang erfolgt \u00fcber eine Luke.\n\nIm Inneren der Katakombe befinden sich:\n*   Ein magisches Tor\n*   Zwei S\u00e4rge mit den Inschriften:\n    *   \"Voras der Schrecken\"\n    *   \"Amelia die Heilige\"\n\n# Belege\n1. Session 2025-04-23 @ 01:38:21 (https://www.youtube.com/watch?v=z3C-bewKqUs)", "locations/die_minen": "# Die Minen\n\nEin weit verzweigtes, altes Minensystem, das sich unter der Festung erstreckt. Die Minen sind reich an magischem Erz und werden sowohl von Zwergen als auch von Goblins beansprucht. Ein unterirdischer Fluss, der von einer Br\u00fccke \u00fcberspannt wird, trennt die Reviere der beiden Parteien.\n\n# Belege\n1. Session 2026-01-27, 00:14:40, https://www.youtube.com/watch?v=9RzvnnWzV7E", "locations/die_nahe_ortschaft": "# Die nahe Ortschaft\n\nEine Ortschaft, die in einer schriftlichen Nachricht erw\u00e4hnt wurde, welche die Gruppe am K\u00f6rper eines besiegten Monsters fand. Die Gruppe fasste den Beschluss, diesen Ort zu einem sp\u00e4teren Zeitpunkt aufzusuchen.\n\n# Belege\n1. Session 2025-03-26, 01:48:35 \u2013 https://www.youtube.com/watch?v=ROCKGeeRUFw", "locations/die_versunkene_stadt": "# Die versunkene Stadt\n\nDie versunkene Stadt ist eine unterirdische, teilweise \u00fcberflutete Ruinenstadt. Der Zugang erfolgt durch einen \u00fcberfluteten Gang. In ihrem Inneren finden sich Gew\u00f6lbe, die mit Schlangenrunen verziert sind, sowie Muschelbetten. Die Stadt erstreckt sich \u00fcber tiefere, dunkle Ebenen. Es wird vermutet, dass sie einst von Anbetern eines alten Schlangengottes bewohnt wurde.\n\n# Belege\n1. Session 2025-06-10, 00:32:25, https://www.youtube.com/watch?v=cLkCu3Iq3y8", "locations/die_zwergenfestung": "# Die Zwergenfestung\n\nEine fast uneinnehmbare Festung in den Bergen. Sie verf\u00fcgt \u00fcber eine gro\u00dfe Mauer und eine Werkstatt. Zur Beheizung wird ein magischer Kristall genutzt.\n\n# Belege\n1. Session 2026-01-27 @ 00:01:29 (https://www.youtube.com/watch?v=9RzvnnWzV7E)", "locations/dungeon_unter_der_casa_de_la_cookie": "# Dungeon unter der Casa de la Cookie\n\nEin tief in die Erde f\u00fchrender Dungeon, der sich unter der [Casa de la Cookie](casa_de_la_cookie.md) befindet.\n\n## Beschreibung\n- **Atmosph\u00e4re:** Feucht, mit Dschungelbewuchs durchzogen.\n- **Geruch:** S\u00fc\u00dflicher Verwesungsgeruch liegt in der Luft.\n- **Gefahren:** In den Tunneln treten giftige Gase aus.\n- **Besonderheiten:** Ein Raum ist voller aufgestapelter Skelette.\n\n# Belege\n1. Session 2026-02-11 @ 00:01:24 (https://www.youtube.com/watch?v=3C8SD-cyNPM)", "locations/ehrenfels": "# Ehrenfels\n\n## \u00dcberblick\n\nEhrenfels ist die Gildenhauptstadt, hoch oben in einer Bergsenke gelegen. Sie dient als Standort der Gilde, von dem aus die Helden ihre Missionen starten. Die Stadt ist stark von den Erzeugnissen der Zwergenmine profitiert.\n\n## Stadtstruktur\n\nDie Stadt ist in zwei Teile geteilt: einen reicheren und einen einfacheren Teil. Zu den Einrichtungen geh\u00f6ren Schmieden, ein Handelsmarkt, eine Kathedrale und ein altes Heiligtum. In Ehrenfels befinden sich zudem die Taverne und das Quartier der Gruppe sowie das Trainingsgel\u00e4nde der Gilde, zu dem ein Portal ge\u00f6ffnet werden k\u00f6nnte.\n\n## Klima\n\nIm Winter liegt Schnee in der Stadt und der Fluss beginnt zu gefrieren.\n\n## Bedeutung in der Kampagne\n\n- Ein wichtiges Dokument soll nach Ehrenfels gebracht werden. Ein wiederbelebter Soldat nannte die Stadt als eigentliches Ziel seiner Nachricht, nachdem er zuvor von [Willauch](../locations/willauch.md) gesprochen hatte.\n- Laut [Slix](../npcs/slix.md) befindet sich in Ehrenfels der letzte Teil von [Vasuls](../npcs/vasul.md) Macht. Slix will dorthin, um seine volle St\u00e4rke zu erlangen, was die Gruppe unbedingt verhindern muss.\n\n# Belege\n\n1. Session 2025-07-22 @ 00:02:06 (https://www.youtube.com/watch?v=BRRCUgW4xRo)\n2. Session 2025-09-09 @ 00:07:30 (https://www.youtube.com/watch?v=Zl0qfuI6Goc)\n3. Session 2025-11-18 @ 00:00:04 (https://www.youtube.com/watch?v=w__ahowb9p0)\n4. Session 2026-01-06 @ 01:25:36 (https://www.youtube.com/watch?v=VGw81seFvbo)\n5. Session 2026-01-13 @ 00:45:25 (https://www.youtube.com/watch?v=w4LB1s9_3rs)\n6. Session 2026-01-27 @ 00:01:29 (https://www.youtube.com/watch?v=9RzvnnWzV7E)\n7. Session 2026-02-17 @ 00:02:18 (https://www.youtube.com/watch?v=Z2jlzpoTWVw)", "locations/ende": "# Ende\n\n**Ende** ist ein gef\u00e4hrliches und instabiles Gebiet im Norden, das von einem Vulkan dominiert wird. Es gilt als \u00e4u\u00dferst riskant, da Berichten zufolge noch niemand von einer Expedition dorthin zur\u00fcckgekehrt ist. Das Gebiet beherbergt angeblich eine alte Bibliothek, die das Ziel der Gruppe darstellt.\n\n# Belege\n1. Session 2026-03-18 @ 00:16:32 (https://www.youtube.com/watch?v=HHXxsASLrbQ)", "locations/faehre_faehrmann": "# F\u00e4hre / F\u00e4hrmann\n\nEin mystischer Steg mit einer F\u00e4hre, die eine Verbindung zur Unterwelt darstellt. Dieser Ort ist eng mit [Vasul](../npcs/vasul.md) verbunden, der die F\u00e4hre ben\u00f6tigt, um seinen Platz in der Unterwelt wieder einzunehmen. Es offenbart sich, dass Vasul selbst der F\u00e4hrmann oder der Herrscher dieser Ebene ist.\n\n# Belege\n1. Session 2025-09-06, 00:28:37, https://www.youtube.com/watch?v=vo1xnyLQDJk", "locations/fluechtlingslager": "# Fl\u00fcchtlingslager\n\nDas Fl\u00fcchtlingslager ist eine provisorische Siedlung au\u00dferhalb der Stadtmauern von [Breska](../locations/breska.md). Es wird von ausgehungerten und verzweifelten Fl\u00fcchtlingen bewohnt, bei denen es sich gr\u00f6\u00dftenteils um Zwerge handelt, die vor den Untoten aus dem Norden geflohen sind.\n\nDie Gruppe hat in diesem Lager den Winter verbracht und agiert von dort aus als Sp\u00e4her. Das Lager liegt weiter oben am Berg.\n\n# Belege\n1. Session 2025-09-17 @ 00:36:38 (https://www.youtube.com/watch?v=AhIT8dcxw2o)\n2. Session 2026-01-06 @ 00:14:46 (https://www.youtube.com/watch?v=VGw81seFvbo)", "locations/gebirgspass": "# Gebirgspass\n\n## Allgemeines\nDer Gebirgspass ist ein strategisch bedeutsamer Ort, der als Schauplatz einer gro\u00dfen Schlacht gegen eine Untotenarmee diente. Die Gruppe verteidigte diesen Pass, um die Fl\u00fcchtlinge zu sch\u00fctzen.\n\n## Ereignisse\n- **Schlacht gegen die Untotenarmee:** Die Gruppe stellte sich hier einer Untotenarmee entgegen, um den Durchzug der Fl\u00fcchtlinge zu sichern und sie vor den Angreifern zu bewahren.\n\n# Belege\n1. Session 2025-09-30, 00:01:09 \u2013 https://www.youtube.com/watch?v=bUT7Mc2hjUY", "locations/gewoelbe_der_hexe": "# Gew\u00f6lbe der Hexe\n\nDas Gew\u00f6lbe der Hexe ist ein weitl\u00e4ufiger, mehrst\u00f6ckiger Dungeon, der sich tief in die Erde erstreckt. Es beherbergt eine Vielzahl von Gefahren und Geheimnissen, darunter komplexe Fallen, aggressive Pilzwesen, sogenannte Seelen-Netze und einen Raum, der mit den \u00dcberresten toter Seraphen gef\u00fcllt ist.\n\n# Belege\n1. Session 2025-06-17, 00:02:31, https://www.youtube.com/watch?v=tl76B4V0io8", "locations/gild
