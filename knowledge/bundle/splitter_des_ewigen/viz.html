<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OKF Bundle Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  color: #0f172a;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }
.muted { color: #64748b; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #fff;
}
.controls input { width: 220px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;
  position: relative;
}
#detail {
  flex: 0 0 40%;
  overflow-y: auto;
  padding: 18px 22px;
  background: #fff;
}
#detail-empty {
  text-align: center;
  margin-top: 40px;
}

.detail-header { margin-bottom: 12px; }
.detail-header h1 {
  font-size: 18px;
  margin: 4px 0 2px;
  font-weight: 600;
}
.type-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
dl.frontmatter {
  display: grid;
  grid-template-columns: 90px 1fr;
  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

#detail-body { font-size: 13px; line-height: 1.55; }
#detail-body h1 {
  font-size: 16px; margin: 18px 0 6px;
  padding-bottom: 4px; border-bottom: 1px solid #e2e8f0;
}
#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }
#detail-body p { margin: 6px 0; }
#detail-body code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
}
#detail-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
}
#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }
#detail-body table { border-collapse: collapse; margin: 8px 0; }
#detail-body th, #detail-body td {
  border: 1px solid #e2e8f0; padding: 4px 8px; font-size: 12px;
}
#detail-body a.internal { color: #2563eb; cursor: pointer; }
#detail-body a.external { color: #2563eb; }

#detail-backlinks { margin-top: 18px; }
#detail-backlinks h2 { font-size: 13px; color: #64748b; margin-bottom: 6px; }
#detail-backlinks ul { padding-left: 18px; }
#detail-backlinks a { color: #2563eb; cursor: pointer; }

</style>
</head>
<body>
<header>
  <div class="title">
    <strong id="bundle-name"></strong>
    <span class="muted">OKF bundle</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search title / id / tag">
    <select id="filter-type">
      <option value="">All types</option>
    </select>
    <select id="layout">
      <option value="cose">cose (force)</option>
      <option value="concentric">concentric</option>
      <option value="breadthfirst">breadth-first</option>
      <option value="circle">circle</option>
      <option value="grid">grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>

<main>
  <section id="graph"></section>
  <section id="detail">
    <div id="detail-empty" class="muted">Click a node to see its details.</div>
    <article id="detail-content" hidden>
      <header class="detail-header">
        <span class="type-chip" id="detail-type"></span>
        <h1 id="detail-title"></h1>
        <div class="muted" id="detail-id"></div>
      </header>
      <dl class="frontmatter">
        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
      </dl>
      <hr>
      <div id="detail-body"></div>
      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>
        <ul id="backlinks-list"></ul>
      </section>
    </article>
  </section>
</main>

nd Cookie verbrennen ein unnat\u00fcrliches, pulsierendes Gebilde aus gr\u00fcnen Kristallen mit geb\u00fcndelter Feuermagie, was zu einer int\u2026", "resource": "", "tags": ["events"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "events/zirkusvorfuehrung", "label": "Zirkusvorf\u00fchrung", "type": "Event", "description": "Um die gedr\u00fcckte Stimmung in der Taverne zu heben, f\u00fchren Nyrella und Nairuk Kunstst\u00fccke auf, unterst\u00fctzt von Rotunas' Lichtzaubern und Est\u2026", "resource": "", "tags": ["events"], "color": "#94a3b8", "size": 33}}, {"data": {"id": "events/zweiter_arena_kampf", "label": "Zweiter Arena-Kampf", "type": "Event", "description": "Der Kampf gegen die Phasenspinne und ihre Brut. Ein z\u00e4her Kampf, bei dem Esterossa vergiftet wird. Die Gruppe findet und birgt das Spinnene\u2026", "resource": "", "tags": ["events"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "factions/alte_goetter_old_gods", "label": "Alte G\u00f6tter (Old Gods)", "type": "Faction", "description": "Die fr\u00fcheren Herrscher der Welt, die von den neuen G\u00f6ttern verdr\u00e4ngt und in eine andere Ebene verbannt wurden. Ihre Diener versuchen durch\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "factions/banditen_fraktion", "label": "Banditen (Fraktion)", "type": "Faction", "description": "Eine gro\u00dfe Gruppe, aufgeteilt unter zwei Anf\u00fchrern, die in der n\u00f6rdlichen Schneise operiert und Handelsrouten kontrolliert.", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "factions/brabarand_gilde", "label": "Brabarand-Gilde", "type": "Faction", "description": "Eine bekannte Assassinengilde, die f\u00fcr Auftragsmorde angeheuert wird. Ihre Mitglieder nutzen Gifte, Armbr\u00fcste und Dolche. Sie wurden auf di\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "factions/der_alte_schlangengott", "label": "Der alte Schlangengott", "type": "Faction", "description": "Eine alte Gottheit, die in der versunkenen Stadt verehrt wurde. Darauf deuten die Schlangenk\u00f6pfe auf den Glyphen und Runen hin, die aufleuc\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "factions/der_einfluss_der_hack", "label": "Der Einfluss der Hack", "type": "Faction", "description": "Eine Gruppe oder Person, die in der Vergangenheit mit einem verkleinernden Fluch auf Dodo interagierte. Eine Statue von ihr wurde in der Bu\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 34}}, {"data": {"id": "factions/die_alten_goetter", "label": "Die Alten G\u00f6tter", "type": "Faction", "description": "Ehemalige G\u00f6tter, die Seelen-Netze zur Bestrafung nutzten. Wurden im Krieg besiegt, haben aber offenbar immer noch Macht. Dodo betet zu ein\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "factions/die_gilde", "label": "Die Gilde", "type": "Faction", "description": "Die Auftraggeber der Helden. Eine Organisation, die eine andere Gruppe geschickt hatte, um das Goblin-Camp auszuheben, und nun Valeria und\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "factions/dwarfmaster_gilde", "label": "Dwarfmaster Gilde", "type": "Faction", "description": "Die Organisation, die Dodo und Cookie beauftragt hat, die Ursache f\u00fcr die Untoten in Zebros zu untersuchen.", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 35}}, {"data": {"id": "factions/dwarfmasters_gilde", "label": "Dwarfmasters-Gilde", "type": "Faction", "description": "Die Organisation, der die Helden angeh\u00f6ren. Sie betreibt den Au\u00dfenposten, um das Portal zu bewachen und die Kreaturen der alten G\u00f6tter zu s\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "factions/fluechtlinge_aus_breska", "label": "Fl\u00fcchtlinge aus Breska", "type": "Faction", "description": "Eine Gruppe von Dorfbewohnern, die von der Gruppe besch\u00fctzt und zum Banditenlager gef\u00fchrt wird, aber auf dem Weg von Untoten angegriffen wi\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "factions/gilde", "label": "Gilde", "type": "Faction", "description": "Die Auftraggeberin der Gruppe, die sie losschickt, um die Krypta zu s\u00e4ubern.", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "factions/gilde_der_schilder", "label": "Gilde der Schilder", "type": "Faction", "description": "Eine kleine, aber lukrative Gilde in Tiefwasser, die mit Willauch verb\u00fcndet ist. Ihre Mitglieder, wie Lara, \u00fcbernehmen Auftr\u00e4ge wie das Aus\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "factions/gilde_ehrenfels", "label": "Gilde (Ehrenfels)", "type": "Faction", "description": "Die Organisation, der die Spielercharaktere angeh\u00f6ren. Ihr Anf\u00fchrer Nox hat den Auftrag gegeben, in Breska nach dem Rechten zu sehen und ar\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "factions/gnolle", "label": "Gnolle", "type": "Faction", "description": "Hy\u00e4nenartige Humanoide, die als Bogensch\u00fctzen und Nahk\u00e4mpfer die Kapelle angreifen. Sie scheinen auf eine Hack zu h\u00f6ren.", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 33}}, {"data": {"id": "factions/goblin_goetter", "label": "Goblin-G\u00f6tter", "type": "Faction", "description": "Vom Spielleiter eingef\u00fchrtes Meta-Element, bei dem der Twitch-Chat die Rolle von Goblins beeinflussenden G\u00f6ttern \u00fcbernimmt. Ein spezifische\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 35}}, {"data": {"id": "factions/goblins", "label": "Goblins", "type": "Faction", "description": "Die Bedrohung f\u00fcr das Dorf. Eine unbekannte Anzahl von Goblins plant einen Angriff auf Breska, m\u00f6glicherweise mit einer weiteren, unbekannt\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 34}}, {"data": {"id": "factions/kuatau_fischmenschen", "label": "Kuatau (Fischmenschen)", "type": "Faction", "description": "Eine Spezies glitschiger, nackter Fischmenschen mit Netzen, Speeren und Fernkampfwaffen. Sie werden von okkulten und magischen Dingen angez\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "factions/kultisten", "label": "Kultisten", "type": "Faction", "description": "Anh\u00e4nger von Varsul, die das Heiligtum umwidmen wollen. Sie werden im Kampf besiegt.", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "factions/neue_gilde_in_breska", "label": "Neue Gilde in Breska", "type": "Faction", "description": "Eine von einem Tiefenzwerg namens Gorak gef\u00fchrte Gilde, die sehr auf St\u00e4rke und Reichtum bedacht ist. Sie will die Fl\u00fcchtlinge vor der Stad\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "factions/schattenfinger", "label": "Schattenfinger", "type": "Faction", "description": "Rabenvogel\u00e4hnliche Kreaturen mit rasiermesserscharfen, vergifteten Klauen. Sie sind magisch, werden von etwas gesteuert und erf\u00fcllen blind\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "factions/silberkerne", "label": "Silberkerne", "type": "Faction", "description": "Eine als Verbrecher gebrandmarkte Gruppe, die beschuldigt wird, eine wichtige Person in Willauch ermordet zu haben. Ein Bote von ihnen bitt\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "factions/silberkornbande", "label": "Silberkornbande", "type": "Faction", "description": "Eine R\u00e4uberbande, deren Mitglieder Harl und Sarina sind. Ein Teil von ihnen kampiert nahe der Silbergruft und hat bereits erfolglos versuch\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "factions/tarvok", "label": "Tarvok", "type": "Faction", "description": "Ein alter Gott der Berge, Erdbeben und Best\u00e4ndigkeit, dessen Kapelle das urspr\u00fcngliche Ziel der Gruppe war. Die Kultisten auf dem Gipfel di\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "factions/uhoriaks", "label": "Uhoriaks", "type": "Faction", "description": "Eine uralte Gottheit oder Macht, die als 'Vernichterin' bezeichnet wird. Ihr Symbol ist ein Auge, das die Gruppe beobachtet. Im Dungeon bef\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "factions/untote_armee", "label": "Untote Armee", "type": "Faction", "description": "Eine Streitmacht von Untoten, die die Karawane angreift und von einem m\u00e4chtigen Wesen angef\u00fchrt wird, das Gefallene wiederbeleben kann.", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "factions/untote_horde_zebras", "label": "Untote Horde (Zebras)", "type": "Faction", "description": "Eine gro\u00dfe untote Bedrohung, die sich \u00fcber das Land ausbreitet und gegen die die Helden k\u00e4mpfen. In dieser Session greifen Skelett-Bogensch\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "factions/varsul_warzul", "label": "Varsul / Warzul", "type": "Faction", "description": "Ein Gott, der in vier Seelen gespalten wurde, die sich in Lindo Lauts Amulett befinden. Die Kultisten auf dem Gipfel sind seine Anh\u00e4nger un\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "factions/vorgulta", "label": "Vorgulta", "type": "Faction", "description": "Ein alter Gott, bekannt als 'Herr der Tausend Seelen', der im gro\u00dfen Krieg in Abyssalis war. Ein Buch von Tyrael beschreibt ihn wohlwollend\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "factions/zwerge", "label": "Zwerge", "type": "Faction", "description": "Die Bewohner der Festung, angef\u00fchrt von Lord Harik und Hauptmann Krevis. Sie sind geschickte Handwerker und Schmiede, die das magische Erz\u2026", "resource": "", "tags": ["factions"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/amulett", "label": "Amulett", "type": "Item", "description": "Lindos Amulett, das die Seelen von Tyrex, Esua und Sintra enth\u00e4lt. Nach der Vernichtung der b\u00f6sartigen Seelen f\u00fchlt es sich leer an.", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/amulett_des_heiligen_duran", "label": "Amulett des Heiligen Duran", "type": "Item", "description": "Ein m\u00e4chtiges Artefakt, das von der Priesterin Auranil \u00fcbergeben wird. Es verleiht Lindo Laut genug Kraft, um ein Portal zur Flucht zu ersc\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/amulett_des_lindo_laut", "label": "Amulett des Lindo Laut", "type": "Item", "description": "Enth\u00e4lt die Stimmen von drei Wesen (darunter Esua), die Lindo Laut zu Opferungen und Macht dr\u00e4ngen. Fordert ihn auf, in das Herz zu bei\u00dfen.\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 34}}, {"data": {"id": "items/amulett_von_duran", "label": "Amulett von Duran", "type": "Item", "description": "Ein m\u00e4chtiges Artefakt, das Rotunas tr\u00e4gt. Nach dem Kampf in der Buchebene ist es verdunkelt und tr\u00e4gt einen tief dunkelroten Punkt. Enth\u00e4l\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "items/amulett_von_lindo_laut", "label": "Amulett von Lindo Laut", "type": "Item", "description": "Ein magisches Amulett, das mehrere Wesenheiten beherbergt. Es wird in der N\u00e4he des Tempels st\u00e4rker und die Stimmen dr\u00e4ngen Lindo Laut zu ei\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/angriffsplan", "label": "Angriffsplan", "type": "Item", "description": "Eine Karte, die nach dem Sieg im Goblindorf gefunden wird und einen geplanten Angriff auf ein nahegelegenes Dorf zeigt, aus dem die Gruppe\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/arkaner_umhang", "label": "Arkaner Umhang", "type": "Item", "description": "Ein Umhang mit Kapuze, der seine Farbe nach Wunsch des Tr\u00e4gers \u00e4ndern kann. Gefunden von Dodo im Turm.", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/arkanes_prisma", "label": "Arkanes Prisma", "type": "Item", "description": "Ein einmalig nutzbarer Stein, der allen Zauberrollen einen Bonus von +1 gibt. Gefunden von Lindo Laut im Turm.", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/armbrust_von_berthold", "label": "Armbrust von Berthold", "type": "Item", "description": "Eine Armbrust, die Valeria von B\u00fcrgermeister Berthold f\u00fcr eine Handvoll Gold kauft. Sie ist so gro\u00df wie Valeria selbst und wird von Rotunas\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/artefakt_kugel", "label": "Artefakt-Kugel", "type": "Item", "description": "Eine tennisballgro\u00dfe, silberne Kugel, die in der Tiefe der Mine schwebt. Nach der Bergung kann Nyrella sie aktivieren, wodurch sie zwei ill\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/auftragsschriftrolle", "label": "Auftragsschriftrolle", "type": "Item", "description": "Ein inoffizieller Eil-Mordauftrag, der beim Attent\u00e4ter gefunden wird. Darauf stehen Rotunas' Name und eine Zeichnung von ihm, jedoch ohne A\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/beschwoerungsbuch", "label": "Beschw\u00f6rungsbuch", "type": "Item", "description": "Ein Buch, das der Kultistenanf\u00fchrer bei sich tr\u00e4gt und das Lindo Laut an sich nimmt.", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/beschwoerungsfluessigkeit", "label": "Beschw\u00f6rungsfl\u00fcssigkeit", "type": "Item", "description": "Eine brodelnde Substanz aus dem Kessel, die f\u00fcr ein Ritual ben\u00f6tigt wird. Der Barde erw\u00e4gt, sie abzuf\u00fcllen.", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "items/beschwoerungsstab", "label": "Beschw\u00f6rungsstab", "type": "Item", "description": "Ein gef\u00e4hrliches Artefakt, das von der vernichteten Splitterwelt-Kreatur zur\u00fcckgelassen wurde. Es dient dazu, Kreaturen aus anderen Reichen\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/buch_der_namen", "label": "Buch der Namen", "type": "Item", "description": "Ein Buch, das Lindo Laut in einer fr\u00fcheren Session gefunden hat und in dem der Name 'Voras der Schrecken' verzeichnet ist, was bei der Iden\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/buch_flueche_und_das_schweigen", "label": "Buch 'Fl\u00fcche und das Schweigen'", "type": "Item", "description": "Ein von Safin Al Barak restauriertes, wertvolles Buch voller Fl\u00fcche, das f\u00fcr eine Hexe perfekt ist. Es enth\u00e4lt unter anderem einen Fluch, d\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "items/buch_mit_namensliste", "label": "Buch mit Namensliste", "type": "Item", "description": "Ein Buch in der Krypta, das eine Liste von Namen enth\u00e4lt, wobei die letzten Eintr\u00e4ge 'Grog' und 'Greg' noch frisch sind.", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/buch_von_vasul", "label": "Buch von Vasul", "type": "Item", "description": "Ein Buch, das Runen \u00e4hnlich denen von Lunara enth\u00e4lt und mit der Splitterwelt in Verbindung steht. Lindo Laut wirft es Belorus vor die F\u00fc\u00dfe\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "items/cookies_roter_trank", "label": "Cookies roter Trank", "type": "Item", "description": "Eine Viole mit einer roten Fl\u00fcssigkeit, die Cookie von einem Alchemisten bekam. Soll widerstandsf\u00e4higer, st\u00e4rker und mutiger machen. L\u00f6st d\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "items/daemon_in_lindo_laut", "label": "D\u00e4mon in Lindo Laut", "type": "Item", "description": "Eine b\u00f6sartige, d\u00e4monische Pr\u00e4senz in Lindo Laut, die von Mil und Tyrael entdeckt wird und mit dem Gott Basul in Verbindung stehen k\u00f6nnte.", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/das_amulett", "label": "Das Amulett", "type": "Item", "description": "Ein m\u00e4chtiges, gef\u00e4hrliches Artefakt, das Lindo Laut tr\u00e4gt. Es enth\u00e4lt die Seelenst\u00fccke von drei (ehemals vier) alten G\u00f6ttern: Koll, Glut u\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 34}}, {"data": {"id": "items/das_buch", "label": "Das Buch", "type": "Item", "description": "Ein Buch, das Lunara vor zw\u00f6lf Jahren Voras als Dank gab. Es konnte lange nicht ge\u00f6ffnet werden, bis ein Hexenartefakt verwendet wurde. Sei\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 34}}, {"data": {"id": "items/das_buch_des_belorus", "label": "Das Buch des Belorus", "type": "Item", "description": "Ein selbstgeschriebenes Buch aus den Gem\u00e4chern des Todesritters, das seine Identit\u00e4t als gefallener Paladin und General von Zebros enth\u00fcllt.", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "items/das_tagebuch", "label": "Das Tagebuch", "type": "Item", "description": "Ein Buch, das Cookie und Dodo zuvor gestohlen haben. Die Gruppe vermutet, dass die Untoten auf der Suche nach diesem Gegenstand sind.", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/der_altar", "label": "Der Altar", "type": "Item", "description": "Ein alter Opferaltar im Keller mit einer ewigen, blitzenden Flamme, die magisch aufgeladen ist und nachts zu brummen beginnt. Er scheint mi\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/der_altar_des_uhoriaks", "label": "Der Altar des Uhoriaks", "type": "Item", "description": "Ein Altar mit dem Symbol von Uhoriaks und einem Pendel. Als Cookie ihr Blut darauf tropfen l\u00e4sst, wird ihre Hand stark in Richtung des Pend\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "items/der_brennende_speer", "label": "Der brennende Speer", "type": "Item", "description": "Eine Waffe, die in einem kalten Feuer auf dem Vorhof steckte und von roten, magischen Ketten gehalten wurde. Er wurde von Valeria befreit u\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "items/der_heilige_dolch", "label": "Der heilige Dolch", "type": "Item", "description": "Eine von Dodo nach den Pl\u00e4nen des Zwergs Bullrin gefertigte Waffe. Sie muss mit heiligem \u00d6l getr\u00e4nkt und an der blauen Flamme entz\u00fcndet wer\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/der_teleportationsring", "label": "Der Teleportationsring", "type": "Item", "description": "Ein magischer Ring, der vom toten Kenku-Hexenmeister geborgen wird. Er erlaubt einmal pro kurzer Rast eine Teleportation bis zu 'very far'\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/der_thron", "label": "Der Thron", "type": "Item", "description": "Ein m\u00e4chtiger, b\u00f6ser Thron, den die Gruppe aus dem Heiligtum bergen sollte. Er wird durch das Portal transportiert und muss noch untersucht\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "items/die_blaue_flamme", "label": "Die blaue Flamme", "type": "Item", "description": "Eine seltsame, blaue Flamme in einem kleinen Raum, die wie in einer anderen Dimension zu existieren scheint. Sie ist der Ort, an dem der pr\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/die_drachenstatue", "label": "Die Drachenstatue", "type": "Item", "description": "Eine Statue in einem sporenfreien Raum, die eine sch\u00fctzende Aura ausstrahlt. Die Inschrift erw\u00e4hnt 'Das Blut des Heiligen Drachens'. Der Ha\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "items/die_ringe", "label": "Die Ringe", "type": "Item", "description": "Von Nox und Voras geschmiedete Ringe an Lindo Lauts Handgelenken, die einen Weltenwechsel erm\u00f6glichen oder verhindern sollen. Ihr Funktioni\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "items/drei_saecke_gold", "label": "Drei S\u00e4cke Gold", "type": "Item", "description": "Von der Gruppe in den sp\u00e4teren R\u00e4umen erbeutetes Gold.", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "items/ekliges_fleischstueck", "label": "Ekliges Fleischst\u00fcck", "type": "Item", "description": "Ein brauner Brei, den Tyrael Lindo Laut gibt, um den D\u00e4mon in ihm f\u00fcr eine Weile zu stillen.", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/ender_truhe", "label": "Ender-Truhe", "type": "Item", "description": "Eine magische Truhe mit einem geheimen Fach, das sich nur mit einem bestimmten Kommandowort \u00f6ffnen l\u00e4sst. Gefunden von Cookie im Turm.", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/fahndungsplakat", "label": "Fahndungsplakat", "type": "Item", "description": "Ein von Esterossa gefundenes Dokument, das einen Gnoll zeigt und eine Belohnung von 'vier H\u00e4nden' verspricht.", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/fangzahn_amulett", "label": "Fangzahn-Amulett", "type": "Item", "description": "Ein Amulett mit einem vampir\u00e4hnlichen Gebiss (nur die oberen Fangz\u00e4hne), das magische Energie ausstrahlt. Gefunden von Lindo Laut hinter ei\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/gegengift", "label": "Gegengift", "type": "Item", "description": "Ein universelles Gegengift gegen die \u00fcblichen Gifte des Sumpfes, das Esterossa f\u00fcr eine Handvoll Gold erwirbt.", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "items/glamourstein", "label": "Glamourstein", "type": "Item", "description": "Ein Stein, der eine Illusion einer Person in der N\u00e4he erzeugen kann, um als Ablenkung zu dienen. Gefunden von Rotunas im Turm.", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/gluecksbringer", "label": "Gl\u00fccksbringer", "type": "Item", "description": "Ein kleiner, gekerbter Stein mit einer Rune, die f\u00fcr 'Leben' steht. Nyrella erh\u00e4lt ihn von einer Zwergin als Dank f\u00fcr ihre Gro\u00dfz\u00fcgigkeit.", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/glueckstag_trank", "label": "Gl\u00fcckstag-Trank", "type": "Item", "description": "Ein Trank mit der Aufschrift 'Gl\u00fcckstag', gefunden in einem der R\u00e4ume. Seine Wirkung ist unbekannt.", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/goblin_buch", "label": "Goblin-Buch", "type": "Item", "description": "Ein Buch, das Esterossa besitzt und Rotunas nutzt, um w\u00e4hrend der Abenteuers bruchst\u00fcckhaft die Goblin-Sprache zu lerne "items"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "items/gruener_kristall_seelenstein", "label": "Gr\u00fcner Kristall / Seelenstein", "type": "Item", "description": "Ein Kristall, der von Hans \u00fcberbracht wird und als Energiequelle f\u00fcr eine Teleportation dient. Aus ihm werden der Todesritter und der flieg\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 33}}, {"data": {"id": "items/halsband_und_nachricht", "label": "Halsband und Nachricht", "type": "Item", "description": "Ein Halsband mit einer Markierung und eine daran befestigte Nachricht, die am toten Monster gefunden werden und auf eine nahe Ortschaft hin\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/heilige_pfeile", "label": "Heilige Pfeile", "type": "Item", "description": "Drei Silberpfeile, die in Weihwasser getaucht wurden. \u00c4u\u00dferst effektiv gegen Untote, wie der kritische Treffer gegen einen untoten W\u00e4chter\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "items/heiliger_streitkolben_aus_zebras", "label": "Heiliger Streitkolben aus Zebras", "type": "Item", "description": "Dodos Waffe, die sich als f\u00e4hig erweist, das magische Schutzschild des Todesritters zu durchdringen und ihm schweren Schaden zuzuf\u00fcgen.", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/heiliges_oel", "label": "Heiliges \u00d6l", "type": "Item", "description": "Ein Trank, der bei einer Leiche in einem roten Gewand gefunden wurde. Er wird ben\u00f6tigt, um den Dolch zu pr\u00e4parieren, bevor er an der heilig\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/heiltinktur_des_gnolls", "label": "Heiltinktur des Gnolls", "type": "Item", "description": "Ein Brei aus Kr\u00e4utern und Fl\u00fcssigkeit, der Rotunas' Vergiftung heilt, ihn aber zun\u00e4chst in Ohnmacht fallen l\u00e4sst.", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 33}}, {"data": {"id": "items/heiltrank", "label": "Heiltrank", "type": "Item", "description": "Ein Heiltrank, der bei der Leiche des ersten besiegten Goblins gefunden und von Dodo mitgenommen wird.", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/kontrollrune", "label": "Kontrollrune", "type": "Item", "description": "Eine magische Rune, die zur Kontrolle dient. Eine wurde unter einem gr\u00fcnen Kristall gefunden und zerst\u00f6rt, eine weitere im Torso des zerst\u00f6\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/kornklatscher", "label": "Kornklatscher", "type": "Item", "description": "Ein starkes, von Goblins gebrautes alkoholisches Getr\u00e4nk, das wie Putzalkohol schmeckt und im Magen blubbert. Es wird in der Taverne zu ein\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "items/kristall", "label": "Kristall", "type": "Item", "description": "Ein magisches Artefakt, das von Belorus' Magiern getragen wird. Es wird von Hal mit der Balliste beschossen und sp\u00e4ter von Rotunas mit eine\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "items/lebende_kristalle", "label": "Lebende Kristalle", "type": "Item", "description": "Ein leuchtendes, silbernes Material in der Mine, das eine eigene Lebensform zu sein scheint und sich langsam bewegt. Es erinnert Lunara an\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "items/lila_kristalle", "label": "Lila Kristalle", "type": "Item", "description": "Besondere, nicht-magische Kristalle aus dem Norden, die bei Ber\u00fchrung Lebewesen kristallisieren lassen. Wurden f\u00fcr die Erschaffung des Gole\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/lindo_lauts_amulett", "label": "Lindo Lauts Amulett", "type": "Item", "description": "Beherbergt mehrere Stimmen, darunter die von Kol Meref. Es zieht Lindo Laut zum Schrein, reagiert auf die Umgebung und versucht, ihn von de\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "items/logbuch_der_expedition", "label": "Logbuch der Expedition", "type": "Item", "description": "Ein besch\u00e4digtes Buch aus dem Schiffswrack, das von Rotunas mit Magie repariert wird. Es beschreibt eine Expedition zu einer Kirche auf ein\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "items/magische_handschellen", "label": "Magische Handschellen", "type": "Item", "description": "G\u00f6ttliche Artefakte, die von Nox angeboten werden. Sie k\u00f6nnen m\u00e4chtige Wesen bannen und alle magischen F\u00e4higkeiten des Tr\u00e4gers unterdr\u00fccken\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "items/magischer_schluessel", "label": "Magischer Schl\u00fcssel", "type": "Item", "description": "Ein Gegenstand, den der Magier Lendras nach dem Kampf an Esterossa \u00fcbergibt.", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 36}}, {"data": {"id": "items/magischer_stab", "label": "Magischer Stab", "type": "Item", "description": "Ein Artefakt im Besitz von Lindo Laut, das als Portalschl\u00fcssel dient und immense zerst\u00f6rerische Energie gegen D\u00e4monen freisetzen kann.", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 33}}, {"data": {"id": "items/magisches_erz", "label": "Magisches Erz", "type": "Item", "description": "Ein wertvoller, energiegeladener Rohstoff aus den Minen, der f\u00fcr magische Artefakte und Waffen genutzt wird. Ein gro\u00dfer Brocken davon wird\u2026", "resource": "", "tags": ["items"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "items/metallarm_von_rotunas", "label": "Metallarm von Rotunas", "type": "Item", "description": "Eine von Zwergeningenieu "description": "Der \u00e4ltere Verwalter von Crowfin Manor. Er f\u00fchrt die Gruppe durch das Haus, erz\u00e4hlt von dessen Geschichte und opfert sich im Kampf gegen Sl\u2026", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "npcs/lisa", "label": "Lisa", "type": "NPC", "description": "Eine Einheimische aus Willau, die die Gruppe aus Ehrenfels kennt und ihnen Informationen \u00fcber das Turnier und die Stadt gibt.", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "npcs/loran_silberbart", "label": "Loran Silberbart", "type": "NPC", "description": "Ein Zwerg, der die Helden an der Festung empf\u00e4ngt und sie durch die Anlage f\u00fchrt. Er begleitet die Gruppe bei den Verhandlungen und verteid\u2026", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "npcs/lord_belorus", "label": "Lord Belorus", "type": "NPC", "description": "Ein m\u00e4chtiger untoter Lord in schwarzer R\u00fcstung, der die Untoten kontrolliert und Breska belagert. Er erscheint pers\u00f6nlich, um Lindo Laut z\u2026", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "npcs/lord_harik", "label": "Lord Harik", "type": "NPC", "description": "Der Zwergenf\u00fcrst in prunkvoller R\u00fcstung. Er ist verhandlungsbereiter als sein Hauptmann, will Blutvergie\u00dfen vermeiden und geht das Risiko e\u2026", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "npcs/lord_kaledan_und_lady_lyra_von_willau", "label": "Lord Kaledan und Lady Lyra von Willau", "type": "NPC", "description": "Die Herrscher von Willau, die kunstvolle K\u00e4mpfe sch\u00e4tzen und ein St\u00fcck Land als Hauptpreis f\u00fcr den Solo-Champion ausgelobt haben.", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "npcs/lord_kalidarn_von_willoch", "label": "Lord Kalidarn von Willoch", "type": "NPC", "description": "Der Herrscher von Willoch. Er wirkt emotionslos und schwer zu beeindrucken. Er entscheidet per Daumenzeichen \u00fcber das Schicksal des Werwolf\u2026", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "npcs/lukas", "label": "Lukas", "type": "NPC", "description": "Ein freundlicher Goblin-Alchemist, der der Gruppe das Haus zeigt und selbstgebraute Tr\u00e4nke anbietet, darunter einen dubiosen Heiltrank und\u2026", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "npcs/luli", "label": "Luli", "type": "NPC", "description": "Eine kleine, sanfte Pilzkreatur, die von der 'gr\u00fcnen Dame' (Hexe) eingesperrt wurde, nachdem ihre Familie in einen Kessel geworfen wurde. W\u2026", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "npcs/lurk", "label": "Lurk", "type": "NPC", "description": "Ein intelligenter Goblin-Anf\u00fchrer, der die erste Verhandlungsrunde f\u00fchrt. Er ist misstrauisch und lehnt das Angebot von magischem Erz ab. A\u2026", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "npcs/marktschreier", "label": "Marktschreier", "type": "NPC", "description": "Ein Nachrichtenverbreiter, der in der Taverne Neuigkeiten verk\u00fcndet, darunter die milit\u00e4rische Aufr\u00fcstung in Willau, die Nachrichtensperre\u2026", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "npcs/marus", "label": "Marus", "type": "NPC", "description": "Der Anf\u00fchrer der in der N\u00e4he der Silbergruft lagernden Silberkornbande. Er ist misstrauisch, aber kooperativ, nachdem die Gruppe ihr Wissen\u2026", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "npcs/meister_grimm", "label": "Meister Grimm", "type": "NPC", "description": "Ein zwergischer \u00dcberlebender, der leicht aufbrausend und misstrauisch ist. Er trauert um den gefallenen Prinzen Bran.", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "npcs/meister_pyrandras", "label": "Meister Pyrandras", "type": "NPC", "description": "Ein goldener Dragonborn und hochrangiger W\u00e4chter der Gilde. Er reagiert sofort auf den Alarm, organisiert die Verteidigung und durchbricht\u2026", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "npcs/miaomani", "label": "Miaomani", "type": "NPC", "description": "Ein Mitglied der Schiffsbesatzung, das die Insel aus der Ferne beobachtet und die vielen Fackeln entdeckt hat.", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "npcs/mil", "label": "Mil", "type": "NPC", "description": "Ein katzenartiger Berserker und zweifacher Solo-Champion, der eine d\u00e4monische Pr\u00e4senz in Lindo Laut sp\u00fcrt und ihm misstrauisch gegen\u00fcberste\u2026", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "npcs/mimic", "label": "Mimic", "type": "NPC", "description": "Eine als riesige Muschel getarnte Kreatur, die Lindo Laut und Cookie angreift. Sie verschlingt Cookie fast, wird aber von Dodo und Rotunas\u2026", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "npcs/miner_demon", "label": "Miner Demon", "type": "NPC", "description": "Ein feuerbeschw\u00f6render D\u00e4mon (Tier 1, Solo), Anh\u00e4nger der alten Gottheiten. Er ist intelligent, telepathisch unempf\u00e4nglich f\u00fcr Lindos Kommu\u2026", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "npcs/nai_ruk", "label": "Nai Ruk", "type": "NPC", "description": "Nyrellas Eisb\u00e4ren-Begleiter. Zeigt im Verlauf der Session Anzeichen von Schmerz und Angst.", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "npcs/nairog", "label": "Nairog", "type": "NPC", "description": "Nyrellas Eisb\u00e4r-Begleiter, der als Seelentier beschrieben wird und bei den Nomaden f\u00fcr Erschrecken sorgt.", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "npcs/nairog_nyruk", "label": "Nairog/Nyruk", "type": "NPC", "description": "Nyrellas B\u00e4rengef\u00e4hrte, der im Kampf unterst\u00fctzt und auf den sie reitet.", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "npcs/nairuk", "label": "Nairuk", "type": "NPC", "description": "Ein Begleiter der Gruppe, der im Kampf gegen die Untoten in der ersten Reihe steht und Angriffe abwehrt.", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 36}}, {"data": {"id": "npcs/nayruk", "label": "Nayruk", "type": "NPC", "description": "Nyrellas B\u00e4renbegleiter, der im Kampf versucht, den Todesritter von Dodo abzulenken, aber von diesem ignoriert wird.", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "npcs/nerash", "label": "Nerash", "type": "NPC", "description": "Ein verschollener Demigott, der einst f\u00fcr die neuen G\u00f6tter k\u00e4mpfte. Sie war in der Festung in magischen Ketten gefangen und wird von der Gr\u2026", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 35}}, {"data": {"id": "npcs/nip", "label": "Nip", "type": "NPC", "description": "Ein st\u00e4ndig betrunkener Dorfbewohner in der Taverne. Er ist sehr schreckhaft und f\u00e4llt bei Valerias Zaubervorf\u00fchrung ohnm\u00e4chtig um.", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "npcs/nox", "label": "Nox", "type": "NPC", "description": "Der Gildenmeister der Dwarfmasters. Er f\u00fchrt das Beschw\u00f6rungsritual am Portal durch, \u00fcberwacht das Training und erkl\u00e4rt der Gruppe die Hint\u2026", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 34}}, {"data": {"id": "npcs/orlanius_schwarzhorn", "label": "Orlanius Schwarzhorn", "type": "NPC", "description": "Ein Magier in Bresca, Spezialist f\u00fcr altes Wissen. Warnt Lindo Laut vor der korrumpierenden Macht des verdunkelten Amuletts und ": "Rachs\u00fcchtiger D\u00e4mon (Ratte)", "type": "NPC", "description": "Ein D\u00e4mon, der einen alten Vertrag mit Vasul \u00fcber 10.000 Seelen und Halbg\u00f6tter einfordert. Er wird von Lindo Laut verbannt, kehrt sp\u00e4ter zu\u2026", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "npcs/rachsuechtiger_geist", "label": "Rachs\u00fcchtiger Geist", "type": "NPC", "description": "Ein Geist, der Rotunas verfolgt, weil dieser eine Rune zu Beginn des Dungeons ber\u00fchrt hat. Erscheint mehrfach, entzieht Energie und kann nu\u2026", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "npcs/rodek", "label": "Rodek", "type": "NPC", "description": "Der \u00c4lteste des Sumpfdorfes Cornivum, ein Druide. Er empf\u00e4ngt die Gruppe im Auftrag der Gilde, bietet ihnen Unterkunft und verkauft ihnen G\u2026", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "npcs/roland", "label": "Roland", "type": "NPC", "description": "Der Sprecher und \u00c4lteste des Fl\u00fcchtlingslagers vor Breska. Er ist ein alter Bekannter der Gruppe aus der Zeit der Goblin-Belagerung. Er ist\u2026", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 35}}, {"data": {"id": "npcs/rolanes", "label": "Rolanes", "type": "NPC", "description": "Ein reicher, hochn\u00e4siger Tiefling und 'Meister der M\u00fcnze' in der neuen Gilde. Er hat den Einlassstopp f\u00fcr mittellose Fl\u00fcchtlinge in die Sta\u2026", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 31}}, {"data": {"id": "npcs/safin_al_barak", "label": "Safin Al Barak", "type": "NPC", "description": "Der H\u00fcter der Schriften und Bibliothekar aus Wabarask. Er ist sehr wissbegierig und misstrauisch, beobachtet die Gruppe genau und konfiszie\u2026", "resource": "", "tags": ["npcs"], "color": "#94a3b8", "size": 32}}, {"data": {"id": "npcs/sandro", "label": "Sandro", "type": "NPC", "description": "Ein vampirischer Magier i voras"}}, {"data": {"id": "npcs/tindrael__npcs/bertie", "source": "npcs/tindrael", "target": "npcs/bertie"}}, {"data": {"id": "npcs/tindrael__characters/dodo", "source": "npcs/tindrael", "target": "characters/dodo"}}, {"data": {"id": "npcs/todesritter_general_der_untoten__characters/rotunas", "source": "npcs/todesritter_general_der_untoten", "target": "characters/rotunas"}}, {"data": {"id": "npcs/todesritter_general_der_untoten__characters/lindo_laut", "source": "npcs/todesritter_general_der_untoten", "target": "characters/lindo_laut"}}, {"data": {"id": "npcs/trickler__characters/rotunas", "source": "npcs/trickler", "target": "characters/rotunas"}}, {"data": {"id": "npcs/tyrex__characters/lindo_laut", "source": "npcs/tyrex", "target": "characters/lindo_laut"}}, {"data": {"id": "npcs/varsul__characters/lindo_laut", "source": "npcs/varsul", "target": "characters/lindo_laut"}}, {"data": {"id": "npcs/vasul__characters/lindo_laut", "source": "npcs/vasul", "target": "characters/lindo_laut"}}, {"data": {"id": "npcs/vasul__npcs/belorus", "source": "npcs/vasul", "target": "npcs/belorus"}}, {"data": {"id": "npcs/voras__npcs/belorus", "source": "npcs/voras", "target": "npcs/belorus"}}, {"data": {"id": "npcs/voras__npcs/nox", "source": "npcs/voras", "target": "npcs/nox"}}, {"data": {"id": "npcs/waechter_des_berges__characters/lindo_laut", "source": "npcs/waechter_des_berges", "target": "characters/lindo_laut"}}, {"data": {"id": "npcs/wasserelementare__characters/dodo", "source": "npcs/wasserelementare", "target": "characters/dodo"}}], "bodies": {"characters/brim": "# Brim\n\nBrim ist ein zwergischer Krieger (Slayer), der neu zur Gruppe gesto\u00dfen ist. Er ist noch keiner Gilde fest beigetreten.\n\n## Pers\u00f6nlichkeit & Verhalten\n\n*   **Pragmatisch:** Brim zeigt eine pragmatische Herangehensweise an Situationen.\n*   **Initiative in Gespr\u00e4chen:** Er \u00fcbernimmt oft die F\u00fchrung in Gespr\u00e4chen mit Fremden oder potenziellen Verb\u00fcndeten.\n*   **\u00dcberforderung:** Trotz seiner Tapferkeit ist er von den \u00fcbernat\u00fcrlichen Ereignissen und der Splitterwelt sichtlich \u00fcberfordert.\n\n## F\u00e4higkeiten\n\n*   **Kampfkraft:** Er beweist im Kampf gegen Ghule und eine Schattenkreatur gro\u00dfe St\u00e4rke und Tapferkeit.\n\n# Belege\n\n1.  Session 2026-03-10 @ 00:00:35 (https://www.youtube.com/watch?v=Kr9_AC2XtOw)\n2.  Session 2026-03-18 @ 00:05:39 (https://www.youtube.com/watch?v=HHXxsASLrbQ)", "characters/cookie": "# Cookie (Ribbit)\n\nCookie ist eine froschartige Waldl\u00e4uferin (Ranger, Beast Bound) vom Volk der Ribbit (auch als Grung bezeichnet). Sie wird von der Spielerin Celin verk\u00f6rpert und ist ein zentrales Mitglied der Heldengruppe.\n\n## Aussehen & Merkmale\nCookie ist ein kleines Froschwesen mit gr\u00fcner Haut. Sie besitzt eine lange, greifbare Zunge und hat im Laufe der Abenteuer eine bleibende Narbe davongetragen. Sie sch\u00fctzt sich gelegentlich mit einem K\u00e4ferpanzer.\n\n## Herkunft & Lebensweise\nCookie ist in einer H\u00f6hle unter der Erde aufgewachsen und liebt den Sumpf. Sie hasst K\u00e4lte, kann aber unter Wasser atmen und im Dunkeln sehen (Nachtsicht). Sie hat panische Angst vor Spinnen.\n\n## Pers\u00f6nlichkeit\nCookie ist neugierig, nascht gerne und hat Manieren. Vor K\u00e4mpfen zeigt sie sich oft nerv\u00f6s. Sie ist mitf\u00fchlend und unterst\u00fctzt ihre Gef\u00e4hrten emotional, etwa als sie [Lindo Laut](../npcs/lindo_laut.md) Mut zuspricht. Sie zeigt Besorgnis \u00fcber die Motive von Gegnern und hinterfragt Dorfbewohner kritisch.\n\n## F\u00e4higkeiten & Ausr\u00fcstung\n\n### Kampf\n- **Kurzbogen**: Cookies Hauptwaffe, mit der sie \u00e4u\u00dferst geschickt ist. Sie setzt verschiedene Spezialpfeile ein, darunter Giftpfeile und gekaufte L\u00e4hmungspfeile.\n- **Tarnung**: Sie ist sehr gut getarnt und kann sich nahezu unsichtbar machen.\n\n### Magie & Naturverbundenheit\n- **Sprache der verborgenen Natur**: Cookie kann mit Tieren und Pflanzen sprechen. Dies erm\u00f6glicht ihr unter anderem die Kommunikation mit den [Kuatau](../npcs/kuatau.md), mit Pilzen (was eine beunruhigende Vision ausl\u00f6st) und die Analyse von Golemschw\u00e4chen.\n- **Rankenmagie (Vicious Entangle)**: Sie nutzt Ranken, um Gegner festzuhalten oder festzusetzen, und setzt diese F\u00e4higkeit in vielen K\u00e4mpfen ein.\n- **Eisranken / Eismagie**: Eine Weiterentwicklung ihrer Rankenmagie, mit der sie Gegner einfrieren kann.\n- **Wirbelsturm**: Eine weitere Naturzauber-F\u00e4higkeit.\n- **Heilfeld**: Sie kann ein heilendes Feld erschaffen und wird in einer Session als Heilerin bezeichnet.\n- **Heilige Pfeile (Holy Arrows)**: Eine magische Pfeilf\u00e4higkeit.\n\n### Begleiter\n- **[Perry](perry.md)**: Ein giftiges Schnabeltier, das als ihr tierischer Begleiter fungiert. Perry kann im Kampf unterst\u00fctzen, ger\u00e4t aber im Dungeon auch einmal in Panik.\n\n### Gegenst\u00e4nde\n- **Voodoo-Puppe**: Von Cookie gefunden; sie verletzt sich im Finale eines Kampfes versehentlich selbst damit.\n- **Roter Trank eines Alchemisten**: Ein geheimnisvoller Trank, mit dem sie [Lindo Laut](../npcs/lindo_laut.md) das Leben rettet, als dieser nach einem Biss in ein Herz zu ersticken droht.\n- **Psychoaktive Pflanzensubstanz**: Von ihr gesammelt.\n- **Speer**: Dessen Aufheben eine Geistererscheinung ausl\u00f6st.\n\n## Wichtige Taten & Ereignisse\n- Findet in einer Session das entscheidende Buch.\n- Erledigt einen D\u00e4mon mit einem finalen Kopfschuss.\n- Befreit die Pilzkreatur [Luli](../npcs/luli.md).\n- Wird im Kampf gegen eine Mimic und Schleimkreaturen zweimal fast get\u00f6tet und ist danach stark angeschlagen und ver\u00e4ngstigt.\n- Wird in einem sp\u00e4teren Kampf schwer verwundet und erh\u00e4lt eine bleibende Narbe.\n- Wird im Dungeon kurzzeitig vom Hauptgegner mental kontrolliert und zum Angriff auf eine Drachenstatue gezwungen.\n- Beeindruckt eine Menge mit einer magischen Lichtshow.\n- Kundschaftet mit [Nyrella](../npcs/nyrella.md) ein Banditenlager aus.\n- Sp\u00fcrt Kreaturen f\u00fcr ein Opferritual auf.\n- Sammelt Proben von Kristallen und analysiert deren Schw\u00e4chen.\n\n## Tod\nCookie f\u00e4llt heldenhaft im Kampf gegen einen Lich. Ihr Tod wird in der Taverne betrauert, und ein Marktschreier wird beauftragt, ihre Legende zu verbreiten.\n\n# Belege\n1. Session 2025-03-26 @ 00:11:02 (https://www.youtube.com/watch?v=ROCKGeeRUFw)\n2. Session 2025-04-01 @ 00:03:47 (https://www.youtube.com/watch?v=LZIuUzc3F18)\n3. Session 2025-04-15 @ 00:03:45 (https://www.youtube.com/watch?v=YCpAz_syjaY)\n4. Session 2025-04-30 @ 00:06:27 (https://www.youtube.com/watch?v=fsCOiSkKKTE)\n5. Session 2025-05-14 @ 00:04:12 (https://www.youtube.com/watch?v=5eAEDN5ra-4)\n6. Session 2025-05-27 @ 00:03:06 (https://www.youtube.com/watch?v=bamCIB_CkR8)\n7. Session 2025-06-03 @ 00:05:35 (https://www.youtube.com/watch?v=jtYR4Je0a18)\n8. Session 2025-06-10 @ 00:31:05 (https://www.youtube.com/watch?v=cLkCu3Iq3y8)\n9. Session 2025-06-17 @ 00:04:20 (https://www.youtube.com/watch?v=tl76B4V0io8)\n10. Session 2025-07-09 @ 00:26:36 (https://www.youtube.com/watch?v=XOnHa6CmDbo)\n11. Session 2025-07-22 @ 00:10:26 (https://www.youtube.com/watch?v=BRRCUgW4xRo)\n12. Session 2025-07-29 @ 00:02:06 (https://www.youtube.com/watch?v=XXgO5Ht4Q0A)\n13. Session 2025-08-05 @ 00:01:00 (https://www.youtube.com/watch?v=cRNIWJz_ATo)\n14. Session 2025-08-12 @ 00:00:04 (https://www.youtube.com/watch?v=vHIjua0BZ9Y)\n15. Session 2025-08-20 @ 00:56:02 (https://www.youtube.com/watch?v=-XbO3FLSL_I)\n16. Session 2025-09-02 @ 00:24:38 (https://www.youtube.com/watch?v=TLZOH7TlGhk)\n17. Session 2025-09-06 @ 00:05:47 (https://www.youtube.com/watch?v=vo1xnyLQDJk)\n18. Session 2025-09-23 @ 00:00:02 (https://www.youtube.com/watch?v=DGzfqVigS0g)\n19. Session 2025-09-30 @ 00:02:59 (https://www.youtube.com/watch?v=bUT7Mc2hjUY)\n20. Session 2025-10-07 @ 00:06:03 (https://www.youtube.com/watch?v=qVAF_54S8Vw)\n21. Session 2025-10-21 @ 00:01:01 (https://www.youtube.com/watch?v=sxFhbtwoefA)\n22. Session 2025-10-28 @ 00:02:16 (https://www.youtube.com/watch?v=V6NzNakqxXM)\n23. Session 2025-11-18 @ 00:09:47 (https://www.youtube.com/watch?v=w__ahowb9p0)", "characters/dodo": "# Dodo\n\nDodo ist ein Spielercharakter und der unersch\u00fctterliche Tank der Heldengruppe. Er ist ein Halbblut mit der gemischten Herkunft eines Goblins und eines Drachen (auch als Halbdrache, Drachengeborener oder Drakoner bezeichnet) und stammt von der Insel Tarkia. Seine Erscheinung wird als gro\u00df und l\u00f6wenartig beschrieben. Er k\u00e4mpft mit einem Schild und einem Streitkolben (sp\u00e4ter mit einem heiligen Streitkolben aus Zebras) und verf\u00fcgt \u00fcber die F\u00e4higkeit, Feuer zu spucken. Im Kampf agiert er stets an vorderster Front, wirft sich sch\u00fctzend vor seine Gef\u00e4hrten und nutzt seine extrem hohe Schadensreduktion, um massiven Schaden abzufangen. Seine bekannten F\u00e4higkeiten umfassen 'I am your Shield' und 'Unstoppable'.\n\n## Pers\u00f6nlichkeit und Rolle in der Gruppe\n\nDodo ist ein pragmatischer und oft impulsiver K\u00e4mpfer, der im Kampf einsch\u00fcchternd wirkt, aber auch taktisches Geschick zeigt, etwa beim \u00d6ffnen von T\u00fcren mit Seilen. Er \u00fcbernimmt h\u00e4ufig die Rolle des Anf\u00fchrers und Sprechers der Gruppe, beispielsweise gegen\u00fcber der Gilde. Trotz seiner harten Schale zeigt er eine f\u00fcrsorgliche Seite: Er teilt seine Heiltr\u00e4nke mit [Cookie](../npcs/cookie.md), eilt [Esterossa](esterossa.md) zu Hilfe und spendet der Gruppe in schwierigen Momenten Trost. Er kann jedoch auch von Hoffnungslosigkeit ergriffen werden, wie auf einer Br\u00fccke, wo er von seinen Gef\u00e4hrten aufgeheitert werden musste. Nach einem emotionalen Gespr\u00e4ch mit [Lindo Laut](lindo_laut.md) wurde er als ungew\u00f6hnlich ruhig und nachdenklich beschrieben.\n\n## Besondere Ausr\u00fcstung und F\u00e4higkeiten\n\n*   **Heiliger Streitkolben aus Zebras:** Eine seiner wenigen Waffen, die den magischen Schutz eines Todesritters durchdringen konnte. Er tr\u00e4gt das Symbol von Zebros.\n*   **Waffe aus dem Spiegel:** Er tr\u00e4gt eine Waffe, die aus einem Spiegel gezogen wurde.\n*   **Dolchaufsatz:** In einer Schmiede stellte er einen speziellen Dolchaufsatz f\u00fcr seinen Streitkolben her, um eine untote Kreatur zu vernichten.\n*   **Schwarzer Palantir:** Er brachte den schwarzen Palantir aus dem Sumpf-Dungeon mit, mit dem ein Buch ge\u00f6ffnet wurde.\n*   **Goldenes Amulett:** Fand ein goldenes Amulett in einer Ruine.\n\n## Wichtige Taten und Ereignisse\n\n*   **Arena-Champion:** Dodo ist unter dem Titel 'Trollschlechter' als Arena-Champion bekannt. Dieser Titel verschaffte der Gruppe Zugang zur Bibliothek und wird sogar von Untoten erkannt.\n*   **Kampf gegen den dunklen Paladin:** Er war bereits auf dem Berg Zebros und k\u00e4mpfte dort gegen den dunklen Paladin.\n*   **Rettungsaktionen:** Er rettete den Magier Lendras in einem Turm und [Rotunas](rotunas.md) vor dem Biss einer Schlangenkreatur.\n*   **Verhandlungen:** Er verhandelte mit Banditen und mit [Voras](../npcs/voras.md), den er allein aufsuchte.\n*   **Opfer und Heilung:** Er wurde von einem Kultisten teilweise versteinert und sp\u00e4ter durch [Lindo Lauts](lindo_laut.md) Wunsch geheilt. Er wurde von einer Splitterwelt-Kreatur verschlungen und erlitt schweren Schaden. Er ber\u00fchrte einen lila Kristall, woraufhin seine Fingerspitzen kristallisierten.\n*   **Visionen:** Er hatte eine verst\u00f6rende Vision eines aufgespie\u00dften Goblins aus seiner Heimat und erhielt eine Vision von einem Labor und einer Gestalt.\n*   **Suche:** Er sucht nach einem Freund namens Krenko.\n*   **Gildenangelegenheiten:** Er ist besorgt, die neue Gilde nicht zu ver\u00e4rgern, unterst\u00fctzt aber den Plan, Fl\u00fcchtlingen zu helfen.\n*   **Tod von Cookie:** Er \u00fcberbrachte die traurige Nachricht von [Cookies](../npcs/cookie.md) Tod und bot [Lunara](lunara.md) den Stein von Cookie an.\n\n# Belege\n\n1.  Session 2025-03-26 @ 00:08:26 (https://www.youtube.com/watch?v=ROCKGeeRUFw)\n2.  Session 2025-04-01 @ 00:05:49 (https://www.youtube.com/watch?v=LZIuUzc3F18)\n3.  Session 2025-04-15 @ 00:34:56 (https://www.youtube.com/watch?v=YCpAz_syjaY)\n4.  Session 2025-04-23 @ 00:05:28 (https://www.youtube.com/watch?v=z3C-bewKqUs)\n5.  Session 2025-05-06 @ 00:32:43 (https://www.youtube.com/watch?v=e0v6AFGd4mE)\n6.  Session 2025-05-14 @ 00:05:41 (https://www.youtube.com/watch?v=5eAEDN5ra-4)\n7.  Session 2025-05-27 @ 00:02:43 (https://www.youtube.com/watch?v=bamCIB_CkR8)\n8.  Session 2025-06-03 @ 01:08:59 (https://www.youtube.com/watch?v=jtYR4Je0a18)\n9.  Session 2025-06-10 @ 00:13:16 (https://www.youtube.com/watch?v=cLkCu3Iq3y8)\n10. Session 2025-06-17 @ 00:05:55 (https://www.youtube.com/watch?v=tl76B4V0io8)\n11. Session 2025-06-25 @ 00:00:02 (https://www.youtube.com/watch?v=tpkO9uGw6-I)\n12. Session 2025-07-09 @ 00:56:56 (https://www.youtube.com/watch?v=XOnHa6CmDbo)\n13. Session 2025-07-22 @ 00:10:13 (https://www.youtube.com/watch?v=BRRCUgW4xRo)\n14. Session 2025-08-05 @ 00:01:00 (https://www.youtube.com/watch?v=cRNIWJz_ATo)\n15. Session 2025-08-12 @ 00:04:51 (https://www.youtube.com/watch?v=vHIjua0BZ9Y)\n16. Session 2025-08-20 @ 00:27:33 (https://www.youtube.com/watch?v=-XbO3FLSL_I)\n17. Session 2025-09-02 @ 00:08:36 (https://www.youtube.com/watch?v=TLZOH7TlGhk)\n18. Session 2025-09-06 @ 00:21:38 (https://www.youtube.com/watch?v=vo1xnyLQDJk)\n19. Session 2025-09-09 @ 00:13:16 (https://www.youtube.com/watch?v=Zl0qfuI6Goc)\n20. Session 2025-09-17 @ 00:12:42 (https://www.youtube.com/watch?v=AhIT8dcxw2o)\n21. Session 2025-09-23 @ 00:04:56 (https://www.youtube.com/watch?v=DGzfqVigS0g)\n22. Session 2025-09-30 @ 00:02:00 (https://www.youtube.com/watch?v=bUT7Mc2hjUY)\n23. Session 2025-10-07 @ 00:04:49 (https://www.youtube.com/watch?v=qVAF_54S8Vw)\n24. Session 2025-10-14 @ 00:00:05 (https://www.youtube.com/watch?v=cUtz87UCHu4)\n25. Session 2025-10-21 @ 00:01:01 (https://www.youtube.com/watch?v=sxFhbtwoefA)\n26. Session 2025-10-28 @ 00:01:52 (https://www.youtube.com/watch?v=V6NzNakqxXM)\n27. Session 2025-11-14 @ 00:09:33 (https://www.youtube.com/watch?v=8Khb-Y8XbKY)\n28. Session 2025-11-18 @ 00:04:08 (https://www.youtube.com/watch?v=w__ahowb9p0)\n29. Session 2025-11-25 @ 00:41:49 (https://www.youtube.com/watch?v=wd5R4fJfngY)\n30. Session 2026-01-06 @ 00:09:34 (https://www.youtube.com/watch?v=VGw81seFvbo)\n31. Session 2026-01-13 @ 01:37:13 (https://www.youtube.com/watch?v=w4LB1s9_3rs)\n32. Session 2026-01-20 @ 00:10:51 (https://www.youtube.com/watch?v=H3ckYdTv4y8)\n33. Session 2026-02-11 @ 00:01:07 (https://www.youtube.com/watch?v=3C8SD-cyNPM)\n34. Session 2026-02-17 @ 00:00:01 (https://www.youtube.com/watch?v=Z2jlzpoTWVw)\n35. Session 2026-02-24 @ 00:02:20 (https://www.youtube.com/watch?v=WOFArbwDDIQ)\n36. Session 2026-03-03 @ 00:02:32 (https://www.youtube.com/watch?v=BRUNuNKTeOg)\n37. Session 2026-03-10 @ 00:07:37 (https://www.youtube.com/watch?v=Kr9_AC2XtOw)\n38. Session 2026-03-18 @ 00:07:23 (https://www.youtube.com/watch?v=HHXxsASLrbQ)", "characters/esterossa": "# Esterossa\n\nEsterossa ist ein gefl\u00fcgelter Seraph (auch als Aasimar, Lorborn, Norborn, Warforged oder Clank beschrieben) und agiert als Kleriker, Paladin oder Magier der Gruppe. Er tr\u00e4gt eine schwere Plattenr\u00fcstung, f\u00fchrt eine Axt (sp\u00e4ter auch einen Kriegshammer) und kann fliegen, Blitze schleudern, Verb\u00fcndete heilen sowie Schutzzauber wirken. Seine Magie ist g\u00f6ttlichen Ursprungs; er nutzt Gebete (Pray Dice) und heilige Magie, die besonders effektiv gegen untote und splittersph\u00e4rische Kreaturen ist. Er verf\u00fcgt zudem \u00fcber die F\u00e4higkeit, Materialien zu formen (Shape Material), etwa Steinw\u00e4nde zu verengen, Holztore in Stahl zu verwandeln oder Schlafr\u00e4ume im Keller zu erschaffen.\n\n## Pers\u00f6nlichkeit und Verhalten\nEsterossa zeigt eine Mischung aus t\u00f6dlichem Ernst und Belustigung im Kampf, lacht beim Zerschmettern von Gegnern und ist stets kampfbereit. Au\u00dferhalb des Kampfes verh\u00e4lt er sich diplomatisch und vorsichtig, bem\u00fcht sich um den guten Ruf der Gilde und f\u00fchrt die Gruppe bei Ermittlungen und Entscheidungsfindungen an. Gegen\u00fcber neuen Hexen ist er misstrauisch und versucht, [Nyrella](../npcs/nyrella.md) magisch vor \u00fcberm\u00e4\u00dfigem Alkoholkonsum zu sch\u00fctzen, muss sich jedoch sp\u00e4ter selbst \u00fcbergeben, als er versucht mitzuhalten. Von der Situation der Fl\u00fcchtlinge zeigt er sich weniger ber\u00fchrt, unterst\u00fctzt aber dennoch die Gruppe.\n\n## Wissen und Fertigkeiten\nEsterossa besitzt umfangreiches Wissen \u00fcber Geschichte, Kulturen, Okkultes und die Unterwelt. Er kennt die Legende des Heiligen Duran, identifiziert den Schlangenschrein, erinnert sich an die Legende des F\u00e4hrmanns und widersteht mentalen Einfl\u00fcssen der Zwischenebene. Er analysiert religi\u00f6se Symbole und entwickelt die Theorie \u00fcber den Konflikt der G\u00f6tter. Zudem identifiziert er das Symbol von Tarvok.\n\n## Wichtige Handlungen\n- Enthauptet einen betrunkenen Goblin und st\u00fcrzt den Goblin-Magier in den Tod.\n- F\u00fchrt ein Blutopfer an einer Statue durch und beschw\u00f6rt das Wesen [Lenra](../npcs/lenra.md).\n- \u00d6ffnet den Sarg von [Voras](../npcs/voras.md).\n- Freundet sich mit einer Katze namens G\u00fcnther an (sp\u00e4ter auch Adjani genannt).\n- Durchtrennt die entscheidenden Ketten von Nerash mit einem Speer.\n- Heilt mehrfach [Dodo](dodo.md), [Brass](brass.md), [Lindo Laut](lindo_laut.md), [Rotunas](rotunas.md) und [Nyrella](../npcs/nyrella.md)s B\u00e4ren Nairuk.\n- Wird im finalen Kampf schwer verletzt, aber durch [Lindo Laut](lindo_laut.md)s Wunsch wiederbelebt.\n- Schaltet einen Attent\u00e4ter mit einem kritischen Blitz aus.\n- Zerst\u00f6rt zwei mysteri\u00f6se Statuen auf den H\u00fcgeln mit seinem Kriegshammer, was den Kampfverlauf entscheidend wendet.\n- Verwandelt ein Holztor in Stahl und verst\u00e4rkt Barrikaden.\n- Ist sofort bereit, gegen [Slix](../npcs/slix.md) vorzugehen.\n\n# Belege\n1. Session 2025-04-01 @ 00:03:25 (https://www.youtube.com/watch?v=LZIuUzc3F18)\n2. Session 2025-04-15 @ 00:06:48 (https://www.youtube.com/watch?v=YCpAz_syjaY)\n3. Session 2025-04-23 @ 00:00:42 (https://www.youtube.com/watch?v=z3C-bewKqUs)\n4. Session 2025-04-30 @ 00:08:13 (https://www.youtube.com/watch?v=fsCOiSkKKTE)\n5. Session 2025-05-06 @ 00:13:39 (https://www.youtube.com/watch?v=e0v6AFGd4mE)\n6. Session 2025-05-27 @ 00:01:25 (https://www.youtube.com/watch?v=bamCIB_CkR8)\n7. Session 2025-06-03 @ 00:02:50 (https://www.youtube.com/watch?v=jtYR4Je0a18)\n8. Session 2025-07-09 @ 00:55:49 (https://www.youtube.com/watch?v=XOnHa6CmDbo)\n9. Session 2025-07-22 @ 00:09:00 (https://www.youtube.com/watch?v=BRRCUgW4xRo)\n10. Session 2025-07-29 @ 00:11:56 (https://www.youtube.com/watch?v=XXgO5Ht4Q0A)\n11. Session 2025-08-05 @ 00:01:29 (https://www.youtube.com/watch?v=cRNIWJz_ATo)\n12. Session 2025-08-12 @ 00:00:04 (https://www.youtube.com/watch?v=vHIjua0BZ9Y)\n13. Session 2025-08-20 @ 00:15:14 (https://www.youtube.com/watch?v=-XbO3FLSL_I)\n14. Session 2025-09-02 @ 00:13:34 (https://www.youtube.com/watch?v=TLZOH7TlGhk)\n15. Session 2025-09-06 @ 00:07:00 (https://www.youtube.com/watch?v=vo1xnyLQDJk)\n16. Session 2025-09-09 @ 00:17:14 (https://www.youtube.com/watch?v=Zl0qfuI6Goc)\n17. Session 2025-09-17 @ 00:03:52 (https://www.youtube.com/watch?v=AhIT8dcxw2o)\n18. Session 2025-09-23 @ 00:05:51 (https://www.youtube.com/watch?v=DGzfqVigS0g)\n19. Session 2025-09-30 @ 00:07:27 (https://www.youtube.com/watch?v=bUT7Mc2hjUY)\n20. Session 2025-10-07 @ 00:04:30 (https://www.youtube.com/watch?v=qVAF_54S8Vw)\n21. Session 2025-10-14 @ 00:00:05 (https://www.youtube.com/watch?v=cUtz87UCHu4)\n22. Session 2025-11-14 @ 00:09:33 (https://www.youtube.com/watch?v=8Khb-Y8XbKY)\n23. Session 2025-11-18 @ 00:02:14 (https://www.youtube.com/watch?v=w__ahowb9p0)\n24. Session 2025-11-25 @ 00:49:28 (https://www.youtube.com/watch?v=wd5R4fJfngY)\n25. Session 2026-01-06 @ 00:10:34 (https://www.youtube.com/watch?v=VGw81seFvbo)\n26. Session 2026-01-13 @ 01:19:15 (https://www.youtube.com/watch?v=w4LB1s9_3rs)\n27. Session 2026-01-20 @ 00:13:00 (https://www.youtube.com/watch?v=H3ckYdTv4y8)\n28. Session 2026-01-27 @ 00:01:51 (https://www.youtube.com/watch?v=9RzvnnWzV7E)\n29. Session 2026-02-11 @ 00:07:38 (https://www.youtube.com/watch?v=3C8SD-cyNPM)", "characters/esterossa_torbhalm": "# Esterossa Torbhalm\n\nEsterossa Torbhalm ist ein gefl\u00fcgelter Kleriker des Gottes [Korn](../gods/korn.md). Er betet vor K\u00e4mpfen mit dem Ausruf \u201eBlut f\u00fcr den Blutgott\u201c. Zu seinen F\u00e4higkeiten z\u00e4hlen Heilung (Healing Hands) und die Manipulation von Material (Shape Material). Im zweiten Kampf der Session wurde er von einer Spinne vergiftet und war am Ende schwer angeschlagen.\n\n# Belege\n1. Session 2025-10-21 @ 00:01:01 (https://www.youtube.com/watch?v=sxFhbtwoefA)", "characters/lindo_laut": "# Lindo Laut\n\nLindo Laut ist ein gefl\u00fcgelter Feen-Barde (Troubadour) und Magier, gespielt von Tim. Er ist bekannt f\u00fcr seine musikalischen F\u00e4higkeiten, insbesondere sein Pfeifen und Violinenspiel, mit denen er seine Gef\u00e4hrten inspiriert, heilt und Gegner manipuliert. Im Laufe der Kampagne entwickelt er sich zu einer zentralen Figur mit einer tiefen Verbindung zu dunklen, g\u00f6ttlichen M\u00e4chten.\n\n## Pers\u00f6nlichkeit und F\u00e4higkeiten\n\nLindo ist ein charismatischer und neugieriger Charakter, der sich gerne vorstellt und seine Umgebung erkundet. Er fliegt oft voraus, um zu sp\u00e4hen. Sein schauspielerisches Talent erlaubt es ihm, sein Aussehen zu ver\u00e4ndern \u2013 so kann er sich unter anderem in eine Eule oder eine Hack verwandeln. Er ist sensibel f\u00fcr Ger\u00e4usche und nutzt ein breites Arsenal an Magie:\n\n*   **Musik & Inspiration:** Inspiriert und heilt Verb\u00fcndete mit Liedern und Reden, schl\u00e4fert Gegner ein oder h\u00e4lt sie fest.\n*   **Illusion & Tarnung:** Kann sich und andere (z.B. [Cookie](../npcs/cookie.md)) unsichtbar machen.\n*   **Klangmagie:** Setzt schrille Pfiffe und telepathische Diss-Raps ein, um Gegner zu provozieren.\n*   **Arkanes & Elementares:** Wirkt m\u00e4chtige Zauber wie Arkane Salve (Akan Barrage), Feuerball, Feuermagie und Zeitmagie. Er kann arkane T\u00fcren zur Teleportation erschaffen.\n*   **Telepathie & Gedankenlesen:** Kommuniziert telepathisch und kann Erinnerungen durchsuchen.\n\n## Besondere Gegenst\u00e4nde\n\n*   **Amulett des Heiligen Duran:** Ein m\u00e4chtiges, aber gef\u00e4hrliches Artefakt, das Lindo tr\u00e4gt. Es enth\u00e4lt drei gefangene Seelenst\u00fccke und \u00fcbt eine dunkle Pr\u00e4senz auf ihn aus. Es erm\u00f6glichte ihm, ein m\u00e4chtiges Fluchtportal zu \u00f6ffnen, zieht ihn aber auch zu Schreinen und fl\u00fcstert ihm zu, Opfer zu bringen.\n*   **Dolch (Dagger):** Ein Dolch, den er von [Brass](brass.md) erhielt.\n*   **Zauberstab:** Ein portalf\u00e4higer Zauberstab, den er von [Vasul](../gods/vasul.md) (auch bekannt als Tyrex) erhielt, nachdem er eine wichtige Rolle bei dessen Wiederbelebung spielte.\n\n## Die Verbindung zu Vasul und die innere Dunkelheit\n\nLindo hat eine besondere Verbindung zum alten Gott [Vasul](../gods/vasul.md). Er tr\u00e4gt ein Fragment des Gottes in sich, das sich als eine zweite, d\u00e4monische Seele namens **Slix** manifestiert. Diese Verbindung macht ihn zu einer Gefahr f\u00fcr die Welt und f\u00fchrt dazu, dass der Gott [Belorus](../gods/belorus.md) pers\u00f6nlich erscheint, um ihn zu t\u00f6ten.\n\nUnter dem Einfluss der Stimmen aus seinem Amulett und der Macht in ihm verwandelt sich Lindo kurzzeitig in eine d\u00e4monischere Form mit vampir\u00e4hnlichen Z\u00fcgen und roten Augen. Er wird von dem Drang heimgesucht, Opfer zu bringen, kann aber mehrfach die Kontrolle behalten. Er fungiert als Kanal f\u00fcr Vasuls Macht, verbannt D\u00e4monen und kann Seelen nach Abyssalis schicken. Er \u00fcberzeugt [Belorus](../gods/belorus.md) schlie\u00dflich, dass sein Tod Vasul nur st\u00e4rken w\u00fcrde.\n\nUm seine Freunde zu sch\u00fctzen, l\u00e4sst er sich magische Handschellen anlegen, die seine Kr\u00e4fte und die Verbindung zu Slix unterdr\u00fccken. In diesem Zustand ist er auf eine Armbrust angewiesen und wirkt ruhiger und unauff\u00e4lliger. Sp\u00e4ter sucht er nach einem Verwandlungstrank und nimmt die neue Identit\u00e4t **\"Pedro die Katze\"** an.\n\n## Wichtige Beziehungen\n\n*   **[Phipps](../npcs/phipps.md):** Freundet sich mit ihm an.\n*   **[Lenra](../npcs/lenra.md):** Versucht, sie mit Musik zu beeindrucken.\n*   **[Cookie](../npcs/cookie.md):** Macht ihn unsichtbar und k\u00e4mpft an seiner Seite.\n*   **[Brass](brass.md):** Erh\u00e4lt einen Dolch von ihm.\n*   **[Esterossa](esterossa.md):** Wirkt Unsichtbarkeit auf sie und springt f\u00fcr sie ein.\n*   **[Vasul](../gods/vasul.md):** Tr\u00e4gt ein Fragment des alten Gottes in sich und dient als sein Kanal.\n*   **[Belorus](../gods/belorus.md):** Wird von ihm als Bedrohung gejagt, kann ihn aber von seiner Sache \u00fcberzeugen.\n*   **[Lunara](../npcs/lunara.md):** Befreit ihn von Slix' \u00dcbernahme.\n\n# Belege\n\n1.  Session 2025-03-26 @ 00:09:18\n2.  Session 2025-04-15 @ 00:14:37\n3.  Session 2025-04-23 @ 00:02:49\n4.  Session 2025-05-06 @ 00:06:07\n5.  Session 2025-05-27 @ 00:01:59\n6.  Session 2025-06-03 @ 00:03:57\n7.  Session 2025-06-10 @ 00:09:42\n8.  Session 2025-06-17 @ 00:06:19\n9.  Session 2025-06-25 @ 00:00:02\n10. Session 2025-07-09 @ 00:08:15\n11. Session 2025-07-22 @ 00:09:28\n12. Session 2025-07-29 @ 00:07:33\n13. Session 2025-08-05 @ 00:01:29\n14. Session 2025-08-12 @ 00:00:00\n15. Session 2025-08-20 @ 00:06:02\n16. Session 2025-09-02 @ 00:06:42\n17. Session 2025-09-06 @ 00:02:44\n18. Session 2025-09-09 @ 00:03:53\n19. Session 2025-09-23 @ 00:12:33\n20. Session 2025-09-30 @ 00:04:38\n21. Session 2025-10-07 @ 00:05:39\n22. Session 2025-10-14 @ 00:00:05\n23. Session 2025-10-28 @ 00:00:44\n24. Session 2025-11-25 @ 00:08:12\n25. Session 2026-01-06 @ 00:11:28\n26. Session 2026-01-13 @ 02:09:45\n27. Session 2026-01-20 @ 00:06:59\n28. Session 2026-02-11 @ 00:10:16\n29. Session 2026-02-17 @ 00:00:41\n30. Session 2026-02-24 @ 00:03:57\n31. Session 2026-03-03 @ 00:03:35", "characters/lindo_laut_pedro": "# Lindo Laut (Pedro)\n\nLindo Laut ist ein Spielercharakter in der Kampagne, gespielt von Pedro. Er wird von [Voras](../npcs/voras.md) als \"das ganze \u00dcbel\" bezeichnet, da er etwas in sich tr\u00e4gt.\n\n## Pers\u00f6nlichkeit und Verhalten\n\nLindo zeigt sich als besonnener und einf\u00fchlsamer Charakter. Er \u00fcbernimmt eine beruhigende Rolle innerhalb der Gruppe, insbesondere in angespannten Situationen. So beruhigt er die Gruppe gegen\u00fcber Vampiren und tr\u00f6stet [Lunara](lunara.md).\n\nGegen\u00fcber [Voras](../npcs/voras.md) zeigt er sich kritisch und hinterfragend. Er stellt diesem kritische Fragen zu dessen Pl\u00e4nen und zu den G\u00f6ttern.\n\n## Besonderheiten\n\nLindo tr\u00e4gt etwas in sich, das [Voras](../npcs/voras.md) dazu veranlasst, ihn als \"das ganze \u00dcbel\" zu bezeichnen. Die genaue Natur dessen, was er in sich tr\u00e4gt, ist bislang nicht n\u00e4her bekannt.\n\n# Belege\n\n1. Session 2026-03-10, 00:10:47, https://www.youtube.com/watch?v=Kr9_AC2XtOw", "characters/lunara_velora": "# Lunara Velora\n\nLunara Velora ist eine junge Hexe und Spielercharakterin, die sich der Gruppe anschloss, nachdem sie ihren urspr\u00fcnglichen Zirkel verloren hatte. Sie ist auf der Suche nach einer neuen Familie und einem Platz in der Welt.\n\n## Erscheinungsbild & Natur\n\nLunara hat eine blasse Haut, wei\u00dfe Haare und ist von mysteri\u00f6sen Runen bedeckt, die mit der Splitterwelt in Verbindung stehen [1][6][7]. Sie ist halb Tidekin [1]. Ihre Magie und ihr Wesen sind eng mit den Mondphasen verbunden; bei Neumond ist sie emotional aufgew\u00fchlt und unkonzentriert, w\u00e4hrend sie in der Nacht regelrecht aufbl\u00fcht [1][10].\n\nUm unerkannt zu bleiben, ver\u00e4nderte sie zeitweise ihr Aussehen mit einer Lederr\u00fcstung und \u00fcberschminkte ihre Runen [8].\n\n## Pers\u00f6nlichkeit\n\nLunara wird als k\u00fchl, geheimnisvoll und tierlieb beschrieben [2]. Sie hat gemischte Gef\u00fchle bez\u00fcglich ihrer Runen und versucht, versteckte Runen loszuwerden [7]. Ihre emotionale Willenskraft ist eine bedeutende Quelle ihrer Macht [5].\n\n## Magische F\u00e4higkeiten\n\nLunara ist eine vielseitige Hexe, deren Kr\u00e4fte verschiedene Aspekte umfassen:\n\n*   **Wundmagie:** Sie kann Verletzungen heilen und sogar k\u00fcrzlich Verstorbene wiederbeleben, wie sie es bei einem erstickten Soldaten tat [2].\n*   **Wasser- & Naturmagie:** Sie kann Wasserranken beschw\u00f6ren, um Gegner zu fesseln, und versuchte, Pflanzen Wasser zu entziehen [3][5].\n*   **Schattenmagie:** Sie nutzt Schattenfeuer im Kampf und kann das Schlachtfeld in die Splitterwelt verschieben, eine m\u00e4chtige F\u00e4higkeit, die die meisten Untoten vernichtete [4][7]. Gegen bestimmte Kreaturen aus der Splitterwelt ist ihre Schattenmagie jedoch wirkungslos [9].\n*   **Schutz- & Bannmagie:** Sie kann Pfeile mit Magie abwehren, Gegner verhexen und Ketten beschw\u00f6ren [2]. Sie sp\u00fcrt Schutzzauber und kann die Welten verbinden, um Wesen wie den D\u00e4mon Slix zu schw\u00e4chen [6].\n*   **Unkontrollierte Macht:** In emotional aufgew\u00fchlten Zust\u00e4nden, besonders bei Neumond, setzt sie m\u00e4chtige, unkontrollierte Zauber ein, die mit dem Abyssalis verbunden zu sein scheinen [10].\n\n## Wichtige Beziehungen & Ereignisse\n\n*   **Die Gruppe:** Sie bat die Gruppe um Aufnahme und gewann schnell das Vertrauen des Schnabeltiers [Perry](../npcs/perry.md) [1].\n*   **[Voras](../npcs/voras.md):** Lunara offenbarte Voras, dass er ihr vor zw\u00f6lf Jahren das Leben rettete. Aus Dankbarkeit gab sie ihm ein Buch, eine Tat, die unwissentlich die sp\u00e4teren Katastrophen ausl\u00f6ste [9].\n*   **[Slix](../npcs/slix.md):** Sie vertrieb den D\u00e4mon Slix mit ihrer emotionalen Willenskraft aus [Lindo Laut](../npcs/lindo_laut.md) und schw\u00e4chte ihn sp\u00e4ter im Kampf, indem sie die Welten verband [5][6].\n*   **[Abyssalis](../orte/abyssalis.md):** Sie hat Flashbacks an den Abyssalis, als sie lebende Kristalle in einer Mine sah, und sammelte in einer Bibliothek Informationen \u00fcber das \u201eEnde\u201c [7][10].\n\n# Belege\n\n1.  Session 2025-11-18 @ 00:21:17 (https://www.youtube.com/watch?v=w__ahowb9p0)\n2.  Session 2026-01-06 @ 00:11:40 (https://www.youtube.com/watch?v=VGw81seFvbo)\n3.  Session 2026-01-13 @ 01:54:06 (https://www.youtube.com/watch?v=w4LB1s9_3rs)\n4.  Session 2026-01-20 @ 00:14:51 (https://www.youtube.com/watch?v=H3ckYdTv4y8)\n5.  Session 2026-02-11 @ 00:03:14 (https://www.youtube.com/watch?v=3C8SD-cyNPM)\n6.  Session 2026-02-17 @ 00:03:53 (https://www.youtube.com/watch?v=Z2jlzpoTWVw)\n7.  Session 2026-02-24 @ 00:02:57 (https://www.youtube.com/watch?v=WOFArbwDDIQ)\n8.  Session 2026-03-03 @ 00:05:43 (https://www.youtube.com/watch?v=BRUNuNKTeOg)\n9.  Session 2026-03-10 @ 00:06:57 (https://www.youtube.com/watch?v=Kr9_AC2XtOw)\n10. Session 2026-03-18 @ 00:08:11 (https://www.youtube.com/watch?v=HHXxsASLrbQ)", "characters/nyrella": "# Nyrella\n\nNyrella ist eine Fee (Freeborn Fairy) und eine erfahrene Waldl\u00e4uferin, gespielt von Katha. Sie ist eine gefl\u00fcgelte Pixie, die sich auf Fernkampf mit dem Bogen sowie auf Natur- und Eismagie spezialisiert hat. Ihre treuen Begleiter sind die Eisb\u00e4ren [Nyruk/Nairog/Nairuk](../npcs/nairuk.md), auf denen sie gelegentlich reitet.\n\n## Pers\u00f6nlichkeit & Hintergrund\n\nNyrella wird als ehemalige Zirkusartistin und kleine, gefl\u00fcgelte Frohnatur beschrieben, die jedoch im Verlauf der Ereignisse zunehmend von ihren Erlebnissen gezeichnet ist. Sie leidet unter posttraumatischen Belastungsst\u00f6rungen (PTSD) und zeigt sich oft misstrauisch, besonders gegen\u00fcber neuen Verb\u00fcndeten wie [Hendrik](../npcs/hendrik.md) oder der neu gegr\u00fcndeten Gilde. Gleichzeitig besitzt sie ein starkes Mitgef\u00fchl f\u00fcr Schutzbed\u00fcrftige, insbesondere f\u00fcr Fl\u00fcchtlinge.\n\nIm Winterlager der Fl\u00fcchtlinge und ehemaligen Banditen engagiert sie sich \u00fcber einen l\u00e4ngeren Zeitraum hinweg ma\u00dfgeblich. Sie verteilt gro\u00dfz\u00fcgig Gold, f\u00f6rdert den Zusammenhalt und die Freundschaft zwischen den beiden Gruppen und tr\u00e4gt so wesentlich zum Ausbau des Lagers bei. Diese Verbundenheit f\u00fchrt sp\u00e4ter zu einem inneren Konflikt zwischen ihrer Loyalit\u00e4t zur Heldengruppe und ihrer Verantwortung f\u00fcr das Lager.\n\nNach tiefgreifenden Enth\u00fcllungen \u00fcber ihre Umgebung reagiert Nyrella zutiefst ersch\u00fcttert, verunsichert und distanziert sich emotional von der Gruppe, da sie das Gef\u00fchl hat, von Fremden umgeben zu sein.\n\n## F\u00e4higkeiten & Kampfstil\n\nIm Kampf agiert Nyrella bevorzugt aus der Ferne:\n\n*   **Bogen:** Sie ist eine treffsichere Bogensch\u00fctzin und setzt unter anderem astrale Pfeile ein, die selbst die R\u00fcstung von [Belorus](../npcs/belorus.md) schw\u00e4chen k\u00f6nnen.\n*   **Naturmagie (Ranken):** Sie beherrscht den Zauber *Vicious Entangle*, mit dem sie Gegner wie einen zweik\u00f6pfigen Riesen oder Banditen durch Dornenranken oder eiserne Ranken festsetzt und Schaden zuf\u00fcgt. Sie nutzt diese Ranken auch defensiv, um Verb\u00fcndete zu sch\u00fctzen oder [Dodo](dodo.md) aus einer Grube zu retten.\n*   **Eismagie:** Sie verf\u00fcgt \u00fcber ein eisiges, mystisches Erscheinungsbild und kann Eis magisch wirken, etwa um eine einsturzgef\u00e4hrdete Br\u00fccke zu stabilisieren.\n*   **Naturverbundenheit:** Sie kann mit der Natur und Kreaturen wie einer Silberbestien-Mutter kommunizieren und sie beruhigen.\n\n## Wichtige Beziehungen\n\n*   **[Nairuk](../npcs/nairuk.md) (auch Nyruk/Nairog):** Ihr tierischer Begleiter, ein Eisb\u00e4r, den sie reitet und der sie im Kampf unterst\u00fctzt. Nair
