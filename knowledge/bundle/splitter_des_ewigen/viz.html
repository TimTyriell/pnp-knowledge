n Heulen [3].\n\n## Besondere Vorkommnisse\n*   Wird von Kindern als lebender Rollercoaster genutzt [2].\n*   Bleibt zusammen mit Nyrella bei den Fl\u00fcchtlingen [2].\n*   Nimmt an einer Zirkusvorf\u00fchrung in der Taverne teil [3].\n*   Muss aufgrund seiner Gr\u00f6\u00dfe in einer Mine zur\u00fcckbleiben [5].\n\n# Belege\n1. Session 2025-09-23 @ 00:17:27 (https://www.youtube.com/watch?v=DGzfqVigS0g)\n2. Session 2025-09-30 @ 01:43:07 (https://www.youtube.com/watch?v=bUT7Mc2hjUY)\n3. Session 2025-11-18 @ 00:06:45 (https://www.youtube.com/watch?v=w__ahowb9p0)\n4. Session 2026-01-20 @ 01:26:45 (https://www.youtube.com/watch?v=H3ckYdTv4y8)\n5. Session 2026-02-24 @ 00:05:16 (https://www.youtube.com/watch?v=WOFArbwDDIQ)", "npcs/nayruk": "# Nayruk\n\n*   **Typ:** NPC\n*   **Zugeh\u00f6rigkeit:** [Nyrellas](../characters/nyrella.md) B\u00e4renbegleiter\n\nNayruk ist der tierische Begleiter von [Nyrella](../characters/nyrella.md). W\u00e4hrend eines Kampfes gegen einen Todesritter versuchte Nayruk, diesen von [Dodo](../characters/dodo.md) abzulenken, wurde jedoch von dem Todesritter ignoriert.\n\n# Belege\n1.  Session 2026-01-13 @ 01:51:40 (https://www.youtube.com/watch?v=w4LB1s9_3rs)", "npcs/nerash": "# Nerash\n\nNerash ist eine verschollene Demig\u00f6ttin, die einst f\u00fcr die neuen G\u00f6tter k\u00e4mpfte. Sie wurde von der Gruppe aus einer anderen Dimension befreit, wo sie in einer Festung in magischen Ketten gefangen gehalten wurde. Nach ihrer Befreiung verteidigte sie ihre Retter vor Kol Meref. Sie wird als sympathischer beschrieben als die Wesen im Amulett und \u00fcberreichte den Helden Totems als Zeichen ihrer Dankbarkeit.\n\nSp\u00e4ter versuchte die Gruppe, in einer Krypta Kontakt zu ihr aufzunehmen, um sie um Hilfe zu bitten, doch die Verbindung wurde durch eine st\u00f6rende Macht blockiert. In einer sp\u00e4teren Begegnung erschien sie [Dodo](../characters/dodo.md) und [Lindo Laut](../characters/lindo_laut.md) im Traum und gab Dodo eine Schriftrolle mit einem Ritual, um Vasul in Abyssalis zu zerst\u00f6ren.\n\n# Belege\n1. Session 2025-07-09 @ 01:14:31 (https://www.youtube.com/watch?v=XOnHa6CmDbo)\n2. Session 2025-07-22 @ 02:48:24 (https://www.youtube.com/watch?v=BRRCUgW4xRo)\n3. Session 2025-09-02 @ 01:25:28 (https://www.youtube.com/watch?v=TLZOH7TlGhk)\n4. Session 2026-02-17 @ 00:56:42 (https://www.youtube.com/watch?v=Z2jlzpoTWVw)", "npcs/nip": "# Nip\n\nNip ist ein st\u00e4ndig betrunkener Dorfbewohner, der in der \u00f6rtlichen Taverne anzutreffen ist. Er zeichnet sich durch eine sehr schreckhafte Natur aus. W\u00e4hrend einer Zaubervorf\u00fchrung von [Valeria](../characters/valeria.md) fiel er vor Schreck in Ohnmacht.\n\n# Belege\n1. Session 2025-04-09 @ 00:46:13 (https://www.youtube.com/watch?v=1PWdwvun5ow)", "npcs/nox": "# Nox\n\nNox ist der Gildenmeister der Dwarfmasters in Ehrenfels. Er wird als emotionslos beschrieben.\n\n## Rolle und Handlungen\n\n- Nox f\u00fchrte das Beschw\u00f6rungsritual am Portal durch und \u00fcberwachte das Training der Gruppe. Er erkl\u00e4rte ihnen die Hintergr\u00fcnde des Portals und der alten G\u00f6tter.\n- Er lud die Gruppe nach Crowfin Manor ein. Als sehr belesener Gelehrter entwickelte er einen Schutzzauber gegen [Lindo Laut](../npcs/lindo_laut.md) d\u00e4monische Kr\u00e4fte und diskutierte philosophisch \u00fcber die Rolle der G\u00f6tter.\n- Gemeinsam mit [Voras](../npcs/voras.md) schmiedete Nox den Plan, das Portal nach Abyssalis zu \u00f6ffnen. Er war es auch, der die Ringe f\u00fcr [Lindo Laut](../npcs/lindo_laut.md) schmiedete.\n\n# Belege\n\n1. Session 2025-05-27, 00:28:07 \u2013 https://www.youtube.com/watch?v=bamCIB_CkR8\n2. Session 2026-02-17, 00:05:28 \u2013 https://www.youtube.com/watch?v=Z2jlzpoTWVw\n3. Session 2026-03-10, 00:14:08 \u2013 https://www.youtube.com/watch?v=Kr9_AC2XtOw", "npcs/orlanius_schwarzhorn": "# Orlanius Schwarzhorn\n\nOrlanius Schwarzhorn ist ein Magier in der Stadt [Bresca](../orte/bresca.md) und ein Spezialist f\u00fcr altes Wissen.\n\n## Rolle in der Handlung\nOrlanius Schwarzhorn wurde von der Gruppe um [Lindo Laut](../characters/lindo_laut.md) konsultiert, um zwei magische Artefakte zu untersuchen. Er warnte Lindo Laut eindringlich vor der korrumpierenden Macht des verdunkelten Amuletts. Zudem identifizierte er [Rotunas](../characters/rotuna.md)' Schl\u00fcssel als einen Portalschl\u00fcssel. Um die Kommunikation mit der Gruppe aufrechtzuerhalten, \u00fcbergab er ihnen einen Rabenstein.\n\n# Belege\n1. Session 2025-06-25, 01:31:45, https://www.youtube.com/watch?v=tpkO9uGw6-I", "npcs/perry_das_schnabeltier": "# Parry das Schnabeltier\n\nParry (auch Perry oder Perry das Schnabeltier genannt) ist der tierische Begleiter der Waldl\u00e4uferin [Cookie](../characters/cookie.md). Es handelt sich um ein Schnabeltier, das im Spiel optisch als Frettchen dargestellt wird.\n\n## F\u00e4higkeiten\n\n- **Giftstachel:** Parry kann im Kampf einen l\u00e4hmenden Giftstachel einsetzen [1][2][5][6].\n- **Tarnung:** Das Tier ist flink, dunkel gef\u00e4rbt und kann sich sehr gut tarnen [2][4][5].\n- **Kommunikation:** Parry dient als Kommunikationsmittel zwischen den Gruppenmitgliedern [3].\n\n## Rolle im Spiel\n\nParry wird von Cookie vor allem zum Auskundschaften und als K\u00f6der eingesetzt [2]. In K\u00e4mpfen lenkt er Gegner ab oder greift direkt mit seinem Giftstachel an [6][7][10]. Allerdings wird er in bedr\u00fcckenden Situationen schnell panisch und verkriecht sich dann in Cookies Tasche [5][11].\n\n## Besondere Vorkommnisse\n\n- Warf sich heldenhaft vor Cookie, um einen Ghul anzugreifen [6].\n- \u00dcberlebte eine finale Explosion, nachdem er einen Ghul abgelenkt hatte [7].\n- Blieb in der Obhut von [Nyrella](../npcs/nyrella.md), als die Gruppe in die Zwischenebene teleportiert wurde [8].\n- \u00dcberstand den S\u00e4ureschaden einer explodierenden Mutterspinne [10].\n- Litt extrem unter der bedr\u00fcckenden Atmosph\u00e4re eines Dungeons und verkroch sich panisch in Cookies Tasche [11].\n- Zeigte sofort eine ungew\u00f6hnliche Zuneigung zu [Lunara](../npcs/lunara.md), obwohl er normalerweise sehr misstrauisch ist [12].\n\n# Belege\n\n1. Session 2025-03-26 @ 00:29:12 (https://www.youtube.com/watch?v=ROCKGeeRUFw)\n2. Session 2025-04-01 @ 00:14:39 (https://www.youtube.com/watch?v=LZIuUzc3F18)\n3. Session 2025-05-14 @ 00:00:16 (https://www.youtube.com/watch?v=5eAEDN5ra-4)\n4. Session 2025-05-27 @ 00:03:06 (https://www.youtube.com/watch?v=bamCIB_CkR8)\n5. Session 2025-07-22 @ 00:11:58 (https://www.youtube.com/watch?v=BRRCUgW4xRo)\n6. Session 2025-08-12 @ 01:07:32 (https://www.youtube.com/watch?v=vHIjua0BZ9Y)\n7. Session 2025-09-02 @ 00:48:53 (https://www.youtube.com/watch?v=TLZOH7TlGhk)\n8. Session 2025-09-06 @ 00:05:52 (https://www.youtube.com/watch?v=vo1xnyLQDJk)\n9. Session 2025-10-07 @ 00:06:03 (https://www.youtube.com/watch?v=qVAF_54S8Vw)\n10. Session 2025-10-21 @ 00:07:09 (https://www.youtube.com/watch?v=sxFhbtwoefA)\n11. Session 2025-10-28 @ 00:02:43 (https://www.youtube.com/watch?v=V6NzNakqxXM)\n12. Session 2025-11-18 @ 01:44:19 (https://www.youtube.com/watch?v=w__ahowb9p0)", "npcs/phasenspinne": "# Phasenspinne\n\nDie Phasenspinne war der zweite Gegner, dem sich die Gruppe in der Arena stellen musste. Es handelte sich um eine riesige, giftige Spinne mit \u00fcbernat\u00fcrlichen F\u00e4higkeiten.\n\n## F\u00e4higkeiten\n\n*   **Teleportation:** Die Kreatur war in der Lage, sich im Kampf zu teleportieren.\n*   **Netzangriff:** Sie konnte Netze auf ihre Gegner verschie\u00dfen.\n*   **Brutbeschw\u00f6rung:** Die Phasenspinne lie\u00df ihre Brut aus Eiern schl\u00fcpfen, um zus\u00e4tzliche Feinde ins Feld zu f\u00fchren.\n\n## Schicksal\n\nDie Gruppe t\u00f6tete die Phasenspinne im Kampf. Bei ihrem Tod explodierte sie in einer Wolke aus S\u00e4ure.\n\n# Belege\n\n1.  Session 2025-10-21 @ 01:10:44 (https://www.youtube.com/watch?v=sxFhbtwoefA)", "npcs/phipps": "# Phipps\n\nPhipps ist ein \u00e4ngstlicher, aber freundlicher Gnom, der in einem alten Turm lebt. Er warnt die Gruppe vor den [Fellbiestern](../monsters/fellbiester.md) in der Burg.\n\n# Belege\n1. Session 2025-04-15 @ 00:13:24 (https://www.youtube.com/watch?v=YCpAz_syjaY)", "npcs/pilz_goblins": "# Pilz-Goblins\n\nPilz-Goblins sind mit Pilzen \u00fcberwucherte Goblins, die \u00fcber regenerative F\u00e4higkeiten verf\u00fcgen. Sie k\u00f6nnen nur durch Feuerschaden endg\u00fcltig vernichtet werden.\n\n## Begegnungen\n\n- **Session 2025-06-17**: Zwei Pilz-Goblins griffen die Gruppe an.\n\n# Belege\n\n1. Session 2025-06-17 @ 00:24:17 (https://www.youtube.com/watch?v=tl76B4V0io8)", "npcs/priesterin_auraniell": "# Priesterin Auraniell\n\nEine Halbling-Priesterin, die urspr\u00fcnglich auf Durchreise war und nun in der neuen Kapelle von [Bresca](../orte/bresca.md) arbeitet. Ihr Kloster wurde von der Hack angegriffen.\n\n# Belege\n1. Session 2025-06-25 @ 00:27:12 (https://www.youtube.com/watch?v=tpkO9uGw6-I)", "npcs/prinz_bran": "# Prinz Bran\n\nPrinz Bran war ein verstorbener Zwergenprinz, der in der Kathedrale von [Steinbachtal](../orte/steinbachtal.md) begraben wurde. Sein Tod ereignete sich nur wenige Tage vor den aktuellen Geschehnissen.\n\n# Belege\n1. Session 2025-09-09 @ 01:23:59 (https://www.youtube.com/watch?v=Zl0qfuI6Goc)", "npcs/rachsuechtiger_daemon_ratte": "# Rachs\u00fcchtiger D\u00e4mon (Ratte)\n\nEin d\u00e4monisches Wesen, das einen uralten Vertrag mit [Vasul](../goetter/vasul.md) besitzt. Der Vertrag umfasst die Forderung nach 10.000 Seelen sowie Halbg\u00f6ttern.\n\n## Bekannte Handlungen\n\n- Forderte den Vertrag mit Vasul ein, der \u00fcber 10.000 Seelen und Halbg\u00f6tter verf\u00fcgt.\n- Wurde von [Lindo Laut](../npcs/lindo_laut.md) verbannt.\n- Kehrte sp\u00e4ter zur\u00fcck und versuchte, die Gruppe zur Seelenknechtschaft zu zwingen.\n\n# Belege\n\n1. Session 2025-09-06, 00:12:05 \u2013 [YouTube](https://www.youtube.com/watch?v=vo1xnyLQDJk)", "npcs/rachsuechtiger_geist": "# Rachs\u00fcchtiger Geist\n\nEin rachs\u00fcchtiger Geist, der [Rotunas](../characters/rotunas.md) verfolgt, nachdem dieser zu Beginn eines Dungeons eine Rune ber\u00fchrt hat. Der Geist erscheint mehrfach, entzieht Energie und kann nur vor\u00fcbergehend besiegt werden.\n\n# Belege\n1. Session 2025-06-17 @ 01:06:10 (https://www.youtube.com/watch?v=tl76B4V0io8)", "npcs/rodek": "# Rodek\n\nRodek ist der \u00c4lteste des Sumpfdorfes [Cornivum](../orte/cornivum.md) und ein Druide. Er empf\u00e4ngt die Gruppe im Auftrag der Gilde und bietet ihnen Unterkunft an. Zudem verkauft er ihnen Gift sowie das dazugeh\u00f6rige Gegengift.\n\n# Belege\n1. Session 2025-06-03, 00:07:45, https://www.youtube.com/watch?v=jtYR4Je0a18", "npcs/roland": "# Roland\n\nRoland ist der Sprecher und \u00c4lteste des Fl\u00fcchtlingslagers vor Breska. Er ist ein alter Bekannter der Gruppe aus der Zeit der Goblin-Belagerung.\n\n## Rolle und Verhalten\n\nRoland fungiert als Anf\u00fchrer der Fl\u00fcchtlinge aus Breska. Er ist besorgt um seine Leute und willigt schlie\u00dflich ein, die Gruppe zum Banditenlager zu f\u00fchren. Sp\u00e4ter erreicht er die Gruppe blutverschmiert und berichtet vom Angriff der Untoten auf die Karawane. Er ist ersch\u00f6pft, aber dankbar.\n\nAm Abend erz\u00e4hlt er der Gruppe eine Legende \u00fcber die Splitterwelt und die vergessenen G\u00f6tter, was die Gruppe an ihre fehlenden Erinnerungen denken l\u00e4sst.\n\nSp\u00e4ter h\u00e4lt Roland auf dem Aussichtsturm Wache und wirkt deutlich entspannter als zuvor.\n\n# Belege\n\n1. Session 2025-09-17 @ 01:01:59 (https://www.youtube.com/watch?v=AhIT8dcxw2o)\n2. Session 2025-09-23 @ 00:17:09 (https://www.youtube.com/watch?v=DGzfqVigS0g)\n3. Session 2025-09-30 @ 01:09:12 (https://www.youtube.com/watch?v=bUT7Mc2hjUY)\n4. Session 2026-01-13 @ 00:18:17 (https://www.youtube.com/watch?v=w4LB1s9_3rs)", "npcs/rolanes": "# Rolanes\n\nRolanes ist ein reicher und hochn\u00e4siger Tiefling. Er bekleidet die Position des \"Meisters der M\u00fcnze\" in der neuen Gilde. In dieser Funktion ordnete er einen Einlassstopp f\u00fcr mittellose Fl\u00fcchtlinge in die Stadt an.\n\n# Belege\n1. Session 2025-09-17 @ 00:26:08 (https://www.youtube.com/watch?v=AhIT8dcxw2o)", "npcs/safin_al_barak": "# Safin Al Barak\n\nSafin Al Barak ist der H\u00fcter der Schriften und Bibliothekar in Wabarask. Er zeichnet sich durch eine ausgepr\u00e4gte Wissbegierde aus, ist jedoch gleichzeitig von Natur aus misstrauisch und beobachtet Fremde sehr genau.\n\n## Begegnung mit der Gruppe\nW\u00e4hrend des Besuchs der Gruppe in der Bibliothek von Wabarask beobachtete Safin sie aufmerksam. Als [Lindo Laut](../characters/lindo_laut.md) seltsam auf ein Pergament \u00fcber \"Rote Magie\" reagierte, konfiszierte Safin dieses umgehend.\n\n# Belege\n- [1] Session 2026-03-03 @ 01:16:39 (https://www.youtube.com/watch?v=BRUNuNKTeOg)", "npcs/sandro": "# Sandro\n\nSandro ist ein vampirischer Magier in Diensten von [Voras](voras.md).\n\n## Rolle in der Handlung\n\nSandro f\u00fchrt die Gruppe durch ein Portal in die Splitterwelt und zu den Toren von Abyssalis. W\u00e4hrend der Reise k\u00e4mpft er an der Seite der Gruppe gegen eine Schattenkreatur und wird dabei schwer verletzt.\n\n# Belege\n\n1. Session 2026-03-10 @ 01:19:56 (https://www.youtube.com/watch?v=Kr9_AC2XtOw)", "npcs/schleichfurz": "# Schleichfurz\n\n**Typ:** NPC\n**Rolle:** Goblin-Anf\u00fchrer, selbsternannter Herrscher\n\nSchleichfurz ist der Anf\u00fchrer der Goblins, die das Dorf erobert haben. Er hat sich selbst zum Herrscher \u00fcber das Dorf ernannt. Nach einer kurzen Ansprache an seine Truppen verschanzte er sich im Hauptgeb\u00e4ude.\n\n# Belege\n1. Session 2025-04-01, 01:14:23 \u2013 https://www.youtube.com/watch?v=LZIuUzc3F18", "npcs/schleimkreaturen": "# Schleimkreaturen\n\nKleine, schleimige Humanoide, die sich im Dunkeln verstecken und ihre Opfer aus dem Hinterhalt angreifen. Sie verf\u00fcgen \u00fcber die F\u00e4higkeit, eine l\u00e4hmende Fl\u00fcssigkeit zu spucken.\n\n## Begegnung mit der Gruppe\n\nDie Kreaturen griffen die Gruppe aus einem Versteck heraus an und zeigten dabei eine besondere Vorliebe f\u00fcr [Cookie](../characters/cookie.md) als Ziel. Im Verlauf des Kampfes wurden drei der Schleimkreaturen get\u00f6tet. Eine vierte Kreatur konnte entkommen und floh ins Wasser.\n\n# Belege\n1. Session 2025-06-10, 01:49:45 \u2013 https://www.youtube.com/watch?v=cLkCu3Iq3y8", "npcs/schwarzer_ritter": "# Schwarzer Ritter\n\nDer Schwarze Ritter ist der Anf\u00fchrer der Untoten-Armee, die das Steinbachtal \u00fcberrannt hat. Er tritt in einer m\u00e4chtigen R\u00fcstung auf und f\u00fchrt ein dunkles Schwert.\n\n# Belege\n1. Session 2025-09-09, 01:12:53 \u2013 https://www.youtube.com/watch?v=Zl0qfuI6Goc", "npcs/seelenkalb": "# Seelenkalb\n\nDas Seelenkalb ist eine gef\u00e4hrliche Kreatur der Zwischenwelt, die Seelen verschlingt.\n\n## Begegnung mit der Gruppe\nDas Seelenkalb griff die Gruppe an und verschluckte [Dodo](../characters/dodo.md) kurzzeitig. Es wurde schlie\u00dflich von [Esterossa](../characters/esterossa.md) und [Lindo Laut](../characters/lindo_laut.md) in die Flucht geschlagen.\n\n# Belege\n1. Session 2026-01-06, 01:40:31 - https://www.youtube.com/watch?v=VGw81seFvbo", "npcs/ser_eulenweiss": "# Ser Eulenweiss\n\nSer Eulenweiss ist ein Ritter der Gilde aus Ehrenfels.\n\n## Rolle in der Handlung\nEr begleitet die Gruppe auf ihrer Reise nach Breska. W\u00e4hrend des Aufenthalts vor einem Anwesen zeigt er sich misstrauisch gegen\u00fcber Vampiren. Er wird von [Voras](../npcs/voras.md) vor dem Anwesen zur\u00fcckgelassen, w\u00e4hrend die Gruppe ins Innere gebeten wird.\n\n# Belege\n1. Session 2026-03-10, 00:09:38, https://www.youtube.com/watch?v=Kr9_AC2XtOw", "npcs/seras": "# Seras\n\n**Typ:** NPC (Gottheit)\n**Alias:** Herr der Flammen\n\nSeras ist ein alter Gott, der unter dem Titel \"Herr der Flammen\" bekannt ist. Die [Nomaden](../fraktionen/nomaden.md) sind seine Anh\u00e4nger, halten ihre Verehrung jedoch aus Angst vor Verfolgung geheim.\n\n---\n\n# Belege\n1. Session 2025-08-12 @ 01:42:58 (https://www.youtube.com/watch?v=vHIjua0BZ9Y)", "npcs/silberbestien": "# Silberbestien\n\nGiftige, herzartige Kreaturen mit Stacheln, die in der [Silbergruft](../orte/silbergruft.md) leben. Sie sind wasserscheu und k\u00f6nnen Illusionen aus Schatten erzeugen. Ihre Brut besch\u00fctzen sie in den tiefsten Ebenen der Mine.\n\n# Belege\n1. Session 2026-02-24 @ 00:10:31 (https://www.youtube.com/watch?v=WOFArbwDDIQ)", "npcs/sintra": "# Sintra\n\nSintra ist eine b\u00f6sartige Entit\u00e4t, die in dem Amulett von [Lindo Laut](../characters/lindo_laut.md) gefangen war.\n\n## Rolle in der Kampagne\n\nSintra war eine von mehreren b\u00f6sartigen Stimmen, die in Lindo Lauts Amulett eingeschlossen waren. Zusammen mit [Esua](esua.md) wurde Sintra vernichtet, als das Amulett zerst\u00f6rt wurde.\n\n# Belege\n\n1. Session 2025-09-02, 02:12:38 \u2013 https://www.youtube.com/watch?v=TLZOH7TlGhk", "npcs/skelett_bogenschuetzen": "# Skelett-Bogensch\u00fctzen\n\nDie Skelett-Bogensch\u00fctzen sind untote Diener des D\u00e4mons, die w\u00e4hrend der\nKonfrontation am Portal erschienen.\n\n## Eigenschaften\n\n- **Typ:** Untoter Minion\n- **Anzahl:** F\u00fcnf Individuen\n- **Schw\u00e4che:** Anf\u00e4llig f\u00fcr magischen Schaden\n- **Verbundenheit:** Dienen dem [D\u00e4mon](../npcs/daemon.md), der aus dem Portal\n  stieg\n\n## Rolle in der Kampagne\n\nF\u00fcnf Skelett-Bogensch\u00fctzen erschienen als Minions des D\u00e4mons aus dem Portal.\nSie erwiesen sich als besonders anf\u00e4llig f\u00fcr magischen Schaden. Nachdem ihr\nAnf\u00fchrer besiegt worden war, zerfielen die verbliebenen Skelett-Bogensch\u00fctzen.\n\n# Belege\n\n1. Session 2025-05-27, 00:46:26 \u2013 https://www.youtube.com/watch?v=bamCIB_CkR8", "npcs/slicks": "# Slicks\n\nSlicks ist eine d\u00fcstere, unterw\u00fcrfige dienende Pr\u00e4senz, die mit [Lindos Laut](../characters/lindos_laut.md) in Verbindung steht. Er erscheint auf Abruf und existiert sowohl als externe Erscheinung als auch als Stimme in Lindos Geist.\n\n## Rolle und F\u00e4higkeiten\n\nSlicks offenbarte Lindo Laut, dass dieser die Seele eines sterbenden Mannes nach Abyssalis geschickt hat. Zudem teilte er mit, dass Lindo die Macht besitzt, Kreaturen zu beschw\u00f6ren und zu \u201everbessern\u201c.\n\n## Einfluss auf Lindo Laut\n\nIn Lindos Geist manifestiert sich Slicks als dr\u00e4ngende Pr\u00e4senz. Er fordert Lindo auf, seine Macht einzusetzen und die Untoten zu vernichten. Dabei bezeichnete er [Belorus](../npcs/belorus.md) als ein \u00dcberbleibsel der Vergangenheit.\n\n# Belege\n\n1. Session 2025-11-25 @ 01:53:10 (https://www.youtube.com/watch?v=wd5R4fJfngY)\n2. Session 2026-01-20 @ 00:41:35 (https://www.youtube.com/watch?v=H3ckYdTv4y8)", "npcs/slix": "# Slix\n\nSlix ist ein d\u00e4monischer Diener und ein Teil des alten Gottes [Vasul](../gods/vasul.md), der in [Lindo Laut](lindo-laut.md) wohnt und zeitweise die Kontrolle \u00fcber dessen K\u00f6rper \u00fcbernimmt. Er erscheint auf Abruf und zeigt sich entt\u00e4uscht \u00fcber Lindos Z\u00f6gern, seine Macht einzusetzen, und dr\u00e4ngt ihn, seine Kr\u00e4fte zu nutzen.\n\n## Pers\u00f6nlichkeit und Verhalten\n\nSlix ist manipulativ und gewaltt\u00e4tig. Er \u00fcbernimmt die Kontrolle \u00fcber [Lindo Laut](lindo-laut.md), nachdem dieser Geheimnisse verr\u00e4t, und bedroht die Gruppe. Er wird von [Lunara](../characters/lunara.md) zur\u00fcckgedr\u00e4ngt.\n\n## Ziele und Motivation\n\nSlix ist auf der Suche nach dem letzten Teil seiner Macht in Ehrenfels.\n\n## F\u00e4higkeiten und Kr\u00e4fte\n\n- Erscheint auf Abruf als Diener von [Lindo Laut](lindo-laut.md).\n- Kann die Kontrolle \u00fcber [Lindo Lauts](lindo-laut.md) K\u00f6rper \u00fcbernehmen.\n- Identifiziert das Seelenkalb.\n\n# Belege\n\n1. Session 2026-01-06 @ 01:39:37 (https://www.youtube.com/watch?v=VGw81seFvbo)\n2. Session 2026-02-11 @ 01:32:51 (https://www.youtube.com/watch?v=3C8SD-cyNPM)\n3. Session 2026-02-17 @ 00:02:18 (https://www.youtube.com/watch?v=Z2jlzpoTWVw)", "npcs/splitterwelt_kreatur": "# Splitterwelt-Kreatur\n\nEin geisterhaftes Wesen aus der Splitterwelt, das Lebewesen Energie entzieht und sie verschlingt. Es agiert wie ein Werkzeug und wird durch den Kontakt mit den B\u00e4umen des Waldes vernichtet. Nach seiner Zerst\u00f6rung hinterl\u00e4sst es einen Beschw\u00f6rungsstab.\n\n# Belege\n1. Session 2025-11-25, 00:08:50 \u2013 https://www.youtube.com/watch?v=wd5R4fJfngY", "npcs/starville": "# Starville\n\nStarville ist ein K\u00e4mpfer, der in den Arenen von [Mil](../orte/mil.md) antritt und sich dort einen Namen gemacht hat. Er hat es in mehreren Kampfdisziplinen bis ins Finale geschafft. Aufgrund seiner Erfahrung und seines K\u00f6nnens wird er von [Mil](../orte/mil.md) als Ansprechpartner f\u00fcr Monsterk\u00e4mpfe empfohlen.\n\n# Belege\n1. Session 2025-10-14, 01:11:14 \u2013 https://www.youtube.com/watch?v=cUtz87UCHu4", "npcs/stavre": "# Stavre\n\nStavre ist ein Soldat, der die Gruppe zum Dungeon begleitet hat.\n\n## Rolle in der Handlung\n- Begleitete die Gruppe zum Dungeon und beantwortete vor dem Betreten einige Fragen.\n- Warnte die Gruppe vor den Gefahren des Dungeons.\n- Erkl\u00e4rte die Bedingungen, um den Dungeon wieder zu verlassen.\n\n# Belege\n1. Session 2025-10-28, 00:07:20 \u2013 https://www.youtube.com/watch?v=V6NzNakqxXM", "npcs/steingolem_koloss": "# Steingolem (Koloss)\n\nEin riesiger, aus sechs lila Kristallen erschaffener Koloss, der au\u00dfer Kontrolle geraten ist. Er bewegt sich langsam, wirft mit Felsen und versucht, weitere Kristalle zu erreichen. Der Koloss wurde durch eine Kontrollrune manipuliert.\n\n# Belege\n1. Session 2025-10-07 @ 00:08:03 (https://www.youtube.com/watch?v=qVAF_54S8Vw)", "npcs/sterbender_mann": "# Sterbender Mann\n\nEin namenloser Gefangener, der von einem untoten Magier verflucht wurde. Er erlag seinen Wunden und dem Fluch, woraufhin seine Seele durch das Eingreifen von [Lindo Laut](../characters/lindo_laut.md) in die Splitterwelt gezogen wurde.\n\n# Belege\n1. Session 2025-11-25, 01:35:34 \u2013 https://www.youtube.com/watch?v=wd5R4fJfngY", "npcs/sumpfhexe_die_hack": "# Sumpfhexe (die Hack)\n\nEine Antagonistin, die sowohl die [Kuatau](../organisationen/kuatau.md) als auch die Gruppe in der Vergangenheit get\u00e4uscht hat.\n\n## Wirken\n\n- Verantwortlich f\u00fcr die Angriffe auf [Breska](../orte/breska.md)\n- Lockte die [Kuatau](../organisationen/kuatau.md) mit den Amuletten nach [Windung](../orte/windung.md), um ein Portal zu \u00f6ffnen\n\n# Belege\n1. Session 2025-07-29 @ 01:34:48 (https://www.youtube.com/watch?v=XXgO5Ht4Q0A)", "npcs/sys_fizik": "# Sys Fizik\n\nSys Fizik ist ein zwielichtiger Goblin-Alchemist, der in einer Schmuggler-Taverne anzutreffen ist. Er raucht Zigarre und stellt f\u00fcr [Lindo Laut](../characters/lindo_laut.md) einen Verwandlungstrank her, der fast ein Jahr lang wirkt. F\u00fcr diesen Trank verlangt er eine Bezahlung von zwei Truhen und zwei S\u00e4cken Gold.\n\n# Belege\n1. Session 2026-03-03, 00:45:27 \u2013 https://www.youtube.com/watch?v=BRUNuNKTeOg", "npcs/t_rex_stimme_im_amulett": "# T-Rex (Stimme im Amulett)\n\nEine Entit\u00e4t, die in [Lindo Lauts](../characters/lindo_laut.md) Amulett wohnt und mit ihm kommuniziert. In fr\u00fcheren Tagen war sie ein Kampfgef\u00e4hrte von [Seras](../npcs/seras.md).\n\n# Belege\n1. Session 2025-08-12 @ 00:44:57 (https://www.youtube.com/watch?v=vHIjua0BZ9Y)", "npcs/tarvok_der_erdrichter": "# Tarvok (Der Erdrichter)\n\n**Tarvok**, auch bekannt als der **Erdrichter**, ist ein alter, wahrscheinlich nicht mehr existierender Gott. Sein Symbol ist ein Granitblock mit einer Bergspitze.\n\n## Verbindungen zu anderen Entit\u00e4ten\n- Ein Umhang mit dem Symbol Tarvoks wurde gefunden.\n- Im Keller des Hauses befindet sich ein Schrein, der Tarvok gewidmet ist.\n\n# Belege\n1. Session 2026-02-11 @ 00:40:12 (https://www.youtube.com/watch?v=3C8SD-cyNPM)", "npcs/tindra": "# Tindra\n\nTindra ist eine Vertraute oder Dienerin des Grafen [Voras](voras.md).\n\n## Rolle in der Handlung\n\nTindra begleitete die Gruppe zur Bibliothek und kommentierte dabei die angespannte Situation nach einem Vorfall.\n\n# Belege\n1. Session 2025-06-25 @ 00:22:08 (https://www.youtube.com/watch?v=tpkO9uGw6-I)", "npcs/tindrael": "# Tindrael\n\nTindrael ist der Grabw\u00e4chter und Geistliche des Dorfes Breska und eine wichtige Autorit\u00e4tsperson innerhalb der Gemeinschaft. Er wird als freundlich und hilfsbereit beschrieben. Nachdem die Helden seine Ziege [Bertie](bertie.md) gerettet haben, begleitet er sie.\n\nEinst war Tindrael die rechte Hand des B\u00fcrgermeisters von Breska. Sp\u00e4ter wurde er ein Diener von [Voras](../gods/voras.md). In dieser Funktion empf\u00e4ngt er [Dodo](../characters/dodo.md) in der Gruft und f\u00fchrt ihn zu seinem Herrn.\n\n# Belege\n1. Session 2025-04-09 @ 00:20:26 (https://www.youtube.com/watch?v=1PWdwvun5ow)\n2. Session 2026-03-10 @ 00:40:29 (https://www.youtube.com/watch?v=Kr9_AC2XtOw)", "npcs/todesritter_general_der_untoten": "# Todesritter (General der Untoten)\n\n## Kurzbeschreibung\nDer Todesritter ist der Anf\u00fchrer der Untotenarmee, die den Pass angreift. Er verf\u00fcgt \u00fcber m\u00e4chtige magische F\u00e4higkeiten, darunter das Aufl\u00f6sen von Magie, das Beschw\u00f6ren gr\u00fcner Blitze und den Einsatz von Schattenmagie.\n\n## Rolle im Kampagnenverlauf\nDer Todesritter tritt als Befehlshaber der Untotenstreitkr\u00e4fte in Erscheinung, die einen Pass angreifen. Im Kampf wird er durch einen kombinierten Angriff von [Rotunas](../characters/rotunas.md) und [Lindo Laut](../characters/lindo_laut.md) besiegt.\n\n## F\u00e4higkeiten\n- **Magie aufl\u00f6sen**: Kann feindliche Zauber neutralisieren oder aufheben\n- **Gr\u00fcne Blitze**: Beschw\u00f6rt zerst\u00f6rerische gr\u00fcne Blitze\n- **Schattenmagie**: Setzt Schattenmagie im Kampf ein\n\n# Belege\n1. Session 2025-09-30, 00:10:20 \u2013 https://www.youtube.com/watch?v=bUT7Mc2hjUY", "npcs/trickler": "# Trickler\n\nTrickler ist ein extrem alt und gebrechlich wirkender Magier, der die Gruppe in einer Taverne anspricht. Er versucht, die Charaktere f\u00fcr eine geheime Mission gegen die \"Silberkerne\" anzuwerben. Insbesondere [Rotunas](../characters/rotunas.md) verh\u00e4lt sich ihm gegen\u00fcber misstrauisch.\n\n# Belege\n1. Session 2026-03-18, 00:53:48, https://www.youtube.com/watch?v=HHXxsASLrbQ", "npcs/tyrael": "# Tyrael\n\nEin untoter, sehr m\u00e4chtiger Magier (Lich). Er ist der Autor eines Buches \u00fcber [Vorgulta](../gods/vorgulta.md), das er als Anh\u00e4nger des alten Gottes \u00fcber einen langen Zeitraum verfasst hat. Das Werk enth\u00e4lt unvollst\u00e4ndige Anleitungen zur Seelenmagie.\n\nTyrael untersuchte den D\u00e4mon in [Lindo Laut](../locations/lindo_laut.md) und warnte vor dessen Macht.\n\n# Belege\n1. Session 2025-10-14 @ 01:24:39 (https://www.youtube.com/watch?v=cUtz87UCHu4)\n2. Session 2026-03-03 @ 01:21:46 (https://www.youtube.com/watch?v=BRUNuNKTeOg)", "npcs/tyrex": "# Tyrex\n\nTyrex ist eine mysteri\u00f6se Entit\u00e4t, die durch ein Amulett mit [Lindo Laut](../characters/lindo_laut.md) kommuniziert.\n\n## Rolle & F\u00e4higkeiten\n- Spricht als k\u00f6rperlose Stimme aus Lindo Lauts Amulett\n- Bietet Lindo Laut Hilfe und Ratschl\u00e4ge an\n- Erm\u00f6glicht Lindo Laut, die Macht des Throns zu nutzen, um andere Seelen zu vernichten\n\n# Belege\n1. Session 2025-09-02, 00:21:20 \u2013 https://www.youtube.com/watch?v=TLZOH7TlGhk", "npcs/untoter_general": "# Untoter General\n\nEin Anf\u00fchrer der Untoten, der in einer Vision des sterbenden Mannes gesehen wird. Er scheint die Untoten zu befehligen und ist mit einem untoten Magier unterwegs.\n\n# Belege\n1. Session 2025-11-25 @ 01:36:49 (https://www.youtube.com/watch?v=wd5R4fJfngY)", "npcs/untoter_magier": "# Untoter Magier\n\nEin untoter Magier, der in den W\u00e4ldern nahe der Route sein Unwesen treibt. Er begegnete einem sterbenden Mann, dem er einen Fluch auferlegte. Durch den Sterbenden lie\u00df er der Gruppe die Botschaft \u00fcberbringen, dass er \"im Wald am Ende der Route\" auf sie warte.\n\n# Belege\n1. Session 2025-11-25, 01:36:49, https://www.youtube.com/watch?v=wd5R4fJfngY", "npcs/valdemar_der_goldene_ritter": "# Valdemar der Goldene Ritter\n\nValdemar der Goldene Ritter ist ein Soldat in vergoldeter R\u00fcstung, der in der Stadt [Willau](../orte/willau.md) stationiert ist. Er leitete die Hinrichtung eines Banditen am Stadttor.\n\n# Belege\n1. Session 2025-10-14 @ 00:04:10 (https://www.youtube.com/watch?v=cUtz87UCHu4)", "npcs/varsul": "# Varsul\n\nVarsul ist ein Gott, dem die Kultisten in der Kapelle dienen. Seine Macht ist in der Kapelle pr\u00e4sent, und eine Statue von ihm befindet sich in der Krypta.\n\nIn einer fr\u00fcheren Session wurden seine Pers\u00f6nlichkeiten wiederbelebt bzw. ausgel\u00f6scht. Varsul gab [Lindo Laut](../characters/lindo_laut.md) einen Zauberstab und besitzt nun einen eigenen K\u00f6rper.\n\n# Belege\n1. Session 2025-09-02 @ 01:34:11 (https://www.youtube.com/watch?v=TLZOH7TlGhk)\n2. Session 2025-09-09 @ 00:03:53 (https://www.youtube.com/watch?v=Zl0qfuI6Goc)", "npcs/vasul": "# Vasul\n\nVasul ist ein uraltes Wesen, das je nach Quelle als alter D\u00e4monenf\u00fcrst oder alter Gott beschrieben wird. Seine Macht ist in mehrere Teile zersplittert, und er strebt danach, seine volle St\u00e4rke wiederzuerlangen \u2013 ein Vorhaben, das als existenzielle Bedrohung gilt.\n\n## Erscheinungsformen und Wirken\n\n*   **Besessenheit von Tyrex:** Vasul hat den K\u00f6rper und die Pers\u00f6nlichkeit von Tyrex vollst\u00e4ndig \u00fcbernommen. In dieser Form teleportierte er eine Gruppe in eine Zwischenebene, um seine R\u00fcckkehr zu vollziehen.\n*   **Traumgestalt:** Er erschien [Lindo Laut](../characters/lindo_laut.md) in einem Traum als schattenhafte Gestalt in einer Burgruine. Dort ging er einen Pakt mit Lindo ein, um ihm seine \u201erichtige Macht\u201c zur\u00fcckzugeben.\n*   **Fragment in Lindo Laut:** Ein Teil von Vasuls zersplitterter Macht befindet sich in [Lindo Laut](../characters/lindo_laut.md).\n\n## Ziele und Konflikte\n\nVasul ist in der Splitterwelt Abyssalis gefangen und versucht, seine zersplitterte Macht wieder zu vereinen. Seine vollst\u00e4ndige R\u00fcckkehr stellt eine existenzielle Bedrohung dar. W\u00e4hrend einige M\u00e4chte seine Wiedererweckung anstreben, verfolgt [Belorus](belorus.md) das Ziel, ihn endg\u00fcltig zu vernichten.\n\n## Verbindungen\n\n*   Gew\u00e4hrte [Lindo Laut](../characters/lindo_laut.md) gro\u00dfe Macht und schloss einen Pakt mit ihm.\n*   Steht im Konflikt mit [Belorus](belorus.md), der seine Vernichtung anstrebt.\n*   Hat den K\u00f6rper von Tyrex \u00fcbernommen.\n\n# Belege\n\n1.  Session 2025-09-06 @ 00:02:44 (https://www.youtube.com/watch?v=vo1xnyLQDJk)\n2.  Session 2025-09-30 @ 01:59:23 (https://www.youtube.com/watch?v=bUT7Mc2hjUY)\n3.  Session 2026-01-20 @ 00:16:58 (https://www.youtube.com/watch?v=H3ckYdTv4y8)\n4.  Session 2026-02-17 @ 00:57:10 (https://www.youtube.com/watch?v=Z2jlzpoTWVw)", "npcs/verwundeter_soldat_aus_breska": "# Verwundeter Soldat aus Breska\n\nEin Soldat im Dienste von [Lord Voras](../npcs/lord_voras.md), der mit einer wichtigen Botschaft nach Ehrenfels unterwegs war.\n\n## Begegnung mit der Gruppe\nDer Soldat wurde von der Gruppe gerettet. Er erlitt eine schwere Vergiftung durch eine gr\u00fcne Substanz, an der er fast gestorben w\u00e4re. Nach seiner Wiederbelebung zeigte er ein seltsames Verhalten und versuchte schlie\u00dflich, mit dem Dokument, das er bei sich trug, zu fliehen.\n\n# Belege\n1. Session 2026-01-06, 00:39:59 - https://www.youtube.com/watch?v=VGw81seFvbo", "npcs/voras": "# Voras\n\nVoras ist ein zivilisierter Vampirf\u00fcrst und der ehemalige Besch\u00fctzer von Breska. Durch den Angriff von [Belorus](../npcs/belorus.md) hat er alles verloren. Er arbeitet nun mit [Nox](../npcs/nox.md) zusammen, um der Gruppe den Weg nach Abyssalis zu ebnen.\n\nGegen\u00fcber [Lunara](../characters/lunara.md) hegt er einen Groll wegen des Buches, akzeptiert jedoch ihre Unwissenheit in dieser Angelegenheit.\n\n# Belege\n1. Session 2026-03-10, 00:04:00 \u2013 https://www.youtube.com/watch?v=Kr9_AC2XtOw", "npcs/voras_der_heilige_der_schrecken": "# Voras (der Heilige / der Schrecken)\n\nEin Vampir, der in einem Sarg in einer Katakombe ruhte. Sein Sarg war f\u00e4lschlicherweise mit der Aufschrift \"der Schrecken\" versehen. Er wurde von der Gruppe erweckt und setzte unmittelbar danach eine Gedankenkraft ein, um eines der angreifenden Monster zu t\u00f6ten.\n\n# Belege\n1. Session 2025-04-23, 01:47:30 \u2013 https://www.youtube.com/watch?v=z3C-bewKqUs", "npcs/waechter_des_berges": "# W\u00e4chter des Berges\n\nDer W\u00e4chter des Berges ist eine vermummte, geisterhafte Gestalt, die erscheint, nachdem ein Kultist die Pr\u00fcfung bestanden hat. Er erkl\u00e4rt, dass jeder Kultist diese Pr\u00fcfung durchl\u00e4uft, und weist den Weg zu den heiligen Treppen.\n\n## Bekannte Auftritte\n\n- Erschien vor [Lindo Laut](../characters/lindo_laut.md), nachdem dieser die Pr\u00fcfung bestanden hatte.\n\n# Belege\n\n1. Session 2025-08-20 @ 01:01:25 (https://www.youtube.com/watch?v=-XbO3FLSL_I)", "npcs/wasserelementare": "# Wasserelementare\n\nWasserelementare sind Kreaturen, die vollst\u00e4ndig aus Wasser bestehen. Sie wurden in einem dunklen, gefluteten Raum angetroffen, wo sie die Gruppe angriffen.\n\n## Eigenschaften\n\n*   **Zusammensetzung:** Bestehen aus Wasser.\n*   **Regeneration:** K\u00f6nnen sich aus dem umgebenden Wasser regenerieren, was bestimmte Angriffsarten wirkungslos macht. So zeigte der Feueratem von [Dodo](../characters/dodo.md) keine Wirkung.\n*   **Schw\u00e4che:** Sind anf\u00e4llig f\u00fcr K\u00e4lteeffekte. [Rotuna](../characters/rotuna.md) konnte sie mit einem Eiszauber einfrieren, woraufhin sie zu einer Eiswand erstarrten.\n\n# Belege\n1.  Session 2025-06-10 @ 01:38:25 (https://www.youtube.com/watch?v=cLkCu3Iq3y8)", "npcs/withermind": "# Withermind\n\n## Beschreibung\nWithermind ist ein m\u00e4chtiger Untoter, der ein gro\u00dfes Schwert f\u00fchrt. Er verf\u00fcgt \u00fcber die F\u00e4higkeit, gefallene Untote wiederzubeleben und setzt im Kampf eine zerst\u00f6rerische Druckwelle ein.\n\n## F\u00e4higkeiten\n- **Wiederbelebung:** Kann gefallene Untote wieder zum Leben erwecken.\n- **Druckwelle:** Setzt eine Druckwelle als Angriff ein.\n\n## Ausr\u00fcstung\n- Gro\u00dfes Schwert\n\n# Belege\n1. Session 2025-09-23 @ 00:49:46 (https://www.youtube.com/watch?v=DGzfqVigS0g)", "npcs/zwei_zwerge": "# Zwei Zwerge\n\nDie Zwei Zwerge sind Bewohner von [Cornivum](../orte/cornivum.md), die sich auf die Verarbeitung von Fischen zur Giftgewinnung spezialisiert haben.\n\n## T\u00e4tigkeit\n\nDie Zwei Zwerge extrahieren ein Nervengift aus den Flossen von Sumpfhaien. Sie erkl\u00e4rten [Rotunas](rotunas.md) den detaillierten Prozess dieser Extraktion.\n\n---\n\n# Belege\n\n1. Session 2025-06-03, 00:17:57 \u2013 https://www.youtube.com/watch?v=jtYR4Je0a18", "npcs/zweikoepfiger_riese": "# Zweik\u00f6pfiger Riese\n\nEin trollartiges Wesen mit zwei K\u00f6pfen, die sich gegenseitig beleidigen.\n\n## Begegnung mit der Gruppe\n\nDer Zweik\u00f6pfige Riese griff die Gruppe an, wurde jedoch von ihr festgesetzt. Im Tausch gegen Essen gab er Informationen \u00fcber ein Monster und den Weg zu einem Altar preis.\n\n# Belege\n\n1. Session 2025-08-20 @ 00:16:07 (https://www.youtube.com/watch?v=-XbO3FLSL_I)", "sessions/2025-03-26": "# Zusammenfassung\n\nDie Gruppe, bestehend aus einem Barden, einem W\u00e4chter und einer Waldl\u00e4uferin, macht sich ohne ihren vierten Gef\u00e4hrten auf, ein Monster zu jagen. Im Wald finden sie einen verlassenen Platz mit einem brodelnden Kessel und einer Schriftrolle. Der Barde erkennt, dass es sich um eine Beschw\u00f6rungsformel handelt. Die Waldl\u00e4uferin entziffert die Rolle und erkl\u00e4rt, dass der Kessel f\u00fcr die Beschw\u00f6rung an einen bestimmten Ort gebracht werden muss. Der W\u00e4chter tr\u00e4gt den Kessel auf eine Lichtung, und der Barde liest die Formel mit Absicht falsch vor, um das Monster zu provozieren. Daraufhin erscheint ein tentakelbewehrtes Wesen aus dem Wald. Im Kampf stellt sich der W\u00e4chter sch\u00fctzend vor seine Gef\u00e4hrten und schl\u00e4gt dem Monster einen Tentakel ab. Der Barde verwundet das Monster mit einem beleidigenden Lied, w\u00e4hrend die Waldl\u00e4uferin aus ihrem Versteck zwei gezielte Sch\u00fcsse abgibt. Der W\u00e4chter f\u00e4ngt einen schweren Hieb f\u00fcr den Barden ab, wird aber selbst verletzt. Der Barde heilt den W\u00e4chter, bevor die Waldl\u00e4uferin das Monster mit einem finalen Schuss ins Auge besiegt. Am K\u00f6rper des Monsters finden sie ein Halsband und eine Nachricht, die auf eine nahe Ortschaft verweist. Die Gruppe beschlie\u00dft, zun\u00e4chst ihre Belohnung beim Auftraggeber abzuholen.\n\n# Auftretende Entit\u00e4ten\n\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Ein Feen-Barde (Troubadour), der gut pfeifen kann und seine Gef\u00e4hrten mit Musik inspiriert und heilt. Er liest die Beschw\u00f6rungsformel vor, um das Monster hervorzulocken. [00:09:18]\n* [Dodo](/characters/dodo.md) \u2014 Ein W\u00e4chter (Guardian) mit gemischter Herkunft (halb Goblin, halb Drache), der als Tank agiert und sich mit seiner F\u00e4higkeit 'I am your Shield' sch\u00fctzend vor seine Gef\u00e4hrten wirft. [00:08:26]\n* [Cookie](/characters/cookie.md) \u2014 Eine froschartige Waldl\u00e4uferin (Ranger, Beast Bound) mit einem Schnabeltier namens Parry als Begleiter. Sie k\u00e4mpft mit einem Kurzbogen und ist sehr gut getarnt. [00:11:02]\n* Parry das Schnabeltier \u2014 Der tierische Begleiter der Waldl\u00e4uferin Cookie. Ein Schnabeltier, das im Kampf einen Stachel als Waffe einsetzen kann. [00:29:12]\n* [Das Monster](/npcs/das_monster.md) \u2014 Ein tentakelbewehrtes Wesen, das durch ein Ritual beschworen wurde. Es tr\u00e4gt ein Halsband und eine Nachricht bei sich, was darauf hindeutet, dass es jemandes Haustier oder Bote war. [01:28:13]\n* [Der Auftraggeber](/npcs/der_auftraggeber.md) \u2014 Eine nicht n\u00e4her benannte Person oder Gruppe, die der Gruppe den Auftrag erteilt hat, das Monster zu t\u00f6ten und einen Teil davon als Beweis mitzubringen. [01:09:48]\n* [Wald](/locations/wald.md) \u2014 Ein tiefes Dickicht, in dem die Gruppe das Versteck des Monsters findet. Es ist neblig und d\u00fcster, mit einem verlassenen Ritualplatz. [01:09:35]\n* [Ritualplatz](/locations/ritualplatz.md) \u2014 Ein hektisch verlassener Ort im Wald mit einem gro\u00dfen, brodelnden Kessel, der eine Beschw\u00f6rungsfl\u00fcssigkeit enth\u00e4lt. [01:15:58]\n* [Die nahe Ortschaft](/locations/die_nahe_ortschaft.md) \u2014 Ein Ort, der in der Nachricht erw\u00e4hnt wird, die am K\u00f6rper des Monsters gefunden wurde. Die Gruppe beschlie\u00dft, sp\u00e4ter dorthin zu reisen. [01:48:35]\n* [Beschw\u00f6rungsfl\u00fcssigkeit](/items/beschwoerungsfluessigkeit.md) \u2014 Eine brodelnde Substanz aus dem Kessel, die f\u00fcr ein Ritual ben\u00f6tigt wird. Der Barde erw\u00e4gt, sie abzuf\u00fcllen. [01:49:37]\n* [Schriftrolle](/items/schriftrolle.md) \u2014 Eine Rolle mit einer Beschw\u00f6rungsformel, die am Ritualplatz gefunden wird. Sie wird ben\u00f6tigt, um das Monster zu rufen. [01:20:23]\n* [Halsband und Nachricht](/items/halsband_und_nachricht.md) \u2014 Ein Halsband mit einer Markierung und eine daran befestigte Nachricht, die am toten Monster gefunden werden und auf eine nahe Ortschaft hinweisen. [01:47:46]\n* [Kampf gegen das Monster](/events/kampf_gegen_das_monster.md) \u2014 Die Gruppe beschw\u00f6rt und besiegt ein tentakelbewehrtes Monster. Der W\u00e4chter sch\u00fctzt die Gruppe, der Barde schw\u00e4cht das Monster, und die Waldl\u00e4uferin t\u00f6tet es mit einem finalen Schuss. [01:29:13]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=ROCKGeeRUFw)", "sessions/2025-04-01": "# Zusammenfassung\n\nDie Gruppe, bestehend aus Esterossa, Cookie und Dodo, nimmt den Auftrag an, ein Goblindorf auszur\u00e4uchern. Auf dem Weg durch einen zunehmend sumpfigen Wald entdecken sie ein \u00fcberfallenes Lager mit Leichen und werden von einem pl\u00fcndernden Goblin angegriffen, den sie besiegen. Bei der Durchsuchung finden sie eine Schriftrolle 'Mit der Natur reden'. Nach einer n\u00e4chtlichen Rast, bei der ein geh\u00f6rntes Wesen das Lager ausspioniert, erreichen sie das von Goblins besetzte Dorf. Sie beobachten, wie der Anf\u00fchrer Schleichfurz eine Ansprache h\u00e4lt. Die Gruppe entscheidet sich f\u00fcr einen heimlichen Angriff, lockt mit Cookies Schnabeltier Perry Wachen in einen Hinterhalt und schaltet sie aus. Im finalen Kampf stellen sie Schleichfurz und einen weiteren Anf\u00fchrer im Hauptgeb\u00e4ude. Esterossa st\u00fcrzt den Magier in den Tod, w\u00e4hrend Cookie und Dodo den letzten Widersacher erledigen. Die restlichen, betrunkenen Goblins fliehen panisch. Die Gruppe pl\u00fcndert das Dorf, findet Gold und einen Angriffsplan auf ein nahegelegenes Dorf und kehrt erfolgreich zur\u00fcck.\n\n# Auftretende Entit\u00e4ten\n\n* [Esterossa](/characters/esterossa.md) \u2014 Ein gefl\u00fcgelter Roboter (Clank) mit einer Axt, der fliegen kann und als Tank der Gruppe fungiert. Er enthauptet einen betrunkenen Goblin und st\u00fcrzt den Goblin-Magier in den Tod. [00:03:25]\n* [Cookie](/characters/cookie.md) \u2014 Ein kleiner Frosch (Ribbit), der mit Tieren und Pflanzen sprechen kann (Sprache der verborgenen Natur). Sie k\u00e4mpft mit einem Bogen und hat ein giftiges Schnabeltier namens Perry als Begleiter. [00:03:47]\n* [Dodo](/characters/dodo.md) \u2014 Ein Stalwart (Tank) mit Schild und Kolben, der \u00fcber eine extrem hohe Schadensreduktion verf\u00fcgt. Er wirft sich sch\u00fctzend vor seine Gef\u00e4hrten und ist im Nahkampf nur schwer zu verletzen. [00:05:49]\n* Perry \u2014 Cookies Schnabeltier-Begleiter (im Spiel als Frettchen dargestellt). Es hat einen l\u00e4hmenden Giftstachel und kann sich gut tarnen. Es wird zum Auskundschaften und als K\u00f6der eingesetzt. [00:14:39]\n* [Schleichfurz](/npcs/schleichfurz.md) \u2014 Der Goblin-Anf\u00fchrer und selbsternannte Herrscher des eroberten Dorfes. Er h\u00e4lt eine kurze Ansprache an seine Truppen und verschanzt sich danach im Hauptgeb\u00e4ude. [01:14:23]\n* [Goblin-Magier](/npcs/goblin_magier.md) \u2014 Ein Goblin mit magischen F\u00e4higkeiten, der Feuerkugeln und Druckwellen beschw\u00f6ren sowie sich in Nebel aufl\u00f6sen und teleportieren kann. Er wird von Esterossa vom Balkon in den Tod gest\u00fcrzt. [01:43:22]\n* [Goblin-G\u00f6tter](/factions/goblin_goetter.md) \u2014 Vom Spielleiter eingef\u00fchrtes Meta-Element, bei dem der Twitch-Chat die Rolle von Goblins beeinflussenden G\u00f6ttern \u00fcbernimmt. Ein spezifischer Gott namens Lugasch versucht, einen Stein auf Dodo fallen zu lassen. [00:17:50]\n* [Goblindorf](/locations/goblindorf.md) \u2014 Das Ziel der Mission, ein von Goblins erobertes und besetztes Dorf mit Palisaden, Zelten und einem Hauptgeb\u00e4ude. Es liegt in einem sumpfigen Waldgebiet. [00:03:52]\n* [\u00dcberfallenes Lager](/locations/ueberfallenes_lager.md) \u2014 Ein Lagerplatz im Wald, der k\u00fcrzlich von Goblins \u00fcberfallen wurde. Die Gruppe findet hier drei Leichen und einen pl\u00fcndernden Goblin. [00:05:06]\n* [Schriftrolle 'Mit der Natur reden'](/items/schriftrolle_mit_der_natur_reden.md) \u2014 Eine magische Schriftrolle, die es dem Anwender erlaubt, mit Pflanzen und B\u00e4umen zu interagieren. Sie wird im Zelt des ersten Goblin-Lagers gefunden. [00:19:48]\n* [Heiltrank](/items/heiltrank.md) \u2014 Ein Heiltrank, der bei der Leiche des ersten besiegten Goblins gefunden und von Dodo mitgenommen wird. [00:18:50]\n* [Angriffsplan](/items/angriffsplan.md) \u2014 Eine Karte, die nach dem Sieg im Goblindorf gefunden wird und einen geplanten Angriff auf ein nahegelegenes Dorf zeigt, aus dem die Gruppe urspr\u00fcnglich kommt. [01:59:22]\n* [Vernichtung des Goblindorfs](/events/vernichtung_des_goblindorfs.md) \u2014 Die erfolgreiche Ausf\u00fchrung des Auftrags. Die Gruppe infiltriert das Dorf, schaltet die Anf\u00fchrer aus und schl\u00e4gt die restlichen Goblins in die Flucht. [01:58:40]\n* [N\u00e4chtliche Begegnung](/events/naechtliche_begegnung.md) \u2014 W\u00e4hrend Cookies Wache schleicht ein unbekanntes, geh\u00f6rntes Wesen um das Lager, das jedoch durch das Licht von Esterossa vertrieben wird, bevor es identifiziert werden kann. [00:37:13]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=LZIuUzc3F18)", "sessions/2025-04-09": "# Zusammenfassung\n\nDie Gildenmitglieder Valeria und Rotunas erreichen das Dorf Breska, um es vor einem bevorstehenden Goblin-Angriff zu warnen. Sie treffen den Magier Leandras, der sie an den B\u00fcrgermeister Berthold verweist. Die Wachen Kerl und Brock lassen sie erst nach F\u00fcrsprache des Grabw\u00e4chters Tindrael vor, den sie durch das Einfangen der Ziege Bertie f\u00fcr sich gewinnen. Berthold glaubt ihnen und beauftragt sie mit der Verteidigung. In der Taverne von Hubert informieren sie die Dorfbewohner, was zu Panik f\u00fchrt. Bei der Familie Schmid organisieren sie Barrikaden. Auf dem Hof der Familie Kr\u00e4mer erschrecken sie versehentlich ein Kind, das in den Wald flieht. Bei der Verfolgung entdecken und t\u00f6ten sie einen einzelnen Goblin-Sp\u00e4her. Sie finden bei ihm Notizen mit Angriffspl\u00e4nen, f\u00e4lschen diese, um die Goblins in eine Falle zu locken, und platzieren die Notiz wieder beim toten Sp\u00e4her. Zur\u00fcck im Dorf planen sie mit den Bewohnern die Verteidigung, platzieren Barrikaden und Fallen zwischen Friedhof und Steinplateau und positionieren die K\u00e4mpfer f\u00fcr den erwarteten Angriff.\n\n# Auftretende Entit\u00e4ten\n\n* [Valeria](/characters/valeria.md) \u2014 Eine Simja (Affenmagierin), die sehr auf Essen fixiert ist und eine Pilotenbrille tr\u00e4gt. Sie ist neugierig, impulsiv und nutzt ihren Great Staff f\u00fcr magische Angriffe. [00:01:07]\n* [Rotunas](/characters/rotunas.md) \u2014 Ein riesenhafter Magier (Giant), der Valeria auf der Schulter tr\u00e4gt. Er ist besonnen, h\u00f6flich und nutzt Eis- und Faustzauber. Tr\u00e4gt magische Tattoos und Armringe. [00:01:07]\n* Leandras \u2014 Ein zur\u00fcckgezogen lebender menschlicher Magier im Dorf. Er ist besch\u00e4ftigt, abweisend und hat sein Haus mit magischen Runen gesichert. [00:08:51]\n* [Berthold](/npcs/berthold.md) \u2014 Der B\u00fcrgermeister von Breska. Ein Handelsmann, der mit Papieren besch\u00e4ftigt ist und Valeria eine Armbrust f\u00fcr eine Handvoll Gold verkauft. [00:11:33]\n* [Kerl](/npcs/kerl.md) \u2014 Einer der beiden Dorfw\u00e4chter. Er ist misstrauisch gegen\u00fcber den Neuank\u00f6mmlingen und verlangt eine Best\u00e4tigung von Tindrael, bevor er sie zum B\u00fcrgermeister l\u00e4sst. [00:17:25]\n* [Brock](/npcs/brock.md) \u2014 Der zweite Dorfw\u00e4chter, zusammen mit Kerl. Er bewacht mit Kerl das Haus des B\u00fcrgermeisters. [00:17:25]\n* [Tindrael](/npcs/tindrael.md) \u2014 Der Grabw\u00e4chter und Geistliche des Dorfes, eine wichtige Autorit\u00e4tsperson. Er ist freundlich, hilfsbereit und begleitet die Helden nach der Rettung seiner Ziege Bertie. [00:20:26]\n* [Bertie](/npcs/bertie.md) \u2014 Die zahme Ziege von Tindrael, die von Valeria mit einem Ziegenlaut angelockt und geritten wird. Sie tr\u00e4gt ein Gl\u00f6ckchen. [00:21:54]\n* [Hubert](/npcs/hubert.md) \u2014 Der Wirt der Dorftaverne. Er ist freundlich, serviert Bier und Wein und bietet H\u00fchnerkeulen als Proviant an. [00:46:13]\n* [Nip](/npcs/nip.md) \u2014 Ein st\u00e4ndig betrunkener Dorfbewohner in der Taverne. Er ist sehr schreckhaft und f\u00e4llt bei Valerias Zaubervorf\u00fchrung ohnm\u00e4chtig um. [00:46:13]\n* [Elisa](/npcs/elisa.md) \u2014 Eine J\u00e4gerin im Dorf, die mit dem Bogen umgehen kann. Sie ist zun\u00e4chst skeptisch, erkl\u00e4rt sich aber bereit, bei der Verteidigung zu helfen. [00:50:53]\n* [Familie Schmid](/npcs/familie_schmid.md) \u2014 Bauernfamilie, die mit Holz arbeitet. Sie stellen den Helden acht Palisaden f\u00fcr die Dorfverteidigung zur Verf\u00fcgung. [00:41:27]\n* [Familie Kr\u00e4mer](/npcs/familie_kraemer.md) \u2014 Bauernfamilie mit K\u00fchen und einem Schmied. Ihr Kind wird von Valeria erschreckt und flieht in den Wald, was zur Entdeckung des Goblin-Sp\u00e4hers f\u00fchrt. [00:41:30]\n* [Goblin-Sp\u00e4her](/npcs/goblin_spaeher.md) \u2014 Ein einzelner Goblin, der das Dorf ausspioniert hat. Er verfolgt das Kind der Kr\u00e4mers, wird aber von Rotunas und Valeria im Wald get\u00f6tet. Hatte Notizen mit Angriffspl\u00e4nen bei sich. [01:12:02]\n* [Breska](/locations/breska.md) \u2014 Das Dorf, in dem die Handlung spielt. Es liegt auf einer Lichtung, hat zwei Bauernh\u00f6fe, eine Taverne, einen Friedhof, ein Wirtshaus und ist von einem Wald umgeben. [00:01:19]\n* [Die Gilde](/factions/die_gilde.md) \u2014 Die Auftraggeber der Helden. Eine Organisation, die eine andere Gruppe geschickt hatte, um das Goblin-Camp auszuheben, und nun Valeria und Rotunas zur Verteidigung von Breska entsandt hat. [00:01:19]\n* [Goblins](/factions/goblins.md) \u2014 Die Bedrohung f\u00fcr das Dorf. Eine unbekannte Anzahl von Goblins plant einen Angriff auf Breska, m\u00f6glicherweise mit einer weiteren, unbekannten Partei. [00:02:25]\n* [Armbrust von Berthold](/items/armbrust_von_berthold.md) \u2014 Eine Armbrust, die Valeria von B\u00fcrgermeister Berthold f\u00fcr eine Handvoll Gold kauft. Sie ist so gro\u00df wie Valeria selbst und wird von Rotunas getragen. [00:37:06]\n* [Goblin-Notizen](/items/goblin_notizen.md) \u2014 Aufzeichnungen des get\u00f6teten Goblin-Sp\u00e4hers mit eingezeichneten Angriffspunkten auf das Dorf. Die Helden f\u00e4lschen die Notizen, um die Goblins in eine Falle zu locken. [01:26:22]\n* [T\u00f6tung des Goblin-Sp\u00e4hers](/events/toetung_des_goblin_spaehers.md) \u2014 Valeria und Rotunas verfolgen das ver\u00e4ngstigte Kind der Kr\u00e4mers in den Wald und entdecken einen Goblin-Sp\u00e4her. Im Kampf t\u00f6ten sie ihn mit Eis- und Feuerzaubern. [01:12:02]\n* [Vorbereitung der Verteidigung](/events/vorbereitung_der_verteidigung.md) \u2014 Die Helden planen mit den Dorfbewohnern die Verteidigung. Sie platzieren acht Palisaden und drei B\u00e4renfallen zwischen Friedhof und Steinplateau und positionieren die K\u00e4mpfer, um die Goblins in einen Hinterhalt zu locken. [01:36:02]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=1PWdwvun5ow)", "sessions/2025-04-15": "# Zusammenfassung\n\nDie Gruppe, bestehend aus Cookie (Frosch), Lindo Laut (Fee), Esterossa (Warforged-Paladin), Dodo (Dragonborn) und Rotunas (Riese), erreicht nach einer Reise das Lager nahe der Krypta. Sie treffen den \u00e4ngstlichen, aber freundlichen Gnom Phipps in einem Turm, der sie vor Fellbiestern (Grottenschraten/Bugbears) in der Burg warnt und andeutet, dass es in der Krypta spukt. Beim Erkunden eines Nebengeb\u00e4udes findet Cookie eine h\u00f6lzerne Voodoo-Puppe. Vor der Burg werden sie von Bugbear-Wachen mit Armbr\u00fcsten angegriffen, k\u00f6nnen diese aber in einem Kampf besiegen. Im Innenhof beschw\u00f6rt Esterossa durch ein Blutopfer an einer Statue ein m\u00e4chtiges Feuerwesen namens Lenra herauf, das die Gruppe jedoch als unw\u00fcrdig zur\u00fcckweist. In der Krypta finden sie ein Buch mit einer Namensliste, eine Schatzkammer mit Gold und werden von Skeletten angegriffen, die sie ebenfalls besiegen. Schlie\u00dflich treffen sie auf die Nekromantin Lenra, die Dodo und Cookie schrumpfen l\u00e4sst. Lenra entkommt durch einen Altar, nachdem Cookie sich mit der Voodoo-Puppe selbst verletzt. Die Gruppe findet Hinweise, dass in der Stadt Breska ein Magier gesucht wird, was den bevorstehenden Angriff erkl\u00e4rt.\n\n# Auftretende Entit\u00e4ten\n\n* [Cookie](/characters/cookie.md) \u2014 Ein Frosch-Spielercharakter, der gut schie\u00dfen und mit der Natur kommunizieren kann. Findet eine Voodoo-Puppe und verletzt sich im Finale versehentlich selbst damit. [00:03:45]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Ein Feen-Barde, der sich gerne vorstellt und Lieder spielt, um die Gruppe zu unterst\u00fctzen. Freundet sich mit Phipps an und versucht, Lenra mit Musik zu beeindrucken. [00:14:37]\n* [Esterossa](/characters/esterossa.md) \u2014 Ein Warforged-Paladin, der betet, Blitze schleudert und ein Blutopfer an einer Statue durchf\u00fchrt, wodurch er das Wesen Lenra beschw\u00f6rt. [00:06:48]\n* [Dodo](/characters/dodo.md) \u2014 Ein Dragonborn mit starkem Schild, der oft Schaden f\u00fcr andere abblockt. Wird von Lenra geschrumpft. [00:34:56]\n* [Rotunas](/characters/rotunas.md) \u2014 Ein riesenhafter Spielercharakter, der Magie (Blitze, Schutzzauber) wirkt und aufgrund seiner Gr\u00f6\u00dfe und Schwere oft Ger\u00e4usche verursacht. [00:05:14]\n* [Phipps](/npcs/phipps.md) \u2014 Ein \u00e4ngstlicher, aber freundlicher Gnom, der in einem alten Turm lebt und die Gruppe vor den Fellbiestern in der Burg warnt. [00:13:24]\n* [Lenra](/npcs/lenra.md) \u2014 Eine m\u00e4chtige Nekromantin (als 'Hack' beschrieben), die in der Krypta residiert, Dodo und Cookie schrumpft und durch einen Altar entkommt. Sie sucht einen Magier in Breska. [01:53:48]\n* [Bugbears (Grottenschrate)](/npcs/bugbears_grottenschrate.md) \u2014 Stinkende Fellbiester, die als Wachen mit Armbr\u00fcsten die Burgruine bewachen und von der Gruppe besiegt werden. [00:16:48]\n* [Burgruine / Krypta](/locations/burgruine_krypta.md) \u2014 Der Ort des Abenteuers, eine alte Burg mit einer Krypta darunter, die von Bugbears bewacht und von Lenra bewohnt wird. [00:08:52]\n* [Phipps' Turm](/locations/phipps_turm.md) \u2014 Ein alter, zerbr\u00f6ckelter Turm nahe der Burg, in dem der Gnom Phipps lebt. [00:09:54]\n* [Breska](/locations/breska.md) \u2014 Ein Dorf, das Ziel eines bevorstehenden gro\u00dfen Angriffs ist. In der Krypta wird enth\u00fcllt, dass dort ein Magier gesucht wird. [01:33:07]\n* [Gilde](/factions/gilde.md) \u2014 Die Auftraggeberin der Gruppe, die sie losschickt, um die Krypta zu s\u00e4ubern. [00:02:40]\n* [Goblin-G\u00f6tter](/factions/goblin_goetter.md) \u2014 Eine boshafte Entit\u00e4t, die vom Spielleiter und den Zuschauern gesteuert wird und das Spielgeschehen durch ungl\u00fcckliche Zuf\u00e4lle beeinflusst. [00:01:53]\n* [Voodoo-Puppe](/items/voodoo_puppe.md) \u2014 Eine kleine, aus Holz geflochtene Puppe, die Cookie in einem Nebengeb\u00e4ude findet. Sie verletzt sich sp\u00e4ter selbst damit, als sie versucht, Lenra zu schaden. [00:29:32]\n* [Buch mit Namensliste](/items/buch_mit_namensliste.md) \u2014 Ein Buch in der Krypta, das eine Liste von Namen enth\u00e4lt, wobei die letzten Eintr\u00e4ge 'Grog' und 'Greg' noch frisch sind. [01:18:57]\n* [Schriftrollen aus der Krypta](/items/schriftrollen_aus_der_krypta.md) \u2014 Hinterlassene Dokumente an Lenras Altar, die enth\u00fcllen, dass ein Magier in Breska gesucht wird, der etwas f\u00fcr einen magischen Ort gefunden hat. [02:00:25]\n* [Blutopfer an der Statue](/events/blutopfer_an_der_statue.md) \u2014 Esterossa opfert sein Blut an einer Statue einer b\u00f6sen Gottheit und beschw\u00f6rt damit das m\u00e4chtige Feuerwesen Lenra. [01:13:27]\n* [Kampf gegen die Bugbears](/events/kampf_gegen_die_bugbears.md) \u2014 Die Gruppe k\u00e4mpft vor der Burg gegen mehrere Bugbear-Wachen mit Armbr\u00fcsten und besiegt sie. [00:48:00]\n* [Konfrontation mit Lenra](/events/konfrontation_mit_lenra.md) \u2014 Die Gruppe trifft im Bossraum auf die Nekromantin Lenra, die Dodo und Cookie schrumpft und schlie\u00dflich entkommt. [01:52:04]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=YCpAz_syjaY)", "sessions/2025-04-23": "# Zusammenfassung\n\nDie Gruppe bereitet sich auf den vorhergesagten Goblin-Angriff auf das Dorf vor. Sie positionieren sich und legen einen Hinterhalt, doch der Plan wird durch vorzeitige Aktionen gest\u00f6rt. Es kommt zu einer gro\u00dfen Schlacht, in der die Helden und die Dorfbewohner gegen mehrere Goblin-Trupps und einen Oger k\u00e4mpfen. W\u00e4hrend des Kampfes wird der Magier Lendras in seinem Turm von einer rabenartigen Kreatur angegriffen. Ein Teil der Gruppe eilt ihm zu Hilfe und kann ihn retten. Nach dem Kampf f\u00fchrt Lendras die Gruppe in eine Katakombe unter dem Friedhof, wo sie ein magisches Tor \u00f6ffnen und den Vampir Voras aus einem Sarg erwecken. Voras stellt sich als 'der Heilige' heraus und nicht als 'der Schrecken'. Gemeinsam mit dem Vampir kehren sie an die Oberfl\u00e4che zur\u00fcck, wo Voras mit einer machtvollen Geste die verbliebenen Monster in die Flucht schl\u00e4gt oder t\u00f6tet. Die Session endet mit dem Versprechen auf Erkl\u00e4rungen in der n\u00e4chsten Sitzung.\n\n# Auftretende Entit\u00e4ten\n\n* [Rotunas](/characters/rotunas.md) \u2014 Ein magiebegabter Charakter, der Nebel wirkt, Eiszapfen und magische Geschosse verschie\u00dft und den Oger im Nahkampf in eine Falle boxt. Er ist ein Halbling oder Gnom. [00:02:34]\n* [Esterossa](/characters/esterossa.md) \u2014 Ein gefl\u00fcgelter Soldat, der als Erster die Goblins entdeckt, im Kampf Pfeilen ausweicht, einen Flugangriff mit zwei Kills durchf\u00fchrt und sp\u00e4ter den Sarg von Voras \u00f6ffnet. [00:00:42]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Ein kleiner Barde (Fee), der das Team mit einer Rede und einem schrillen Pfiff motiviert, ein Abbild seiner selbst beschw\u00f6rt und die Dorfbewohner ins Rathaus schickt. [00:02:49]\n* [Dodo](/characters/dodo.md) \u2014 Ein K\u00e4mpfer mit Schild, der sich an der Front positioniert, Esterossa zu Hilfe eilt, mehrere Goblins t\u00f6tet und sp\u00e4ter den Magier Lendras im Turm rettet. [00:05:28]\n* [Valeria](/characters/valeria.md) \u2014 Eine Magierin (Nomadin), die mit Feuerzaubern mehrere Goblins t\u00f6tet, einen sterbenden Bauern heilt und in der Katakombe das Bild an der Wand ber\u00fchrt. [00:23:30]\n* [Lendras (Joseph)](/npcs/lendras_joseph.md) \u2014 Der Magier des Dorfes, der zun\u00e4chst in seinem Turm angegriffen wird. Er f\u00fchrt die Gruppe in die Katakombe, \u00f6ffnet ein magisches Tor und erweckt den Vampir Voras. [01:32:25]\n* [Voras (der Heilige / der Schrecken)](/npcs/voras_der_heilige_der_schrecken.md) \u2014 Ein Vampir, der in einer Katakombe in einem Sarg liegt. Er wird von der Gruppe erweckt und t\u00f6tet einen der angreifenden Monster mit einer Gedankenkraft. Sein Sarg war f\u00e4lschlicherweise als 'der Schrecken' beschriftet. [01:47:30]\n* [Die Hack](/npcs/die_hack.md) \u2014 Eine Moorhexe und offenbar die Auftraggeberin des Goblin-Angriffs. Sie ist die Antagonistin, die auf der Suche nach Voras' Gemahlin ist. [00:03:07]\n* [Der Wirt / Barkeeper](/npcs/der_wirt_barkeeper.md) \u2014 Ein kampff\u00e4higer Dorfbewohner, der am Kampf teilnimmt und sp\u00e4ter von Lindo Laut \u00fcberzeugt wird, die Dorfbewohner ins Rathaus zu f\u00fchren. [00:05:04]\n* [Der Schmied](/npcs/der_schmied.md) \u2014 Ein Dorfbewohner, der im Kampf von einem Oger angegriffen und schwer verletzt wird. [00:23:17]\n* [Der B\u00fcrgermeister](/npcs/der_buergermeister.md) \u2014 Der Anf\u00fchrer des Dorfes, der nicht am Kampf teilnimmt und sich in seinem Haus aufh\u00e4lt. [00:06:44]\n* [Das Dorf (Bresca)](/locations/das_dorf_bresca.md) \u2014 Der Hauptschauplatz der Schlacht. Ein kleines Dorf mit einer Taverne, einem Rathaus, einem Magierturm und einem Friedhof mit Katakomben. [00:03:07]\n* [Die Katakombe](/locations/die_katakombe.md) \u2014 Ein unterirdischer Ort unter dem Friedhof, erreichbar durch eine Luke. Enth\u00e4lt ein magisches Tor und zwei S\u00e4rge mit den Inschriften 'Voras der Schrecken' und 'Amelia die Heilige'. [01:38:21]\n* [Der Magierturm](/locations/der_magierturm.md) \u2014 Das Haus des Magiers Lendras, in dem er w\u00e4hrend der Schlacht von einer rabenartigen Kreatur angegriffen wird. [01:23:00]\n* [Goblin-G\u00f6tter](/factions/goblin_goetter.md) \u2014 Eine externe Macht, die die Goblins im Kampf unterst\u00fctzt, indem sie Blitze vom Himmel schickt, die die Goblins st\u00e4rker machen. [01:12:39]\n* [Magischer Schl\u00fcssel](/items/magischer_schluessel.md) \u2014 Ein Gegenstand, den der Magier Lendras nach dem Kampf an Esterossa \u00fcbergibt. [01:32:25]\n* [Buch der Namen](/items/buch_der_namen.md) \u2014 Ein Buch, das Lindo Laut in einer fr\u00fcheren Session gefunden hat und in dem der Name 'Voras der Schrecken' verzeichnet ist, was bei der Identifizierung des richtigen Sarges hilft. [01:48:15]\n* [Die Schlacht um das Dorf](/events/die_schlacht_um_das_dorf.md) \u2014 Ein massiver Angriff von Goblins und einem Oger auf das Dorf, der von den Helden und Dorfbewohnern erfolgreich abgewehrt wird. [00:00:49]\n* [Die Erweckung von Voras](/events/die_erweckung_von_voras.md) \u2014 Die Gruppe \u00f6ffnet den Sarg von Voras in der Katakombe und der Magier Lendras bricht einen Bann, um ihn zu erwecken. Voras stellt sich als 'der Heilige' heraus. [01:53:19]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=z3C-bewKqUs)", "sessions/2025-04-30": "# Zusammenfassung\n\nDie Gruppe reist mit dem Gildenschiff zu den Sanddorninseln, um einem Hilferuf nachzugehen. Auf See angekommen, erkunden sie zun\u00e4chst ein altes Schiffswrack, wo Rotunas ein besch\u00e4digtes Logbuch findet. Anschlie\u00dfend begeben sie sich zur Hauptinsel, die von Reichtum und einer korrupten Atmosph\u00e4re gepr\u00e4gt ist. In der Taverne sammeln sie erste Informationen: Ein Kenku namens Gulrak wurde beim Versuch, den Schankwirt Baran zu bestehlen, gefasst und eingesperrt. Der Inselchef Joar Vanur beauftragt die Gruppe, Gulrak im Gef\u00e4ngnis zu verh\u00f6ren. Gulrak behauptet, ein Familienerbst\u00fcck zur\u00fcckstehlen zu wollen, da die Insel urspr\u00fcnglich seiner Familie geh\u00f6rte. Nach einem gescheiterten Fluchtversuch und einem magisch versiegelten Schloss konfrontiert die Gruppe Baran, der ihnen einen mysteri\u00f6sen Schl\u00fcssel zu einem alten Labor zeigt und von einer verborgenen Kirche auf einer der Inseln berichtet. Cookie hat zudem eine beunruhigende Vision, nachdem sie versucht hat, mit den sich unnat\u00fcrlich ausbreitenden Pilzen zu kommunizieren. Die Gruppe erh\u00e4lt eine Belohnung und die M\u00f6glichkeit, die Untersuchung der Kirche als Folgeauftrag anzunehmen.\n\n# Auftretende Entit\u00e4ten\n\n* [Cookie](/characters/cookie.md) \u2014 Ein Frosch-artiger Spielercharakter mit Manieren, der eine lange, greifbare Zunge besitzt und eine starke Verbindung zur Natur hat. Sie ist neugierig, nascht gerne und hat eine beunruhigende Vision, als sie mit Pilzen kommuniziert. [00:06:27]\n* [Rotunas](/characters/rotunas.md) \u2014 Ein gro\u00dfer, magiebegabter Spielercharakter (Riese), der als Sprecher der Gruppe fungiert. Er findet ein Logbuch im Wrack, verh\u00f6rt Gulrak und versiegelt heimlich dessen Zellent\u00fcr mit Magie. [00:09:19]\n* [Esterossa](/characters/esterossa.md) \u2014 Ein Spielercharakter, der sich mit einer Katze namens G\u00fcnther anfreundet. Er ist vorsichtig, diplomatisch und versucht, den guten Ruf der Gilde zu wahren, w\u00e4hrend er die Gruppe durch die Ermittlungen f\u00fchrt. [00:08:13]\n* [Joar Vanur](/npcs/joar_vanur.md) \u2014 Der reiche und m\u00e4chtige Chef der Sanddorninseln. Er beauftragt die Gruppe, den gefangenen Kenku Gulrak zu verh\u00f6ren, und zeigt sich ver\u00e4rgert, als Informationen \u00fcber eine Kirche vor ihm zur\u00fcckgehalten werden. [00:59:57]\n* [Gulrak](/npcs/gulrak.md) \u2014 Ein gerupfter Kenku (Federwesen), der im Gef\u00e4ngnis sitzt, weil er versuchte, ein Familienerbst\u00fcck von Baran zur\u00fcckzustehlen. Er behauptet, die Insel habe urspr\u00fcnglich seiner Familie geh\u00f6rt und bietet Informationen gegen seine Freiheit. [01:12:29]\n* [Baran](/npcs/baran.md) \u2014 Der Schankwirt der Taverne Kyla und Besitzer eines magischen Forschungslabors. Er wurde von Gulrak bestohlen und besitzt einen kleinen Schl\u00fcssel, der zu einem alten Labor im Westen f\u00fchrt. [01:48:46]\n* [Anton Gro\u00dfwurz](/npcs/anton_grosswurz.md) \u2014 Ein gut betuchter Magier und Heiler der Stadt, der in der Taverne einen betrunkenen Gast einschl\u00e4fert, um eine Eskalation zu verhindern. Er scheint \u00fcber einflussreiche F\u00e4higkeiten zu verf\u00fcgen. [00:46:50]\n* [Sanddorninseln](/locations/sanddorninseln.md) \u2014 Eine karibisch-tropische Inselgruppe und das Hauptziel der Mission. Die Hauptinsel ist wohlhabend, korrupt und von Dieben und Piraten bewohnt. Eine unnat\u00fcrliche Ausbreitung von Pilzen gibt Anlass zur Sorge. [00:04:36]\n* [Taverne Kyla](/locations/taverne_kyla.md) \u2014 Das gro\u00dfe, von Baran gef\u00fchrte Etablissement auf der Hauptinsel. Es ist ein Treffpunkt f\u00fcr Abenteurer und magisch Begabte und beherbergt Barans Forschungslabor. [01:47:25]\n* [Schiffswrack](/locations/schiffswrack.md) \u2014 Ein altes, schwer besch\u00e4digtes und auf Grund gelaufenes Galeerenschiff in der Bucht der Inseln. Rotunas findet darin ein nasses Logbuch, das von einer Expedition zu einer Kirche berichtet. [00:19:09]\n* [G\u00fcnther (ehem. Adjani)](/npcs/guenther_ehem_adjani.md) \u2014 Eine Katze, die sich Esterossa angeschlossen hat und von den Goblin-G\u00f6ttern in G\u00fcnther umbenannt wurde. Sie geh\u00f6rte urspr\u00fcnglich dem Barkeeper Hermann, zeigt aber eine starke Bindung zu Esterossa. [00:39:29]\n* [Logbuch der Expedition](/items/logbuch_der_expedition.md) \u2014 Ein besch\u00e4digtes Buch aus dem Schiffswrack, das von Rotunas mit Magie repariert wird. Es beschreibt eine Expedition zu einer Kirche auf einer der Inseln, die das Schiff nie erreichte. [01:10:05]\n* [Schl\u00fcssel zum Labor](/items/schluessel_zum_labor.md) \u2014 Ein kleiner Schl\u00fcssel in Barans Besitz, der zu einem alten Labor im Westen der Inseln f\u00fchrt. Gulrak war vermutlich hinter diesem Schl\u00fcssel her. [01:53:09]\n* [Verh\u00f6r von Gulrak](/events/verhoer_von_gulrak.md) \u2014 Die Gruppe verh\u00f6rt den gefangenen Kenku, der einen Deal um seine Freiheit anbietet. Nach einem gescheiterten Fluchtversuch wird er von Cookie zur\u00fcck in die Zelle geschleudert, woraufhin Rotunas die T\u00fcr heimlich magisch versiegelt. [01:14:11]\n* [Cookies Pilzvision](/events/cookies_pilzvision.md) \u2014 Cookie versucht, mit den sich ausbreitenden Pilzen zu kommunizieren, und erlebt eine beunruhigende Vision von einem Waldst\u00fcck mit einem h\u00f6lzernen Tor, das sie zu rufen scheint. [01:42:06]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=fsCOiSkKKTE)", "sessions/2025-05-06": "# Zusammenfassung\n\nDie Gruppe landet auf einer Insel, um eine Kapelle zu finden. Sie erkunden eine Ruine, die dem Heiligen Duran gewidmet ist, und finden eine scharfe, vergiftete Klaue eines 'Schattenfingers'. Lindo Laut erkundet als Eule ein feindliches Lager und entdeckt einen Kampf zwischen Gnollen und Verteidigern. Die Gruppe \u00fcberquert eine Schlucht und greift in den Kampf ein, um die Verteidiger zu retten. In der Kapelle treffen sie auf Baran und die Priesterin Auranil, die ihnen das Amulett des Heiligen Duran anvertraut. Mit der Kraft des Amuletts und vereinter Magie \u00f6ffnet Lindo Laut ein Portal, durch das die Gruppe und die \u00dcberlebenden auf ihr Schiff entkommen. An Bord wird ihnen der Morgenstern des Heiligen Duran \u00fcberreicht, und die Priesterin \u00e4u\u00dfert ihre Besorgnis \u00fcber die wahren Ziele der angreifenden Kreaturen.\n\n# Auftretende Entit\u00e4ten\n\n* [Dodo](/characters/dodo.md) \u2014 Ein Klippengeborener (Richborn) und Leibw\u00e4chter, agil und stark gepanzert. Fungiert als Tank der Gruppe, besch\u00fctzt seine Gef\u00e4hrten und findet ein goldenes Amulett in der Ruine. [00:32:43]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Eine kleine Fee und Magier mit schauspielerischem Talent. Kann sein Aussehen ver\u00e4ndern (u.a. in eine Eule oder eine Hack), arkane T\u00fcren erschaffen und nutzt das Amulett des Heiligen Duran, um ein m\u00e4chtiges Fluchtportal zu \u00f6ffnen. [00:06:07]\n* [Rotunas](/characters/rotunas.md) \u2014 Ein Zauberer, der arkane T\u00fcren und einen kraftvollen Drucksto\u00df (Power Push) wirken kann. Er untersucht den kranken Baum und schneidet sich an der vergifteten Klaue. [00:17:48]\n* [Esterossa](/characters/esterossa.md) \u2014 Ein gefl\u00fcgelter Lorborn mit Wissen \u00fcber Geschichte und Kulturen. Kennt die Legende des Heiligen Duran und heilt im Kampf einen schwer verwundeten Ritter. [00:13:39]\n* [Baran](/npcs/baran.md) \u2014 Ein Druide, der sich in ein Federvieh verwandeln kann. Er ist der Gruppe vorausgeflogen, um die Kapelle zu verteidigen, und k\u00e4mpft dort ersch\u00f6pft an der Seite der Verteidiger. [01:18:29]\n* [Auranil](/npcs/auranil.md) \u2014 Die Priesterin der Kapelle. Sie \u00fcbergibt Lindo Laut das Amulett des Heiligen Duran, um die Flucht zu erm\u00f6glichen, und zeigt sich nach der Rettung besorgt \u00fcber die Motive der Angreifer. [01:57:38]\n* [Brandon](/npcs/brandon.md) \u2014 Ein Ritter und einer der letzten lebenden Anh\u00e4nger, der den Heiligen Duran noch kannte. Er tr\u00e4gt und benutzt den Morgenstern des Heiligen Duran im Kampf. [01:57:38]\n* [Heiliger Duran](/npcs/heiliger_duran.md) \u2014 Ein historischer, von G\u00f6ttern auserw\u00e4hlter Heiliger, der einst sein Volk anf\u00fchrte und verschwand. Seine Erkennungsmerkmale sind ein Amulett und ein magischer Morgenstern. [00:14:33]\n* [Kahnf\u00fchrer Lobrecht](/npcs/kahnfuehrer_lobrecht.md) \u2014 Der Kapit\u00e4n des Schiffes, mit dem die Gruppe zur Insel gereist ist. [00:03:04]\n* [Miaomani](/npcs/miaomani.md) \u2014 Ein Mitglied der Schiffsbesatzung, das die Insel aus der Ferne beobachtet und die vielen Fackeln entdeckt hat. [00:03:04]\n* [Insel der Kapelle](/locations/insel_der_kapelle.md) \u2014 Eine befestigte Insel mit einer Ruine, einem provisorischen Lager und einer Kapelle. Sie ist Schauplatz der K\u00e4mpfe zwischen Gnollen und den Verteidigern. [00:01:51]\n* [Ruine (Au\u00dfenposten/Fort)](/locations/ruine_aussenposten_fort.md) \u2014 Eine alte, teils gepl\u00fcnderte Ruine, die dem Heiligen Duran gewidmet war. Hier findet die Gruppe eine vergiftete Klaue und ein goldenes Amulett. [00:05:26]\n* [Kapelle](/locations/kapelle.md) \u2014 Das Ziel der Mission. Ein religi\u00f6ses Geb\u00e4ude, das von Gnollen angegriffen wird und in dem die Priesterin Auranil und Baran Zuflucht gesucht haben. [01:12:00]\n* [Gnolle](/factions/gnolle.md) \u2014 Hy\u00e4nenartige Humanoide, die als Bogensch\u00fctzen und Nahk\u00e4mpfer die Kapelle angreifen. Sie scheinen auf eine Hack zu h\u00f6ren. [00:48:47]\n* [Schattenfinger](/factions/schattenfinger.md) \u2014 Rabenvogel\u00e4hnliche Kreaturen mit rasiermesserscharfen, vergifteten Klauen. Sie sind magisch, werden von etwas gesteuert und erf\u00fcllen blind Auftr\u00e4ge. [00:27:35]\n* [Schattenfinger-Klaue](/items/schattenfinger_klaue.md) \u2014 Eine extrem scharfe, vergiftete Klaue eines Schattenfingers, die in einem Tisch steckt. Bei Ber\u00fchrung verursacht sie Schnittwunden und ein l\u00e4hmendes Gift, das mit Hitze neutralisiert werden kann. [00:20:35]\n* [Amulett des Heiligen Duran](/items/amulett_des_heiligen_duran.md) \u2014 Ein m\u00e4chtiges Artefakt, das von der Priesterin Auranil \u00fcbergeben wird. Es verleiht Lindo Laut genug Kraft, um ein Portal zur Flucht zu erschaffen. [01:30:45]\n* [Morgenstern des Heiligen Duran](/items/morgenstern_des_heiligen_duran.md) \u2014 Eine m\u00e4chtige Waffe, die der Ritter Brandon vom Heiligen Duran erhalten hat und mit der er die Verteidigung der Kapelle lange aufrechterhalten konnte. [01:57:38]\n* [Goldenes Amulett](/items/goldenes_amulett.md) \u2014 Ein wertvolles, aber nicht magisches Amulett mit der Insignie des Heiligen Duran, das Dodo in einer Kiste in der Ruine findet. [00:28:28]\n* [Verteidigung der Kapelle](/events/verteidigung_der_kapelle.md) \u2014 Die Gruppe kommt einer ersch\u00f6pften Priesterin und zwei K\u00e4mpfern (Baran und Brandon) zu Hilfe, die seit Stunden gegen eine \u00dcbermacht an Gnollen k\u00e4mpfen. Sie k\u00f6nnen die Angreifer zur\u00fcckschlagen und die \u00dcberlebenden retten. [00:48:12]\n* [Flucht durch das Portal](/events/flucht_durch_das_portal.md) \u2014 Mithilfe des Amuletts des Heiligen Duran und unter dem Schutz eines Nebelzaubers gelingt es Lindo Laut, ein Portal zum Schiff zu \u00f6ffnen, durch das die gesamte Gruppe und die \u00dcberlebenden im letzten Moment entkommen. [01:49:54]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=e0v6AFGd4mE)", "sessions/2025-05-14": "# Zusammenfassung\n\nDie Abenteurer Dodo und Cookie erreichen die verschneiten Ruinen von Zebros, um herauszufinden, warum es dort Untote gibt. In einem alten Au\u00dfenposten finden sie Hinweise auf den einstigen K\u00f6nig Zebros und entdecken ein Schmugglerversteck mit n\u00fctzlichen Gegenst\u00e4nden wie Heiltr\u00e4nken und einem Schutzzauber-Kristall. Auf dem Weg zur Hauptruine werden sie von einem untoten Eisb\u00e4ren angegriffen, den sie mit Magie aufhalten k\u00f6nnen. In der Burgruine begegnen sie dem Todesritter Belorus dem Stillen, einem gefallenen Paladin und ehemaligen General von Zebros. W\u00e4hrend Dodo sich einem Kampf gegen beschworene Untote stellt, durchsucht Cookie die Gem\u00e4cher und findet ein Buch, das die Identit\u00e4t und den Fluch des Ritters enth\u00fcllt. Cookie aktiviert den Schutzzauber, was die Untoten vertreibt und Belorus zum R\u00fcckzug zwingt. Auf der Flucht werden sie von untoten Bogensch\u00fctzen und einer Zombiehorde verfolgt, k\u00f6nnen aber dank ihrer F\u00e4higkeiten und der Silberpfeile entkommen. Mit dem erbeuteten Buch, das wichtige Informationen enth\u00e4lt, treten sie in der Nacht den R\u00fcckzug aus dem unheimlichen Tal an.\n\n# Auftretende Entit\u00e4ten\n\n* [Dodo](/characters/dodo.md) \u2014 Ein Krieger mit schwerer R\u00fcstung und Schild, der sich als Bodyguard vor Cookie stellt und im Kampf gegen die Untoten standhaft bleibt. [00:05:41]\n* [Cookie](/characters/cookie.md) \u2014 Ein Froschwesen, das K\u00e4lte hasst, aber geschickt mit Pfeil und Bogen sowie Naturzaubern umgeht und das entscheidende Buch findet. [00:04:12]\n* [Perry das Schnabeltier](/npcs/perry_das_schnabeltier.md) \u2014 Cookies tierischer Begleiter, ein Frettchen, das als Kommunikationsmittel zwischen den Gruppenmitgliedern dient. [00:00:16]\n* [Belorus der Stille](/npcs/belorus_der_stille.md) \u2014 Ein m\u00e4chtiger Todesritter und ehemaliger General von K\u00f6nig Zebros. Ein gefallener Paladin, der seinen Eid brach und verflucht wurde. Er ist der Herr der Burg und beschw\u00f6rt Untote. [01:05:33]\n* [K\u00f6nig Zebros](/npcs/koenig_zebros.md) \u2014 Der verstorbene Herrscher der Region, nach dem das Gebiet benannt ist. Seine Statue steht in der Ruine. [00:10:22]\n* [Zebros](/locations/zebros.md) \u2014 Eine kalte, neblige Bergregion mit Ruinen, die nach einem Einsturz des Plateaus verlassen wurde. Heimat von Untoten und Eisb\u00e4ren. [00:02:15]\n* [Burgruine von Zebros](/locations/burgruine_von_zebros.md) \u2014 Eine intakte Burg, die als Versteck f\u00fcr Abenteurer dient und von Belorus dem Stillen bewohnt wird. Enth\u00e4lt eine Krypta und Fallen. [00:33:01]\n* [Dwarfmaster Gilde](/factions/dwarfmaster_gilde.md) \u2014 Die Organisation, die Dodo und Cookie beauftragt hat, die Ursache f\u00fcr die Untoten in Zebros zu untersuchen. [00:01:30]\n* [Der Einfluss der Hack](/factions/der_einfluss_der_hack.md) \u2014 Eine Gruppe oder Person, die in der Vergangenheit mit einem verkleinernden Fluch auf Dodo interagierte. Eine Statue von ihr wurde in der Burg gefunden. [00:54:14]\n* [Schutzzauber-Kristall](/items/schutzzauber_kristall.md) \u2014 Ein magischer Kristall, der bei Aktivierung eine Schutzzone erschafft, die Untote vertreibt und aufl\u00f6st. Wurde in einem Schmugglerversteck gefunden. [00:20:28]\n* [Heilige Pfeile](/items/heilige_pfeile.md) \u2014 Drei Silberpfeile, die in Weihwasser getaucht wurden. \u00c4u\u00dferst effektiv gegen Untote, wie der kritische Treffer gegen einen untoten W\u00e4chter zeigt. [00:42:42]\n* [Das Buch des Belorus](/items/das_buch_des_belorus.md) \u2014 Ein selbstgeschriebenes Buch aus den Gem\u00e4chern des Todesritters, das seine Identit\u00e4t als gefallener Paladin und General von Zebros enth\u00fcllt. [01:16:06]\n* [Angriff des untoten Eisb\u00e4ren](/events/angriff_des_untoten_eisbaeren.md) \u2014 Dodo und Cookie werden von einem untoten B\u00e4ren angegriffen, den Cookie mit einem Wurzelzauber festh\u00e4lt, woraufhin sie fliehen. [00:27:24]\n* [Konfrontation mit Belorus](/events/konfrontation_mit_belorus.md) \u2014 Dodo wird von Belorus zu einem Kampf herausgefordert. Cookie aktiviert den Schutzzauber, was die Untoten vertreibt und den Ritter zum R\u00fcckzug zwingt. [01:05:33]\n* [Flucht aus Zebros](/events/flucht_aus_zebros.md) \u2014 Von untoten Bogensch\u00fctzen und einer Zombiehorde verfolgt, k\u00e4mpfen sich Dodo und Cookie den Weg zur\u00fcck und verlassen das Tal in der Nacht. [01:29:42]\n\n# Belege\n\n[1] [Vollst\u00e4ndige Session (VOD)](https://www.youtube.com/watch?v=5eAEDN5ra-4)", "sessions/2025-05-27": "# Zusammenfassung\n\nDie Dwarfmasters-Gilde wird zu einem Au\u00dfenposten zur\u00fcckgerufen, um dort unter der Aufsicht von Gildenmeister Nox ein Training zu absolvieren. Nox \u00f6ffnet ein Portal zu einer anderen Ebene, aus dem f\u00fcnf Skelett-Bogensch\u00fctzen und ein m\u00e4chtiger, feuerbeschw\u00f6render D\u00e4mon (Miner Demon) treten. Die Gruppe verschanzt sich in einer Ruine und versucht, die Gegner in eine Falle zu locken. Esterossa und Cookie er\u00f6ffnen den Kampf aus der Distanz, w\u00e4hrend Lindo Laut den D\u00e4mon mit einem telepathischen Diss-Rap provoziert und verwundbar macht. Dodo stellt sich als unersch\u00fctterlicher Tank sch\u00fctzend vor seine Gef\u00e4hrten und f\u00e4ngt die schweren Angriffe des D\u00e4mons ab. Nach einem intensiven Kampf, in dem Esterossa ein Skelett pulverisiert und Lindo Laut eine gewaltige magische Salve auf den D\u00e4mon feuert, gelingt es Cookie schlie\u00dflich, dem bereits schwer verwundeten D\u00e4mon mit einem gezielten Pfeilschuss den Todessto\u00df zu versetzen, woraufhin die verbleibenden Skelette in sich zusammenfallen. Nox lobt die Gruppe und erkl\u00e4rt, dass das Portal genutzt wird, um die alten G\u00f6tter und ihre Diener zu studieren, bevor er es versiegelt und die Helden zur Gilde zur\u00fcckkehren.\n\n# Auftretende Entit\u00e4ten\n\n* [Esterossa](/characters/esterossa.md) \u2014 Ein gefl\u00fcgelter Seraph, der Blitze wirken und fliegen kann. Er nutzt seine Gebete (Pray Dice) zum Schutz und teilt im Kampf ein Skelett mit seiner magischen Axt in zwei Teile. [00:01:25]\n* [Lindo Laut](/characters/lindo_laut.md) \u2014 Ein Feen-Barde, der fliegen kann und seine Gegner mit magischen Liedern und telepathischen Diss-Raps provoziert. Er entfesselt eine m\u00e4chtige Arkane Salve (Akan Barrage) gegen den D\u00e4mon. [00:01:59]\n* [Dodo](/characters/dodo.md) \u2014 Ein Guardian (Halbdrache/Halbgoblin), der als unersch\u00fctterlicher Tank agiert. Er wirft sich sch\u00fctzend vor seine Verb\u00fcndeten, f\u00e4ngt massiven Schaden ab und nutzt seine 'Unstoppable'-F\u00e4higkeit. [00:02:43]\n* [Cookie](/characters/cookie.md) \u2014 Ein Frosch-Ranger mit einem tierischen Begleiter namens Perry (ein Schnabeltier). Sie k\u00e4mpft mit einem Kurzbogen und Naturzaubern (Ranken, Wirbelsturm) und erledigt den D\u00e4mon mit einem finalen Kopfschuss. [00:03:06]\n* [Nox](/npcs/nox.md) \u2014 Der Gildenmeister der Dwarfmasters. Er f\u00fchrt das Beschw\u00f6rungsritual am Portal durch, \u00fcberwacht das Training und erkl\u00e4rt der Gruppe die Hintergr\u00fcnde des Portals und der alten G\u00f6tter. [00:28:07]\n* [Miner Demon](/npcs/miner_demon.md) \u2014 Ein feuerbeschw\u00f6render D\u00e4mon (Tier 1, Solo), Anh\u00e4nger der alten Gottheiten. Er ist intelligent, telepathisch unempf\u0
