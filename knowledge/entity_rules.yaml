# Entity rules — hand-authored, never written by the pipeline.
#
# The tool reads this file and rewrites entity_registry.yaml next to it. That
# rewrite goes through a YAML dump, which strips comments — so these rules and
# the reasons for them live here instead, where nothing can erase them.
#
#   entity_rules.yaml     input,  written by a human  (this file)
#   entity_registry.yaml  output, written by the tool (inventory + aliases)
#
# merge:       name (lowercased) -> concept_id. Folds every mention of that
#              name into the concept, across entity types.
# never_merge: groups of concept ids the automatic passes must keep apart.
# ignore:      concept ids that must not exist at all; their mentions are
#              dropped and any leftover file is pruned.
# split:       (name, session) -> concept_id, for two beings sharing a name.
# alias_block: concept_id -> [names]. Display-only suppression list for
#              spellings that must not show up as an alias; identity is
#              unaffected — see resolve.py::_load_alias_blocks.
#
# Canon rulings that are prose, not identity, belong in knowledge/sources/
# instead — see Kanon_Entscheidungen.md.
#
# "Never written by the pipeline" still holds — pnp_okf only ever reads this
# file. The pnp-dashboard Glossar tab is a second, human-facing author: its
# Sync button line-patches this file (comment-preserving, not a YAML
# round-trip) for rename/add-alias/hide-alias edits made in the UI. See
# services/dashboard/README.md and docs/architecture/ARCHITECTURE.md §3.4.

