  # --- A deity that shows up in the flesh is still that deity --------------
  # Extraction types the same being as Deity in one sentence and NPC in the
  # next, producing a one-mention twin that carries nothing the god does not
  # already have. The appearance belongs in the event that describes it:
  # (:Event)-[:BETEILIGT]->(:Deity), not in a second node with the same name.
  # Note this is NOT the Seelenwacht case — the order and the city that share
  # that name are two things and keep two nodes, because the edge between them
  # is real.
  nerash: deities/nerash

