  neiraj: deities/nerash
  kord: deities/korn
  # Ezhura "die Glut", one of Vhar'Zul's souls in Lindo's amulet. Heard as
  # "Glut" and as "Ezua"; the Buch der vier Seelen gives the full name.
  goblingötter: deities/goblingoetter
  goblin-gott (dodos gott): deities/goblingoetter

  # Koll'Mereth (die Krone), one of the souls Vhar'Zul was split into and one of
  # the voices in Lindo's amulet — see Das_Buch_der_vier_Seelen.md. Both spellings
  # describe the same god bound to the amulet and the upper shrine.
  koll: deities/kollmereth
  kol meref: deities/kollmereth
  kolgath: deities/kollmereth
  koll'mereth: deities/kollmereth
  kollmereth: deities/kollmereth

  # --- Die übrigen zwei der vier Seelen -------------------------------------
  # Sythraal (der Schleier) and Ezhura (die Glut) round out the four, but no
  # session has extracted either yet, so neither has a live concept to merge
  # onto (both are in KNOWN_UNCREATED_TARGETS, test_canon_decisions.py).
  # Their transcript variants are recorded here rather than as rules: a
  # merge key pointing at a concept that does not exist is a dead rule, and
  # these would fire on nothing today. Uncomment the matching pair when a
  # session first names one and the concept appears.
  #
  #   sintra, sithra          -> deities/sythraal
  #   esua, esoa, ezreal      -> deities/ezhura
  #
  # The variants come from the "Namensvarianten" table that used to sit in
  # Das_Buch_der_vier_Seelen.md as prose — the wrong home twice over: the
  # synthesis prompt forbids writing transcription variants into an entry,
  # and prose reaches no resolver at all.

  # --- Huludan --------------------------------------------------------------
  # GM ruling: "Holodarn" is not a name, it is a Whisper mishearing. Huludan is
  # the Titan; the being that serves him is real but was never named. Both were
  # transcribed "Holodarn", so only the session tells them apart — see split:.
  huludan: deities/huludan

  # --- 2026-08-29 bundle-quality audit --------------------------------------
