# Display names pinned by hand, keyed by concept id. Without a pin the title is
# whichever spelling a transcript happened to use first, so a correction never
# sticks. The concept id stays as it is — only the label changes.
canonical_name:
  # One of the five souls Vhar'Zul was split into; the Buch der vier Seelen
  # names him "die Krone". Transcribed both as "Koll" and as "Kol Meref".
  deities/kollmereth: Koll'Mereth (die Krone)
  deities/ezhura: Ezhura (die Glut)
  factions/gilde_von_ehrenfels: Die Gilde von Ehrenfels
  factions/kult_des_vharzul: Kult des Vhar'Zul
  factions/sippe_des_voras: Sippe des Voras
  factions/anhaenger_vorgultars: Anhänger Vorgul'tars
  # GM ruling: the canonical spelling is Willauch. The id stays 'willau' —
  # ids are identity, names are display, and the wiki URL must not move.
  locations/willau: Willauch
  npcs/adeliga_vom_haus_des_loewen: Adeliga (Haus des Löwen)
  npcs/adeliga_der_eulenseraph: Adeliga (Eulen-Seraph)
  # The transcripts spell it Brechka, Bresca, Breschka and Reska; the campaign
  # spelling is Breska, which is also the concept id.
  locations/breska: Breska
  npcs/hans_soldat_aus_breska: Hans (Soldat aus Breska)
  npcs/hans_wirt_zum_gruenen_sichelmond: Hans (Wirt zum grünen Sichelmond)
  # GM ruling: Huludan is the Titan; the being that serves him was never named
  # on camera, and "Holodarn" was only ever a mishearing of Huludan.
  npcs/diener_huludans: Diener Huludans
  deities/huludan: Huludan
  items/schwert_von_huludan: Schwert von Huludan
  events/verhandlung_mit_dem_diener_huludans: Verhandlung mit dem Diener Huludans
  # Descriptive labels for the places that used to share one generic noun.
  locations/kristallmine: Kristallmine
  locations/zwergenmine: Zwergenmine
  locations/verlassene_mine_an_der_farm: Verlassene Mine an der Farm
  locations/schreinkapelle_der_festung: Schreinkapelle der Festung
  locations/parfon_kapelle_auf_dem_berg: Parfon-Kapelle auf dem Berg
  locations/kapelle_von_vorgultars_refugium: Kapelle von Vorgultars Refugium
  locations/sumpf_vor_dem_goblin_dorf: Sumpf vor dem Goblin-Dorf
  locations/sumpf_der_sumpfhexe: Sumpf der Sumpfhexe
  locations/sumpf_bei_nebelwacht: Sumpf bei Nebelwacht
  items/seelenstein_des_rotunas: Seelenstein des Rotunas
  items/gruener_seelenkristall_von_hans: Grüner Seelenkristall von Hans
  items/haralds_seelenstein: Haralds Seelenstein

