# spelling: mishearing -> canon text, applied to synthesized PROSE (not just
# the title — see canonical_name: above for that). Without this, a title pin
# never reaches the body: the sentence around a link keeps saying "Willoch"
# forever, on every re-run, even after the concept's own title says
# "Willauch". Applied by links.py::apply_spellings via normalize_body, so it
# reaches session bodies, entity bodies, and `pnp validate --fix` alike.
#
# Keys are case-sensitive, word-boundary matched, and never touch a link
# target or the `# Belege` citation list. Prefer a bare token only once every
# occurrence in the bundle is confirmed to be the misspelling (see
# docs/audits/2026-08-30-spelling-sweep.md, Bucket A); a variant that
# collides with a real word or another meaning needs a phrase key instead
# (Bucket B) so only the actual mishearing turns, not every occurrence of the
# common word.
spelling:
  # --- Bucket A: bare token, every occurrence confirmed a mishearing -------
  Willau: Willauch
  Willoch: Willauch
  Villauch: Willauch
  Brechka: Breska
  Bereska: Breska
  Bresca: Breska
  Breschka: Breska
  Lanra: Landra
  Leandra: Landra
  Lenra: Landra
  Tarvok: Thar'Vok
  Tavok: Thar'Vok
  Tarvolk: Thar'Vok
  Adelia: Adeliga
  Slicks: Slix
  Born: Korn
  Kord: Korn
  Holodarn: Huludan
  Zebrus Zorn: Zebros Zorn
  # --- Bucket B, revised: bare token after all ------------------------------
  # "Zebras" reads as the animal in isolation, so the original plan scoped
  # this to a handful of phrases ("Festung Zebras", "Berg Zebras"). That
  # missed just as many real forms ("aus Zebras", "General von Zebras", a
  # quoted "Zebras Zorn" in session recaps) as it caught. A full-bundle
  # check (2026-08-30) turned up zero legitimate zebra-the-animal mentions —
  # the only surviving "Zebra" text is burg_des_belorus.md's own canon
  # explanation of this exact mishearing, which the word-boundary match on
  # "Zebras" (plural) doesn't touch anyway. Bare token confirmed safe.
  Zebras: Zebros
  # Same evidence for Cepros: not one occurrence in the bundle means
  # anything else.
  Cepros: Zebros
  # Bare token, not phrase-scoped: a full-bundle check (2026-08-30) found
  # all 38 word-boundary "Hack" occurrences refer to the hag, and the phrase
  # key "die Hack" missed the ones spanning a link bracket
  # ("die [Hack](/npcs/lenra.md)") or a sentence-initial capital ("Die
  # Hack sucht..."). Bare token confirmed safe the same way Zebras/Cepros
  # were above; see services/kb/tests/test_spelling_sweep.py.
  Hack: Hag

