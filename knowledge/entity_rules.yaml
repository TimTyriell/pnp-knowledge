  symbol: items/symbol_in_der_villa

  # --- Whisper variants of the pantheon ------------------------------------
  # Every one of these is one god heard several ways. Confirmed by the GM
  # 2026-07-27; the notes back them up ("Varsurs: ein zersplitterter Gott,
  # dessen vier Seelenfragmente in Lindo Lauts Amulett gefangen sind").
  varsurs: deities/vharzul
