# alias_block: Anzeigenamen, die NICHT mehr als Alias eines Konzepts
# erscheinen sollen. Rein kosmetisch: die Zuordnung (merge/never_merge)
# bleibt unberuehrt, die Schreibweise verschwindet nur aus Registry,
# Frontmatter und Synthese. Geschrieben vom Glossar-Sync.
alias_block:
  characters/valeria:
  - cookie und valeria
  items/notiz_von_hal:
  - notiz
  # 2026-08-29 bundle-quality audit: both npcs/hans_soldat_aus_breska and
  # npcs/hans_wirt_zum_gruenen_sichelmond carry the bare alias "Hans" (they
  # are the split: pair above, "two unrelated men") — link_targets()
  # (synthesize.py) can only map one name to one concept, so it picked
  # whichever won the mention-count tiebreak, and the soldier's own body
  # ended up linking "Hans" to the innkeeper's page. Blocking it here (this
  # filter runs before synthesis, not just cosmetically on the registry —
  # see resolve.py's per-entity alias_block pass) leaves the qualified
  # titles linkable and only drops the ambiguous bare name.
  npcs/hans_wirt_zum_gruenen_sichelmond:
  - hans
  # 2026-08-30 review fix: the block above was only applied to one side of
  # the split: pair -- the innkeeper's own page still linked "Hans" to the
  # soldier (link_targets() picked whichever concept had more mentions).
  # Block the bare name on both members so neither can claim it.
  npcs/hans_soldat_aus_breska:
  - hans
  # 2026-08-30 spelling sweep: "Amulett" is a bare generic noun, registered
  # as an alias because someone once called this artefact just "the
  # amulet" — but link_targets() then autolinks *any* mention of the word
  # "Amulett" to this one concept, including Dodo's own unrelated trinket
  # (characters/dodo.md: "ein Amulett... das sich als einfacher Schmuck
  # herausstellt"). The qualified aliases ("Amulett des Heiligen Duran" etc.)
  # stay linkable; only the ambiguous bare noun is dropped.
  items/amulett_des_heiligen_duran:
  - amulett
  # 2026-08-30 review fix (§2.1): "Ende" is the ordinary German noun, not a
  # name -- link_targets() autolinked "am Ende" on the Kalidarn page to this
  # location. The qualified name ("Ende (jenseits der Orkgebiete)") isn't a
  # registered alias so it needs no block; only the two bare-noun aliases do.
  locations/ende_jenseits_der_orkgebiete:
  - ende
  - das ende
  # 2026-08-30 review fix (§2.1): "Flüchtlinge" is a bare generic noun. It is
  # also a merge: key (identity-level fold, entity_rules.yaml above) — the
  # visible defect is a *link*
  # (events/verhandlung_um_die_aufnahme_der_fluechtlinge_in_ringtal.md), not
  # a fold, so this blocks linkability only and leaves the merge intact.
  factions/fluechtlinge_aus_breska:
  - flüchtlinge
  # 2026-08-30: "Die Stadt" is registered as an alias of Ehrenfels, so
  # link_targets() autolinked the ordinary noun to Ehrenfels on 10+ pages —
  # including locations/sanddorn, locations/seelenwacht, locations/boragdil
  # and locations/hartwacht, where "die Stadt" means that page's OWN city.
  # Ehrenfels has 18 mentions and is linked plenty by its real name; only the
  # generic noun is dropped. Same precedent as amulett/ende/flüchtlinge above.
  locations/ehrenfels:
  - die stadt
