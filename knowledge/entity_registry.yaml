# Entity registry.
#
# Maintain aliases by hand: add a name under a concept's 'aliases:'
# in the 'entities:' list below. Each alias both de-duplicates
# matching mentions and is shown as a display alias. Your aliases are
# never overwritten - the tool only appends newly discovered variants.
#
# 'merge:' is optional: map a name (lowercased) to a concept_id to
# fold it in without listing it under a concept, e.g.:
#   merge:
#     "heck": factions/hag
#
# 'important: true' on a concept forces the deep synthesis tier for
# entities the automatic rules underrate (a pivotal NPC or city whose
# mention count stays low). Characters and Deities are always deep.
