# ai-knowledge-graph config for the parallel comparison run.
# Same LLM as the custom pipeline (qwen3:14b via Ollama's OpenAI-compat endpoint)
# so the comparison isolates the extraction *approach*, not the model.

[llm]
model = "qwen3:14b"
api_key = "ollama"  # Ollama ignores the key; any non-empty string works
base_url = "http://localhost:11434/v1/chat/completions"
max_tokens = 8192
temperature = 0.8

[chunking]
# Custom pipeline packs ~2000 chars (~350 words); match that granularity so
# neither tool is handicapped by chunk size. ai-kg's shipped default is 100.
chunk_size = 350
overlap = 35

[standardization]
enabled = true
use_llm_for_entities = true

[inference]
enabled = true
use_llm_for_inference = true
apply_transitive = true

[visualization]
edge_smooth = false
