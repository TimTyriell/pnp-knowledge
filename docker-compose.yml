services:
  neo4j-main:
    image: neo4j:5-community
    container_name: pnp-neo4j-main
    ports:
      - "7474:7474"   # http (browser UI)
      - "7687:7687"   # bolt — matches config.py NEO4J_URL
    environment:
      NEO4J_AUTH: none
    volumes:
      - neo4j_main_data:/data
      - neo4j_main_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j-aikg:
    image: neo4j:5-community
    container_name: pnp-neo4j-aikg
    ports:
      - "7475:7474"   # http
      - "7688:7687"   # bolt — matches compare/run_both.py AIKG_NEO4J_URL default
    environment:
      NEO4J_AUTH: none
    volumes:
      - neo4j_aikg_data:/data
      - neo4j_aikg_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j-report:
    image: neo4j:5-community
    container_name: pnp-neo4j-report
    ports:
      - "7476:7474"   # http
      - "7689:7687"   # bolt — matches reports/load_report_graph.py REPORT_NEO4J_URL default
    environment:
      NEO4J_AUTH: none
    volumes:
      - neo4j_report_data:/data
      - neo4j_report_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j_main_data:
  neo4j_main_logs:
  neo4j_aikg_data:
  neo4j_aikg_logs:
  neo4j_report_data:
  neo4j_report_logs:
